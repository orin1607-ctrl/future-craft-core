<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<script>
(function () {
  var host = location.hostname;
  var base = '/future-craft-core/';
  if (host === 'localhost' || host === '127.0.0.1') {
    var p = location.pathname || '';
    var i = p.indexOf('ai-marketing-platform');
    if (i < 0) i = p.indexOf('coco-marketing-platform');
    base = i >= 0 ? p.substring(0, i) : (p.endsWith('/') ? p : p.replace(/\/[^/]*$/, '/'));
  }
  window.COCO_PAGES_BASE = base;
  var bootParams = new URLSearchParams(location.search);
  if (bootParams.get('fullscreen') === '1') {
    try { sessionStorage.setItem('coco-mkt-fullscreen', '1'); } catch (e) { /* ignore */ }
  }
  if (window.self !== window.top) {
    try { sessionStorage.setItem('coco-mkt-embedded', '1'); } catch (e) { /* ignore */ }
  }
  var b = document.createElement('base');
  b.id = 'coco-pages-base';
  b.href = base.charAt(0) === '/' ? (location.origin + base) : new URL(base, location.href).href;
  document.head.appendChild(b);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="ui-version" content="v3-live-demo-3">
<meta name="build-commit" content="STAGING">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

</div>
<style>
.coco-toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); padding:12px 20px; border-radius:10px; background:#1e293b; color:#fff; font-size:13px; z-index:400; opacity:0; pointer-events:none; transition:opacity 0.2s; max-width:90vw; text-align:center; }
.coco-toast.show { opacity:1; pointer-events:auto; }
.coco-toast-success { background:#065f46; }
.coco-toast-warn { background:#92400e; }
.coco-toast-info { background:#1e40af; }

    <div style="font-size:20px;font-weight:700;color:#fff;">טוען מרכז שיווק…</div>
    <div style="font-size:12px;opacity:0.7;">Orin Car Staging · Claude UI</div>
  </div>
</div>

<script src="./ai-marketing/asset-flow-ssot.js"></script>
<script src="./ai-marketing/marketing-ssot.js"></script>
<script src="./ai-marketing/dalia-site-config.js"></script>
<script src="./ai-marketing/coco-integration-hub.js"></script>
<script src="./ai-marketing/sidebar-accordion.js"></script>
<script src="./ai-marketing/app.js"></script>
<script src="./ai-marketing/marketing-api.js"></script>
<script src="./ai-marketing/marketing-client.js"></script>
<script>
(function initCocoClaude() {
  var root = document.getElementById('coco-claude-root');
  var ver = 'v3-live-demo-3';
  try {
    var bootB = new URLSearchParams(location.search).get('b');
    if (bootB) ver = 'v3-unified-3j-' + bootB.slice(0, 12);
    else {
      var bootV = new URLSearchParams(location.search).get('v');
      if (bootV) ver = bootV;
    }
  } catch (e) { /* ignore */ }
  document.body.classList.add('coco-boot-active');
  if (root) root.classList.add('coco-boot-active');

  function assetUrl(rel) {
    var base = window.COCO_PAGES_BASE || '/future-craft-core/';
    if (base.charAt(0) !== '/') base = '/' + base.replace(/^\.\//, '');
    return location.origin + base + rel + (rel.indexOf('?') >= 0 ? '&' : '?') + 'v=' + encodeURIComponent(ver);
  }

  function showBootError(msg) {
    if (!root) return;
    root.classList.add('coco-boot-active');
    root.innerHTML = '<div style="padding:32px 20px;text-align:center;font-family:\'Heebo\',sans-serif;min-height:100vh;background:#04091a;color:#fff;">' +
      '<div style="font-size:18px;font-weight:700;margin-bottom:8px;">לא ניתן לטעון את ממשק השיווק</div>' +
      '<div style="font-size:13px;color:#94a3b8;margin-bottom:16px;">' + (msg || '') + '</div>' +
      '<button type="button" id="coco-boot-retry" style="padding:10px 18px;border-radius:8px;border:none;background:#2563eb;color:#fff;font-size:14px;cursor:pointer;">רענון</button></div>';
    document.getElementById('coco-boot-retry')?.addEventListener('click', function () {
      location.href = location.pathname.split('?')[0] + '?v=' + ver + '&t=' + Date.now();
    });
  }

  function loadScript(url) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = url;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('failed: ' + url)); };
      document.body.appendChild(s);
    });
  }

  function boot() {
    if (!root || !document.getElementById('screen-hub')) {
      showBootError('מסכי Claude לא נטענו');
      return;
    }
    return loadScript(assetUrl('ai-marketing/prd-dalia-nav.js')).then(function () {
      root.classList.remove('coco-boot-active');
      document.body.classList.remove('coco-boot-active');
      if (window.PrdDaliaNav && typeof window.PrdDaliaNav.init === 'function') {
        window.PrdDaliaNav.init();
      }
      if (window.DaliaSite && typeof window.DaliaSite.initOfficial === 'function') {
        return window.DaliaSite.initOfficial().then(function () {
          if (window.CocoClaude) CocoClaude.init();
          else if (typeof window.goScreen === 'function') goScreen('screen-hub');
          if (root) root.classList.add('coco-ready');
          if (window.CocoUnified && CocoUnified.init) CocoUnified.init();
          var tab = new URLSearchParams(location.search).get('tab');
          if (tab === 'crm' && window.CocoMarketingCrm && CocoMarketingCrm.openTab) {
            setTimeout(function () { CocoMarketingCrm.openTab(); }, 400);
          }
          return loadScript(assetUrl('ai-marketing/ai-assistant.js'));
        });
      }
    });
  }

  if (!root) return;

  fetch(assetUrl('ai-marketing/coco-claude-screens.html'), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('screens HTTP ' + r.status); return r.text(); })
    .then(function (html) {
      if (!html || html.length < 5000) throw new Error('screens truncated');
      root.innerHTML = html;
      root.querySelectorAll('.screen.active').forEach(function (s) { s.classList.remove('active'); });
      if (window.DaliaSite) {
        if (DaliaSite.applySiteLabels) DaliaSite.applySiteLabels();
        if (DaliaSite.scrubDemoUi) DaliaSite.scrubDemoUi();
      }
      return loadScript(assetUrl('ai-marketing/coco-claude-main.js'))
        .then(function () { return loadScript(assetUrl('ai-marketing/actions-demo-code.js')); })
        .then(function () { return loadScript(assetUrl('ai-marketing/daily-engine.js')); })
        .then(function () { return loadScript(assetUrl('ai-marketing/actions-workbench.js')); })
        .then(function () { return loadScript(assetUrl('ai-marketing/coco-claude-data.js')); })
        .then(function () { return loadScript(assetUrl('ai-marketing/coco-claude-bridge.js')); })
        .then(function () { return loadScript(assetUrl('ai-marketing/coco-marketing-unified.js')); })
        .then(function () { return loadScript(assetUrl('ai-marketing/multi-ai-orchestrator.js')); })
        .then(function () { return loadScript(assetUrl('ai-marketing/ai-question-engine.js')); })
        .then(function () { return loadScript(assetUrl('ai-marketing/ai-control-center-bridge.js')); })
        .then(function () { return loadScript(assetUrl('ai-marketing/marketing-notifications.js')); })
        .then(function () { return loadScript(assetUrl('ai-marketing/ai-control-center.js')); })
        .then(function () { return loadScript(assetUrl('ai-marketing/coco-marketing-crm-bridge.js')); })
        .then(function () { return loadScript(assetUrl('ai-marketing/business-strategy-module.js')); })
        .then(function () { return loadScript(assetUrl('ai-marketing/business-strategy-wizard.js')); });
    })
    .then(boot)
    .catch(function (e) {
      console.warn('CocoClaude load:', e);
      showBootError(e && e.message ? e.message : 'שגיאה');
    });
})();
</script>
</body>
</html>
