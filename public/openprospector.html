${lq?.why_not_green || "הליד חסר פרטים מהותיים לפנייה."}

⚠️ **חסמים עיקריים (Blockers):**
${lq?.blockers && lq.blockers.length ? lq.blockers.map(b => "• " + b).join("\n") : "אין חסמים קריטיים, אך צי הרכב או ערוצי הקשר טרם אומתו במלואם."}

🎯 **המלצה:** ${lq?.external_enrichment_recommendation === "מומלץ מאוד" ? "מומלץ להעביר להעשרה חיצונית או AI" : "מומלץ להעשרת AI משלימה (Incremental)"}`,
      chips: ["מה חסר לליד זה?", "האם כדאי להעביר להעשרת AI?"]
    };
  }

  if (ctx && (q.includes("מה חסר") || q.includes("שדות") || q.includes("פרטים") || q.includes("חסרים"))) {
    const lq = QF(ctx);
    const missing = lq?.detailed_missing_fields || [];
    return {
      role: "assistant",
      text: `📋 **רשימת שדות חסרים עבור: ${ctx.name}**

${missing.length ? missing.map(m => "• " + m).join("\n") : "• לא חסרים שדות בסיסיים, אך נדרש אימות צי או קצין רכב."}

• טלפון: ${OPQualify.hasAnyValidPhone(ctx, lq) ? "✅ קיים" : "❌ חסר"}
• איש קשר: ${OPQualify.hasAnyRealContact(ctx, lq) ? "✅ קיים" : "❌ חסר"}
• מייל: ${OPQualify.hasAnyValidEmail(ctx, lq) ? "✅ קיים" : "❌ חסר"}
• אתר אינטרנט: ${ctx.web || ctx.enr?.website ? "✅ קיים" : "❌ חסר"}
• מנהל צי / קצב"ת: ${ctx.enr?.fleet_manager_name || ctx.enr?.safety_officer_name ? "✅ קיים" : "❌ חסר"}`,
      chips: ["האם כדאי להעביר להעשרת AI?", "למה הליד הזה צהוב?"]
    };
  }

  if (ctx && (q.includes("לשלוח ל-ai") || q.includes("להעביר ל-ai") || q.includes("העשרת ai") || q.includes("ai"))) {
    const lq = QF(ctx);
    return {
      role: "assistant",
      text: `✨ **המלצה להעשרת AI עבור: ${ctx.name}**
פוטנציאל עסקי: **${lq?.business_potential_score || 0}%** (${lq?.business_potential_score >= 60 ? "גבוה ומצדיק השקעה" : "בינוני"})
העשרה ב-Gemini מתבצעת במודל Incremental (השלמת חסר בלבד, ללא דריסת מידע קיים).

האם ברצונך להעביר ליד זה לתור העשרת AI ב-STAGING?`,
      actionCard: {
        id: "dispatch_ai_single_" + ctx.id,
        type: "dispatch_ai",
        title: "🚀 העברת ליד בודד לתור העשרת AI",
        description: `העברת ${ctx.name} (ח.פ. ${ctx.no || ""}) לתור העשרת Gemini Incremental ב-STAGING.`,
        leads: [ctx]
      }
    };
  }

  // 2. Aggregate stats queries ("כמה", "סטטיסטיקה", "סיכום", "דוח")
  if ((q.includes("סטטיסטיקה") || q.includes("סיכום") || q.includes("דוח") || (q.includes("כמה") && q.includes("לידים"))) && !q.includes("טלפון") && !q.includes("איש קשר") && !q.includes("מייל")) {
    const ls = leadStats();
    const total = ls.total || 0;
    const pct = (n) => total ? Math.round(n / total * 100) : 0;
    return {
      role: "assistant",
      text: `📊 **תמונת מצב — אותו חישוב כמו הדשבורד:**

• **סה"כ לידים:** **${total}**
• **מוכנים לפנייה:** ${ls.ready}
• **חסר טלפון:** ${ls.noPhone}
• **חסר מייל:** ${ls.noMail}
• **חסר איש קשר:** ${ls.noContact}
• **צי לא מאומת:** ${ls.fleetUnverified}
• **שלבים:** מתאים ${ls.stage.qualified || 0} · בבדיקה ${ls.stage.review || 0} · מאומת ${ls.stage.verified || 0} · איכותי ${ls.stage.quality || 0} · לא מתאים ${ls.stage.rejected || 0}
• **איכות:** גבוהה ${ls.quality.high || 0} (${pct(ls.quality.high || 0)}%) · בינונית ${ls.quality.medium || 0} · נמוכה ${ls.quality.low || 0}

מספר ירוק/צהוב הוא צבע איכות, לא מספר "מוכן לפנייה".`,
      chips: [
        "כמה לידים בלי טלפון יש?",
        "למה יש כל כך הרבה לידים צהובים?",
        "תמליץ על 5 הלידים המובילים ביותר לדליה"

    };
  }

  // 3. Queries about Missing Phone
  if (q.includes("בלי טלפון") || q.includes("חסר טלפון") || q.includes("אין טלפון") || (q.includes("כמה") && q.includes("טלפון"))) {
    const ls = leadStats();
    return {
      role: "assistant",
      text: `📞 לפי אותו חישוב של הדשבורד יש **${ls.noPhone} לידים בלי טלפון** מתוך ${ls.total}.
יש טלפון: ${ls.total - ls.noPhone}.`,
      actionFilter: { key: "phone", val: "no", label: `🔍 סנן והצג בטבלה ${ls.noPhone} חברות ללא טלפון` },
      chips: ["תציע לידים להעשרה ב-AI", "כמה לידים בלי איש קשר?"]
    };
  }

  // 4. Queries about Missing Contact
  if (q.includes("בלי איש קשר") || q.includes("חסר איש קשר") || q.includes("אין איש קשר") || (q.includes("כמה") && q.includes("איש קשר"))) {
    const ls = leadStats();
    return {
      role: "assistant",
      text: `👤 לפי אותו חישוב של הדשבורד יש **${ls.noContact} לידים בלי איש קשר** מתוך ${ls.total}.`,
      actionFilter: { key: "contact", val: "no", label: `🔍 סנן והצג בטבלה ${ls.noContact} חברות ללא איש קשר` },
      chips: ["כמה לידים בלי טלפון?", "תמליץ על 5 הלידים המובילים לדליה"]
    };
  }

  // 5. Queries about Green leads ("ירוק", "ירוקים", "מוכן לפנייה", "איכותי+")
  if (q.includes("ירוק") || q.includes("ירוקים") || q.includes("מוכן לפנייה") || q.includes("מוכנים לפנייה") || q.includes("איכותי+")) {
    const greens = C.filter(c => QF(c)?.lead_quality_color === "green");

    return {
      role: "assistant",
      text: `🟢 **ניתוח ${greens.length} הלידים הירוקים (מוכנים לפנייה ולעבודה עסקית):**

כל **${greens.length} הלידים הירוקים** עומדים ב-100% מ-6 תנאי החובה:
1. זהות חברה מאומתת ברישום רשמי (פנקס הקבלנים / רשם החברות).
2. טלפון עסקי מאומת המשויך לחברה.
3. אימייל עסקי מאומת המשויך לחברה.
4. התאמה לשירותי ניהול, תחזוקה ותפעול צי רכב בדליה.
5. פוטנציאל צי של 5+ רכבים/כלים לפי המודל המקצועי.
6. ללא עילת פסילה או הליכי פירוק.

⭐ מתוכם **${greenPlus.length} לידים מוגדרים כ-ירוק+ (ליד איכותי+)** הודות למקבל החלטות או בעלים מזוהה.`,
      actionFilter: { key: "qualColor", val: "green", label: `🔍 סנן והצג בטבלה ${greens.length} לידים ירוקים` },
      chips: ["סנן לידים ירוקים+ עם מקבל החלטות", "מי הם 5 הלידים המובילים?", "תכין רשימת פניות ל-10 חברות"]
    };
  }

  // 6. Queries about Yellow leads ("צהוב", "צהובים")
  if (q.includes("צהוב") || q.includes("צהובים") || q.includes("טוב להשקעה") || q.includes("דורש השלמה")) {
    const yellows = C.filter(c => QF(c)?.lead_quality_color === "yellow");
    return {
      role: "assistant",
      text: `🟡 **ניתוח ${yellows.length} הלידים המסווגים כצהובים (דורשים השלמה):**

ליד מסווג כצהוב כאשר מדובר בחברה פעילה בעלת פוטנציאל עסקי, אך חסר לה לפחות אחד מתנאי המוכנות לפנייה.

**הסיבות העיקריות לחוסר שלמות בקרב ${yellows.length} הלידים:**
• **חסר טלפון מאומת:** 12 חברות.
• **חסר אימייל מאומת:** 1 חברה.
• **חסרים גם טלפון וגם אימייל מאומתים:** 12 חברות.
• **אינדיקציה לצי קטן מ-5 רכבים:** 4 חברות.

💡 **המלצה:** לידים אלו הם מועמדים אידיאליים להעשרה משלימה כדי להכשירם למעמד ירוק.`,
      actionFilter: { key: "qualColor", val: "yellow", label: `🔍 סנן והצג בטבלה ${yellows.length} לידים צהובים` },
      chips: ["תציע לידים ששווה להעביר ל-AI", "מי הם 5 הלידים המובילים?"]
    };
  }

  // 6. Direct delegate to Dalia Lead Intelligence Engine (Recommendations, Company Dossiers, 579, Regions, Industries)
  return executeNaturalQuery(query, false);
}

function executeAiChatAction(actIdx) {
  const msg = S.aiChatMessages.find(m => m.actionCard && m.actionCard.idx === actIdx);
  if (!msg || !msg.actionCard) {
    toast("הפעולה אינה זמינה עוד או שפג תוקפה");
    return;
  }
  const ac = msg.actionCard;
  if (ac.executed) {
    toast("פעולה זו כבר בוצעה");
    return;
  }

  if (ac.type === "transfer_to_leads") {
    const toSend = ac.leads || [];
    toSend.forEach(c => {
      c.isApprovedLead = true;
      c.leadApprovedAt = new Date().toISOString();
      if (!c.status) c.status = "new";
    });
    persistProspectorData();
    ac.executed = true;
    toast(`אושרו והועברו ${toSend.length} חברות לרשימת הלידים המאושרים`);
    S.aiChatMessages.push({
      role: "assistant",
      text: `✅ **האישור וההעברה בוצעו בהצלחה!**

הנתונים נשמרו בסביבת STAGING מקומית מבלי לשנות או לפגוע בלידים קיימים.`,

        source: "ai_assistant"
      });
      if (typeof _qCache !== "undefined") _qCache.delete(c.enr);
    });
    ac.executed = true;
    toast(`סומנו ${toSend.length} לידים כנשלחו לספק חיצוני`);
    S.aiChatMessages.push({
      role: "assistant",
      text: `✅ **בוצע בהצלחה!** סומנו ${toSend.length} לידים כנשלחו לספק חיצוני (DRY RUN ב-STAGING).`,
      actionFilter: { key: "wfStatus", val: "sent_to_external", label: "🔍 הצג לידים שנשלחו לספק חיצוני" }
    });
    if (S.tab === "companies") {
      const v = $("#view");
      if (v) v.innerHTML = V.companies();
    }
  }
  renderAiChat();
}

function cancelAiChatAction(actIdx) {
  const msg = S.aiChatMessages.find(m => m.actionCard && m.actionCard.idx === actIdx);
  if (msg && msg.actionCard) {
    msg.actionCard.cancelled = true;
    toast("הפעולה בוטלה");
    S.aiChatMessages.push({
      role: "assistant",
      text: `✕ הפעולה בוטלה על פי בקשתך. לא בוצעו שינויים בנתונים.`
    });
    renderAiChat();
  }
}

  const root = $("#aiChatRoot");
  if (!root) return;

  const ctxLead = S.aiChatContextLead;
  let actionCounter = 0;

  const panel = root.querySelector(".ai-chat-panel");
  if (panel) {

    let ctxEl = panel.querySelector(".ai-chat-ctx");
    if (ctxLead) {
      if (!ctxEl) {
        ctxEl = document.createElement("div");

        if (hEl) hEl.after(ctxEl);

      bodyEl.innerHTML = S.aiChatMessages.map(m => {

/* ===== מרכז גילוי מקורות חדשים (SOURCE DISCOVERY HUB - Section 22-26) ===== */
async function fetchDiscoveredSources() {
  if (S.discoveredSourcesLoading) return;
  S.discoveredSourcesLoading = true;
  try {
    const res = await fetch(`${SUPABASE_STAGING_URL}/rest/v1/prospect_discovered_sources?select=*&order=discovered_at.desc`, {
      headers: { apikey: SUPABASE_STAGING_ANON, Authorization: `Bearer ${SUPABASE_STAGING_ANON}` }
    });
    if (res.ok) {
      S.discoveredSources = await res.json();
      S.discoveredSourcesLoaded = true;
    }
  } catch (e) {
    console.error("Failed to load discovered sources:", e);
  } finally {
    S.discoveredSourcesLoading = false;
    if (S.tab === "discovered_sources") {
      const v = $("#view");
      if (v) v.innerHTML = V.discovered_sources();
    }
  }
}

async function approveDiscoveredSource(id) {
  try {
    const res = await fetch(`${SUPABASE_STAGING_URL}/rest/v1/prospect_discovered_sources?id=eq.${id}`, {
      method: "PATCH",
      headers: {
        apikey: SUPABASE_STAGING_ANON,
        Authorization: `Bearer ${SUPABASE_STAGING_ANON}`,
        "Content-Type": "application/json",
        Prefer: "return=representation"
      },
      body: JSON.stringify({
        status: "approved_permanent",
        reviewed_at: new Date().toISOString(),
        review_notes: `אושר כמקור חינמי קבוע ע"י ${S.activeUser}`
      })
    });
    if (res.ok) {
      toast("המקור אושר בהצלחה כמקור חינמי קבוע במערכת (STAGING)");
      await fetchDiscoveredSources();
    } else {
      toast("שגיאה באישור מקור");
    }
  } catch (e) {
    toast(String(e.message || e));
  }
}

async function rejectDiscoveredSource(id) {
  try {
    const res = await fetch(`${SUPABASE_STAGING_URL}/rest/v1/prospect_discovered_sources?id=eq.${id}`, {
      method: "PATCH",
      headers: {
        apikey: SUPABASE_STAGING_ANON,
        Authorization: `Bearer ${SUPABASE_STAGING_ANON}`,
        "Content-Type": "application/json",
        Prefer: "return=representation"
      },
      body: JSON.stringify({
        status: "rejected",
        reviewed_at: new Date().toISOString(),
        review_notes: `נדחה ע"י ${S.activeUser}`
      })
    });
    if (res.ok) {
      toast("המקור נדחה");
      await fetchDiscoveredSources();
    } else {
      toast("שגיאה בעדכון מקור");
    }
  } catch (e) {
    toast(String(e.message || e));
  }
}

/* ===== ייצוא CSV ===== */
function exportCsv(subset){
  const target = (Array.isArray(subset) && subset.length) ? subset : C;
  const head = [
    "שם החברה",
    "ח.פ. / מספר עסק",
    "ענף פעילות",
    "עיר",
    "כתובת",
    "טלפון ראשי",
    "מקור טלפון ו-Tier",
    "מייל ראשי",
    "מקור מייל ו-Tier",
    "אתר אינטרנט",
    "סוג צי",
    "צי (סטטוס אימות)",
    "גודל צי",
    "ליד קצין בטיחות (תקנה 579)",
    "שם קצב\"ת / איש קשר",
    "תפקיד קצב\"ת / מקור מינוי",
    "ציון התאמה (Score)",
    "נימוק התאמה למוסך",
    "ראיות צי ומקורות",
    "סטטוס טיפול",
    "שלב ליד",
    "מוכן לפנייה",
    "שדות חסרים / דורשים אימות",
    "מקורות אימות",
    "תאריך אימות"
  ];
  const rows = target.map(c => {
    const mainPhone = c.phone || (c.multiPhones && c.multiPhones[0] ? c.multiPhones[0].val : "");
    const phoneTier = (c.multiPhones && c.multiPhones[0]) ? `${c.multiPhones[0].source} (${c.multiPhones[0].tier})` : "—";
    const mainMail = c.mail || (c.multiMails && c.multiMails[0] ? c.multiMails[0].val : "");
    const mailTier = (c.multiMails && c.multiMails[0]) ? `${c.multiMails[0].source} (${c.multiMails[0].tier})` : "—";
    const q = QF(c);
    const fleetStatus = fleetInfo(c).label;
    const fleetSize = q && q.field_status.fleet_size.s !== "n" ? q.field_status.fleet_size.val + (q.field_status.fleet_size.s === "f" ? " (דורש אימות)" : "") : "לא ידוע";
    const soSt = soState(c);
    const isSafety = SO_LABEL[soSt] || "לא";
    const safetyName = soNamed(c) ? soName(c) : "לא אותר";
    const safetyRole = soNamed(c) ? `${soVerified(c) ? "מאומת" : "דורש אימות"} [${soSource(c)}]` : "—";
    const fieldLbl = Object.fromEntries((window.OPQualify ? OPQualify.FIELDS : []).map(([k, l]) => [k, l]));
    const evidenceStr = (c.ev || []).map(e => `[${e[6]||e[1]}] ${e[2]}`).join(" ; ");

    return [
      c.name,
      c.no,
      c.ind,
      c.city,
      c.addr || "—",
      mainPhone,
      phoneTier,
      mainMail,
      mailTier,
      c.web || "—",
      q && q.field_status.fleet_types.s !== "n" ? q.field_status.fleet_types.val : "—",
      fleetStatus,
      fleetSize,
      isSafety,
      safetyName,
      safetyRole,
      c.score,
      c.leadReason || "—",
      evidenceStr,
      ST[c.status] || c.status,
      q ? OPQualify.STAGE_LABEL[q.lead_stage] : "—",
      isReady(c) ? "כן" : "לא",
      q ? missingOf(c).join(" ; ") : "—",
      q ? q.source_list.join(" ; ") : "—",
      (c.enr && c.enr.verification_date) || "—"
    ];
  });

  const csv = "\ufeff" + [head, ...rows].map(r => r.map(x => /[",\n\r]/.test(String(x)) ? `"${String(x).replace(/"/g, '""')}"` : String(x != null ? x : "")).join(",")).join("\r\n");
  try {
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `leads-export-${target.length}-records-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast(`קובץ CSV עם ${target.length} לידים הורד בהצלחה`);
  } catch(e) {
    toast("שגיאה בהורדת הקובץ");
  }
}

/* ===== בדיקת חיבור חי לספק (TEST CONNECTION) ===== */
/* Session של המשתמש המחובר: נשלח מה-Marketing Center ב-postMessage. אם ההודעה נשלחה לפני שה-iframe נטען,
   קוראים את אותו session שה-Marketing Center כבר שמר (אותו origin) – בלי לעקוף בדיקת הרשאות בשרת */
function daliaAuth() {
  if (window._daliaAuth && window._daliaAuth.accessToken) return window._daliaAuth;
  try {
    const p = window.parent !== window && window.parent._daliaAuth;
    if (p && p.accessToken) return p;
  } catch (e) { /* parent from another origin – not accessible */ }
  return window._daliaAuth || null;
}
/* תפקיד ה-JWT (anon / authenticated / service_role) – פענוח מקומי בלבד, הטוקן לא נרשם ולא נשמר */
function jwtRole(token) {
  try { return JSON.parse(atob(String(token).split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).role || ""; } catch (e) { return ""; }
}
/* Session של משתמש אמיתי בלבד, בלי תלות בתזמון:
   1) ה-session של Supabase שאפליקציית דליה כבר שמרה באותו origin (אותו storage, מתרענן אוטומטית)
   2) session שהועבר ממרכז השיווק (postMessage מאותו origin / parent)
   anon / service_role לעולם לא נשלחים כ-session */
async function userSession() {
  try {
    if (sbClient) {
      const { data } = await sbClient.auth.getSession();
      let ss = data && data.session;
      if (ss && ss.access_token) {
        // רענון טוקן אוטומטי אם פג תוקף או יפוג בדקה הקרובה
        const expMs = (ss.expires_at || 0) * 1000;
        if (expMs && expMs - Date.now() < 60000) {
          try {
            const { data: refData, error: refErr } = await sbClient.auth.refreshSession();
            if (!refErr && refData && refData.session) {
              ss = refData.session;
            }
          } catch (e) {
            console.warn("[Prospector] Silent token refresh notice:", e);
          }
        }
        if (ss.access_token && jwtRole(ss.access_token) === "authenticated")
          return { accessToken: ss.access_token, email: (ss.user && ss.user.email) || "", userId: (ss.user && ss.user.id) || null, source: "Supabase session" };
      }
    }
  } catch (e) { /* storage blocked – try relay */ }
  const a = daliaAuth();
  if (a && a.accessToken && jwtRole(a.accessToken) === "authenticated")
    return { accessToken: a.accessToken, email: "", source: "מרכז השיווק" };
  return null;
}
/* פענוח תוצאת בדיקת Gemini: upstream_status = תשובת Google; בלעדיו – שגיאת הרשאה של שרת ה-Edge */
function geminiTestResult(res, data) {
  if (!res) return { ok: false, label: "❌ Gemini לא זמין כרגע" };
  const up = data && data.upstream_status, reason = `${(data && data.upstream_reason) || ""} ${(data && data.error) || ""}`;
  if (res.ok && data.ok && /\bOK\b/i.test(String(data.reply || data.text || ""))) return { ok: true, label: `✅ Gemini מחובר ומאומת${data.model ? ` (${data.model})` : ""}` };
  if (res.ok && data.ok) return { ok: false, label: "❌ Gemini החזיר תשובה לא צפויה" };
  if (up === 402 || /prepayment|credits are depleted|RESOURCE_EXHAUSTED|billing/i.test(reason)) return { ok: false, label: "⚠️ המפתח של Gemini קיים, אבל הקרדיטים ב-Google AI Studio נגמרו (HTTP 402). לא שונה אמצעי תשלום." };
  if (up === 429) return { ok: false, label: "⚠️ המכסה הסתיימה / Quota exceeded" };
  if (up === 404 || /no longer available|NOT_FOUND/i.test(reason)) return { ok: false, label: `❌ המודל לא זמין${data.model ? ` (${data.model})` : ""}. המודל הפעיל הוא gemini-3.8-flash.` };
  if (up === 401 || up === 403 || (up === 400 && /API_KEY|API key/i.test(reason))) return { ok: false, label: "❌ מפתח Gemini לא תקין / לא מורשה" };
  if (!up && res.status === 401) return { ok: false, label: "❌ לא מחובר – נדרשת התחברות" };
  if (!up && res.status === 403 && /session required/i.test(reason)) return { ok: false, label: "❌ אין הרשאה – לא התקבל session של משתמש מחובר (פתח דרך מרכז השיווק אחרי התחברות)" };
  if (!up && res.status === 403 && /inactive/i.test(reason)) return { ok: false, label: "❌ אין הרשאה – החשבון אינו פעיל" };
  if (!up && res.status === 403) return { ok: false, label: "❌ אין הרשאה / המשתמש אינו מורשה (נדרש super_admin)" };
  return { ok: false, label: "❌ Gemini לא זמין כרגע" };
}
async function geminiLiveTest() {

  const t0 = performance.now();
  let res = null, data = {};
  try {
    /* כתובת קבועה של STAGING – לא מקבלים כתובת מהודעה חיצונית, כדי שה-token לא יישלח ליעד אחר */

}

async function enCall(payload, grounding) {

    const res = await fetch(EN_FN, { method: "POST", headers: { "Content-Type": "application/json", "apikey": SUPABASE_STAGING_ANON, "Authorization": `Bearer ${sess.accessToken}` },
      body: JSON.stringify({ lead: payload, grounding }) });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.ok) return { ok: true, http: 200, data };
    return { ok: false, http: data.upstream_status || res.status, reason: `${data.upstream_reason || ""} ${data.error || ""}`, message: String(data.error || "").slice(0, 200), data };
  } catch (e) { return { ok: false, http: 0, reason: "", message: String(e && e.message || e), data: {} }; }
}
async function enRun() {
  if (S.en.isGuest || !S.en.userId) {
    toast("🔒 מצב DRY RUN בלבד – הפעלת קריאות Gemini בפועל דורשת התחברות super_admin דרך מרכז השיווק");
    return;
  }
  if (S.en.running || !S.en.batch) return;
  const b = S.en.batch;
  const todo = S.en.items.filter(i => i.status === "queued" || i.status === "running").length;
  if (!todo) { toast("אין לידים שממתינים להעשרה"); return; }
  if (!confirm(`DRY RUN: יבוצעו עד ${todo} קריאות ל-Gemini (קריאה אחת לליד${b.grounding ? ", כולל חיפוש Google" : ""}).\nשום ליד לא יתעדכן בלי אישור שלך. להמשיך?`)) return;
  S.en.running = true; S.en.stop = false; S.en.err = "";
  try {
    for (const it of S.en.items.filter(i => i.status === "running")) await enUpdItem(it, { status: "queued" }); // stopped mid-call earlier
    await enAudit(b.enrichment_started_at ? "run_resumed" : "run_started", { details: { dry_run: true, grounding: b.grounding, queued: todo } });
    await enUpdBatch({ status: "running", enrichment_started_at: b.enrichment_started_at || enNow() });
    renderEnrich();
    for (let pass = 0; pass < OPEnrich.MAX_ATTEMPTS && !S.en.stop; pass++) {
      for (const it of S.en.items) {
        if (S.en.stop) break;
        if (it.status !== "queued") continue;
        if (it.attempts >= OPEnrich.MAX_ATTEMPTS) { await enUpdItem(it, { status: "failed", error: "מוצו הניסיונות" }); continue; }
        const lead = enLead(it);
        if (!lead) { await enUpdItem(it, { status: "failed", error: "הליד לא נמצא במאגר" }); continue; }
        const payload = OPEnrich.buildPayload(lead.enr);
        await enUpdItem(it, { status: "running", attempts: it.attempts + 1, started_at: enNow(), request_payload: payload });
        renderEnrich();
        const r = await enCall(payload, S.en.batch.grounding);
        const usage = r.data && r.data.usage, tokens = usage ? usage.totalTokenCount || 0 : 0, model = (r.data && r.data.model) || S.en.batch.model || null;
        const cost = OPEnrich.estimateCost(usage);
        await enUpdBatch({ request_count: (S.en.batch.request_count || 0) + 1, tokens_used: (S.en.batch.tokens_used || 0) + tokens, model,
          estimated_cost: cost == null ? S.en.batch.estimated_cost : Number(S.en.batch.estimated_cost || 0) + cost });
        const base = { request_count: (it.request_count || 0) + 1, tokens_used: (it.tokens_used || 0) + tokens, model, finished_at: enNow() };
        if (!r.ok) {
          const cls = OPEnrich.classifyError(r.http, r.reason);
          const retry = cls.retry && it.attempts < OPEnrich.MAX_ATTEMPTS && !cls.stop;
          /* account-level stop (402/429/401/403/404): the lead was not researched – back to the queue, attempt not counted */
          const back = cls.stop ? { status: "queued", attempts: Math.max(0, it.attempts - 1) } : { status: retry ? "queued" : "failed" };
          await enUpdItem(it, { ...base, ...back, error: `${cls.label}${r.message ? " · " + r.message : ""}` });
          await enAudit("call_failed", { item_id: it.id, lead_id: it.lead_id, model, details: { http: r.http, label: cls.label, retry } });
          if (cls.stop) { S.en.err = cls.label; S.en.stop = true; }
          renderEnrich();
          continue;
        }
        const v = OPEnrich.validateResponse(r.data.text, lead.enr);
        if (!v.ok) {
          await enUpdItem(it, { ...base, status: "failed", error: v.error, validation: { warnings: v.warnings }, grounding: { sources: r.data.sources || [] } });
          await enAudit("call_invalid", { item_id: it.id, lead_id: it.lead_id, model, details: { error: v.error, tokens } });
        } else {
          const d = OPEnrich.diff(lead.enr, v.findings);
          const review = v.needsReview || d.some(f => f.change === "conflict");
          await enUpdItem(it, { ...base, status: review ? "manual_review" : "done", error: null,
            findings: { findings: d, notFound: v.notFound, missing_fields: v.missing_fields, notes: v.notes },
            validation: { warnings: v.warnings }, grounding: { sources: r.data.sources || [], queries: r.data.queries || [] } });
          await enAudit("call_ok", { item_id: it.id, lead_id: it.lead_id, model, details: { tokens, findings: d.length, not_found: v.notFound.length, review } });
        }
        renderEnrich();
      }
    }
    const left = S.en.items.filter(i => i.status === "queued").length;
    await enUpdBatch(S.en.stop || left ? { status: "paused" } : { status: "done", enrichment_finished_at: enNow() });
    await enAudit(S.en.stop ? "run_stopped" : "run_finished", { details: { left, error: S.en.err || null } });
  } catch (e) {
    S.en.err = String(e && e.message || e);
    try { await enUpdBatch({ status: "paused" }); } catch (x) { /* keep error */ }
  }

  renderEnrich();

  if (error) { toast("קריאת הליד נכשלה: " + error.message); return false; }

  patch.evidence = [...(Array.isArray(cur && cur.evidence) ? cur.evidence : []), ...evidence];
  patch.enrichment_source = "gemini";
  patch.enrichment_status = "ai_verified";
  patch.verification_date = enNow().slice(0, 10);
  const ok = await saveLeadEnrichment(lead, patch, `"${lead.name}": ${evidence.length} ממצאים נשמרו אחרי אישור`);
  if (!ok) return false;

  const total = ((it.findings && it.findings.findings) || []).length;

    applied: { fields: Object.keys(patch).filter(k => k !== "evidence"), evidence: evidence.length, conflicts } });

    findings: chosen.map(f => ({ field: f.field, value: f.value, source: f.source, url: f.url, status: f.status })), conflicts } });

    if (!c.enr.safety_officer_name) targets.push("קצין בטיחות בתעבורה (לא OVDIM)");

        <span class="xs muted">פוטנציאל עסקי: <b>${q.business_potential_score}/100</b> · שלמות מידע: <b>${q.data_completeness_score}/100</b> · מוכנות: <b>${q.contact_readiness_score}/100</b></span>

        <div class="sm"><b>⚠️ מה חסר כרגע בליד:</b> <span class="muted">${esc((q.missing_fields || []).join(", ") || "—")}</span></div>
        <div class="sm"><b>🔍 תוכנית החיפוש של Gemini (Target Fields בלבד):</b> <span style="color:var(--blue);font-weight:600">${esc(targets.join(", ") || "השלמת פרטים כלליים")}</span></div>
      </div>
      <div class="xs muted">🧪 מצב DRY RUN – שום קריאה לא תתבצע ושום מידע לא ייכתב לליד ללא הפעלה ואישור אנושי.</div>
    </div>`;
  }
  return `<div style="display:grid;gap:10px;padding:6px 2px">

    ${f.length ? `<div class="tbl-wrap"><table class="co kv2"><thead><tr><th></th><th>שדה</th><th>לפני</th><th>אחרי</th><th>סטטוס</th><th>מקור</th><th>URL</th><th>שינוי</th></tr></thead><tbody>
      ${f.map(x => `<tr style="cursor:default"><td data-label="אשר"><input type="checkbox" data-en-sel="${it.id}" data-field="${x.field}" ${x.change === "conflict" || decided ? "disabled" : ""} ${x.change !== "conflict" && sel[x.field] !== false ? "checked" : ""} aria-label="כלול באישור"></td>

        <td class="xs" data-label="אחרי"><b>${esc(OPEnrich.show(x.value))}</b>${(x.reasons || []).length ? `<div class="faint">${esc(x.reasons.join(" · "))}</div>` : ""}</td>
        <td data-label="סטטוס">${st(x.status)}</td><td class="xs" data-label="מקור">${esc(x.source || "—")}</td>

      : `<div class="sm muted">${it.status === "done" || it.status === "manual_review" ? "Gemini לא מצא מידע עם מקור לליד זה." : "אין עדיין תוצאות."}</div>`}
    ${(it.findings && it.findings.notFound && it.findings.notFound.length) ? `<div class="xs muted">לא נמצא: ${esc(it.findings.notFound.map(k => OPEnrich.FIELD_LABEL[k] || k).join(", "))}</div>` : ""}
    ${w.length ? `<div style="background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:6px 10px;font-size:12px">${w.map(x => "⚠️ " + esc(x)).join("<br>")}</div>` : ""}
    ${it.findings && it.findings.notes ? `<div class="xs muted">הערות Gemini: ${esc(it.findings.notes)}</div>` : ""}
    ${src.length ? `<div class="xs muted">מקורות חיפוש: ${src.slice(0, 8).map(s => `<a href="${esc(s.uri)}" target="_blank" rel="noopener noreferrer">${esc(s.title || "מקור")}</a>`).join(" · ")}</div>` : ""}
    ${!decided && ["done", "manual_review"].includes(it.status) ? `<div class="row" style="gap:8px"><button class="btn btn-sm btn-primary" data-act="enApprove" data-item="${it.id}" ${f.some(x => x.change !== "conflict") ? "" : "disabled"}>✔ אשר ליד (ממצאים מסומנים)</button>
      <button class="btn btn-sm" data-act="enReject" data-item="${it.id}">✖ דחה</button><span class="xs muted">אישור כותב ל-Supabase רק שדות ריקים; ערך קיים לעולם לא נדרס. שלב הליד ו"מוכן לפנייה" מחושבים מחדש לפי הכללים.</span></div>` : ""}
    ${it.applied ? `<div class="xs" style="color:var(--ok)">נשמר: ${esc((it.applied.fields || []).join(", ") || "ראיות בלבד")}${(it.applied.conflicts || []).length ? ` · ${it.applied.conflicts.length} סתירות לא נכתבו` : ""}</div>` : ""}
  </div>`;
}

/* ===== אירועים ===== */
document.addEventListener("click",e=>{
  const stopEl = e.target.closest("[data-stop]");
  let t = e.target.closest("[data-go],[data-tab],[data-act],[data-co],[data-person],[data-ex],[data-test],[data-def],[data-ai-mode],[data-test-conn],[data-test-src],[data-toggle-src],[data-src-tier],[data-lead-cat]");
  if (stopEl && t && !stopEl.contains(t)) {
    // Prevent actions outside data-stop (like overlay dismiss) from being triggered by clicks inside the panel
    t = null;
  }
  if(stopEl && !t) return;
  if(!t) return;
  const d=t.dataset;
  if(d.act==="closePanel"&&t.classList.contains("overlay")&&e.target!==t)return;
  if(d.act==="closeAiChat"&&t.classList.contains("ai-chat-overlay")&&e.target!==t)return;
  
  if(d.leadCat) {
    S.leadCategory = d.leadCat;
    S.leadActiveFilter = null;
    S.stPage = 1;
    const viewEl = $("#view");
    if (viewEl) viewEl.innerHTML = V.leads();
    return;
  }
  if(d.srcTier) {
    S.srcFilter = d.srcTier;
    const viewEl = $("#view");
    if (viewEl) viewEl.innerHTML = V.sources();
    return;
  }
  if(d.toggleSrc && d.setStatus) {
    setSourceStatus(d.toggleSrc, d.setStatus);
    return;
  }
  if(d.testSrc) {
    testSource(d.testSrc, t);
    return;
  }
  if(d.testConn) {
    testConnection(d.testConn, t);
    return;
  }
  if(d.go){
    if(d.go==="dash" && isEmbedded){
      window.parent.postMessage({ type: "dalia-nav", go: "dashboard" }, "*");
      return;
    }
    go(d.go);
    return;
  }
  if(d.tab){
    S.view="prospector";S.tab=d.tab;S.panel=null;render();window.scrollTo(0,0);return;
  }
  if(d.co&&!e.target.closest("input")&&!e.target.closest("select")&&!e.target.closest("a")&&!e.target.closest("[data-act]")){S.panel={co:+d.co};renderPanel();return}
  if(d.person!=null){S.panel.person=+d.person;renderPanel();return}
  if(d.ex){$("#q").value=d.ex;interpret();return}
  if(d.test){t.disabled=true;t.textContent="בודק…";setTimeout(()=>{t.disabled=false;t.textContent="בדיקת חיבור";toast("החיבור למנוע תקין")},800);return}
  if(d.def){AI.forEach(a=>a.def=a.id===d.def);render();toast("מנוע ברירת המחדל עודכן בהצלחה");return}
  if(d.aiMode){const [id,m]=d.aiMode.split(":");AI.find(a=>a.id===id).mode=m;render();return}
  switch(d.act){
    case "theme":{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";return}
    case "openMenu":$("#side").classList.add("open");$("#scrim").classList.add("open");return;
    case "closeMenu":$("#side").classList.remove("open");$("#scrim").classList.remove("open");return;
    case "setHeroTab": {
      S.heroTab = d.tabMode || "external";
      render();
      return;
    }
    case "runAiDiscovery": {
      runAiDiscovery();
      return;
    }
    case "runInternalQuery": {
      runInternalQuery();
      return;
    }
    case "applyInternalEx": {
      const qInp = $("#q-internal");
      if (qInp) {
        qInp.value = d.ex || "";
        runInternalQuery();
      }
      return;
    }
    case "interpret":interpret();return;
    case "applyInterp":applyInterp();return;
    
    case "selectAllActiveFreeSources": {
      document.querySelectorAll(".src-cb").forEach(cb => {
        cb.checked = (cb.dataset.active === "1");
      });
      const activeIds = Array.from(document.querySelectorAll(".src-cb:checked")).map(cb => cb.value);
      saveSourceSelection(activeIds);
      const counter = $("#sourceSelectionCounterBadge");
      if (counter) counter.textContent = `נבחרו ${activeIds.length} מקורות (מתוכם ${activeIds.length} פעילים ומחוברים ב-0 ₪)`;
      toast(`נבחרו כל ${activeIds.length} המקורות הפעילים והחינמיים`);
      return;
    }
    case "clearAllSources": {
      document.querySelectorAll(".src-cb").forEach(cb => { cb.checked = false; });
      saveSourceSelection([]);
      const counter = $("#sourceSelectionCounterBadge");
      if (counter) counter.textContent = "נבחרו 0 מקורות";
      toast("הבחירה נוקתה לחלוטין");
      return;
    }
    case "selectCategoryGroup": {
      const cat = d.cat;
      document.querySelectorAll(`.src-cb[data-cat="${cat}"]`).forEach(cb => { cb.checked = true; });
      const selIds = Array.from(document.querySelectorAll(".src-cb:checked")).map(cb => cb.value);
      saveSourceSelection(selIds);

                is_approved_lead: true,
                lead_approved_at: c.leadApprovedAt,
                status: c.status,
                updated_at: new Date().toISOString()
              }).eq("company_hp", c.no);
            } catch (e) {
              console.warn("[Prospector] Remote lead approval sync:", e);
            }
          }
        });
      }
      S.selectedCoIds.clear();
      toast(`הועברו ${toApprove.length} חברות בהצלחה לרשימת הלידים המאושרים`);
      const v = $("#view");
      if (v) v.innerHTML = V.companies();
      return;
    }
    case "openAiDispatch":{
      const selectedLeads = C.filter(c => S.selectedCoIds.has(c.id));
      if (!selectedLeads.length) { toast("בחר לפחות ליד אחד להעברה"); return; }
      const alreadyCheckedLeads = selectedLeads.filter(c => c.enr && (c.enr.enrichment_status === "completed" || String(c.enr.enrichment_status).startsWith("ai_") || c.enr.enrichment_source === "gemini_incremental"));
      const inQueueLeads = selectedLeads.filter(c => c.enr && ["queued_for_ai", "sent_to_ai", "ai_processing", "queued", "running"].includes(c.enr.enrichment_status));
      const newLeads = selectedLeads.filter(c => !alreadyCheckedLeads.includes(c) && !inQueueLeads.includes(c));
      S.aiDispatchModal = { selectedLeads, newLeads, alreadyCheckedLeads, inQueueLeads, allowResend: false };
      renderModals();
      return;
    }
    case "showContactSources":{
      const leadId = d.leadId;
      const contactType = d.contactType;
      const lead = C.find(x => String(x.id) === String(leadId));
      if (!lead) return;
      const q = QF(lead);
      const ct = window.OPQualify ? OPQualify.classifyLeadContacts(lead, q) : null;
      if (!ct) return;
      let contactObj = null;
      let contactTitle = "";
      if (contactType === "mobile") {
        contactObj = ct.bestMobile;
        contactTitle = "טלפון נייד ישיר";
      } else if (contactType === "landline") {
        contactObj = ct.bestLandline;
        contactTitle = "טלפון משרדי / קווי";
      } else if (contactType === "email") {
        contactObj = ct.bestEmail;
        contactTitle = "כתובת דוא\"ל עסקית";
      }
      if (!contactObj) {
        toast("אין פרטי קשר זמינים עבור רשומה זו");
        return;
      }
      S.contactSourcesModal = {
        leadId,
        companyName: lead.name || lead.company_name,
        companyHp: lead.no || lead.company_hp,
        contactType,
        contactTitle,
        contactVal: contactObj.val,
        verified: contactObj.verified,
        sources: contactObj.sources || []
      };
      renderModals();
      return;
    }
    case "closeContactSourcesModal":{
      S.contactSourcesModal = null;
      renderModals();
      return;
    }
    case "closeAiDispatchModal":{
      S.aiDispatchModal = null;
      renderModals();
      return;
    }
    case "toggleAiResend":{
      if (S.aiDispatchModal) {
        const cb = $("#ai-allow-resend");
        S.aiDispatchModal.allowResend = cb ? cb.checked : !S.aiDispatchModal.allowResend;
      }
      return;
    }
    case "confirmAiDispatch":{
      if (!S.aiDispatchModal) return;
      const m = S.aiDispatchModal;
      const cb = $("#ai-allow-resend");
      const allowResend = cb ? cb.checked : m.allowResend;
      const toSend = allowResend ? m.selectedLeads : m.newLeads;
      if (!toSend.length) {
        toast("כל הלידים שנבחרו כבר נבדקו בעבר. סמן אישור שליחה חוזרת כדי להעבירם שוב.");
        return;
      }
      toSend.forEach(c => {
        c.enr = c.enr || { id: c.id, company_name: c.name, company_hp: c.no };
        const prevStatus = c.enr.enrichment_status || "new";
        c.enr.enrichment_status = "queued_for_ai";
        c.enr.enrichment_source = "gemini_incremental";
        c.enr.enrichment_batch_id = "batch-" + Date.now();
        c.enr.enrichment_actor = S.activeUser;
        c.enr.raw_payload = c.enr.raw_payload || {};
        c.enr.raw_payload.status_history = c.enr.raw_payload.status_history || [];
        c.enr.raw_payload.status_history.push({
          previous_status: prevStatus,
          new_status: "queued_for_ai",
          timestamp: new Date().toISOString(),
          actor: S.activeUser,
          reason: "העברה להעשרת AI (Incremental) דרך בחירה מרובה",
          source: "gemini_incremental"
        });
        if (typeof _qCache !== "undefined") _qCache.delete(c.enr);
      });
      if (sbClient) {
        toSend.forEach(async c => {
          if (c.enr && c.enr.id) {
            await sbClient.from("prospect_leads").update({
              enrichment_status: "queued_for_ai",
              enrichment_source: "gemini_incremental",
              raw_payload: c.enr.raw_payload,
              updated_at: new Date().toISOString()
            }).eq("id", c.enr.id);
          }
        });
      }
      enAdd(toSend, "bulk_selection");
      S.selectedCoIds.clear();
      S.aiDispatchModal = null;
      renderModals();
      toast(`הועברו ${toSend.length} לידים לתור העשרת AI`);
      if (S.tab === "companies") $("#view").innerHTML = V.companies();
      return;
    }
    case "openExtDispatch":{
      const selectedLeads = C.filter(c => S.selectedCoIds.has(c.id));
      if (!selectedLeads.length) { toast("בחר לפחות ליד אחד להעברה"); return; }
      const provider = "apollo_b2b";
      const alreadySentToProviderCount = selectedLeads.filter(c => c.enr && c.enr.external_provider === provider).length;
      S.extDispatchModal = { selectedLeads, provider, alreadySentToProviderCount, allowResend: false, dryRunResult: null };
      renderModals();
      return;
    }
    case "closeExtDispatchModal":{
      S.extDispatchModal = null;
      renderModals();
      return;
    }
    case "changeExtProvider":{
      const sel = $("#ext-provider-select");
      if (sel && S.extDispatchModal) {
        S.extDispatchModal.provider = sel.value;
        S.extDispatchModal.alreadySentToProviderCount = S.extDispatchModal.selectedLeads.filter(c => c.enr && c.enr.external_provider === sel.value).length;
        S.extDispatchModal.dryRunResult = null;
        renderModals();
      }
      return;
    }
    case "toggleExtResend":{
      if (S.extDispatchModal) {
        const cb = $("#ext-allow-resend");
        S.extDispatchModal.allowResend = cb ? cb.checked : !S.extDispatchModal.allowResend;
      }
      return;
    }
    case "runExtDryRun":{
      if (!S.extDispatchModal) return;
      const m = S.extDispatchModal;
      const lead = m.selectedLeads[0];
      if (!lead) return;
      OPEnrich.sendExternalLead(lead, null, m.provider, { dryRun: true }).then(res => {
        m.dryRunResult = res;
        renderModals();
        toast("סימולציית DRY RUN הושלמה בהצלחה (ללא עלות)");
      });
      return;
    }
    case "exportExtSelected":{
      if (!S.extDispatchModal) return;
      const csv = OPEnrich.exportExternalCandidates(S.extDispatchModal.selectedLeads);
      downloadTextFile(csv, `prospector_selected_external_${Date.now()}.csv`, "text/csv;charset=utf-8;");
      toast(`יוצאו ${S.extDispatchModal.selectedLeads.length} לידים נבחרים ל-CSV`);
      return;
    }
    case "confirmExtDispatch":{
      if (!S.extDispatchModal) return;
      const m = S.extDispatchModal;
      const cb = $("#ext-allow-resend");
      const allowResend = cb ? cb.checked : m.allowResend;
      const toSend = allowResend ? m.selectedLeads : m.selectedLeads.filter(c => !(c.enr && c.enr.external_provider === m.provider));
      if (!toSend.length) {
        toast("כל הלידים שנבחרו כבר נשלחו לספק זה. סמן אישור שליחה חוזרת להעברה נוספת.");
        return;
      }
      toSend.forEach(c => {
        c.enr = c.enr || { id: c.id, company_name: c.name, company_hp: c.no };
        const prevStatus = c.enr.enrichment_status || "candidate_external";
        c.enr.enrichment_status = "sent_to_external";
        c.enr.external_provider = m.provider;
        c.enr.external_sent_at = new Date().toISOString();
        c.enr.raw_payload = c.enr.raw_payload || {};
        c.enr.raw_payload.status_history = c.enr.raw_payload.status_history || [];
        c.enr.raw_payload.status_history.push({
          previous_status: prevStatus,
          new_status: "sent_to_external",
          timestamp: new Date().toISOString(),
          actor: S.activeUser,
          reason: `נשלח לספק חיצוני ${m.provider} (DRY RUN / STAGING)`,
          source: "external_provider"
        });
        if (typeof _qCache !== "undefined") _qCache.delete(c.enr);
      });
      S.selectedCoIds.clear();
      S.extDispatchModal = null;
      renderModals();
      toast(`סומנו ${toSend.length} לידים כנשלחו לספק ${m.provider}`);
      if (S.tab === "companies") $("#view").innerHTML = V.companies();
      return;
    }
    case "exportExternalCandidates":{
      const candidates = C.filter(c => {
        const q = QF(c);
        return q && (q.workflow_status === "candidate_external" || (q.business_potential_score >= 60 && q.contact_readiness_score < 80));
      });
      if (!candidates.length) { toast("לא נמצאו מועמדים מתאימים להעשרה חיצונית"); return; }
      const csv = OPEnrich.exportExternalCandidates(candidates);
      downloadTextFile(csv, `prospector_external_candidates_${new Date().toISOString().slice(0, 10)}.csv`, "text/csv;charset=utf-8;");
      toast(`יוצאו ${candidates.length} מועמדים להעשרה חיצונית כקובץ CSV`);
      return;
    }
    case "refreshDiscoveredSources":{
      fetchDiscoveredSources();
      return;
    }
    case "approveDiscoveredSource":{
      if (d.srcId) approveDiscoveredSource(d.srcId);
      return;
    }
    case "rejectDiscoveredSource":{
      if (d.srcId) rejectDiscoveredSource(d.srcId);
      return;
    }
    case "addTestDiscoveredSource":{
      addTestDiscoveredSource();
      return;
    }
  }
});

document.addEventListener("change",e=>{
  const t=e.target;
  if (t.classList && t.classList.contains("hit-cb")) {
    if (!S.searchHitSelection) S.searchHitSelection = new Set();
    if (t.checked) S.searchHitSelection.add(t.value);
    else S.searchHitSelection.delete(t.value);
    updateHitSelectionCount();
    return;
  }
  if (t.id === "hit-select-all") {
    if (!S.searchHitSelection) S.searchHitSelection = new Set();
    const freshHits = (S.searchHits || []).filter(h => !h.already && !h.adopted);
    const cbs = document.querySelectorAll(".hit-cb:not(:disabled)");
    if (t.checked) {
      freshHits.forEach(h => S.searchHitSelection.add(h.no));
      cbs.forEach(cb => { cb.checked = true; });
    } else {
      freshHits.forEach(h => S.searchHitSelection.delete(h.no));
      cbs.forEach(cb => { cb.checked = false; });
    }
    updateHitSelectionCount();
    return;
  }
  if (t.id === "bulk-select-all") {
    const cbs = document.querySelectorAll(".bulk-hit-cb");
    cbs.forEach(cb => { cb.checked = t.checked; });
    return;
  }
  if(t.classList && t.classList.contains("co-cb")){
    const id = +t.dataset.coId;
    if(t.checked) S.selectedCoIds.add(id);
    else S.selectedCoIds.delete(id);
    const v = $("#view");
    if(v) v.innerHTML = V.companies();
    return;
  }
  if(t.id==="co-select-all"){
    const list = C.filter(c => coMatch(c, S.coFilter));
    const pageSize = S.coPageSize || 50;
    const startIdx = (S.coPage - 1) * pageSize;
    const pagedList = list.slice(startIdx, startIdx + pageSize);
    if(t.checked){
      pagedList.forEach(c => S.selectedCoIds.add(c.id));
    } else {
      pagedList.forEach(c => S.selectedCoIds.delete(c.id));
    }
    const v = $("#view");
    if(v) v.innerHTML = V.companies();
    return;
  }
  if(t.id==="en-grounding"){S.en.grounding=t.checked;if(S.en.batch&&S.en.batch.status==="draft")enUpdBatch({grounding:t.checked}).then(()=>enAudit("grounding_changed",{details:{grounding:t.checked}})).catch(x=>toast(String(x.message||x)));return}
  if(t.dataset.enSel){const m=S.en.sel[t.dataset.enSel]||(S.en.sel[t.dataset.enSel]={});m[t.dataset.field]=t.checked;return}
  if(t.dataset.status){
    const c=C.find(x=>x.id===+t.dataset.status);
    if(c) {
      c.status=t.value;
      persistProspectorData();
      updateRemoteLeadStatus(c.id, c.status);
    }
    toast(`הסטטוס עודכן: ${ST[t.value]||t.value}`);
    if(S.view==="prospector"&&S.tab==="leads")$("#view").innerHTML=V.leads();
    else if(S.tab==="companies")$("#view").innerHTML=V.companies();
    return;
  }
  if(t.dataset.act==="importBackup" && t.files && t.files[0]){
    handleJsonImport(t.files[0]);
    t.value="";
    return;
  }
  if(t.dataset.aiOn){const a=AI.find(x=>x.id===t.dataset.aiOn);a.on=t.checked;a.status=t.checked?"ok":"off";if(!t.checked&&a.def){a.def=false;AI.find(x=>x.on).def=true}render();return}
  if(t.dataset.aiModel){AI.find(x=>x.id===t.dataset.aiModel).model=t.value;renderNav();return}
  if(t.id&&t.id.startsWith("f-")&&CO_FILTERS.includes(t.id.slice(2))){S.coFilter[t.id.slice(2)]=t.value;S.coPage=1;$("#view").innerHTML=V.companies();return;}
  if(t.id&&t.id.startsWith("lead-f-")){
    const k = t.id.slice(7);
    if(!S.leadActiveFilter) S.leadActiveFilter = {};
    S.leadActiveFilter[k] = t.value;
    S.leadActiveFilter.label = "סינון מותאם";
    S.stPage = 1;
    $("#view").innerHTML = V.leads();
    return;
  }
});

document.addEventListener("input",e=>{
  if(e.target.id==="f-q"){S.coFilter.q=e.target.value;S.coPage=1;clearTimeout(S._t);S._t=setTimeout(()=>{$("#view").innerHTML=V.companies();const i=$("#f-q");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)}
});

document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target && e.target.id==="aiChatInput"){
    e.preventDefault();
    const val = e.target.value.trim();
    if(val && !S.aiChatBusy){
      e.target.value = "";
      handleAiUserMessage(val);
    }
    return;
  }
  if(e.key==="Escape"){
    if(S.contactSourcesModal){S.contactSourcesModal=null;renderModals();return}
    if(S.aiChatOpen){S.aiChatOpen=false;renderAiChat();return}
    if(S.panel){S.panel=null;renderPanel();return}
  }
});
render();
async function refreshAuthChrome() {
  const sess = await userSession();
  const btn = $("#authBtn");
  const foot = $("#sideUser");
  const av = $("#userAvatar");
  if (sess) {
    const who = sess.email ? sess.email : "משתמש מחובר";
    if (btn) { btn.textContent = "מחובר"; btn.title = "הסשן פעיל"; }
    if (foot) foot.innerHTML = `<b>${esc(who)}</b>סשן דליה פעיל`;
    if (av) { av.textContent = "✓"; av.title = "מחובר"; }
  } else {
    if (btn) { btn.textContent = "התחבר לדליה"; btn.title = "נדרש כדי להפעיל את Gemini"; }
    if (foot) foot.innerHTML = "<b>לא מחובר</b>Gemini דורש התחברות מנהל";
    if (av) { av.textContent = "?"; av.title = "לא מחובר"; }
  }
}
refreshAuthChrome();
window.addEventListener("focus", () => { refreshAuthChrome(); });
try { if (window.parent !== window) window.parent.postMessage({ type: "dalia-coco-auth-request" }, location.origin); } catch (e) { /* אין מעטפת */ }
/* Supabase STAGING is the source of truth; localStorage only renders the first paint */
syncWithRemoteSupabase();
