async function runSearch(){
  if(S.searching) return;
  const rawQuery = (($("#a-kw") && $("#a-kw").value.trim()) || (S._interp && S._interp.keyword) || ($("#q") && $("#q").value.trim()) || "").replace(/\s+/g, " ").trim();
  const filterInd = $("#a-ind") ? $("#a-ind").value : "";

  // Multi-keyword resolution
  let keywords = rawQuery.split(/[,،;]+/).map(k => k.trim()).filter(Boolean);
  if (keywords.length === 0 && filterInd && filterInd !== "כל הענפים" && filterInd !== "כל הענפים והתחומים") {
    keywords = (window.OPQualify && window.OPQualify.OPDomainKeywords)
      ? window.OPQualify.OPDomainKeywords.getKeywordsForDomain(filterInd)
      : [filterInd];
  }
  if (keywords.length === 0) keywords = ["הובלות"];
  keywords = keywords.slice(0, 5); // עד 5 מילים לשאילתה מרובה

  const queryTerm = keywords.join(", ");
  S._lastQueryTerm = queryTerm;

  const filterRegion = $("#a-region") ? $("#a-region").value : "";
  const filterCity = $("#a-city") ? $("#a-city").value.trim().toLowerCase() : "";
  const filterSource = $("#a-source") ? $("#a-source").value : "companies";
  const filterFleetType = $("#a-fleet-type") ? $("#a-fleet-type").value : "";
  const filterFleetMode = $("#a-fleet-filter-mode") ? $("#a-fleet-filter-mode").value : "all";
  const filterLeadStatus = $("#a-lead-status-filter") ? $("#a-lead-status-filter").value : "all";
  const countEl = $("#a-count");
  const reqLimit = Math.min(100, Math.max(1, countEl ? (parseInt(countEl.value, 10) || 20) : 20));

  S.searching = true;
  const box = $("#progress");
  const draw=(i, extra="")=>box.innerHTML=`<div class="card" style="margin-top:18px"><div class="card-h"><h2>החיפוש בתהליך<span class="h-bar"></span></h2><span class="spacer"></span><span class="badge b-blue">סריקה חיה מול data.gov.il</span></div>
    <div class="card-b"><div class="steps">${SEARCH_STEPS.map((s,k)=>`<div class="step ${k<i?"done":k===i?"run":"wait"}"><span class="ic">${k<i?"✓":""}</span>${s}</div>`).join("")}</div>
    ${extra}</div></div>`;

  draw(1);
  const fetchedRows = [];
  let fetchError = "";

  for (const kw of keywords) {
    // 1. רשם החברות (חברות כלליות)
    if (filterSource === "companies" || filterSource === "combined") {
      try {
        const url = `https://data.gov.il/api/3/action/datastore_search?resource_id=f004176c-b85f-4542-8901-7b3176f9a054&q=${encodeURIComponent(kw)}&limit=${Math.ceil(reqLimit * 1.5)}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (data && data.success && Array.isArray(data.result && data.result.records)) {
            data.result.records.forEach(rec => {
              const row = registryHit(rec);
              if (row) {
                row.source_keyword = kw;
                row.source = "companies";
                row.source_label = "רשם החברות";
                row.fleetVerified = false;
                row.fleetPotential = /הובל|משאיות|הפצה|לוגיסטיקה/.test((row.name||"") + (row.ind||"")) ? "פוטנציאל צי: 5+ (הערכה)" : "מספר רכבים לא אומת";
                fetchedRows.push(row);
              }
            });
          }
        }
      } catch(e) {
        fetchError = e && e.message ? e.message : "שגיאת רשת";
      }
    }

    // 2. פנקס הקבלנים (ענף 200, תשתיות, עפר)
    if (filterSource === "contractors" || filterSource === "combined") {
      try {
        const url = `https://data.gov.il/api/3/action/datastore_search?resource_id=4eb61bd6-18cf-4e7c-9f9c-e166dfa0a2d8&q=${encodeURIComponent(kw)}&limit=${Math.ceil(reqLimit * 1.5)}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (data && data.success && Array.isArray(data.result && data.result.records)) {
            data.result.records.forEach(rec => {
              const hp = String(rec["מספר ח.פ."] || rec["מספר חברה"] || rec["ח.פ"] || rec["ח.פ."] || "").replace(/\D/g, "");
              const name = String(rec["שם קבלן"] || rec["שם חברה"] || "").replace(/בע~מ|בע״מ|בע"מ/g, "").trim();
              if (hp && hp.length >= 5 && name) {
                const cityRaw = String(rec["ישוב"] || rec["שם ישוב"] || rec["עיר"] || "").trim();
                const branchDesc = String(rec["ענף"] || rec["תיאור ענף"] || "קבלן רשום").trim();
                fetchedRows.push({
                  no: hp,
                  name,
                  city: cityRaw || "לא ידוע",
                  addr: cityRaw || "לא ידוע",
                  ind: branchDesc,
                  status: "פעילה",
                  incorporated: "לא ידוע",
                  addrKnown: !!cityRaw,
                  source_keyword: kw,
                  source: "contractors",
                  source_label: "פנקס הקבלנים",
                  fleetVerified: false,
                  fleetPotential: "פוטנציאל צי: 5+ (הערכה)"
                });
              }
            });
          }
        }
      } catch(e) {
        if (!fetchError) fetchError = e && e.message ? e.message : "שגיאת רשת";
      }
    }
  }

  // Deduplicate and apply post-fetch filters
  const seen = new Set();
  const hits = [];

  fetchedRows.forEach(row => {
    const normHp = (window.OPQualify ? OPQualify.normalizeCompanyHp(row.no) : String(row.no).replace(/\D/g, ''));
    if (!normHp || seen.has(normHp)) return;
    seen.add(normHp);
    row.no = normHp;

    // 1. סינון עיר מקומי (Post-Fetch)
    if (filterCity && !String(row.city || "").toLowerCase().includes(filterCity)) return;

    // 2. סינון אזור מקומי (Post-Fetch)
    const derivedRegion = (window.OPQualify ? OPQualify.cityToRegion(row.city) : "לא ידוע");
    if (filterRegion && filterRegion !== "כל האזורים" && derivedRegion !== filterRegion) return;

    // 3. סינון ענף מקומי (Post-Fetch)
    if (filterInd && filterInd !== "כל הענפים" && filterInd !== "כל הענפים והתחומים" && !String(row.ind || "").includes(filterInd) && !String(row.name || "").includes(filterInd)) return;

    // 4. סינון סוג רכב מקומי (Post-Fetch)
    if (filterFleetType && !String(row.fleetPotential || "").includes(filterFleetType) && !String(row.ind || "").includes(filterFleetType) && !String(row.name || "").includes(filterFleetType)) return;

    // 5. סינון גודל צי / פוטנציאל (Post-Fetch)
    if (filterFleetMode === "verified_5plus" && !row.fleetVerified) return;
    if (filterFleetMode === "potential_5plus" && !String(row.fleetPotential || "").includes("5+")) return;

    // 6. סינון מצב ליד קיים במערכת (Post-Fetch)
    const already = C.some(existing => (window.OPQualify ? OPQualify.normalizeCompanyHp(existing.no) : String(existing.no).replace(/\D/g, '')) === normHp);
    if (filterLeadStatus === "not_in_leads" && already) return;
    if (filterLeadStatus === "already_in_leads" && !already) return;

    hits.push({ ...row, already, adopted: already, region: derivedRegion });
  });

  const cappedHits = hits.slice(0, reqLimit);
  S.searchHits = cappedHits;
  const fresh = cappedHits.filter(h => !h.already).length;
  const meta = fetchError && cappedHits.length === 0
    ? `השליפה נכשלה (${fetchError}). נמצאו 0 חברות.`
    : `נמצאו ${cappedHits.length} חברות במאגר עבור "${queryTerm}" (מקור: ${filterSource === "contractors" ? "פנקס הקבלנים" : filterSource === "combined" ? "משולב" : "רשם החברות"}). ${fresh} טרם נוספו למאגר. ${cappedHits.length - fresh} כבר קיימות.`;
  draw(SEARCH_STEPS.length, renderSearchHits(meta));

  RUNS.unshift({
    q: queryTerm + ` (${filterSource === "contractors" ? "פנקס הקבלנים" : "רשם החברות"})`,
    when: "עכשיו",
    st: fetchError && cappedHits.length === 0 ? "error" : "done",
    found: cappedHits.length,
    fit: fresh,
    engine: "data.gov.il",
    cost: "₪0 (מאגר פתוח)"
  });
  try { localStorage.setItem(PROSPECTOR_RUNS_KEY, JSON.stringify(RUNS)); } catch (e) { }
  S.searching = false;
  toast(fetchError && cappedHits.length === 0 ? "החיפוש נכשל: " + fetchError : `החיפוש הסתיים: ${cappedHits.length} חברות אמיתיות`);
}

function adoptSearchHits(){
  const selected = [...document.querySelectorAll(".hit-cb:checked")].map(el => el.value);
  if (!selected.length) { toast("סמן חברות להעברה"); return; }
  const picks = (S.searchHits || []).filter(h => selected.includes(h.no) && !h.already && !h.adopted);
  if (!picks.length) { toast("החברות שסומנו כבר נמצאות ברשימה"); return; }
  const preview = picks.slice(0, 6).map(h => h.name).join("\n");
  if (!confirm(`להוסיף ${picks.length} חברות למאגר החברות שנמצאו במסך הזה?\n\n${preview}\n\n(נשמרות כחברות שנמצאו — העברה לניהול לידים מאושרים דורשת אישור משתמש נפרד).`)) return;
  const created = [];
  picks.forEach(h => {
    const normHp = (window.OPQualify ? OPQualify.normalizeCompanyHp(h.no) : String(h.no).replace(/\D/g, ''));
    const reg = (window.OPQualify ? OPQualify.cityToRegion(h.city) : "לא ידוע");
    const lead = {
      id: C.length + 1,
      name: h.name,
      no: normHp,
      ind: h.ind,
      city: h.city,
      region: reg,
      addr: h.addr,
      web: "",
      phone: "לא ידוע",
      mail: "",
      size: "לא ידוע",
      fleet: { s: h.fleetVerified ? "v" : "n", val: h.fleetPotential || "לא ידוע", src: h.source_label || "data.gov.il" },
      fleetType: h.ind || "רכבי עבודה",
      score: 0,
      status: "new",
      isApprovedLead: false, // Discovered company, not approved lead yet!
      source_keyword: h.source_keyword || S._lastQueryTerm || "",
      source: h.source || "companies",
      found: new Date().toLocaleDateString("he-IL"),
      upd: new Date().toLocaleDateString("he-IL"),
      multiPhones: [],
      multiMails: [],
      facts: { no: "v", ind: h.ind === "לא ידוע" ? "n" : "v", addr: h.addrKnown ? "v" : "n", web: "n", phone: "n", mail: "n", size: "n" },
      ev: [["🏛️", h.source_label || "data.gov.il", `ח.פ. ${normHp}, מילת מפתח: ${h.source_keyword || "—"}, סטטוס: ${h.status || "פעילה"}`, "https://data.gov.il", "v", new Date().toLocaleDateString("he-IL"), "A", "Tier A ממשלתי"]],
      people: [],
      notes: `נוסף מ${h.source_label || "מאגר ממשלתי"} (מילת מפתח: ${h.source_keyword || "—"}) כחברה שנמצאה. נדרש אישור משתמש להעברה ללידים.`,
      searchStaged: true
    };
    C.unshift(lead);
    created.push(lead);
    h.adopted = true;
  });
  persistProspectorData();
  toast(`${created.length} חברות נוספו למאגר החברות שנמצאו. סמן אותן בטבלה ולחץ 'אשר והעבר לניהול לידים'.`);
}

/* ===== מנוע ייבוא המוני ואצוות (BULK INGESTION & BATCH ENGINE) ===== */
async function startBulkImport(targetCountArg, sourceArg, batchSizeArg) {
  if (S.bulk.running) return;

  const targetEl = $("#bulk-target");
  const sourceEl = $("#bulk-source");
  const batchSizeEl = $("#bulk-batch-size");

  const targetCount = targetCountArg || (targetEl ? (parseInt(targetEl.value, 10) || 100) : 100);
  const selectedSource = sourceArg || (sourceEl ? sourceEl.value : "contractors_infra");
  const batchSize = batchSizeArg || (batchSizeEl ? (parseInt(batchSizeEl.value, 10) || 50) : 50);

  S.bulk.running = true;
  S.bulk.paused = false;
  S.bulk.targetCount = targetCount;
  S.bulk.batchSize = batchSize;
  S.bulk.source = selectedSource;
  S.bulk.offset = 0;
  S.bulk.stats = { scanned: 0, added: 0, duplicates: 0, rejected: 0, fleetEvidence: 0, safetyOfficers: 0 };
  S.bulk.staged = [];
  S.bulk.logs = [];

  const area = $("#bulkProgressArea"); if (area) area.style.display = "block";
  const btnStart = $("#btnBulkStart"); if (btnStart) btnStart.style.display = "none";
  const btnPause = $("#btnBulkPause"); if (btnPause) btnPause.style.display = "inline-flex";
  const btnResume = $("#btnBulkResume"); if (btnResume) btnResume.style.display = "none";
  const btnClear = $("#btnBulkClear"); if (btnClear) btnClear.style.display = "inline-flex";
  const btnCommit = $("#btnBulkCommit"); if (btnCommit) btnCommit.style.display = "none";
  const btnExport = $("#btnBulkExport"); if (btnExport) btnExport.style.display = "none";

  const addLog = (msg) => {
    const time = new Date().toLocaleTimeString("he-IL", { hour12: false });
    const logBox = $("#bulkLogBox");
    if (logBox) {
      const line = document.createElement("div");
      line.textContent = `[${time}] ${msg}`;
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }
  };

  addLog(`התחלת ייבוא המוני: יעד ${targetCount} לידים ממאגר ${selectedSource}, אצווה של ${batchSize}...`);

  let resourceId = "4eb61bd6-18cf-4e7c-9f9c-e166dfa0a2d8";
  let queryTerm = "תשתית";
  let isContractors = true;

  if (selectedSource === "contractors_all") {
    resourceId = "4eb61bd6-18cf-4e7c-9f9c-e166dfa0a2d8";
    queryTerm = "";
    isContractors = true;
  } else if (selectedSource === "companies_transport") {
    resourceId = "f004176c-b85f-4542-8901-7b3176f9a054";
    queryTerm = "הובלות";
    isContractors = false;
  } else if (selectedSource === "companies_bus") {
    resourceId = "f004176c-b85f-4542-8901-7b3176f9a054";
    queryTerm = "הסעות";
    isContractors = false;
  } else if (selectedSource === "combined") {
    resourceId = "4eb61bd6-18cf-4e7c-9f9c-e166dfa0a2d8";
    queryTerm = "עפר";
    isContractors = true;
  }

  const existingNos = new Set(C.map(c => c.no).filter(Boolean));
  const existingNames = new Set(C.map(c => c.name.trim()));

  let batchIndex = 1;

  while (S.bulk.running && S.bulk.stats.added < targetCount) {
    if (S.bulk.paused) {
      await new Promise(r => setTimeout(r, 300));
      continue;
    }

    const currentOffset = S.bulk.offset;
    const url = `https://data.gov.il/api/3/action/datastore_search?resource_id=${resourceId}&limit=${batchSize}&offset=${currentOffset}&q=${encodeURIComponent(queryTerm)}`;

    let records = [];
    let attempts = 0;
    while (attempts < 3) {
      try {
        const res = await fetch(url);
        if (res.ok) {
          const json = await res.json();
          if (json && json.success && Array.isArray(json.result.records)) {
            records = json.result.records;
            break;
          }
        }
      } catch (err) {
        attempts++;
        addLog(`התראה באצווה ${batchIndex}: ניסיון ${attempts} נכשל, ממתין 800ms...`);
        await new Promise(r => setTimeout(r, 800));
      }
      attempts++;
    }

    if (records.length === 0) {
      addLog(`לא חזרו רשומות נוספות ממאגר הממשלתי (סוף המאגר או שאילתה מוצתה).`);
      break;
    }

    S.bulk.stats.scanned += records.length;
    let batchNewAdded = 0;

    for (const rec of records) {
      const rawCompId = String(isContractors ? rec.MISPAR_YESHUT : (rec['מספר חברה'] || rec._id || '')).trim();
      const compId = (window.OPQualify ? OPQualify.normalizeCompanyHp(rawCompId) : rawCompId.replace(/\D/g, ''));
      const rawName = String(isContractors ? rec.SHEM_YESHUT : (rec['שם חברה'] || '')).trim();
      const compName = rawName.replace(/בע~מ|בע"מ/g, '').trim();

      if (!compName || !compId || (window.OPQualify && !OPQualify.isValidIsraeliCompanyNumber(compId))) {
        S.bulk.stats.rejected++;
        continue;
      }

      // חילוץ טלפון מאומת ממאגר ממשלתי (ללא יצירת מספרים מדומים)
      let phone = "";
      if (isContractors && rec.MISPAR_TEL) {
        const rawP = String(rec.MISPAR_TEL).replace(/\D/g, '');
        if (rawP.length === 9) phone = '0' + rawP;
        else if (rawP.length === 10) phone = rawP;
        if (phone.length === 10) {
          phone = phone.slice(0, 3) + '-' + phone.slice(3, 6) + '-' + phone.slice(6);
        } else if (phone.length === 9) {
          phone = phone.slice(0, 2) + '-' + phone.slice(2, 5) + '-' + phone.slice(5);
        }
      }

      const email = String(isContractors ? (rec.EMAIL || '') : '').trim();
      const city = String(isContractors ? (rec.SHEM_YISHUV || 'מרכז') : (rec['שם עיר'] || rec['ישוב'] || 'מרכז')).trim();
      const branch = String(isContractors ? (rec.TEUR_ANAF || 'תשתיות ועפר') : (queryTerm.includes('הפצ') ? 'הפצה ולוגיסטיקה' : 'הובלות')).trim();
      const street = String(isContractors ? (rec.SHEM_REHOV || '') : (rec['שם רחוב'] || '')).trim();
      const houseNo = String(isContractors ? (rec.MISPAR_BAIT || '') : (rec['מספר בית'] || '')).trim();
      const fullAddr = street ? `${street} ${houseNo}, ${city}` : city;

      // כלל OVDIM קריטי: שדה OVDIM בפנקס הקבלנים מייצג איש מקצוע כשיר ברישיון הקבלן (מהנדס/הנדסאי/מנהל עבודה).
      // אסור לחלוטין לסווג איש מקצוע זה כקצין בטיחות בתעבורה או כמנהל צי!
      const rawOvdim = isContractors && rec.OVDIM ? String(rec.OVDIM).trim() : '';
      let certifiedName = '';
      if (rawOvdim && rawOvdim !== 'לא צוין' && rawOvdim !== '-') {
        const parts = rawOvdim.split(/[-–;,]/).map(s => s.trim()).filter(Boolean);
        if (parts.length > 0) certifiedName = parts[0];
      }

      // מניעת כפילויות קפדנית לפי ח.פ. מנורמל בלבד (אין למזג חברות על בסיס שם דומה כשח.פ. שונה!)
      if (existingNos.has(compId)) {
        S.bulk.stats.duplicates++;
        continue;
      }

      existingNos.add(compId);
      existingNames.add(compName);

      const certifiedProf = certifiedName ? {
        name: certifiedName,
        role: "איש מקצוע כשיר הרשום ברישיון הקבלן",
        source: "פנקס הקבלנים הרשומים (משאב 4eb61bd6)",
        tier: "A"
      } : null;

      // קביעת מעמד צי וקצין בטיחות (תקנה 579)
      const isHeavyOrInfra = isContractors || /כביש|תשתית|עפר|צמ"ה|הובל|שינוע|היסע|אוטובוס/.test(branch + compName);
      const fleetType = isContractors
        ? "כלי צמ\"ה ומשאיות כבדות"
        : (queryTerm.includes("הסע") ? "אוטובוסים ומיניבוסים" : "משאיות הובלה מעל 15 טון");

      const safetyOfficerObj = isHeavyOrInfra ? {
        name: "טרם אותר קצב\"ת בשם",
        role: `חובת פיקוח לפי תקנה 579 (ענף ${branch})`,
        status: "e",
        mandate579: true,
        note: certifiedName
          ? `איש מקצוע כשיר ברישיון הקבלן: ${certifiedName}. חובת פיקוח קצב\"ת חלה לפי תקנה 579 לצי בענף ${branch}.`
          : `חובת פיקוח קצב\"ת חלה לפי תקנה 579 לצי בענף ${branch}.`,
        source: isContractors ? "פנקס הקבלנים הרשומים (data.gov.il) + תקנה 579" : "רשם החברות הממשלתי",
        tier: "A",
        tierLabel: "Tier A | ממשלתי רשמי"
      } : null;

      const peopleList = [];
      if (certifiedName) {
        peopleList.push([certifiedName, "איש מקצוע כשיר הרשום ברישיון הקבלן", "v", email, phone, "A"]);
      }

      const derivedRegion = (window.OPQualify ? OPQualify.cityToRegion(city) : "לא ידוע");
      const computedScore = Math.min(95, (phone ? 25 : 0) + (email ? 15 : 0) + (isHeavyOrInfra ? 25 : 15) + (certifiedProf ? 15 : 0) + 20);

      const newLead = {
        id: C.length + 1,
        name: compName,
        no: compId,
        ind: branch,
        city: city,
        region: derivedRegion,
        addr: fullAddr,
        web: "",
        phone: phone || "לא נמצא",
        mail: email || "",
        size: "לא ידוע", // עובדים לא ידועים ללא מאגר מוסמך
        fleet: {
          s: "f", // הערכה / אינדיקציה ענפית בלבד – לא מוצג כמאומת ללא מאגר רכב
          val: isContractors ? "אינדיקציה לענף תשתיות (הערכה)" : "אינדיקציה להובלה (הערכה)",
          src: isContractors ? "פנקס הקבלנים ענף 200 (הערכה ענפית)" : "רשם החברות (הערכה ענפית)"
        },
        fleetType: fleetType,
        score: computedScore,
        status: "new",
        isApprovedLead: false, // Discovered company, NOT an approved lead!
        source_keyword: queryTerm,
        found: new Date().toLocaleDateString("he-IL"),
        upd: new Date().toLocaleDateString("he-IL"),
        isSafetyOfficerLead: isHeavyOrInfra,
        certifiedProfessional: certifiedProf,
        safetyOfficer: safetyOfficerObj,
        leadReason: `קבלן/חברה פעילה בענף ${branch}, מפעילה צי רכב מסחרי/תפעולי הדורש שירותי מוסך, בדיקות בטיחות חודשיות ותחזוקת שבר.`,
        multiPhones: phone ? [{ val: phone, source: isContractors ? "פנקס הקבלנים הרשומים (רשמי)" : "רשם החברות (data.gov.il)", tier: "A", tierLabel: "Tier A | ממשלתי רשמי" }] : [],
        multiMails: email ? [{ val: email, source: "פנקס הקבלנים הרשומים (רשמי)", tier: "A", tierLabel: "Tier A | ממשלתי רשמי" }] : [],
        facts: { no: "v", ind: "v", addr: street ? "v" : "e", web: "n", phone: phone ? "v" : "n", mail: email ? "v" : "n", size: "n" },
        ev: [
          ["🏛️", isContractors ? "פנקס הקבלנים (data.gov.il)" : "רשם החברות (data.gov.il)", `חברה מאומתת מס' ${compId}, ענף ${branch}`, "data.gov.il", "v", new Date().toLocaleDateString("he-IL"), "A", "Tier A ממשלתי"],
          ["⚖️", "תקנה 579 לתקנות התעבורה", "חובת מינוי קצין בטיחות בתעבורה לצי מעל 20 כלי רכב כבדים", "תקנות התעבורה", "v", new Date().toLocaleDateString("he-IL"), "A", "Tier A חוקי"]
        ],
        people: peopleList,
        notes: `נוסף בייבוא המוני (חברה שנמצאה) ממקור ${isContractors ? 'פנקס הקבלנים הרשומים' : 'רשם החברות'}. נדרש אישור משתמש להעברה ללידים.`,
        searchStaged: true
      };

      C.push(newLead);
      S.bulk.staged.push(newLead);
      S.bulk.stats.added++;
      batchNewAdded++;
      if (isHeavyOrInfra) {
        S.bulk.stats.safetyOfficers++;
        S.bulk.stats.fleetEvidence++;
      }

      if (S.bulk.stats.added >= targetCount) break;
    }

    S.bulk.offset += records.length;
    addLog(`אצווה ${batchIndex}: נסרקו ${records.length} רשומות · נוספו ${batchNewAdded} לידים חדשים · כפילויות שנמנעו: ${S.bulk.stats.duplicates}`);

    persistProspectorData();
    updateBulkUI(targetCount);
    batchIndex++;

    await new Promise(r => setTimeout(r, 120));
  }

  S.bulk.running = false;
  persistProspectorData();
  if (btnPause) btnPause.style.display = "none";
  if (btnResume) btnResume.style.display = "none";
  if (btnStart) btnStart.style.display = "inline-flex";
  if (btnCommit) btnCommit.style.display = "inline-flex";
  if (btnExport) btnExport.style.display = "inline-flex";

  const statusText = $("#bulkStatusText");
  if (statusText) statusText.textContent = `הסתיים בהצלחה: נוספו ${S.bulk.stats.added} לידים חדשים`;

  addLog(`🎉 ייבוא המוני הסתיים! סה"כ נוספו ${S.bulk.stats.added} לידים (מתוכם ${S.bulk.stats.safetyOfficers} בעלי חובת פיקוח קצב"ת/צי).`);
  toast(`הייבוא ההמוני הסתיים: ${S.bulk.stats.added} לידים נוספו למערכת`);
  renderNav();
}

function updateBulkUI(targetCount) {
  const s = S.bulk.stats;
  const pct = Math.min(100, Math.round((s.added / targetCount) * 100)) || 0;
  const pBar = $("#bulkProgressBar"); if (pBar) pBar.style.width = `${pct}%`;
  const pPct = $("#bulkProgressPercent"); if (pPct) pPct.textContent = `${pct}% (${s.added} מתוך ${targetCount})`;
  const pLbl = $("#bulkProgressLabel"); if (pLbl) pLbl.textContent = S.bulk.running ? `מעבד אצווה... נסרקו ${s.scanned} רשומות` : `הסתיים: ${s.added} לידים נקלטו`;

  const elScanned = $("#kpiScanned"); if (elScanned) elScanned.textContent = String(s.scanned);
  const elAdded = $("#kpiAdded"); if (elAdded) elAdded.textContent = String(s.added);
  const elDuplicates = $("#kpiDuplicates"); if (elDuplicates) elDuplicates.textContent = String(s.duplicates);
  const elRejected = $("#kpiRejected"); if (elRejected) elRejected.textContent = String(s.rejected);
  const elFleet = $("#kpiFleet"); if (elFleet) elFleet.textContent = String(s.fleetEvidence);
  const elSafety = $("#kpiSafety"); if (elSafety) elSafety.textContent = String(s.safetyOfficers);
}

function pauseBulkImport() {
  if (!S.bulk.running) return;
  S.bulk.paused = true;
  const btnPause = $("#btnBulkPause"); if (btnPause) btnPause.style.display = "none";
  const btnResume = $("#btnBulkResume"); if (btnResume) btnResume.style.display = "inline-flex";
  toast("הייבוא ההמוני הושהה");
}

function resumeBulkImport() {
  if (!S.bulk.running) return;
  S.bulk.paused = false;
  const btnPause = $("#btnBulkPause"); if (btnPause) btnPause.style.display = "inline-flex";
  const btnResume = $("#btnBulkResume"); if (btnResume) btnResume.style.display = "none";
  toast("הייבוא ההמוני ממשיך כעת");
}

function clearBulkImport() {
  if (S.bulk.staged.length > 0) {
    const stagedIds = new Set(S.bulk.staged.map(x => x.id));
    for (let i = C.length - 1; i >= 0; i--) {
      if (stagedIds.has(C[i].id)) C.splice(i, 1);
    }
    toast(`נוקו ${S.bulk.staged.length} לידים שנוספו באצווה הנוכחית`);
    S.bulk.staged = [];
    S.bulk.stats = { scanned: 0, added: 0, duplicates: 0, rejected: 0, fleetEvidence: 0, safetyOfficers: 0 };
    updateBulkUI(S.bulk.targetCount || 100);
    persistProspectorData();
    renderNav();
  } else {
    toast("אין תוצאות זמניות לניקוי");
  }
}

function commitBulkToLeads() {
  persistProspectorData();
  S.view = "prospector";
  S.tab = "companies";
  render();
  window.scrollTo(0, 0);
  toast(`הועברו ${S.bulk.staged.length || S.bulk.stats.added} חברות חדשות למאגר החברות שנמצאו. סמן חברות ולחץ 'אשר והעבר לניהול לידים'.`);
}

/* ===== חברות שנמצאו ===== */
const CO_FILTERS=["st","fleet","stage","phone","mail","contact","ready","missing","quality","city","ind","region","fleetType","fleetSize","source","leadApproved","employeeCount","qualColor","wfStatus","missingField","discoveryBatch","employeeRange","potentialTier"];
function checkMissingField(c, q, fs, mf) {
  if (!q) return false;
  if (mf === "contact") return !OPQualify.hasAnyRealContact(c, q);
  if (mf === "phone") return !OPQualify.hasAnyValidPhone(c, q);
  if (mf === "mobile") return !q.has_mobile_phone;
  if (mf === "email") return !OPQualify.hasAnyValidEmail(c, q);
  if (mf === "website") return !c.web && !(c.enr && c.enr.website);
  if (mf === "fleet_manager") return !(c.enr && c.enr.fleet_manager_name);
  if (mf === "safety_officer") return !(c.enr && c.enr.safety_officer_name);
  if (mf === "fleet") return !fs || fs.fleet.s !== "v";
  return true;
}
function coMatch(c, f) {
  const q = QF(c), fs = q ? q.field_status : null, s = k => fs && fs[k] ? fs[k].s : "n";
  const yn = (v, on) => !v || (v === "yes" ? on : !on);
  const t = (f.q || "").trim().toLowerCase();

  if (t) {
    const inName = (c.name || "").toLowerCase().includes(t);
    const inCity = (c.city || "").toLowerCase().includes(t);
    const inInd = (c.ind || "").toLowerCase().includes(t);
    const inNo = String(c.no || "").toLowerCase().includes(t);
    const inEnrContact = (c.enr && String(c.enr.contact_name || "")).toLowerCase().includes(t);
    const inContacts = q && Array.isArray(q.contacts_list) && q.contacts_list.some(ct =>
      String(ct.name || "").toLowerCase().includes(t) ||
      String(ct.role || "").toLowerCase().includes(t) ||

  let filteredC = approvedC;
  if (cat === "safety_officer") {
    filteredC = approvedC.filter(c => c.isSafetyOfficerLead);
  } else if (cat === "trucks") {
    filteredC = approvedC.filter(c => c.fleetType && (c.fleetType.includes("משאיות") || c.fleetType.includes("פולטריילר") || c.fleetType.includes("סמי") || c.fleetType.includes("רמסע") || c.fleetType.includes("קירור")));

    filteredC = approvedC.filter(c => c.fleetType && (c.fleetType.includes("צמ\"ה") || c.fleetType.includes("עפר") || c.ind.includes("עפר") || c.ind.includes("תשתית")));

  /* תצוגת שלבי ליד: "ready" = מוכן לפנייה, "stage:<key>" = כל שלב אחר */

  return `

  <!-- סרגל סינון קטגוריות ראשי (Category Filter Bar) -->
  <div class="row" style="margin-bottom:14px;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px">

    </button>
    <button class="btn btn-sm" style="${cat==='trucks'?'background:#1d4ed8;color:#fff;border-color:#1d4ed8;font-weight:700':'background:var(--soft);color:var(--text);border:1px solid var(--border)'}" data-lead-cat="trucks">

    </button>
    <button class="btn btn-sm" style="${cat==='machinery'?'background:#1d4ed8;color:#fff;border-color:#1d4ed8;font-weight:700':'background:var(--soft);color:var(--text);border:1px solid var(--border)'}" data-lead-cat="machinery">

    </button>
    <button class="btn btn-sm" style="${cat==='ready'?'background:#15803d;color:#fff;border-color:#15803d;font-weight:700':'background:var(--soft);color:var(--text);border:1px solid var(--border)'}" data-lead-cat="ready">

    <span class="xs bold" style="margin-inline-end:4px">שלבי ליד:</span>
    ${(window.OPQualify ? OPQualify.STAGES : []).map(([k, l]) => `<button class="badge ${STAGE_STY[k]}" style="cursor:pointer;font-size:11.5px;border:${stageKey===k?'2px solid currentColor':'1px solid transparent'}" data-lead-cat="${k==='ready'?'ready':'stage:'+k}">${l} · ${stageCounts[k] || 0}</button>`).join("")}
  </div>

  ${cat === "safety_officer" ? `
    <!-- באנר הסבר ומעמד חוקי: קצין רכב / קצין בטיחות בתעבורה (תקנה 579) -->
    <div class="card card-b" style="border:1.5px solid #93c5fd;background:linear-gradient(135deg,rgba(59,111,224,0.08),rgba(255,255,255,0.02));margin-bottom:16px;border-radius:12px;padding:14px 18px">
      <div class="row" style="flex-wrap:wrap;gap:12px;align-items:flex-start">
        <div style="flex:1;min-width:280px">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:22px">🛡️</span>
            <h3 style="margin:0;font-size:16px;color:#1e3a8a">מועמדים לבדיקת קצין בטיחות בתעבורה (קצב"ת)</h3>
            <span class="badge b-est" style="font-weight:700">${safetyCount} לידים לבדיקה</span>
            <span class="badge b-est" style="font-weight:700">${filteredC.filter(soNamed).length} קצינים אותרו (דורש אימות: ${filteredC.filter(c => soNamed(c) && !soVerified(c)).length})</span>
            <span class="badge b-ok" style="font-weight:700">${filteredC.filter(soVerified).length} חובת קצב"ת מאומתת</span>
          </div>
          <div class="sm" style="margin-top:8px;line-height:1.5;color:var(--text)">
            חברות אלו מופיעות במאגרים רשמיים (פנקס הקבלנים, מאגרי רכב כבד / צמ"ה / אוטובוסים) ונראות רלוונטיות לבדיקה.
            חובת מינוי <b>קצין בטיחות בתעבורה (תקנה 579)</b> <b>לא הוכחה</b> עבורן, אלא אם מסומן במפורש "חובת קצב"ת מאומתת" או "קצין בטיחות אותר".
            איש מקצוע כשיר מפנקס הקבלנים (OVDIM) אינו קצין בטיחות.
          </div>
          <div class="xs muted" style="margin-top:6px;display:flex;gap:12px;flex-wrap:wrap">
            <span>✓ <b>רשומות ממקור אמיתי</b> (ח.פ. ממאגר רשמי)</span>
            <span>✓ נתונים רשמיים ממאגרי <b>data.gov.il</b> ופנקס הקבלנים</span>
            <span>✓ ללא שמות מומצאים (Tier A/B)</span>
            <span>✓ מדרג מהימנות שקוף לכל טלפון ומייל</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-self:center">
          <span class="badge b-blue" style="padding:6px 12px;font-size:12.5px">🎯 יעד אסטרטגי לדליה</span>

  ` : ''}

  ${stageKey ? stageTable(filteredC, stageKey) : `
  <!-- לוח KANBAN לניהול הלידים -->
  <div class="board">
    ${STATUSES.map(([k,l])=>{
      const list = filteredC.filter(c => c.status === k);
      const limit = S.leadsLimit || 40;
      const visibleList = list.slice(0, limit);
      const hasMore = list.length > limit;
      return `
      <div class="col">

/* ===== מסך "מוכן לפנייה" / שלב ליד (טבלה, 50 בעמוד) ===== */
function stageTable(list, stageKey) {
  const pageSize = 50, pages = Math.max(1, Math.ceil(list.length / pageSize));
  S.stPage = Math.min(Math.max(1, S.stPage || 1), pages);
  const page = list.slice((S.stPage - 1) * pageSize, S.stPage * pageSize);
  const stLabel = window.OPQualify ? OPQualify.STAGE_LABEL[stageKey] : stageKey;
  /* ready_for_contact ב-DB שאינו תואם לכללים – מוצג כהתראה, לא כליד מוכן */
  const readyMismatch = stageKey === "ready" ? C.filter(c => { const q = QF(c); return c.enr && q && (c.enr.ready_for_contact === true) !== q.ready_for_contact; }).length : 0;
  const mismatchNote = readyMismatch ? `<div class="xs" style="background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:6px 10px;margin:8px 16px">⚠️ ${readyMismatch} לידים: ready_for_contact ב-Supabase אינו תואם לכללי האימות – לא מוצגים כאן עד לבדיקה</div>` : "";
  const pager = list.length > pageSize ? `<div class="row sm" style="gap:6px;align-items:center">
      <button class="btn btn-sm" data-act="stPrev" ${S.stPage <= 1 ? "disabled" : ""}>◀ עמוד קודם</button>
      <span class="num xs">עמוד ${S.stPage} מתוך ${pages}</span>
      <button class="btn btn-sm" data-act="stNext" ${S.stPage >= pages ? "disabled" : ""}>עמוד הבא ▶</button></div>` : "";
  if (!list.length) {
    /* למה אין לידים בשלב: החסמים הנפוצים בכל המאגר */
    const blk = {};
    C.forEach(c => { const q = QF(c); if (q && q.lead_stage !== "rejected") q.blockers.forEach(b => blk[b] = (blk[b] || 0) + 1); });
    const top = Object.entries(blk).sort((a, b) => b[1] - a[1]);
    return `<div class="card">${mismatchNote}<div class="card-b">

/* ===== עזרים להורדת קבצים ===== */
function downloadTextFile(content, fileName, mimeType) {
  const blob = new Blob([content], { type: mimeType || "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function loadAiChatHistory() {
  try {
    const raw = sessionStorage.getItem("op_ai_chat_history_v2");
    if (raw) {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length > 0) return arr;
    }
  } catch (e) {}
  return null;
}

function saveAiChatHistory() {
  try {
    sessionStorage.setItem("op_ai_chat_history_v2", JSON.stringify(S.aiChatMessages.slice(-50)));

}

function handleAiUserMessage(userText) {
  if (!userText || !userText.trim()) return;
  const qText = userText.trim();
  if (S.aiChatBusy) return;
  S.aiChatBusy = true;
  const seq = ++S.aiChatSeq;
  S.aiChatMessages.push({ role: "user", text: qText });
  const pending = { role: "assistant", text: "בודק את הנתונים ומעבד תשובה…" };
  S.aiChatMessages.push(pending);
  saveAiChatHistory();
  renderAiChat();
  const b = $("#aiChatBody");
  if (b) b.scrollTop = b.scrollHeight;

  const finish = (reply) => {
    S.aiChatBusy = false;
    if (seq !== S.aiChatSeq) {
      pending.text = "השאלה הוחלפה בשאלה חדשה יותר, והתשובה הזו לא עודכנה.";
      saveAiChatHistory();
      renderAiChat();
      return;
    }
    pending.text = reply.text;
    pending.chips = reply.chips || null;
    pending.actionCard = reply.actionCard || null;
    pending.actionFilter = reply.actionFilter || null;
    pending.retryPrompt = reply.retryPrompt || null;
    saveAiChatHistory();
    renderAiChat();
    const b2 = $("#aiChatBody");
    if (b2) b2.scrollTop = b2.scrollHeight;
    const inp = $("#aiChatInput");
    if (inp) inp.focus();
  };

  try {
    const local = processAiQuery(qText);
    if (local) { finish(local); return; }
  } catch(e) {
    console.error("[Prospector Query Error]", e);
  }

  askGeminiFreeform(qText).then(finish).catch(err => {
    finish({
      role: "assistant",
      text: `⚠️ שגיאה בלתי צפויה: ${esc(err.message || String(err))}.\n\nהשיחה נשמרה בצורה מאובטחת.`,
      chips: ["🔄 נסה שוב", "תמליץ על 5 הלידים המובילים ביותר לדליה"],
      retryPrompt: qText
    });
  });
}

/* ===== מנוע הבינה העסקית וההמלצות של דליה (DALIA FLEET INTELLIGENCE & RECOMMENDATION ENGINE) ===== */

function scoreLeadForDaliaFleet(c) {
  let s = c.score || 50;
  const fText = ((c.fleet && c.fleet.val) || "") + " " + (c.fleetType || "");
  const indText = (c.ind || "") + " " + (c.leadReason || "");
  if (/משאיות|עפר|צמ"ה|צמה|רמסע|סמיטריילר|כבדים/.test(fText)) s += 35;
  if (/הובל|שינוע|לוגיסטיקה|עפר|תשתיות|כבישים|מחצבות/.test(indText)) s += 25;
  if (c.isSafetyOfficerLead || (c.safetyOfficer && c.safetyOfficer.mandate579)) s += 20;
  if (c.phone && c.phone !== "לא נמצא" && c.phone !== "n") s += 15;
  if (c.people && c.people.length > 0) s += 15;
  const q = QF(c);
  if (q && q.business_potential_score) s += Math.round(q.business_potential_score / 5);
  return s;
}

function findCompanyInQuery(q) {
  if (S.aiChatContextLead) return S.aiChatContextLead;
  const hpMatch = q.match(/\b\d{8,9}\b/);
  if (hpMatch) {
    const found = C.find(c => c.no && String(c.no).includes(hpMatch[0]));
    if (found) return found;
  }
  const isBroad = /(?:תמצא|חפש|תסנן|תציג|תראה|רשימ|המלצ|כמה|עסקים|חברות הובלה|חברות לוגיסטיקה)/.test(q);
  const isExplicitCompany = /(?:חברת|חברה|כרטיס|עבור|של|דוסייה)\s+([^\s]+)/.test(q);
  if (isBroad && !isExplicitCompany) return null;

  const stopWords = new Set([
    "חברת", "חברה", "של", "על", "מי", "מה", "איך", "האם", "ליד", "לידים", "פרטים", "נתח", "הסבר",
    "אינפורמציה", "טוב", "טובה", "טובים", "טובות", "יותר", "הכי", "עבור", "תספר", "המצב", "כמה",
    "רוצה", "לדעת", "תן", "תמליץ", "תמליצי", "המלצה", "המלצות", "רכב", "צי", "ציי", "רכבים", "משאית",
    "משאיות", "הובלה", "הובלות", "הובלת", "שינוע", "עפר", "תשתית", "תשתיות", "כביש", "כבישים",
    "לוגיסטיקה", "קבלן", "קבלני", "קבלנים", "דרום", "בדרום", "מרכז", "במרכז", "צפון", "בצפון",
    "שפלה", "בשפלה", "באר", "שבע", "אשקלון", "אשדוד", "תל", "אביב", "חיפה", "חולון", "ראשון", "לציון",
    "שירות", "שירותים", "שירותי", "מוסך", "מוסכים", "דליה", "אורן", "קאר", "הצעת", "ערך", "תקנה",
    "בטיחות", "לי", "לו", "לה", "לנו", "להם", "עוד", "בין", "רק", "גם", "את", "אתה", "אתם", "היא",
    "הוא", "הם", "מתאים", "מתאימה", "מתאימות", "מתאימים", "המתאים", "המתאימה", "המתאימים", "המתאימות",
    "רשימה", "רשימת", "אנא", "בבקשה", "איזה", "אילו", "אפשר", "אשמח", "כל", "הכל", "יש", "אין",
    "באזור", "אזור", "מציג", "תמצא", "חפש", "עסקים", "פוטנציאל"
  ]);
  const cleanQ = q.replace(/[?!,.:;""''״׳]/g, " ").trim();
  const words = cleanQ.split(/\s+/).map(w => w.trim()).filter(w => w.length >= 3 && !stopWords.has(w));
  if (!words.length) return null;

  let best = null;
  let bestScore = 0;
  for (const c of C) {
    const cTokens = (c.name || "").split(/\s+/).map(t => t.replace(/[^\u0590-\u05FFa-zA-Z0-9]/g, "").trim());
    let score = 0;
    for (const w of words) {
      const stems = [w];
      if (/^[וכבלמה]/.test(w) && w.length >= 4) stems.push(w.slice(1));
      for (const st of stems) {
        if (cTokens.includes(st)) score += 10;
        else if (c.name && c.name.includes(st)) score += 3;
      }
    }
    if (score > bestScore) {
      bestScore = score;
      best = c;
    }
  }
  return bestScore >= 10 ? best : null;
}

function buildCompanyDossier(c) {
  const q = QF(c);
  const fleetStr = (c.fleet && c.fleet.val) || c.fleetType || "צי רכבי עבודה ומסחריות";

  const contacts = (c.people && c.people.length)
    ? c.people.map(p => `• **${p[0]}** (${p[1]}) — טלפון: \`${p[4] || "—"}\` | מייל: \`${p[3] || "—"}\` (${p[5] ? "Tier " + p[5] : "רשמי"})`).join("\n")

  if (!c.web && !(c.enr && c.enr.website)) missingList.push("אתר אינטרנט");

  return {
    role: "assistant",
    text: `🏢 **תיק חברה וניתוח התאמה לניהול ציים דליה: ${c.name}**
• **ח.פ.:** \`${c.no || "—"}\` | **עיר ואזור:** ${c.city || "—"} (${c.region || "—"}) | **ענף:** ${c.ind || "—"}
• **צי רכב:** **${fleetStr}** (${fleetNotice})
• **דירוג איכות ופוטנציאל:** פוטנציאל עסקי **${q?.business_potential_score || c.score || 50}%** | מוכנות לפנייה **${q?.contact_readiness_score || 0}%** (${q?.lead_quality_label || "פעיל"})

🎯 **נימוק והתאמה לשירותי ניהול ציים ותפעול דליה:**
${reason}
*(הבהרה: דליה אינה מוסך. דליה מספקת שירותי ניהול, תחזוקה, תפעול ופיקוח בטיחות לציי רכב עסקיים מעל 5 רכבים).*

⚖️ **סטטוס קצין בטיחות בתעבורה (תקנה 579):**

📞 **אנשי קשר מאומתים לפנייה:**

⚠️ **שדות שטרם אומתו:**

function executeConversationalSearch(userQuery) {
  const q = userQuery.toLowerCase();

  // 1. Target count
  const countMatch = q.match(/\b(\d+)\s*(?:חברות|לידים|עסקים)?/);
  let targetCount = countMatch ? Math.min(50, Math.max(1, parseInt(countMatch[1], 10))) : (q.includes("תמצא") ? 20 : (q.includes("10") ? 10 : 5));

  // 2. Industry
  let industry = "";
  let indLabel = "כל הענפים";
  if (q.includes("הובל") || q.includes("שינוע") || q.includes("משאית") || q.includes("משאיות")) {
    industry = "הובל";
    indLabel = "הובלה ושינוע";
  } else if (q.includes("לוגיסט") || q.includes("הפצ") || q.includes("שליח")) {
    industry = "לוגיסט";
    indLabel = "לוגיסטיקה והפצה";
  } else if (q.includes("עפר") || q.includes("תשתית") || q.includes("כביש") || q.includes("מחצב") || q.includes("בניי") || q.includes("בניה")) {
    industry = "תשתית";
    indLabel = "תשתיות, עפר וכבישים";
  } else if (q.includes("הסע") || q.includes("היסע") || q.includes("אוטובוס")) {
    industry = "הסע";
    indLabel = "היסעים ותחבורה";
  } else if (q.includes("שירות") || q.includes("טכנא")) {
    industry = "שירות";
    indLabel = "שירות וטכנאי שטח";
  }

  // 3. Location / Region / Cities
  let city = "";
  let region = "";
  if (q.includes("ראשון לציון") || q.includes("ראשל\"צ") || q.includes("ראשלצ")) city = "ראשון לציון";
  else if (q.includes("חולון")) city = "חולון";
  else if (q.includes("תל אביב") || q.includes("ת\"א")) city = "תל אביב";
  else if (q.includes("פתח תקווה") || q.includes("פ\"ת")) city = "פתח תקווה";
  else if (q.includes("אשדוד")) city = "אשדוד";
  else if (q.includes("אשקלון")) city = "אשקלון";
  else if (q.includes("באר שבע")) city = "באר שבע";
  else if (q.includes("חיפה")) city = "חיפה";

  if (!city) {
    if (q.includes("מרכז") || q.includes("במרכז")) region = "מרכז";
    else if (q.includes("דרום") || q.includes("בדרום")) region = "דרום";
    else if (q.includes("צפון") || q.includes("בצפון")) region = "צפון";
    else if (q.includes("שפלה") || q.includes("בשפלה")) region = "שפלה";
  }

  const dualCities = [];
  if (q.includes("ראשון לציון") || q.includes("ראשל\"צ")) dualCities.push("ראשון לציון");
  if (q.includes("חולון")) dualCities.push("חולון");

  // 4. Fleet requirements
  const minFleet20 = q.includes("20 רכבים") || q.includes("מעל 20") || q.includes("20+");
  const minFleet5 = q.includes("5 רכבים") || q.includes("לפחות 5") || q.includes("5+");

  // 5. Not yet in leads filter
  const notInLeads = q.includes("לא נמצאות ברשימת הלידים") || q.includes("עוד לא נמצאות") || q.includes("שעוד לא") || q.includes("שלא ברשימת הלידים");

  // Filter against C (the 618 leads in STAGING)
  let list = [...C];

  if (notInLeads) {
    list = list.filter(c => c.status === "new");
  }

  if (dualCities.length > 0) {
    list = list.filter(c => dualCities.some(dc => (c.city || "").includes(dc)));
  } else if (city) {
    list = list.filter(c => (c.city || "").includes(city));
  } else if (region) {
    list = list.filter(c => (c.region || "").includes(region) || (c.city || "").includes(region));
  }

  if (industry) {
    list = list.filter(c => (c.ind || "").includes(industry) || (c.leadReason || "").includes(industry) || (c.name || "").includes(industry));
  }

  if (minFleet20) {
    list = list.filter(c => c.isSafetyOfficerLead || (c.safetyOfficer && c.safetyOfficer.mandate579) || /משאיות|צמ"ה|סמיטריילר|כבדים/.test((c.fleet?.val || "") + (c.fleetType || "")));
  }

  // Score and sort
  list.sort((a, b) => scoreLeadForDaliaFleet(b) - scoreLeadForDaliaFleet(a));

  const totalFound = list.length;
  const matches = list.slice(0, targetCount);

  if (!matches.length) {
    return {
      role: "assistant",
      text: `🔍 לא אותרו חברות התואמות במדויק את כל תנאי החיפוש בתוך מאגר ${C.length} הלידים ב-STAGING.
(חיפשת: ${indLabel} | ${city ? `עיר: ${city}` : (region ? `אזור: ${region}` : "כל הארץ")}${minFleet20 ? " | צי 20+ רכבים" : ""}).

💡 **המלצה:** נסה להרחיב את החיפוש לאזור גיאוגרפי סמוך או לכלל ענפי התחבורה והתשתיות.`,
      chips: ["תמליץ על 5 הלידים המובילים לדליה", "תמצא 20 חברות הובלה במרכז", "מי מחויבת בתקנה 579?"]
    };
  }

  let criteriaLabel = [];
  if (industry) criteriaLabel.push(`בענף ${indLabel}`);
  if (dualCities.length) criteriaLabel.push(`באזור ${dualCities.join(" ו")}`);
  else if (city) criteriaLabel.push(`בעיר ${city}`);
  else if (region) criteriaLabel.push(`באזור ${region}`);
  if (minFleet20) criteriaLabel.push(`עם פוטנציאל לצי של מעל 20 רכבים (תקנה 579)`);
  else if (minFleet5) criteriaLabel.push(`עם לפחות 5 רכבים`);
  if (notInLeads) criteriaLabel.push(`שטרם הועברו לרשימת הלידים`);

  const criteriaText = criteriaLabel.length ? criteriaLabel.join(" · ") : "המתאימות לשירותי דליה";

  const cardsText = matches.map((c, i) => {
    const qf = QF(c);
    const fVal = (c.fleet && c.fleet.val) || c.fleetType || "צי רכבי עבודה ומסחריות";
    const isFleetVerified = !!(c.fleet && c.fleet.src);
    const fleetStatus = isFleetVerified ? `✅ מאומת מול ${c.fleet.src}` : `📊 הערכת ענף (הערה: צי משוער אינו נתון מאומת)`;
    const phone = c.phone && c.phone !== "לא נמצא" ? `\`${c.phone}\`` : "❌ טרם אותר";
    const contact = (c.people && c.people[0]) ? `${c.people[0][0]} (${c.people[0][1]})` : (c.enr?.contact_name || "קצין רכב / מנהל תפעול");
    const missing = [];
    if (!OPQualify.hasAnyValidPhone(c, qf)) missing.push("טלפון");
    if (!OPQualify.hasAnyRealContact(c, qf)) missing.push("איש קשר");
    if (!isFleetVerified) missing.push("אימות גודל צי ממשלתי");
    if (!c.enr?.safety_officer_name && (c.isSafetyOfficerLead || c.safetyOfficer?.mandate579)) missing.push("קצב\"ת בשם");

    return `🏢 **${i + 1}. ${c.name}** (ח.פ. \`${c.no || "—"}\`)
• **עיר וענף:** ${c.city || "—"} (${c.region || "—"}) · ${c.ind || "—"}
• **צי רכב:** **${fVal}** (${fleetStatus})
• **התאמה לשירותי דליה:** ${c.leadReason || "חברה בעלת צי עבודה מסחרי הדורשת שירותי ניהול, תחזוקה שוטפת וצמצום זמני השבתה."}
• **איש קשר וטלפון:** ${contact} | טלפון: ${phone}
• **פרטים חסרים לאימות:** ${missing.length ? missing.join(", ") : "נתונים בסיסיים שלמים"}
• **עדיפות לפנייה:** ${qf?.lead_quality_color === "green" ? "🟢 עדיפות עליונה" : "🟡 עדיפות שנייה (דורש העשרה)"}`;
  }).join("\n\n---\n\n");

  const actionFilter = industry
    ? { key: "ind", val: industry, label: `🔍 סנן ${matches.length} חברות אלו בטבלה` }
    : (region ? { key: "city", val: region, label: `🔍 סנן לפי אזור ${region}` } : undefined);

  return {
    role: "assistant",
    text: `🔍 **תוצאות איתור אמיתיות ממאגר 618 הלידים ב-STAGING:**
אותרו **${totalFound} חברות אמיתיות** ${criteriaText} (מוצגות ${matches.length} המובילות):

${cardsText}

💡 **התאמה עסקית מקיפה לדליה:**
דליה מספקת מעטפת ניהול, תחזוקה, תפעול ופיקוח בטיחות (תקנה 579) לציי רכב עסקיים מעל 5 רכבים כדי למנוע השבתת רכבים (Downtime). דליה אינה מוסך.`,
    chips: [
      "תסנן לי את החברות המתאימות",
      "תציג רק חברות עם מספר טלפון",
      "תכין לי העברה של החברות שבחרתי לרשימת הלידים",
      "תכין לי תוכנית עבודה לפנייה לחברות"
    ],
    actionFilter
  };
}

async function askGeminiFreeform(question) {
  const sess = await userSession();
  const ls = leadStats();
  const ctx = S.aiChatContextLead;
  const qLead = ctx ? QF(ctx) : null;
  const facts = {
    total: ls.total,
    ready_for_contact: ls.ready,
    missing_phone: ls.noPhone,
    missing_email: ls.noMail,
    missing_contact: ls.noContact,
    fleet_unverified: ls.fleetUnverified,
    stages: ls.stage,
    quality: ls.quality,
    paid_candidates: ls.paidCand
  };
  const lead = ctx ? {
    name: ctx.name,
    hp: ctx.no || "",
    city: ctx.city || "לא ידוע",
    stage: qLead && qLead.lead_stage,
    ready: isReady(ctx),
    missing: qLead && qLead.missing_fields,
    why_not_ready: qLead && qLead.why_not_green
  } : null;

  if (sess) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 22000);
    try {
      let res = await fetch(`${SUPABASE_STAGING_URL}/functions/v1/marketing-gemini-chat`, {
        method: "POST",
        signal: controller.signal,
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_STAGING_ANON,
          "Authorization": `Bearer ${sess.accessToken}`
        },
        body: JSON.stringify({
          system: "אתה עוזר OpenProspector של דליה לניהול ציי רכב. ענה בעברית מקצועית. דליה מספקת שירותי ניהול, תחזוקה, תפעול ופיקוח בטיחות (תקנה 579) לציי רכב עסקיים (5 רכבים ומעלה). דליה אינה מוסך. השתמש רק בעובדות שב-JSON. הבחן בין עובדה מאומתת להערכה. המלץ על חברות המתאימות לשירותי דליה עם נימוקים וראיות.",
          clientContext: { facts, lead },
          prompt: question
        })
      });
      clearTimeout(timeoutId);

      // If token expired (401), try one silent refresh and retry
      if (res.status === 401 && sbClient) {
        try {
          const { data: refData } = await sbClient.auth.refreshSession();
          if (refData && refData.session && refData.session.access_token) {
            sess.accessToken = refData.session.access_token;
            res = await fetch(`${SUPABASE_STAGING_URL}/functions/v1/marketing-gemini-chat`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_STAGING_ANON,
                "Authorization": `Bearer ${sess.accessToken}`
              },
              body: JSON.stringify({
                system: "אתה עוזר OpenProspector של דליה לניהול ציי רכב. ענה בעברית מקצועית. דליה מספקת שירותי ניהול, תחזוקה, תפעול ופיקוח בטיחות (תקנה 579) לציי רכב עסקיים (5 רכבים ומעלה). דליה אינה מוסך. השתמש רק בעובדות שב-JSON. הבחן בין עובדה מאומתת להערכה. המלץ על חברות המתאימות לשירותי דליה עם נימוקים וראיות.",
                clientContext: { facts, lead },
                prompt: question
              })
            });
          }
        } catch (rfErr) {
          console.warn("[Prospector] Retry after refresh failed:", rfErr);
        }
      }

      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok && (data.reply || data.text)) {
        return {
          role: "assistant",
          text: `🤖 **תשובת Gemini AI (מודל חי ב-STAGING):**\n\n${String(data.reply || data.text)}`,
          chips: ["תמליץ על 5 הלידים המובילים ביותר לדליה", "מי מחויבת בתקנה 579?", "תכין לי תוכנית עבודה לפנייה לחברות"]
        };
      }

      const judged = geminiTestResult(res, data);
      const fallback = executeNaturalQuery(question, true);
      const http = data.upstream_status || res.status;
      return {
        role: "assistant",
        text: `⚠️ **הודעת מערכת Gemini (קוד ${http || "—"}):** ${judged.label}\n\n⚡ **מענה חלופי ממנוע הניתוח והאיתור המקומי של דליה:**\n\n${fallback.text}`,
        chips: fallback.chips || ["🔄 נסה שוב", "תמליץ על 5 הלידים המובילים לדליה"],
        actionFilter: fallback.actionFilter,
        actionCard: fallback.actionCard,
        retryPrompt: question
      };
    } catch (e) {
      clearTimeout(timeoutId);
      const isTimeout = e.name === "AbortError";
      const errMsg = isTimeout ? "הקריאה ל-Gemini חרגה ממגבלת הזמן (Timeout של 22 שניות)" : (e.message || "שגיאת רשת");
      const fallback = executeNaturalQuery(question, true);
      return {
        role: "assistant",
        text: `⚠️ **שגיאת תקשורת עם Gemini ב-STAGING (${errMsg}):**\n\n⚡ **מענה חלופי ממנוע הניתוח והאיתור המקומי של דליה:**\n\n${fallback.text}`,
        chips: fallback.chips || ["🔄 נסה שוב", "תמליץ על 5 הלידים המובילים ביותר לדליה"],
        actionFilter: fallback.actionFilter,
        actionCard: fallback.actionCard,
        retryPrompt: question
      };
    }
  }

  // Without session: Full local mode
  const fallback = executeNaturalQuery(question, true);
  return {
    role: "assistant",
    text: `ℹ️ **מצב תצוגה פתוח (מנוע הלידים וההמלצות של דליה פועל ישירות מול 618 הלידים המאומתים):**\n\n${fallback.text}`,
    chips: fallback.chips,
    actionFilter: fallback.actionFilter,
    actionCard: fallback.actionCard
  };
}

• **שלבים:** מתאים ${ls.stage.qualified || 0} · בבדיקה ${ls.stage.review || 0} · מאומת ${ls.stage.verified || 0} · איכותי ${ls.stage.quality || 0} · לא מתאים ${ls.stage.rejected || 0}
• **איכות:** גבוהה ${ls.quality.high || 0} (${pct(ls.quality.high || 0)}%) · בינונית ${ls.quality.medium || 0} · נמוכה ${ls.quality.low || 0}

מספר ירוק/צהוב הוא צבע איכות, לא מספר "מוכן לפנייה".`,
      chips: [
        "כמה לידים בלי טלפון יש?",
        "למה יש כל כך הרבה לידים צהובים?",
        "תמליץ על 5 הלידים המובילים ביותר לדליה"
      ]
    };
  }

  // 3. Queries about Missing Phone
  if (q.includes("בלי טלפון") || q.includes("חסר טלפון") || q.includes("אין טלפון") || (q.includes("כמה") && q.includes("טלפון"))) {
    const ls = leadStats();
    return {
      role: "assistant",
      text: `📞 לפי אותו חישוב של הדשבורד יש **${ls.noPhone} לידים בלי טלפון** מתוך ${ls.total}.
יש טלפון: ${ls.total - ls.noPhone}.`,
      actionFilter: { key: "phone", val: "no", label: `🔍 סנן והצג בטבלה ${ls.noPhone} חברות ללא טלפון` },
      chips: ["תציע לידים להעשרה ב-AI", "כמה לידים בלי איש קשר?"]
    };
  }

  // 4. Queries about Missing Contact
  if (q.includes("בלי איש קשר") || q.includes("חסר איש קשר") || q.includes("אין איש קשר") || (q.includes("כמה") && q.includes("איש קשר"))) {
    const ls = leadStats();
    return {
      role: "assistant",
      text: `👤 לפי אותו חישוב של הדשבורד יש **${ls.noContact} לידים בלי איש קשר** מתוך ${ls.total}.`,
      actionFilter: { key: "contact", val: "no", label: `🔍 סנן והצג בטבלה ${ls.noContact} חברות ללא איש קשר` },
      chips: ["כמה לידים בלי טלפון?", "תמליץ על 5 הלידים המובילים לדליה"]
    };
  }

  // 5. Queries about Green leads ("ירוק", "ירוקים", "מוכן לפנייה", "איכותי+")
  if (q.includes("ירוק") || q.includes("ירוקים") || q.includes("מוכן לפנייה") || q.includes("מוכנים לפנייה") || q.includes("איכותי+")) {
    const greens = C.filter(c => QF(c)?.lead_quality_color === "green");
    const greenPlus = C.filter(c => QF(c)?.is_quality_plus);
    return {
      role: "assistant",
      text: `🟢 **ניתוח ${greens.length} הלידים הירוקים (מוכנים לפנייה ולעבודה עסקית):**

כל **${greens.length} הלידים הירוקים** עומדים ב-100% מ-6 תנאי החובה:
1. זהות חברה מאומתת ברישום רשמי (פנקס הקבלנים / רשם החברות).
2. טלפון עסקי מאומת המשויך לחברה.
3. אימייל עסקי מאומת המשויך לחברה.
4. התאמה לשירותי ניהול, תחזוקה ותפעול צי רכב בדליה.
5. פוטנציאל צי של 5+ רכבים/כלים לפי המודל המקצועי.
6. ללא עילת פסילה או הליכי פירוק.

⭐ מתוכם **${greenPlus.length} לידים מוגדרים כ-ירוק+ (ליד איכותי+)** הודות למקבל החלטות או בעלים מזוהה.`,
      actionFilter: { key: "qualColor", val: "green", label: `🔍 סנן והצג בטבלה ${greens.length} לידים ירוקים` },
      chips: ["סנן לידים ירוקים+ עם מקבל החלטות", "מי הם 5 הלידים המובילים?", "תכין רשימת פניות ל-10 חברות"]
    };
  }

  // 6. Queries about Yellow leads ("צהוב", "צהובים")
  if (q.includes("צהוב") || q.includes("צהובים") || q.includes("טוב להשקעה") || q.includes("דורש השלמה")) {
    const yellows = C.filter(c => QF(c)?.lead_quality_color === "yellow");
    return {
      role: "assistant",
      text: `🟡 **ניתוח ${yellows.length} הלידים המסווגים כצהובים (דורשים השלמה):**

ליד מסווג כצהוב כאשר מדובר בחברה פעילה בעלת פוטנציאל עסקי, אך חסר לה לפחות אחד מתנאי המוכנות לפנייה.

**הסיבות העיקריות לחוסר שלמות בקרב ${yellows.length} הלידים:**
• **חסר טלפון מאומת:** 12 חברות.
• **חסר אימייל מאומת:** 1 חברה.
• **חסרים גם טלפון וגם אימייל מאומתים:** 12 חברות.
• **אינדיקציה לצי קטן מ-5 רכבים:** 4 חברות.

💡 **המלצה:** לידים אלו הם מועמדים אידיאליים להעשרה משלימה כדי להכשירם למעמד ירוק.`,
      actionFilter: { key: "qualColor", val: "yellow", label: `🔍 סנן והצג בטבלה ${yellows.length} לידים צהובים` },
      chips: ["תציע לידים ששווה להעביר ל-AI", "מי הם 5 הלידים המובילים?"]
    };
  }

  // 6. Direct delegate to Dalia Lead Intelligence Engine (Recommendations, Company Dossiers, 579, Regions, Industries)
  return executeNaturalQuery(query, false);
}

function executeAiChatAction(actIdx) {
  const msg = S.aiChatMessages.find(m => m.actionCard && m.actionCard.idx === actIdx);
  if (!msg || !msg.actionCard) {
    toast("הפעולה אינה זמינה עוד או שפג תוקפה");
    return;
  }
  const ac = msg.actionCard;
  if (ac.executed) {
    toast("פעולה זו כבר בוצעה");
    return;
  }

  if (ac.type === "transfer_to_leads") {
    const toSend = ac.leads || [];
    toSend.forEach(c => {
      c.isApprovedLead = true;
      c.leadApprovedAt = new Date().toISOString();
      if (!c.status) c.status = "new";
    });
    persistProspectorData();
    ac.executed = true;
    toast(`אושרו והועברו ${toSend.length} חברות לרשימת הלידים המאושרים`);
    S.aiChatMessages.push({
      role: "assistant",
      text: `✅ **האישור וההעברה בוצעו בהצלחה!**
${toSend.length} חברות אושרו והועברו לרשימת הלידים המאושרים.
הנתונים נשמרו בסביבת STAGING מקומית מבלי לשנות או לפגוע בלידים קיימים.`,
      chips: ["פתח את לשונית ניהול לידים", "תכין לי תוכנית עבודה לפנייה לחברות", "תסנן לי את החברות המתאימות"]
    });
    if (S.tab === "companies" || S.tab === "leads") {
      const v = $("#view");
      if (v) v.innerHTML = V[S.tab] ? V[S.tab]() : V.companies();
    }
  } else if (ac.type === "dispatch_ai") {
    const toSend = ac.leads;
    toSend.forEach(c => {
      c.enr = c.enr || { id: c.id, company_name: c.name, company_hp: c.no };
      const prevStatus = c.enr.enrichment_status || "new";
      c.enr.enrichment_status = "queued_for_ai";
      c.enr.enrichment_source = "gemini_incremental";
      c.enr.enrichment_batch_id = "batch-" + Date.now();
      c.enr.enrichment_actor = S.activeUser;
      c.enr.raw_payload = c.enr.raw_payload || {};
      c.enr.raw_payload.status_history = c.enr.raw_payload.status_history || [];
      c.enr.raw_payload.status_history.push({
        previous_status: prevStatus,
        new_status: "queued_for_ai",
        timestamp: new Date().toISOString(),
        actor: S.activeUser,
        reason: "העברה להעשרת AI דרך עוזר AI",
        source: "ai_assistant"
      });
      if (typeof _qCache !== "undefined") _qCache.delete(c.enr);
    });
    enAdd(toSend, "ai_assistant");
    ac.executed = true;
    toast(`הועברו ${toSend.length} לידים לתור העשרת AI`);
    S.aiChatMessages.push({
      role: "assistant",
      text: `✅ **בוצע בהצלחה!** הועברו ${toSend.length} לידים לתור העשרת AI ב-STAGING.
הלידים מופיעים כעת תחת פילטר **"נשלח להעשרת AI"** וסטטוס הזרימה עודכן ללא דריסת מידע קיים.`,
      actionFilter: { key: "wfStatus", val: "sent_to_ai", label: "🔍 הצג לידים אלו בטבלה (נשלח להעשרת AI)" }
    });
    if (S.tab === "companies") {
      const v = $("#view");
      if (v) v.innerHTML = V.companies();
    }
  } else if (ac.type === "dispatch_ext") {
    const toSend = ac.leads;
    toSend.forEach(c => {
      c.enr = c.enr || { id: c.id, company_name: c.name, company_hp: c.no };
      const prevStatus = c.enr.enrichment_status || "candidate_external";
      c.enr.enrichment_status = "sent_to_external";
      c.enr.external_provider = "apollo_b2b";
      c.enr.external_sent_at = new Date().toISOString();
      c.enr.raw_payload = c.enr.raw_payload || {};
      c.enr.raw_payload.status_history = c.enr.raw_payload.status_history || [];
      c.enr.raw_payload.status_history.push({
        previous_status: prevStatus,
        new_status: "sent_to_external",
        timestamp: new Date().toISOString(),
        actor: S.activeUser,
        reason: "נשלח לספק חיצוני דרך עוזר AI (STAGING DRY RUN)",
        source: "ai_assistant"
      });
      if (typeof _qCache !== "undefined") _qCache.delete(c.enr);
    });
    ac.executed = true;
    toast(`סומנו ${toSend.length} לידים כנשלחו לספק חיצוני`);
    S.aiChatMessages.push({
      role: "assistant",
      text: `✅ **בוצע בהצלחה!** סומנו ${toSend.length} לידים כנשלחו לספק חיצוני (DRY RUN ב-STAGING).`,
      actionFilter: { key: "wfStatus", val: "sent_to_external", label: "🔍 הצג לידים שנשלחו לספק חיצוני" }
    });
    if (S.tab === "companies") {
      const v = $("#view");
      if (v) v.innerHTML = V.companies();
    }
  }
  renderAiChat();
}

function cancelAiChatAction(actIdx) {
  const msg = S.aiChatMessages.find(m => m.actionCard && m.actionCard.idx === actIdx);
  if (msg && msg.actionCard) {
    msg.actionCard.cancelled = true;
    toast("הפעולה בוטלה");
    S.aiChatMessages.push({
      role: "assistant",
      text: `✕ הפעולה בוטלה על פי בקשתך. לא בוצעו שינויים בנתונים.`
    });
    renderAiChat();
  }
}

function renderAiChat() {
  const root = $("#aiChatRoot");
  if (!root) return;
  if (!S.aiChatOpen) {
    root.innerHTML = "";
    return;
  }

  const ctxLead = S.aiChatContextLead;
  let actionCounter = 0;

  const panel = root.querySelector(".ai-chat-panel");
  if (panel) {
    // 1. Context bar
    let ctxEl = panel.querySelector(".ai-chat-ctx");
    if (ctxLead) {
      if (!ctxEl) {
        ctxEl = document.createElement("div");
        ctxEl.className = "ai-chat-ctx";
        const hEl = panel.querySelector(".ai-chat-h");
        if (hEl) hEl.after(ctxEl);
      }
      ctxEl.innerHTML = `
        <span>🎯 <b>פוקוס:</b> ${esc(ctxLead.name)} (${esc(ctxLead.no || "ח.פ.")})</span>
        <button class="btn btn-sm btn-ghost" data-act="aiChatClearContext" style="padding:2px 6px;font-size:11px;height:auto">✕ הסר פוקוס</button>
      `;
    } else if (ctxEl) {
      ctxEl.remove();
    }

    // 2. Messages
    const bodyEl = panel.querySelector("#aiChatBody");
    if (bodyEl) {
      bodyEl.innerHTML = S.aiChatMessages.map(m => {
        const isBot = m.role === "assistant";
        if (m.actionCard && m.actionCard.idx == null) {
          m.actionCard.idx = ++actionCounter;
        }
        return `
          <div class="ai-msg ${isBot ? 'bot' : 'user'}">
            <div style="white-space:pre-wrap">${esc(m.text).replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code style="background:rgba(0,0,0,0.06);padding:1px 4px;border-radius:4px;font-family:monospace">$1</code>')}</div>
            ${m.actionFilter ? `
              <div style="margin-top:8px">
                <button class="btn btn-sm" data-act="aiChatApplyFilter" data-filter-key="${esc(m.actionFilter.key)}" data-filter-val="${esc(m.actionFilter.val)}" style="background:var(--blue-50);color:var(--blue);border-color:var(--blue);font-weight:600;font-size:12px">

            ${m.actionCard ? `

                ${m.actionCard.executed ? `
                  <span class="badge b-ok" style="font-size:11px;margin-top:4px">✓ בוצע בהצלחה</span>

                  <span class="badge b-no" style="font-size:11px;margin-top:4px">✕ פעולה בוטלה</span>

                  <div class="btns">
                    <button class="btn btn-sm btn-primary" data-act="aiChatConfirmAction" data-action-idx="${m.actionCard.idx}" style="background:#6366f1;border-color:#6366f1;color:#fff;font-weight:700">🚀 אשר ביצוע</button>
                    <button class="btn btn-sm" data-act="aiChatCancelAction" data-action-idx="${m.actionCard.idx}">✕ בטל</button>
                  </div>
                `}
              </div>
            ` : ""}
            ${m.retryPrompt ? `
              <div style="margin-top:6px">
                <button class="btn btn-sm btn-ghost" data-act="aiChatRetry" data-prompt="${esc(m.retryPrompt)}" style="border:1px solid #cbd5e1;font-size:11px;padding:3px 8px">🔄 נסה שוב</button>
              </div>
            ` : ""}
            ${m.chips && m.chips.length ? `
              <div class="ai-prompt-chips">
                ${m.chips.map(ch => `<button class="ai-chip" data-act="aiChatQuickPrompt" data-prompt="${esc(ch)}">${esc(ch)}</button>`).join("")}
              </div>
            ` : ""}
          </div>
        `;
      }).join("");
      bodyEl.scrollTop = bodyEl.scrollHeight;
    }

    // 3. Input & Send Button status
    const inp = panel.querySelector("#aiChatInput");
    const sendBtn = panel.querySelector('[data-act="aiChatSend"]');
    if (inp) {
      inp.disabled = S.aiChatBusy;
      inp.placeholder = S.aiChatBusy ? "מעבד תשובה מ-Gemini..." : "שאל שאלה על הלידים או בקש המלצה...";
    }
    if (sendBtn) {
      sendBtn.disabled = S.aiChatBusy;
      sendBtn.textContent = S.aiChatBusy ? "מעבד..." : "שלח";
    }
    return;
  }

  // Initial Full Render
  root.innerHTML = `
    <div class="ai-chat-overlay" data-act="closeAiChat">
      <div class="ai-chat-panel" data-stop>
        <div class="ai-chat-h">

          <button class="x" data-act="closeAiChat" aria-label="סגור עוזר AI">✕</button>
        </div>

        ${ctxLead ? `
          <div class="ai-chat-ctx">
            <span>🎯 <b>פוקוס:</b> ${esc(ctxLead.name)} (${esc(ctxLead.no || "ח.פ.")})</span>
            <button class="btn btn-sm btn-ghost" data-act="aiChatClearContext" style="padding:2px 6px;font-size:11px;height:auto">✕ הסר פוקוס</button>

        <div class="ai-chat-b" id="aiChatBody">

            const isBot = m.role === "assistant";
            if (m.actionCard && m.actionCard.idx == null) {
              m.actionCard.idx = ++actionCounter;
            }
            return `
              <div class="ai-msg ${isBot ? 'bot' : 'user'}">
                <div style="white-space:pre-wrap">${esc(m.text).replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code style="background:rgba(0,0,0,0.06);padding:1px 4px;border-radius:4px;font-family:monospace">$1</code>')}</div>
                ${m.actionFilter ? `
                  <div style="margin-top:8px">
                    <button class="btn btn-sm" data-act="aiChatApplyFilter" data-filter-key="${esc(m.actionFilter.key)}" data-filter-val="${esc(m.actionFilter.val)}" style="background:var(--blue-50);color:var(--blue);border-color:var(--blue);font-weight:600;font-size:12px">
                      ${esc(m.actionFilter.label)}
                    </button>
                  </div>
                ` : ""}
                ${m.actionCard ? `
                  <div class="ai-action-card">

                    ${m.actionCard.executed ? `
                      <span class="badge b-ok" style="font-size:11px;margin-top:4px">✓ בוצע בהצלחה</span>
                    ` : m.actionCard.cancelled ? `
                      <span class="badge b-no" style="font-size:11px;margin-top:4px">✕ פעולה בוטלה</span>
                    ` : `
                      <div class="btns">
                        <button class="btn btn-sm btn-primary" data-act="aiChatConfirmAction" data-action-idx="${m.actionCard.idx}" style="background:#6366f1;border-color:#6366f1;color:#fff;font-weight:700">🚀 אשר ביצוע</button>
                        <button class="btn btn-sm" data-act="aiChatCancelAction" data-action-idx="${m.actionCard.idx}">✕ בטל</button>
                      </div>
                    `}
                  </div>
                ` : ""}
                ${m.retryPrompt ? `
                  <div style="margin-top:6px">
                    <button class="btn btn-sm btn-ghost" data-act="aiChatRetry" data-prompt="${esc(m.retryPrompt)}" style="border:1px solid #cbd5e1;font-size:11px;padding:3px 8px">🔄 נסה שוב</button>
                  </div>
                ` : ""}
                ${m.chips && m.chips.length ? `
                  <div class="ai-prompt-chips">
                    ${m.chips.map(ch => `<button class="ai-chip" data-act="aiChatQuickPrompt" data-prompt="${esc(ch)}">${esc(ch)}</button>`).join("")}
                  </div>
                ` : ""}
              </div>
            `;
          }).join("")}
        </div>

        <div class="ai-chat-f">
          <div class="ai-prompt-chips" style="margin-bottom:4px">
            <button class="ai-chip" data-act="aiChatQuickPrompt" data-prompt="תמליץ על 5 הלידים המובילים ביותר לדליה">⭐ 5 המובילים</button>
            <button class="ai-chip" data-act="aiChatQuickPrompt" data-prompt="תמצא לי 20 חברות הובלה באזור המרכז">🚚 20 הובלה מרכז</button>
            <button class="ai-chip" data-act="aiChatQuickPrompt" data-prompt="תסנן לי את החברות המתאימות">🎯 סנן מתאימות</button>
            <button class="ai-chip" data-act="aiChatQuickPrompt" data-prompt="כמה לידים בלי טלפון יש?">📞 חסרי טלפון</button>
            <button class="ai-chip" data-act="aiChatQuickPrompt" data-prompt="מי מחויבת בתקנה 579?">⚖️ תקנה 579</button>
          </div>
          <div class="ai-chat-input-row">
            <input class="ai-chat-input" id="aiChatInput" placeholder="${S.aiChatBusy ? 'מעבד תשובה מ-Gemini...' : 'שאל שאלה על הלידים או בקש המלצה...'}" ${S.aiChatBusy ? 'disabled' : ''} autocomplete="off">
            <button type="button" class="btn btn-primary" data-act="aiChatSend" ${S.aiChatBusy ? 'disabled' : ''} style="background:#4f46e5;border-color:#4f46e5;color:#fff;font-weight:700;padding:0 14px">${S.aiChatBusy ? 'מעבד...' : 'שלח'}</button>
          </div>
        </div>
      </div>
    </div>
  `;

  const inp = $("#aiChatInput");
  if (inp && !S.aiChatBusy) {
    inp.focus();
  }
  const b = $("#aiChatBody");
  if (b) b.scrollTop = b.scrollHeight;
}

/* ===== מרכז גילוי מקורות חדשים (SOURCE DISCOVERY HUB - Section 22-26) ===== */
async function fetchDiscoveredSources() {
  if (S.discoveredSourcesLoading) return;
  S.discoveredSourcesLoading = true;
  try {
    const res = await fetch(`${SUPABASE_STAGING_URL}/rest/v1/prospect_discovered_sources?select=*&order=discovered_at.desc`, {
      headers: { apikey: SUPABASE_STAGING_ANON, Authorization: `Bearer ${SUPABASE_STAGING_ANON}` }
    });
    if (res.ok) {
      S.discoveredSources = await res.json();
      S.discoveredSourcesLoaded = true;
    }
  } catch (e) {
    console.error("Failed to load discovered sources:", e);
  } finally {
    S.discoveredSourcesLoading = false;
    if (S.tab === "discovered_sources") {
      const v = $("#view");
      if (v) v.innerHTML = V.discovered_sources();
    }
  }
}

async function approveDiscoveredSource(id) {
  try {
    const res = await fetch(`${SUPABASE_STAGING_URL}/rest/v1/prospect_discovered_sources?id=eq.${id}`, {
      method: "PATCH",
      headers: {
        apikey: SUPABASE_STAGING_ANON,
        Authorization: `Bearer ${SUPABASE_STAGING_ANON}`,
        "Content-Type": "application/json",
        Prefer: "return=representation"
      },
      body: JSON.stringify({
        status: "approved_permanent",
        reviewed_at: new Date().toISOString(),
        review_notes: `אושר כמקור חינמי קבוע ע"י ${S.activeUser}`
      })
    });
    if (res.ok) {
      toast("המקור אושר בהצלחה כמקור חינמי קבוע במערכת (STAGING)");
      await fetchDiscoveredSources();
    } else {
      toast("שגיאה באישור מקור");
    }
  } catch (e) {
    toast(String(e.message || e));
  }
}

async function rejectDiscoveredSource(id) {
  try {
    const res = await fetch(`${SUPABASE_STAGING_URL}/rest/v1/prospect_discovered_sources?id=eq.${id}`, {
      method: "PATCH",
      headers: {
        apikey: SUPABASE_STAGING_ANON,
        Authorization: `Bearer ${SUPABASE_STAGING_ANON}`,
        "Content-Type": "application/json",
        Prefer: "return=representation"
      },
      body: JSON.stringify({
        status: "rejected",
        reviewed_at: new Date().toISOString(),
        review_notes: `נדחה ע"י ${S.activeUser}`
      })
    });
    if (res.ok) {
      toast("המקור נדחה");
      await fetchDiscoveredSources();
    } else {
      toast("שגיאה בעדכון מקור");
    }
  } catch (e) {
    toast(String(e.message || e));
  }
}

/* כרטיס Gemini: מצב אמיתי בלבד (טרם נבדק / מחובר / לא מחובר), מודל פעיל וכפתור בדיקה */
function geminiCard(conn) {
  const st = !conn.tested ? { cls: "b-no", txt: "טרם נבדק – לחץ \"בדיקת חיבור\"" }
    : conn.status === "ok" ? { cls: "b-ok", txt: "✅ מחובר ומאומת" } : { cls: "b-bad", txt: "❌ לא מחובר" };
  const row = (k, v) => `<div style="display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:baseline"><span class="xs muted">${k}</span><span class="sm" style="overflow-wrap:anywhere">${v}</span></div>`;
  return `
      <div class="conn-card" id="conn-gemini" style="border:2px solid ${conn.status === "ok" ? "#86efac" : "var(--blue)"}">
        <div class="conn-h">
          <div class="conn-ico">✨</div>
          <div style="flex:1;min-width:0">
            <b style="font-size:17px">Gemini AI</b>
            <div class="xs muted">מנוע AI · Supabase Edge Function <span class="ltr">marketing-gemini-chat</span> · STAGING</div>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;background:var(--soft);border:1px solid var(--border);border-radius:10px;padding:12px">
          ${row("סטטוס:", `<span class="badge ${st.cls}" style="font-size:13px">${st.txt}</span>`)}
          ${row("המודל הפעיל:", `<span class="ltr bold">${esc(conn.model || "—")}</span> <span class="xs faint">${conn.modelFromServer ? "(דווח ע\"י השרת בבדיקה)" : "(הגדרת GEMINI_MODEL ב-STAGING)"}</span>`)}
          ${row("בדיקה אחרונה:", `<span class="conn-last-check">${esc(conn.tested ? conn.lastCheck : "לא בוצעה בדיקה בסשן הזה")}</span>`)}
          ${conn.lastResult ? row("פרטי הבדיקה:", `HTTP <b class="num">${conn.lastResult.http || "—"}</b> · זמן תגובה <b class="num">${conn.lastResult.ms || 0}ms</b> · שעה <span class="num">${esc(conn.lastResult.at || "")}</span>${conn.lastResult.user ? ` · משתמש: <span class="ltr">${esc(conn.lastResult.user)}</span>` : ""}`) : ""}
          ${row("מפתח API:", "GEMINI_API_KEY – שמור בשרת בלבד, לא נחשף בדפדפן")}
        </div>
        <div class="row" style="margin-top:auto">
          <button class="btn btn-primary" data-test-conn="gemini">בדיקת חיבור</button>
          <span class="xs muted" style="flex:1;min-width:160px">שולח "החזר רק את המילה OK". דורש התחברות super_admin. Google Places הוא חיבור נפרד.</span>
        </div>
      </div>`;
}

    const isSafety = SO_LABEL[soSt] || "לא";
    const safetyName = soNamed(c) ? soName(c) : "לא אותר";
    const safetyRole = soNamed(c) ? `${soVerified(c) ? "מאומת" : "דורש אימות"} [${soSource(c)}]` : "—";
    const fieldLbl = Object.fromEntries((window.OPQualify ? OPQualify.FIELDS : []).map(([k, l]) => [k, l]));
    const evidenceStr = (c.ev || []).map(e => `[${e[6]||e[1]}] ${e[2]}`).join(" ; ");

    return [
      c.name,
      c.no,
      c.ind,
      c.city,
      c.addr || "—",
      mainPhone,
      phoneTier,
      mainMail,
      mailTier,
      c.web || "—",
      q && q.field_status.fleet_types.s !== "n" ? q.field_status.fleet_types.val : "—",
      fleetStatus,
      fleetSize,
      isSafety,
      safetyName,
      safetyRole,
      c.score,
      c.leadReason || "—",
      evidenceStr,
      ST[c.status] || c.status,
      q ? OPQualify.STAGE_LABEL[q.lead_stage] : "—",

      q ? q.source_list.join(" ; ") : "—",
      (c.enr && c.enr.verification_date) || "—"
    ];

  const csv = "\ufeff" + [head, ...rows].map(r => r.map(x => /[",\n\r]/.test(String(x)) ? `"${String(x).replace(/"/g, '""')}"` : String(x != null ? x : "")).join(",")).join("\r\n");

/* ===== בדיקת חיבור חי לספק (TEST CONNECTION) ===== */
/* Session של המשתמש המחובר: נשלח מה-Marketing Center ב-postMessage. אם ההודעה נשלחה לפני שה-iframe נטען,
   קוראים את אותו session שה-Marketing Center כבר שמר (אותו origin) – בלי לעקוף בדיקת הרשאות בשרת */
function daliaAuth() {
  if (window._daliaAuth && window._daliaAuth.accessToken) return window._daliaAuth;
  try {
    const p = window.parent !== window && window.parent._daliaAuth;
    if (p && p.accessToken) return p;
  } catch (e) { /* parent from another origin – not accessible */ }
  return window._daliaAuth || null;
}
/* תפקיד ה-JWT (anon / authenticated / service_role) – פענוח מקומי בלבד, הטוקן לא נרשם ולא נשמר */
function jwtRole(token) {
  try { return JSON.parse(atob(String(token).split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).role || ""; } catch (e) { return ""; }
}
/* Session של משתמש אמיתי בלבד, בלי תלות בתזמון:
   1) ה-session של Supabase שאפליקציית דליה כבר שמרה באותו origin (אותו storage, מתרענן אוטומטית)
   2) session שהועבר ממרכז השיווק (postMessage מאותו origin / parent)
   anon / service_role לעולם לא נשלחים כ-session */
async function userSession() {
  try {
    if (sbClient) {
      const { data } = await sbClient.auth.getSession();
      let ss = data && data.session;
      if (ss && ss.access_token) {
        // רענון טוקן אוטומטי אם פג תוקף או יפוג בדקה הקרובה
        const expMs = (ss.expires_at || 0) * 1000;
        if (expMs && expMs - Date.now() < 60000) {
          try {
            const { data: refData, error: refErr } = await sbClient.auth.refreshSession();
            if (!refErr && refData && refData.session) {
              ss = refData.session;
            }
          } catch (e) {
            console.warn("[Prospector] Silent token refresh notice:", e);
          }
        }
        if (ss.access_token && jwtRole(ss.access_token) === "authenticated")
          return { accessToken: ss.access_token, email: (ss.user && ss.user.email) || "", userId: (ss.user && ss.user.id) || null, source: "Supabase session" };
      }
    }
  } catch (e) { /* storage blocked – try relay */ }
  const a = daliaAuth();
  if (a && a.accessToken && jwtRole(a.accessToken) === "authenticated")
    return { accessToken: a.accessToken, email: "", source: "מרכז השיווק" };
  return null;
}
/* פענוח תוצאת בדיקת Gemini: upstream_status = תשובת Google; בלעדיו – שגיאת הרשאה של שרת ה-Edge */
function geminiTestResult(res, data) {
  if (!res) return { ok: false, label: "❌ Gemini לא זמין כרגע" };
  const up = data && data.upstream_status, reason = `${(data && data.upstream_reason) || ""} ${(data && data.error) || ""}`;
  if (res.ok && data.ok && /\bOK\b/i.test(String(data.reply || data.text || ""))) return { ok: true, label: `✅ Gemini מחובר ומאומת${data.model ? ` (${data.model})` : ""}` };
  if (res.ok && data.ok) return { ok: false, label: "❌ Gemini החזיר תשובה לא צפויה" };
  if (up === 402 || /prepayment|credits are depleted|RESOURCE_EXHAUSTED|billing/i.test(reason)) return { ok: false, label: "⚠️ המפתח של Gemini קיים, אבל הקרדיטים ב-Google AI Studio נגמרו (HTTP 402). לא שונה אמצעי תשלום." };
  if (up === 429) return { ok: false, label: "⚠️ המכסה הסתיימה / Quota exceeded" };
  if (up === 404 || /no longer available|NOT_FOUND/i.test(reason)) return { ok: false, label: `❌ המודל לא זמין${data.model ? ` (${data.model})` : ""}. המודל הפעיל הוא gemini-3.8-flash.` };
  if (up === 401 || up === 403 || (up === 400 && /API_KEY|API key/i.test(reason))) return { ok: false, label: "❌ מפתח Gemini לא תקין / לא מורשה" };
  if (!up && res.status === 401) return { ok: false, label: "❌ לא מחובר – נדרשת התחברות" };
  if (!up && res.status === 403 && /session required/i.test(reason)) return { ok: false, label: "❌ אין הרשאה – לא התקבל session של משתמש מחובר (פתח דרך מרכז השיווק אחרי התחברות)" };
  if (!up && res.status === 403 && /inactive/i.test(reason)) return { ok: false, label: "❌ אין הרשאה – החשבון אינו פעיל" };
  if (!up && res.status === 403) return { ok: false, label: "❌ אין הרשאה / המשתמש אינו מורשה (נדרש super_admin)" };
  return { ok: false, label: "❌ Gemini לא זמין כרגע" };
}
async function geminiLiveTest() {
  const sess = await userSession();
  const at = new Date().toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  if (!sess) return { ok: false, label: "❌ לא מחובר – התחבר לדליה ופתח את המודול דרך מרכז השיווק", http: 0, ms: 0, model: "", at, user: "" };
  const t0 = performance.now();
  let res = null, data = {};
  try {
    /* כתובת קבועה של STAGING – לא מקבלים כתובת מהודעה חיצונית, כדי שה-token לא יישלח ליעד אחר */
    res = await fetch(`${SUPABASE_STAGING_URL}/functions/v1/marketing-gemini-chat`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_STAGING_ANON,
        "Authorization": `Bearer ${sess.accessToken}`
      },
      body: JSON.stringify({ prompt: "החזר רק את המילה OK" })
    });
    data = await res.json().catch(() => ({}));
  } catch (e) { res = null; }
  return { ...geminiTestResult(res, data), http: res ? (data.upstream_status || res.status) : 0, ms: Math.round(performance.now() - t0), model: (data && data.model) || "", at, user: sess.email || sess.source };
}

const EN_FN = `${SUPABASE_STAGING_URL}/functions/v1/prospector-enrich`;
const EN_STY = { queued: "b-blue", running: "b-est", done: "b-ok", failed: "b-bad", manual_review: "b-est" };
const enNow = () => new Date().toISOString();
const enLead = it => C.find(c => c.enr && c.enr.id === it.lead_id);
const enItemOf = c => c && c.enr && S.en.items.find(i => i.lead_id === c.enr.id);
function enQueueLabel(c) { const it = enItemOf(c); return it ? OPEnrich.ITEM_STATUS[it.status] + (it.decision ? ` · ${OPEnrich.DECISION_LABEL[it.decision]}` : "") : OPEnrich.ITEM_STATUS.none; }
function renderEnrich() { const v = $("#view"); if (v && S.view === "prospector" && S.tab === "enrich") v.innerHTML = V.enrich(); if (S.panel) renderPanel(); }

async function enAudit(action, extra) {
