<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>דליה | מרכז שיווק ופרסום – איתור לקוחות עסקיים ולידים (OpenProspector)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="openprospector-qualify.js?v=workforce-fleet-v2-calibrated"></script>
<script src="openprospector-enrich.js?v=workforce-fleet-v2"></script>
<script src="data/prospector-batch2-1000.js"></script>
<style>
:root{
  --navy-950:#04091a;--navy-900:#071022;--navy-800:#0a1830;--navy-700:#0d1f3c;--navy-600:#15305c;
  --blue:#2563EB;--blue-600:#1d4fd8;--blue-100:#e7efff;--blue-50:#f3f7ff;
  --bg:#f1f4f9;--card:#ffffff;--text:#0f172a;--muted:#64748b;--faint:#94a3b8;--border:#e2e8f0;--soft:#f8fafc;
  --ok:#16a34a;--ok-bg:#e8f7ee;--est:#b45309;--est-bg:#fdf3e2;--no:#64748b;--no-bg:#eef2f6;--bad:#dc2626;--bad-bg:#fdecec;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px -6px rgba(15,23,42,.10);
  --r:14px;--r-sm:10px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#04091a;--card:#0a1830;--text:#f1f5f9;--muted:#a8b4c7;--faint:#6b7a91;--border:rgba(255,255,255,.10);--soft:#0d1f3c;
  --blue-100:rgba(37,99,235,.22);--blue-50:rgba(37,99,235,.10);
  --ok-bg:rgba(22,163,74,.18);--est-bg:rgba(217,119,6,.18);--no-bg:rgba(148,163,184,.14);--bad-bg:rgba(220,38,38,.18);
  --ok:#4ade80;--est:#fbbf24;--no:#a8b4c7;--bad:#f87171;--shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#04091a;--card:#0a1830;--text:#f1f5f9;--muted:#a8b4c7;--faint:#6b7a91;--border:rgba(255,255,255,.10);--soft:#0d1f3c;
  --blue-100:rgba(37,99,235,.22);--blue-50:rgba(37,99,235,.10);
  --ok-bg:rgba(22,163,74,.18);--est-bg:rgba(217,119,6,.18);--no-bg:rgba(148,163,184,.14);--bad-bg:rgba(220,38,38,.18);
  --ok:#4ade80;--est:#fbbf24;--no:#a8b4c7;--bad:#f87171;--shadow:none;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{overflow-x:clip;background:var(--bg);color:var(--text);font-family:Heebo,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.num{font-variant-numeric:tabular-nums}
.m-only{display:none!important}
@media (max-width:860px){.m-only{display:inline-flex!important}}
.muted{color:var(--muted)}.faint{color:var(--faint)}.sm{font-size:13px}.xs{font-size:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* פס תצוגה / מודעות מערכת */
.preview-bar{background:#fff7e6;color:#7a4b00;border-bottom:1px solid #f3dfb4;padding:7px 18px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.preview-bar b{font-weight:700}
.preview-bar button{margin-inline-start:auto;background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:13px}
:root[data-theme="dark"] .preview-bar{background:#2a1f07;color:#f7d58b;border-color:#4a3810}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .preview-bar{background:#2a1f07;color:#f7d58b;border-color:#4a3810}}

/* מעטפת */
.app{display:flex;min-height:calc(100vh - 36px)}
.side{width:264px;flex-shrink:0;background:var(--navy-950);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1}
.brand .logo span{display:block;width:34px;height:3px;background:#fff;border-radius:2px;margin-top:8px}
.brand .sub{font-size:12.5px;color:rgba(255,255,255,.55);margin-top:10px}
.nav{padding:12px 10px 20px;flex:1}
.nav-cap{font-size:11.5px;color:rgba(255,255,255,.42);padding:12px 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:rgba(255,255,255,.78);padding:9px 12px;border-radius:10px;cursor:pointer;text-align:start;font-size:14px}
.nav-item svg{flex-shrink:0;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item[aria-current="page"]{background:var(--blue);color:#fff}
.nav-item[aria-disabled="true"]{color:rgba(255,255,255,.38);cursor:default}
.nav-item[aria-disabled="true"]:hover{background:none}
.soon{margin-inline-start:auto;font-size:10.5px;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:0 7px;color:rgba(255,255,255,.45)}
.side-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;color:rgba(255,255,255,.55)}
.side-foot b{color:#fff;font-weight:600;display:block;font-size:13.5px}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:12px 24px;position:sticky;top:0;z-index:20}
.top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.crumb{font-size:12.5px;color:var(--muted)}
.top .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;background:var(--card);cursor:pointer;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.menu-btn{display:none;border:0;background:none;padding:6px;cursor:pointer;color:var(--text)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy-700);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0}
.tabs{display:flex;gap:4px;padding:0 24px;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{border:0;background:none;padding:12px 14px;font-size:14.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--blue);border-color:var(--blue);font-weight:600}
.content{padding:24px;max-width:1320px;width:100%;margin:0 auto}

/* רכיבים */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-h h2,.card-h h3{margin:0;font-size:16.5px;font-weight:700}
.card-b{padding:18px}
.h-bar{display:block;width:28px;height:3px;background:var(--blue);border-radius:2px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-600)}
.btn-navy{background:var(--navy-800);border-color:var(--navy-800);color:#fff}
.btn-navy:hover{background:var(--navy-700)}
.btn-ghost{border-color:transparent;background:none;color:var(--muted)}
.btn-sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input,select.input,textarea.input{width:100%;height:40px;border:1px solid var(--border);border-radius:10px;padding:0 12px;background:var(--card);font-size:14.5px}
textarea.input{height:auto;padding:12px;resize:vertical;line-height:1.55}
.input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:500}
label.f .input{margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-est{background:var(--est-bg);color:var(--est)}.b-no{background:var(--no-bg);color:var(--no)}.b-blue{background:var(--blue-100);color:var(--blue)}.b-bad{background:var(--bad-bg);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:2px 8px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:1.4fr 1fr}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{padding:16px 18px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .s{font-size:12.5px;color:var(--muted)}
.bar{height:8px;border-radius:999px;background:var(--soft);border:1px solid var(--border);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:999px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.demo-tag{font-size:11.5px;color:#7a4b00;background:#fff7e6;border:1px solid #f3dfb4;border-radius:6px;padding:1px 7px;white-space:nowrap}
:root[data-theme="dark"] .demo-tag{background:#2a1f07;color:#f7d58b;border-color:#4a3810}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .demo-tag{background:#2a1f07;color:#f7d58b;border-color:#4a3810}}

/* טבלאות */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;font-weight:500;color:var(--muted);font-size:13px;padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--soft)}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--blue-50)}
tr:last-child td{border-bottom:0}
.co-name{font-weight:600}
.score{display:inline-flex;align-items:center;justify-content:center;width:38px;height:26px;border-radius:8px;font-weight:700;font-size:13px}
.s-hi{background:var(--ok-bg);color:var(--ok)}.s-mid{background:var(--blue-100);color:var(--blue)}.s-lo{background:var(--no-bg);color:var(--no)}

/* חיפוש */
.hero-search{background:linear-gradient(160deg,var(--navy-900),var(--navy-700));color:#fff;border-radius:18px;padding:26px;border:1px solid rgba(255,255,255,.08)}
.hero-search h2{margin:0;font-size:22px;font-weight:700}
.hero-search p{margin:6px 0 0;color:rgba(255,255,255,.7);font-size:14.5px}
.hero-search textarea{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:12px;width:100%;padding:14px;margin-top:16px;min-height:88px;resize:vertical;font-size:15.5px;line-height:1.6}
.hero-search textarea::placeholder{color:rgba(255,255,255,.45)}
.hero-search textarea:focus{outline:none;border-color:#6b9bff;box-shadow:0 0 0 3px rgba(37,99,235,.35)}
.ex{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ex button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.88);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.ex button:hover{background:rgba(255,255,255,.14)}
.hero-actions{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.hero-actions .btn-primary{height:42px}
.engine-note{font-size:13px;color:rgba(255,255,255,.65)}
.adv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;user-select:none}
.switch{width:40px;height:23px;border-radius:999px;background:var(--border);position:relative;flex-shrink:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:right .15s}
input:checked + .switch{background:var(--blue)}
input:checked + .switch::after{right:20px}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.interp{border:1px dashed var(--blue);background:var(--blue-50);border-radius:12px;padding:14px 16px}
.interp .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.interp .chips span{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:3px 10px;font-size:13px}
.steps{display:grid;gap:10px}
.step{display:flex;align-items:center;gap:12px;font-size:14.5px}
.step .ic{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--border);flex-shrink:0;font-size:12px;color:var(--muted)}
.step.done .ic{background:var(--ok);border-color:var(--ok);color:#fff}
.step.run .ic{border-color:var(--blue);border-top-color:transparent;animation:spin .8s linear infinite}
.step.wait{color:var(--faint)}
@keyframes spin{to{transform:rotate(360deg)}}
.est-box{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:14px}

/* מודלים של Pre-Dispatch ובחירה מרובה */
.modal-overlay{position:fixed;inset:0;background:rgba(4,9,26,.65);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:var(--card);color:var(--text);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.35);width:min(680px,100vw);max-height:90vh;overflow-y:auto;border:1px solid var(--border);display:flex;flex-direction:column}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--soft)}
.modal-h h3{margin:0;font-size:16.5px;font-weight:700}
.modal-b{padding:20px;display:grid;gap:14px;line-height:1.5}
.modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;gap:10px;background:var(--soft)}
.selection-bar{animation:fadeIn .2s ease-in-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

/* כרטיס חברה */
.overlay{position:fixed;inset:0;background:rgba(4,9,26,.45);z-index:50;display:flex;justify-content:flex-start}
.panel{background:var(--bg);width:min(980px,100%);max-width:100vw;height:100%;overflow:auto;box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel-b,.panel-b *{overflow-wrap:anywhere}
.panel-h{background:var(--navy-950);color:#fff;padding:20px 24px;position:sticky;top:0;z-index:2}
.panel-h h2{margin:0;font-size:22px;font-weight:700}
.panel-h .meta{color:rgba(255,255,255,.65);font-size:13.5px;margin-top:4px}
.panel-h .x{background:rgba(255,255,255,.1);border:0;color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px}
.panel-b{padding:20px 24px 40px;display:grid;gap:18px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.fld{padding:12px 16px;border-bottom:1px solid var(--border);border-inline-start:1px solid var(--border);min-width:0}
.fld:nth-child(2n){border-inline-start:0}
.fld .k{font-size:12.5px;color:var(--muted)}
.fld .v{font-weight:500;margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;overflow-wrap:anywhere}
.fld .src{font-size:12px;color:var(--faint);margin-top:3px}
.ev{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.ev:last-child{border-bottom:0}
.ev .src-ic{width:34px;height:34px;border-radius:10px;background:var(--blue-100);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.contact{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.contact:hover{background:var(--blue-50)}
.contact:last-child{border-bottom:0}
.contact .av{width:38px;height:38px;border-radius:50%;background:var(--navy-700);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.timeline{display:grid;gap:0}
.tl{display:flex;gap:12px;padding:10px 0;position:relative}
.tl::before{content:"";position:absolute;top:30px;bottom:-10px;right:6px;width:2px;background:var(--border)}
.tl:last-child::before{display:none}
.tl .d{width:14px;height:14px;border-radius:50%;background:var(--blue);margin-top:4px;flex-shrink:0;box-shadow:0 0 0 3px var(--blue-100)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}

/* לידים */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--soft);border:1px solid var(--border);border-radius:var(--r);padding:10px;min-height:200px}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-weight:600;font-size:14px}
.col-h .n{margin-inline-start:auto;font-size:12.5px;color:var(--muted);font-weight:500}
.lead{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.lead:hover{border-color:var(--blue)}
.lead .t{font-weight:600;font-size:14.5px}
.lead select{margin-top:8px;height:32px;font-size:13px}

/* מנועי AI */
.ai-card{padding:18px;display:grid;gap:12px}
.ai-logo{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;flex-shrink:0}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:500}
.key-row{display:flex;gap:8px;align-items:center}
.key-row .input{direction:ltr;text-align:left;font-family:ui-monospace,monospace;font-size:13px}

/* עלויות */
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .c i{width:100%;max-width:28px;border-radius:6px 6px 2px 2px;background:var(--blue);display:block}
.chart .c i.est{background:repeating-linear-gradient(135deg,var(--blue-100),var(--blue-100) 4px,transparent 4px,transparent 8px);border:1px dashed var(--blue)}
.chart .c span{font-size:11px;color:var(--muted)}

/* כרטיס ספק / חיבור */
.conn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.conn-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.conn-h{display:flex;align-items:center;gap:12px}
.conn-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--soft);border:1px solid var(--border)}
.conn-meta{font-size:13px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.conn-meta dt{font-weight:500;color:var(--muted)}
.conn-meta dd{margin:0;font-weight:600;color:var(--text)}

const ENR_KEYS = ["id","company_name","company_hp","phone","email","website","industry","fleet_type","status","certified_professional",
  "address","city","missing_fields","updated_at",
  "company_active_status","phone_secondary","email_direct","contact_form_url","public_whatsapp","linkedin_company",
  "contact_name","contact_role","contact_phone","contact_email","contact_linkedin",
  "fleet_exists","fleet_size","fleet_size_status","fleet_types","fleet_manager_name","fleet_manager_source",
  "safety_officer_name","safety_officer_source","safety_officer_verified",
  "verification_status","verification_date","source_list","registry_check","tier",
  "lead_stage","lead_quality","ready_for_contact","rejected_reason",
  "people","multi_phones","multi_mails",
  "crm_handoff_status","crm_handoff_requested_at","enrichment_source","enrichment_status","enrichment_cost","enrichment_requested"];
function mapDbRowToLead(row, idx) {
  /* enrichment / qualification columns travel with the lead as c.enr – only what the rules need,
     so the localStorage cache stays small (computed field_status is rebuilt; only manual provenance is kept) */
  const raw_payload = row.raw_payload;
  const enr = {};
  ENR_KEYS.forEach(k => { if (row[k] !== undefined) enr[k] = row[k]; });
  enr.people = Array.isArray(row.people) ? row.people : [];
  enr.multi_phones = Array.isArray(row.multi_phones) ? row.multi_phones : [];
  enr.multi_mails = Array.isArray(row.multi_mails) ? row.multi_mails : [];
  enr.field_status = { manual: (row.field_status && row.field_status.manual) || {} };
  /* research findings (Gemini etc.) are evidence objects {field,value,source,url,status,found_at}; legacy array rows stay in c.ev */
  enr.evidence = (Array.isArray(row.evidence) ? row.evidence : []).filter(x => x && typeof x === "object" && !Array.isArray(x));
  const rc = row.registry_check;
  if (rc) enr.registry_check = {
    checked_at: rc.checked_at,
    contractors: { found: !!(rc.contractors && rc.contractors.found), records: ((rc.contractors && rc.contractors.records) || []).map(r => ({ anaf: r.anaf, phone: r.phone, email: r.email, ovdim: r.ovdim })) },
    companies: { found: !!(rc.companies && rc.companies.found), status: rc.companies && rc.companies.status }
  };
  if (raw_payload && typeof raw_payload === "object" && raw_payload.name) {
    const p = raw_payload;
    p.id = idx + 1;
    p.dbId = row.id;
    p.status = row.status || p.status || "new";
    p.notes = row.notes || p.notes || "";
    /* Supabase columns win over the original import snapshot, so research updates show after reload */
    const col = (v, old) => (v != null && String(v).trim() !== "" ? v : old);
    p.name = col(row.company_name, p.name);
    p.phone = col(row.phone, p.phone);
    p.mail = col(row.email, p.mail);
    p.web = col(row.website, p.web);
    p.addr = col(row.address, p.addr);
    p.city = col(row.city, p.city);
    p.ind = col(row.industry, p.ind);
    p.isApprovedLead = row.is_approved_lead !== false;
    p.source_keyword = row.source_keyword || p.source_keyword || "";
    p.discovery_batch = (row.raw_payload && row.raw_payload.discovery_batch) || p.discovery_batch || "batch_1";
    p.employee_range = (row.raw_payload && row.raw_payload.employee_range) || p.employee_range || "";
    p.workforce_status = (row.raw_payload && row.raw_payload.workforce_status) || p.workforce_status || "";
    p.potential_score = (row.raw_payload && row.raw_payload.potential_score) || p.potential_score || null;
    p.potential_tier = (row.raw_payload && row.raw_payload.potential_tier) || p.potential_tier || "";
    p.potential_tier_label = (row.raw_payload && row.raw_payload.potential_tier_label) || p.potential_tier_label || "";
    p.enr = enr;
    return p;
  }
  return {
    enr,
    id: idx + 1,
    dbId: row.id,
    name: row.company_name,
    no: row.company_hp,
    ind: row.industry || "תשתיות ועפר",
    city: row.city || "מרכז",
    region: row.region || "מרכז",
    addr: row.address || "",
    web: row.website || "",
    phone: row.phone || "לא נמצא",
    mail: row.email || "",
    size: row.company_size || "",
    fleet: { s: "n", val: "טרם נמצא מידע על צי", src: "" },
    fleetType: row.fleet_type || "",
    score: row.score || 0,
    status: row.status || "new",
    isApprovedLead: row.is_approved_lead !== false,
    source_keyword: row.source_keyword || "",
    discovery_batch: (row.raw_payload && row.raw_payload.discovery_batch) || "batch_1",
    employee_range: (row.raw_payload && row.raw_payload.employee_range) || "",
    workforce_status: (row.raw_payload && row.raw_payload.workforce_status) || "",
    potential_score: (row.raw_payload && row.raw_payload.potential_score) || null,
    potential_tier: (row.raw_payload && row.raw_payload.potential_tier) || "",
    potential_tier_label: (row.raw_payload && row.raw_payload.potential_tier_label) || "",
    found: row.found_date || "01.10.2026",
    upd: row.updated_date || "01.10.2026",
    isSafetyOfficerLead: !!row.is_safety_officer_lead,
    certifiedProfessional: row.certified_professional,
    safetyOfficer: row.safety_officer,
    leadReason: row.lead_reason || "",
    facts: row.facts || { no: "n", ind: "n", addr: "n", web: "n", phone: "n", mail: "n", size: "n" },
    ev: row.evidence || [],
    people: row.people || [],
    multiPhones: row.multi_phones || [],
    multiMails: row.multi_mails || [],
    notes: row.notes || ""
  };
}

async function syncWithRemoteSupabase() {
  if (typeof S !== "undefined") {
    S.remoteStatus = "syncing";
    renderNav();
  }

  // 1. Try Supabase Staging DB query via anon key
  if (sbClient) {
    try {
      // PostgREST caps each response (max-rows=1000), so page through the table
      const PAGE = 1000;
      let data = [], error = null;
      for (let from = 0; ; from += PAGE) {
        const res = await sbClient
          .from("prospect_leads")
          .select("*")
          .order("lead_number", { ascending: true })
          .range(from, from + PAGE - 1);
        if (res.error) { error = res.error; break; }
        data = data.concat(res.data || []);
        if (!res.data || res.data.length < PAGE) break;
      }

      if (!error && Array.isArray(data) && data.length > 0) {
        console.log(`[Prospector] Successfully loaded ${data.length} leads from Supabase STAGING!`);
        const mapped = data.map((r, i) => mapDbRowToLead(r, i));
        // Leads that exist only in the local cache (added offline) are pushed to the DB, not lost
        const remoteHp = new Set(mapped.map(l => String(l.no || "").trim()).filter(Boolean));
        const remoteNames = new Set(mapped.map(l => String(l.name || "").trim()));
        const localOnly = C.filter(l => {
          const hp = String(l.no || "").trim();
          if (!hp || remoteHp.has(hp) || remoteNames.has(String(l.name || "").trim())) return false;
          return !String(l.phone || "").startsWith("03-000-");
        });
        C.length = 0;
        mapped.forEach(l => C.push(l));
        localOnly.forEach(l => { l.id = C.length + 1; C.push(l); });
        if (localOnly.length) S.pendingLocalOnly = localOnly.length;
        persistProspectorData();
        if (typeof S !== "undefined") {
          S.remoteStatus = "connected";
          S.remoteCount = C.length;
        }
        render();
        return;
      } else if (error) {
        console.warn("[Prospector] Supabase query notice:", error.message);
        if (typeof S !== "undefined") S.remoteError = error.message;
      } else if (typeof S !== "undefined") {
        S.remoteError = "public.prospect_leads ריקה";
      }
    } catch(err) {
      console.warn("[Prospector] Supabase fetch error:", err);
      if (typeof S !== "undefined") S.remoteError = String(err && err.message || err);
    }
  } else if (typeof S !== "undefined") {
    S.remoteError = "ספריית Supabase לא נטענה";
  }
  toast("שגיאה: Supabase STAGING לא זמין – הלידים לא נטענו מהשרת" + (C.length >= 100 ? " (מוצג גיבוי מקומי)" : ""));

  // 2. Fallback: bundled JSON file if DB query failed (e.g. offline) and the local batch_1 cache is small
  const b1Count = C.filter(c => (c.discovery_batch || "batch_1") === "batch_1").length;
  if (b1Count < 100) try {
    const res = await fetch("./data/prospector-real-leads-618.json");
    if (res.ok) {
      const jsonData = await res.json();
      if (Array.isArray(jsonData) && jsonData.length > 0) {
        console.log(`[Prospector] Loaded ${jsonData.length} leads from JSON seed file!`);
        const b2Items = C.filter(c => c.discovery_batch === "batch_2");
        C.length = 0;
        jsonData.forEach(l => {
          if (!l.discovery_batch) l.discovery_batch = "batch_1";
          if (l.isApprovedLead === undefined) l.isApprovedLead = true;
          C.push(l);
        });
        b2Items.forEach(b => C.push(b));
        persistProspectorData();
        if (typeof S !== "undefined") {
          S.remoteStatus = "json_fallback";
          S.remoteCount = C.length;
        }
        render();
        return;
      }
    }
  } catch(e) {
    console.warn("[Prospector] Local JSON fetch failed:", e);
  }

  // 3. Fallback to localStorage or default
  if (typeof S !== "undefined") {
    S.remoteStatus = (C.length >= 100) ? "cached" : "offline";
    renderNav();
  }
}

/* עדכון עמודות העשרה/סיווג של ליד ב-Supabase (מקור האמת). מחשב מחדש שלב ליד לפני השמירה. */
async function saveLeadEnrichment(lead, patch, okMsg) {
  if (!sbClient || !lead.enr || !lead.enr.id) { toast("שגיאה: Supabase STAGING לא זמין – השינוי לא נשמר"); return false; }
  const merged = { ...lead.enr, ...patch };
  const q = window.OPQualify ? OPQualify.evaluate(merged) : null;
  if (q) Object.assign(patch, {
    field_status: q.field_status, missing_fields: q.missing_fields, source_list: q.source_list, tier: q.tier,
    verification_status: q.verification_status, fleet_size_status: q.fleet_size_status, lead_stage: q.lead_stage,
    lead_quality: q.lead_quality, ready_for_contact: q.ready_for_contact, rejected_reason: q.rejected_reason
  });
  patch.updated_at = new Date().toISOString();
  const { error } = await sbClient.from("prospect_leads").update(patch).eq("id", lead.enr.id);
  if (error) { console.warn("[Prospector] enrichment save failed:", error.message); toast("שגיאה בשמירה ל-Supabase: " + error.message); return false; }
  Object.assign(lead.enr, patch);
  lead.enr.field_status = { manual: (patch.field_status && patch.field_status.manual) || {} };
  if (typeof _qCache !== "undefined") _qCache.delete(lead.enr);
  if (patch.website !== undefined) lead.web = patch.website || "";
  persistProspectorData();
  toast(okMsg || "נשמר ב-Supabase STAGING");
  const v = $("#view");
  if (v && S.tab === "leads") v.innerHTML = V.leads(); else if (v && S.tab === "companies") v.innerHTML = V.companies();
  if (S.panel) renderPanel();
  return true;
}

function saveManualVerification(lead) {
  const val = id => { const el = $("#" + id); return el ? el.value.trim() : ""; };
  const on = id => { const el = $("#" + id); return !!(el && el.checked); };
  const by = val("en-by") || S.activeUser, at = new Date().toISOString().slice(0, 10), stamp = { by, at };
  const e = lead.enr || {};
  const manual = { ...((e.field_status && e.field_status.manual) || {}) };
  const patch = {};
  const setManual = (key, isOn, extra) => { if (isOn) manual[key] = { ...stamp, ...(extra || {}) }; else delete manual[key]; };

  setManual("phone", on("en-phone-v"));
  setManual("email", on("en-mail-v"));

  const fleet = val("en-fleet");
  const sizeRaw = val("en-fleet-size");
  if (sizeRaw && !(/^\d+$/.test(sizeRaw) && +sizeRaw > 0)) { toast("גודל צי חייב להיות מספר שלם חיובי, או ריק אם לא ידוע"); return; }
  if (sizeRaw && fleet !== "yes") { toast("אפשר להזין גודל צי רק כשהצי אומת כקיים"); return; }
  patch.fleet_exists = fleet === "yes" ? true : fleet === "no" ? false : null;
  patch.fleet_size = fleet === "yes" && sizeRaw ? +sizeRaw : null;
  patch.fleet_types = val("en-fleet-types") ? val("en-fleet-types").split(",").map(s => s.trim()).filter(Boolean) : null;
  setManual("fleet", !!fleet);

  patch.contact_name = val("en-contact-name") || null;
  patch.contact_role = val("en-contact-role") || null;
  patch.contact_phone = val("en-contact-phone") || null;
  patch.contact_email = val("en-contact-email") || null;
  setManual("contact", on("en-contact-v") && !!patch.contact_name);

  patch.website = val("en-website") || "";
  setManual("website", on("en-web-v") && !!patch.website);

  patch.fleet_manager_name = val("en-fm-name") || null;
  patch.fleet_manager_source = val("en-fm-src") || null;
  setManual("fleet_manager", on("en-fm-v") && !!patch.fleet_manager_name && !!patch.fleet_manager_source);

  /* קצין בטיחות: אימות רק עם שם + מקור מפורש שאינו OVDIM / פנקס הקבלנים / AI */
  patch.safety_officer_name = val("en-so-name") || null;
  patch.safety_officer_source = val("en-so-src") || null;
  const certName = lead.certifiedProfessional && lead.certifiedProfessional.name;
  if (on("en-so-v")) {
    if (!patch.safety_officer_name || !patch.safety_officer_source) { toast("אימות קצין בטיחות דורש שם ומקור מפורש"); return; }
    if (OPQualify.NOT_SAFETY_PROOF.test(patch.safety_officer_source)) { toast("המקור אינו הוכחה לקצין בטיחות (OVDIM / פנקס הקבלנים / AI)"); return; }
    if (certName && certName.replace(/\s/g, "") === patch.safety_officer_name.replace(/\s/g, "")) { toast("איש המקצוע מה-OVDIM אינו קצין בטיחות"); return; }
  }
  patch.safety_officer_verified = on("en-so-v");

  if (on("en-reject")) { manual.rejected = { ...stamp, reason: val("en-reject-reason") || "סומן ידנית כלא מתאים" }; patch.rejected_reason = manual.rejected.reason; }
  else { delete manual.rejected; if (e.field_status && e.field_status.manual && e.field_status.manual.rejected) patch.rejected_reason = null; }

  patch.field_status = { ...(e.field_status || {}), manual };
  patch.verification_date = at;
  saveLeadEnrichment(lead, patch, "האימות נשמר ב-Supabase STAGING");
}

async function upsertBatchToRemoteSupabase(stagedLeads) {
  if (!Array.isArray(stagedLeads) || stagedLeads.length === 0) return { ok: false, error: "empty" };
  const sess = await userSession();
  if (!sess || !window.supabase) {
    toast("שמירה ל-Supabase דורשת התחברות לדליה. החברות נשארו במסך בלבד.");
    return { ok: false, error: "no_session" };
  }
  const client = window.supabase.createClient(SUPABASE_STAGING_URL, SUPABASE_STAGING_ANON, {
    global: { headers: { Authorization: "Bearer " + sess.accessToken } },
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });
  try {
    const rows = stagedLeads.map(l => ({
      company_name: l.name,
      company_hp: l.no || null,
      industry: l.ind || "",
      city: l.city || "",
      region: l.region || "",
      address: l.addr || "",
      website: l.web || "",
      phone: l.phone && l.phone !== "לא ידוע" ? l.phone : "",
      email: l.mail || "",
      company_size: l.size && l.size !== "לא ידוע" ? l.size : "",
      fleet_info: l.fleet || {},
      fleet_type: l.fleetType || "",
      score: Number.isFinite(+l.score) ? +l.score : 0,
      status: l.status || "new",
      found_date: l.found || "",
      updated_date: l.upd || "",
      is_safety_officer_lead: !!l.isSafetyOfficerLead,
      is_approved_lead: l.isApprovedLead === true,
      source_keyword: l.source_keyword || "",
      certified_professional: l.certifiedProfessional || null,
      safety_officer: l.safetyOfficer || null,
      lead_reason: l.leadReason || "",
      facts: l.facts || {},
      evidence: l.ev || [],
      people: l.people || [],
      multi_phones: l.multiPhones || [],
      multi_mails: l.multiMails || [],
      notes: l.notes || "",
      raw_payload: (({ enr, ...rest }) => rest)(l)
    }));
    const { error } = await client.from("prospect_leads").upsert(rows, { onConflict: "company_hp" });
    if (error) { toast("השמירה נחסמה: " + error.message); return { ok: false, error: error.message }; }
    stagedLeads.forEach(l => { l.searchStaged = false; });
    toast(`נשמרו ${rows.length} חברות ב-Supabase Staging`);
    return { ok: true };
  } catch(e) {
    toast("שגיאה בשמירה");
    return { ok: false, error: String(e && e.message || e) };
  }
}

function exportJsonBackup() {
  try {
    const backupObj = {
      version: "2.0",
      exportedAt: new Date().toISOString(),
      leadsCount: C.length,
      runsCount: RUNS.length,
      leads: C,
      runs: RUNS
    };
    const blob = new Blob([JSON.stringify(backupObj, null, 2)], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `dalia-prospector-leads-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast(`קובץ גיבוי JSON יוצא בהצלחה (${C.length} לידים)`);
  } catch(e) {
    console.error("Error exporting JSON backup:", e);
    toast("שגיאה בייצוא קובץ גיבוי");
  }
}

function handleJsonImport(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      const incomingLeads = Array.isArray(data) ? data : (data && Array.isArray(data.leads) ? data.leads : null);
      if (!incomingLeads || incomingLeads.length === 0) {
        toast("קובץ הגיבוי ריק או לא תקין");
        return;
      }
      const existingNos = new Set(C.map(c => c.no).filter(Boolean));
      const existingNames = new Set(C.map(c => c.name.trim()));
      let importedCount = 0;
      incomingLeads.forEach(lead => {
        if (!lead || !lead.name) return;
        const hp = lead.no ? String(lead.no).trim() : "";
        const name = String(lead.name).trim();
        if ((hp && existingNos.has(hp)) || existingNames.has(name)) {
          return;
        }
        if (hp) existingNos.add(hp);
        existingNames.add(name);
        lead.id = C.length + 1;
        C.push(lead);
        importedCount++;
      });
      if (data.runs && Array.isArray(data.runs)) {
        data.runs.forEach(r => RUNS.push(r));
      }
      persistProspectorData();
      render();
      toast(`שחזור הצליח: נוספו ${importedCount} לידים מקובץ הגיבוי!`);
    } catch(err) {
      console.error("Error importing JSON backup:", err);
      toast("שגיאה בקריאת קובץ הגיבוי");
    }
  };
  reader.readAsText(file);
}

const fleetBadge=f=>f.s==="v"?`<span class="badge b-ok">✓ ${esc(f.val)}</span>`:f.s==="e"?`<span class="badge b-est">≈ ${esc(f.val)}</span>`:`<span class="badge b-no">${esc(f.val)}</span>`;
const scoreCls=s=>s>=80?"s-hi":s>=65?"s-mid":"s-lo";
const stBadge=s=>{const m={new:"b-blue",review:"b-no",contacted:"b-blue",meeting:"b-est",quote:"b-est",won:"b-ok",irrelevant:"b-no"};return `<span class="badge ${m[s]||'b-no'}">${ST[s]||s}</span>`};
function toast(t){const el=$("#toast");if(!el)return;el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3200)}
const engine=()=>AI.find(a=>a.def)||AI[0];

/* ===== זיהוי סביבת IFRAME (EMBEDDED) ===== */
const isEmbedded = window.parent && window.parent !== window;
if (isEmbedded) {
  document.body.classList.add("is-embedded");
}

/* ===== ניווט וטאבים ===== */
const TABS=[["dash","דשבורד"],["search","חיפוש חדש"],["companies","חברות שנמצאו"],["leads","ניהול לידים"],["enrich","העשרת לידים"],["sources","מקורות מידע"],["discovered_sources","מקורות שהתגלו"],["connections","חיבורים ו-APIs"]];

function renderNav(){
  const byId=Object.fromEntries(MENU.map(m=>[m[0],m]));
  const navEl=$("#nav");
  if(navEl){
    navEl.innerHTML=GROUPS.map(([cap,ids])=>`<div class="nav-cap">${cap}</div>`+ids.map(id=>{const [k,l,i,active]=byId[id];
      return active?`<button class="nav-item" data-go="${k}" ${S.view===k?'aria-current="page"':""}>${i}<span>${l}</span></button>`
        :`<div class="nav-item" aria-disabled="true">${i}<span>${l}</span><span class="soon">בקרוב</span></div>`}).join("")).join("");
  }
  const elLbl=$("#engineLabel");
  if(elLbl) elLbl.textContent=engine().name;

  const syncEl = $("#cloudSyncStatus");
  if (syncEl) {
    if (S.remoteStatus === "connected") {
      syncEl.innerHTML = `<span class="badge b-ok" style="font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px" title="מסונכרן בזמן אמת ל-Supabase STAGING (public.prospect_leads)">🟢 ענן Supabase Staging פעיל (${C.length} לידים)</span>`;
    } else if (S.remoteStatus === "syncing" || S.remoteStatus === "initializing") {
      syncEl.innerHTML = `<span class="badge" style="background:#fef3c7;color:#b45309;font-size:12px;display:inline-flex;align-items:center;gap:5px">🔄 מסנכרן מול Supabase...</span>`;
    } else if (S.remoteStatus === "json_fallback") {
      syncEl.innerHTML = `<span class="badge b-bad" style="font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px" title="${esc(S.remoteError || "")}">⚠️ Supabase לא זמין – מוצג קובץ גיבוי סטטי (${C.length} לידים)</span>`;
    } else if (S.remoteStatus === "cached") {
      syncEl.innerHTML = `<span class="badge b-bad" style="font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px" title="${esc(S.remoteError || "")}">⚠️ Supabase לא זמין – מוצג cache מקומי (${C.length} לידים)</span>`;
    } else {
      syncEl.innerHTML = `<span class="badge b-bad" style="font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px" title="${esc(S.remoteError || "")}">⛔ Supabase לא זמין – לא נטענו לידים מהשרת</span>`;
    }
  }
}

function renderTabs(){
  const t=$("#tabs");
  if(S.view!=="prospector"){t.hidden=true;return}
  t.hidden=false;
  t.innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join("");
}

function render(){
  renderNav();renderTabs();
  const titles={prospector:"איתור לקוחות עסקיים",enrich:"העשרת לידים – Gemini",ai:"ניהול מנועי AI",costs:"שימוש, עלויות וקרדיטים",providers:"ניהול ספקי מידע",sources:"מרכז מקורות מידע ומאגרים",discovered_sources:"מקורות מידע חדשים שהתגלו (Source Discovery)",connections:"חיבורים ו-APIs",workspace:"סביבת עבודה"};
  const titEl=$("#title");
  if(titEl) titEl.textContent=titles[S.view==="prospector"?S.tab:S.view]||"איתור לקוחות עסקיים";
  const viewEl=$("#view");
  if(viewEl) viewEl.innerHTML=(V[S.view==="prospector"?S.tab:S.view]||V.dash)();
  renderPanel();
  renderModals();
  renderAiChat();
}

function go(v){
  S.view=v;S.menu=false;
  const side=$("#side"), scrim=$("#scrim");
  if(side) side.classList.remove("open");
  if(scrim) scrim.classList.remove("open");
  render();
  window.scrollTo(0,0);
}

const V={};
/* ===== דשבורד ===== */
V.dash=()=>{
  const counts=Object.fromEntries(STATUSES.map(([k])=>[k,C.filter(c=>c.status===k).length]));
  const ls=leadStats(), st=k=>ls.stage[k]||0;
  const srcNote=S.remoteStatus==="connected"?`מחושב מ-${ls.total} לידים שנטענו כעת מ-Supabase STAGING`:`⚠️ Supabase לא זמין – המונים מחושבים מ-cache מקומי (${ls.total})`;
  const tile=(l,v,sub,sty)=>`<div class="card kpi" style="${sty||""}"><div class="l">${l}</div><div class="v num">${v}</div>${sub?`<div class="s">${sub}</div>`:""}</div>`;
  return `
  <div class="card" style="margin-bottom:18px">
    <div class="card-h"><h2>מצב הלידים – אימות והעשרה<span class="h-bar"></span></h2><span class="spacer"></span><span class="xs muted">${srcNote}</span></div>
    <div class="card-b" style="padding-top:0">
      <div class="tiles">
        ${tile("סה\"כ לידים",ls.total)}
        ${tile("🟢 לידים ירוקים",ls.green,"מוכנים לפנייה ולעבודה עסקית","border-color:#86efac;background:#f0fdf4")}
        ${tile("⭐ לידים איכותיים+",ls.greenPlus,"ירוקים עם מקבל החלטות מזוהה","border-color:#fde68a;background:#fffbeb")}
        ${tile("🟡 לידים צהובים",ls.yellow,"פוטנציאל טוב – דורשים השלמה","border-color:#fed7aa;background:#fffaf0")}
        ${tile("🔴 לידים אדומים",ls.red,"אינם מתאימים / בפירוק","border-color:#fca5a5;background:#fef2f2")}
        ${tile("מוכנים לפנייה",ls.ready,"עומדים בכל תנאי החובה","border-color:#86efac")}
        ${tile("חסר טלפון מאומת",ls.noPhone)}
        ${tile("חסר מייל מאומת",ls.noMail)}
        ${tile("חסר איש קשר",ls.noContact)}
        ${tile("מועמדים להעשרה חיצונית",ls.paidCand,"פוטנציאל טוב שדורש השלמת קשר")}
      </div>
      <div class="row xs muted" style="margin-top:10px;gap:10px;flex-wrap:wrap">
        <span>רשומה בסיסית: <b class="num">${st("basic")}</b></span><span>לא מתאים: <b class="num">${st("rejected")}</b></span>
        <span>איכות גבוהה / בינונית / נמוכה: <b class="num">${ls.quality.high} / ${ls.quality.medium} / ${ls.quality.low}</b></span>
      </div>
    </div>
  </div>
  <div class="grid g-kpi">
    ${kpi("חיפושים החודש",String(RUNS.length),"פעילים ב-STAGING")}
    ${kpi("חברות שנמצאו",String(C.length),`${st("qualified")+st("quality")+st("ready")} מתאימות לפי כללי האימות`)}
    ${kpi("מועמדים לבדיקת קצב\"ת",String(C.filter(c=>soState(c)).length),`${C.filter(soNamed).length} קצינים אותרו · ${C.filter(soVerified).length} מאומתים`)}
    ${kpi("אומתו ברשם (data.gov.il)",String(C.filter(c=>{const q=QF(c);return q&&q.tier==="A"}).length),"פנקס הקבלנים / רשם החברות")}
  </div>
  <div class="grid g-2" style="margin-top:18px">
    <div class="card">
      <div class="card-h"><h2>חיפושים אחרונים<span class="h-bar"></span></h2><span class="spacer"></span><button class="btn btn-primary btn-sm" data-tab="search">+ חיפוש חדש</button></div>
      <div class="tbl-wrap"><table><thead><tr><th>בקשה</th><th>סטטוס</th><th>נמצאו</th><th class="hm">מתאימות</th><th class="hm">מנוע</th><th>עלות</th></tr></thead><tbody>
      ${RUNS.map(r=>`<tr data-tab="companies"><td><div class="co-name">${esc(r.q)}</div><div class="xs muted">${r.when}</div></td>
        <td>${r.st==="done"?'<span class="badge b-ok">הסתיים</span>':r.st==="error"?'<span class="badge b-bad">נכשל</span>':'<span class="badge b-blue">בתהליך…</span>'}</td>
        <td class="num">${r.found}</td><td class="num hm">${r.fit}</td><td class="hm">${r.engine}</td><td class="num">${r.cost}</td></tr>`).join("")}

    <div class="card">

      <div class="card-b" style="display:grid;gap:12px">

  <div class="grid g-3" style="margin-top:18px">

      <p class="xs muted" style="margin:10px 0 0">טלפון, מייל, אתר, איש קשר וצי – מחושב מהנתונים. "מאומת" מופיע רק כשיש מקור. גודל צי לא מוצג בלי ראיה.</p></div>
    <div class="card card-b"><div class="sm muted">מנוע AI פעיל</div><div style="font-size:20px;font-weight:700;margin-top:4px">${engine().name} · <span class="sm muted ltr">${engine().model}</span></div>
      <button class="btn btn-sm" style="margin-top:10px" data-tab="connections">הגדרות חיבורים</button></div>
    <div class="card card-b"><div class="sm muted">ספקי מידע ואימות</div><div style="font-size:20px;font-weight:700;margin-top:4px">רשם החברות פעיל</div>
      <p class="xs muted" style="margin:6px 0 0">Gemini זמין אחרי התחברות מנהל. ספקי צד ג' בתשלום כבויים.</p></div>
  </div>`;
};
function kpi(l,v,s,pct){return `<div class="card kpi"><div class="l">${l}</div><div class="v num">${v}</div><div class="s">${s}</div>${pct!=null?`<div class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></div>`:""}</div>`}

/* ===== ניהול תחומי פעילות ומילות מפתח ===== */
function renderDomainKeywordManager() {
  const domains = (window.OPQualify && window.OPQualify.OPDomainKeywords)
    ? window.OPQualify.OPDomainKeywords.getDomains()
    : [];
  if (!S.selectedDomainId && domains.length > 0) {
    S.selectedDomainId = domains[0].id;
  }
  const curDomain = domains.find(d => d.id === S.selectedDomainId) || domains[0];

  return `
  <div class="card" style="margin-top:18px;border:1.5px solid #cbd5e1;box-shadow:0 2px 8px rgba(0,0,0,0.04)">
    <div class="card-h" style="flex-wrap:wrap;gap:8px">
      <h2><span>🏷️ ניהול תחומי פעילות ומילות מפתח (10 תחומי בסיס + התאמה אישית)</span><span class="h-bar"></span></h2>
      <span class="spacer"></span>
      <button class="btn btn-sm" data-act="toggleKwManager" style="background:var(--soft);border:1px solid var(--border)">
        ${S.kwManagerOpen ? "▲ כווץ ניהול מילות מפתח" : "▼ פתח ניהול מילות מפתח"}
      </button>
      <button class="btn btn-sm" data-act="openAddDomainModal" style="background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd">+ הוסף תחום חדש</button>
      <button class="btn btn-sm" data-act="openAssignMultiDomainModal" style="background:#f3e8ff;color:#7e22ce;border:1px solid #e9d5ff">🔗 שייך מילה למספר תחומים</button>
      <button class="btn btn-sm btn-ghost" data-act="resetDomainsDefaults" title="שחזר ברירת מחדל" style="color:var(--muted)">↺ שחזר</button>
    </div>
    <div class="card-b" style="${S.kwManagerOpen ? '' : 'display:none;'}padding-top:12px">
      <div class="sm muted" style="margin-bottom:12px">
        בחר תחום פעילות לצפייה במילות המפתח המשויכות לו, הפעלה או השבתה של מילים, הוספת מילים חדשות, או העברתן ישירות לחיפוש המתקדם.
      </div>
      <!-- Domain selector pills -->
      <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:14px">
        ${domains.map(d => `
          <button class="btn btn-sm ${curDomain && curDomain.id === d.id ? 'btn-primary' : 'btn-ghost'}" data-act="selectDomainForKw" data-domain-id="${esc(d.id)}" style="font-size:12px;border:1px solid ${curDomain && curDomain.id === d.id ? 'var(--blue)' : 'var(--border)'}">
            ${esc(d.name)} (${(d.keywords||[]).filter(k=>k.active).length})
          </button>
        `).join("")}
      </div>

      <!-- Current domain content -->
      ${curDomain ? `
        <div style="background:var(--soft);border:1.5px solid var(--border);border-radius:10px;padding:14px">
          <div class="row" style="align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">
            <span class="bold" style="font-size:15px;color:var(--text)">${esc(curDomain.name)}</span>
            <span class="xs muted">${esc(curDomain.description||"")}</span>
            <span class="badge b-blue" style="font-size:10.5px">עוגן צי: ${esc(curDomain.fleetType||"רכבי עבודה")}</span>
            <span class="badge b-ok" style="font-size:10.5px">פוטנציאל מינימום: ${curDomain.minFleetPotential || 5}+ רכבים</span>
            <span class="spacer"></span>
            <button class="btn btn-sm btn-primary" data-act="applyDomainKwToSearch" data-domain-id="${esc(curDomain.id)}">📥 בחר מילות תחום זה לחיפוש</button>
            ${curDomain.isCustom ? `<button class="btn btn-sm btn-bad" data-act="deleteCustomDomain" data-domain-id="${esc(curDomain.id)}" style="background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5">מחק תחום</button>` : ""}
          </div>

          <div style="margin-top:12px">
            <div class="xs muted bold" style="margin-bottom:6px">מילות מפתח פעילות / מושבתות (לחץ על מילה להפעלה/השבתה):</div>
            <div class="row" style="gap:6px;flex-wrap:wrap;align-items:center">
              ${(curDomain.keywords||[]).map(kw => `
                <span class="badge ${kw.active ? 'b-ok' : 'b-no'}" style="font-size:11.5px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;cursor:pointer;user-select:none" data-act="toggleKwActive" data-domain-id="${esc(curDomain.id)}" data-word="${esc(kw.word)}" title="לחץ להפעלה / השבתה">
                  <span>${kw.active ? '✓ פעיל' : '✕ מושבת'}</span>
                  <b>${esc(kw.word)}</b>
                  <span data-act="deleteKwFromDomain" data-domain-id="${esc(curDomain.id)}" data-word="${esc(kw.word)}" style="font-weight:bold;margin-right:4px;color:#dc2626;cursor:pointer" title="מחק מילה מתוך תחום זה">×</span>
                </span>
              `).join("")}
              ${(!curDomain.keywords || curDomain.keywords.length === 0) ? '<span class="xs muted">אין מילות מפתח בתחום זה עדיין.</span>' : ''}
            </div>
          </div>

          <!-- Add keyword inline form -->
          <div class="row" style="margin-top:14px;gap:8px;align-items:center;flex-wrap:wrap">
            <input class="input" id="new-kw-input" placeholder="הוסף מילת מפתח חדשה לתחום ${esc(curDomain.name)}" style="max-width:280px;height:34px;font-size:12.5px">
            <button class="btn btn-sm" data-act="addKwToDomain" data-domain-id="${esc(curDomain.id)}" style="height:34px">+ הוסף מילת מפתח</button>
          </div>
        </div>
      ` : ''}
    </div>
  </div>`;
}

async function executeGeminiEdgeCall() {
  const q = ($("#q").value || "").trim();
  const g = $("#geminiApprovalGateContainer");
  if (g) g.innerHTML = `<div class="card" style="padding:14px;background:#f8fafc"><div class="row"><b>מבצע שאילתה ב-Gemini AI (אישור משתמש התקבל)...</b><span class="badge b-blue">Gemini Flash</span></div></div>`;
  const sess = await userSession();
  if (!sess) {
    if (g) g.innerHTML = `<div class="card" style="padding:14px;background:#fef2f2;color:#b91c1c">נדרשת התחברות משתמש מורשה לביצוע שאילתת Gemini.</div>`;
    return;
  }
  try {
    const res = await fetch(`${SUPABASE_STAGING_URL}/functions/v1/marketing-gemini-chat`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_STAGING_ANON,
        "Authorization": `Bearer ${sess.accessToken}`
      },
      body: JSON.stringify({
        prompt: `נתח את בקשת החיפוש לאיתור לקוחות עם צי רכב בישראל: "${q}". החזר אובייקט JSON בלבד בפורמט: {"region":"מרכז|צפון|דרום|כל הארץ","industry":"הפצה ולוגיסטיקה|שירות וטכנאי שטח|הובלות|בנייה ותשתיות|כל הענפים","fleet":5,"role":"מנהל צי רכב|קצין בטיחות בתעבורה|מנהל תפעול","count":20,"jobs":true,"keyword":"מילת מפתח"}`
      })
    });
    const data = await res.json();
    if (data.ok && data.reply) {
      let parsed = null;
      const match = data.reply.match(/\{[\s\S]*\}/);
      if (match) parsed = JSON.parse(match[0]);
      if (parsed) {
        parsed.source = "gemini";
        S._interp = parsed;
        if (g) {
          g.innerHTML = `
            <div class="card" style="margin-top:12px;border:1.5px solid #16a34a;background:#f0fdf4;padding:14px">
              <div class="row"><b>פענוח מורחב מ-Gemini התקבל בהצלחה</b><span class="badge b-ok">Gemini</span><span class="spacer"></span><button class="btn btn-sm" data-act="applyInterp">העבר לחיפוש המתקדם</button></div>
              <div class="chips" style="margin-top:8px"><span>אזור: ${esc(parsed.region)}</span><span>ענף: ${esc(parsed.industry)}</span><span>צי משוער: ${esc(parsed.fleet)}+ רכבים</span><span>מילת מפתח: ${esc(parsed.keyword)}</span></div>
            </div>
          `;
        }
        toast("פענוח Gemini הושלם בהצלחה");
        return;
      }
    }
    if (g) g.innerHTML = `<div class="card" style="padding:14px;background:#fef2f2;color:#b91c1c">לא התקבל מענה תקין מ-Gemini. נסה שנית או השתמש בחיפוש החינמי.</div>`;
  } catch(e) {
    if (g) g.innerHTML = `<div class="card" style="padding:14px;background:#fef2f2;color:#b91c1c">שגיאה בתקשורת עם Gemini: ${esc(e.message)}</div>`;
  }
}

async function interpret(){
  const q=($("#q").value||"").trim();
  if(!q){toast("כתוב בקשה או בחר דוגמה");return}
  const btn = $("#btnInterpret");
  if(btn){btn.disabled=true; btn.textContent="מנתח בקשה…";}

  // Tier 1 Check (0 ₪ - נתונים קיימים במערכת):
  const localAnswer = executeNaturalQuery(q);
  if (localAnswer && localAnswer.text) {

  const role = q.includes("קצין בטיחות") ? "קצין בטיחות בתעבורה" : q.includes("צי") ? "מנהל צי רכב" : "מנהל תפעול";
  const jobs = q.includes("דרושים") || q.includes("קצין בטיחות");

  const parsed = { region, industry: ind, fleet, role, count, jobs, keyword: keyword || "הובלות", source: "local" };
  S._interp = parsed;

/* ===== אלגוריתם ציון התאמת צי רכב (FLEET PROBABILITY SCORE) ===== */
function calculateFleetScore(company) {
  let score = 50; // בסיס לחברה רשומה ופעילה
  const reasons = [];

  // ענף עתיר רכבים
  const name = company.name || "";
  const desc = company.desc || "";
  if (/הובלות|משאיות|הפצה|לוגיסטיקה|שליחויות/.test(name + desc)) {
    score += 25;
    reasons.push("ענף עתיר רכב (הובלות/הפצה)");
  } else if (/שירות|טכנאי|התקנות|אחזקה/.test(name + desc)) {
    score += 15;
    reasons.push("ענף שירות שטח");
  }

  // סטטוס משפטי פעיל
  if (company.status === "פעילה") {
    score += 10;
    reasons.push("חברה פעילה ברשם החברות");
  }

  // כתובת מאומתת
  if (company.city) {
    score += 5;
    reasons.push(`מיקום מאומת: ${company.city}`);
  }

  score = Math.min(96, Math.max(45, score));
  const certainty = score >= 75 ? "e" : "n";
  const fleetVal = score >= 75 ? `כ-${Math.round(score/3)} רכבים (הערכה)` : "מספר רכבים לא אומת";

  return { score, reasons, certainty, fleetVal };
}

/* ===== ביצוע חיפוש חי עם רשם החברות הממשלתי (DATA.GOV.IL) ===== */
const SEARCH_STEPS=[
  "בדיקת מילת החיפוש",
  "שליפה מרשם החברות (data.gov.il)",
  "השוואת ח.פ. לרשימת הלידים",
  "סימון שדות חסרים כלא ידוע"
];

function registryHit(rec){
  const hp = String(rec["מספר חברה"] || "").replace(/\D/g, "");
  const name = String(rec["שם חברה"] || "").replace(/בע~מ|בע״מ|בע"מ/g, "").trim();
  if (!hp || hp.length < 5 || !name) return null;
  const cityRaw = String(rec["שם עיר"] || rec["ישוב"] || "").trim();
  const street = String(rec["שם רחוב"] || "").trim();
  const house = String(rec["מספר בית"] || "").trim();
  const purpose = String(rec["מטרת החברה"] || "").trim();
  const status = String(rec["סטטוס חברה"] || "").trim();
  return {
    no: hp,
    name,
    city: cityRaw || "לא ידוע",
    addr: street ? `${street}${house ? " " + house : ""}${cityRaw ? ", " + cityRaw : ""}` : "לא ידוע",
    ind: purpose ? purpose.slice(0, 120) : "לא ידוע",
    status: status || "לא ידוע",
    incorporated: String(rec["תאריך התאגדות"] || "").trim() || "לא ידוע",
    addrKnown: !!street
  };
}
