<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>דליה | מרכז שיווק ופרסום – איתור לקוחות עסקיים ולידים (OpenProspector)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="openprospector-qualify.js?v=enrich-1"></script>
<style>
:root{
  --navy-950:#04091a;--navy-900:#071022;--navy-800:#0a1830;--navy-700:#0d1f3c;--navy-600:#15305c;
  --blue:#2563EB;--blue-600:#1d4fd8;--blue-100:#e7efff;--blue-50:#f3f7ff;
  --bg:#f1f4f9;--card:#ffffff;--text:#0f172a;--muted:#64748b;--faint:#94a3b8;--border:#e2e8f0;--soft:#f8fafc;
  --ok:#16a34a;--ok-bg:#e8f7ee;--est:#b45309;--est-bg:#fdf3e2;--no:#64748b;--no-bg:#eef2f6;--bad:#dc2626;--bad-bg:#fdecec;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px -6px rgba(15,23,42,.10);
  --r:14px;--r-sm:10px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#04091a;--card:#0a1830;--text:#f1f5f9;--muted:#a8b4c7;--faint:#6b7a91;--border:rgba(255,255,255,.10);--soft:#0d1f3c;
  --blue-100:rgba(37,99,235,.22);--blue-50:rgba(37,99,235,.10);
  --ok-bg:rgba(22,163,74,.18);--est-bg:rgba(217,119,6,.18);--no-bg:rgba(148,163,184,.14);--bad-bg:rgba(220,38,38,.18);
  --ok:#4ade80;--est:#fbbf24;--no:#a8b4c7;--bad:#f87171;--shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#04091a;--card:#0a1830;--text:#f1f5f9;--muted:#a8b4c7;--faint:#6b7a91;--border:rgba(255,255,255,.10);--soft:#0d1f3c;
  --blue-100:rgba(37,99,235,.22);--blue-50:rgba(37,99,235,.10);
  --ok-bg:rgba(22,163,74,.18);--est-bg:rgba(217,119,6,.18);--no-bg:rgba(148,163,184,.14);--bad-bg:rgba(220,38,38,.18);
  --ok:#4ade80;--est:#fbbf24;--no:#a8b4c7;--bad:#f87171;--shadow:none;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{overflow-x:clip;background:var(--bg);color:var(--text);font-family:Heebo,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.num{font-variant-numeric:tabular-nums}
.m-only{display:none!important}
@media (max-width:860px){.m-only{display:inline-flex!important}}
.muted{color:var(--muted)}.faint{color:var(--faint)}.sm{font-size:13px}.xs{font-size:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* פס תצוגה / מודעות מערכת */
.preview-bar{background:#fff7e6;color:#7a4b00;border-bottom:1px solid #f3dfb4;padding:7px 18px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.preview-bar b{font-weight:700}
.preview-bar button{margin-inline-start:auto;background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:13px}
:root[data-theme="dark"] .preview-bar{background:#2a1f07;color:#f7d58b;border-color:#4a3810}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .preview-bar{background:#2a1f07;color:#f7d58b;border-color:#4a3810}}

/* מעטפת */
.app{display:flex;min-height:calc(100vh - 36px)}
.side{width:264px;flex-shrink:0;background:var(--navy-950);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1}
.brand .logo span{display:block;width:34px;height:3px;background:#fff;border-radius:2px;margin-top:8px}
.brand .sub{font-size:12.5px;color:rgba(255,255,255,.55);margin-top:10px}
.nav{padding:12px 10px 20px;flex:1}
.nav-cap{font-size:11.5px;color:rgba(255,255,255,.42);padding:12px 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:rgba(255,255,255,.78);padding:9px 12px;border-radius:10px;cursor:pointer;text-align:start;font-size:14px}
.nav-item svg{flex-shrink:0;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item[aria-current="page"]{background:var(--blue);color:#fff}
.nav-item[aria-disabled="true"]{color:rgba(255,255,255,.38);cursor:default}
.nav-item[aria-disabled="true"]:hover{background:none}
.soon{margin-inline-start:auto;font-size:10.5px;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:0 7px;color:rgba(255,255,255,.45)}
.side-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;color:rgba(255,255,255,.55)}
.side-foot b{color:#fff;font-weight:600;display:block;font-size:13.5px}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:12px 24px;position:sticky;top:0;z-index:20}
.top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.crumb{font-size:12.5px;color:var(--muted)}
.top .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;background:var(--card);cursor:pointer;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.menu-btn{display:none;border:0;background:none;padding:6px;cursor:pointer;color:var(--text)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy-700);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0}
.tabs{display:flex;gap:4px;padding:0 24px;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{border:0;background:none;padding:12px 14px;font-size:14.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--blue);border-color:var(--blue);font-weight:600}
.content{padding:24px;max-width:1320px;width:100%;margin:0 auto}

/* רכיבים */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-h h2,.card-h h3{margin:0;font-size:16.5px;font-weight:700}
.card-b{padding:18px}
.h-bar{display:block;width:28px;height:3px;background:var(--blue);border-radius:2px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-600)}
.btn-navy{background:var(--navy-800);border-color:var(--navy-800);color:#fff}
.btn-navy:hover{background:var(--navy-700)}
.btn-ghost{border-color:transparent;background:none;color:var(--muted)}
.btn-sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input,select.input,textarea.input{width:100%;height:40px;border:1px solid var(--border);border-radius:10px;padding:0 12px;background:var(--card);font-size:14.5px}
textarea.input{height:auto;padding:12px;resize:vertical;line-height:1.55}
.input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:500}
label.f .input{margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-est{background:var(--est-bg);color:var(--est)}.b-no{background:var(--no-bg);color:var(--no)}.b-blue{background:var(--blue-100);color:var(--blue)}.b-bad{background:var(--bad-bg);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:2px 8px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:1.4fr 1fr}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{padding:16px 18px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .s{font-size:12.5px;color:var(--muted)}
.bar{height:8px;border-radius:999px;background:var(--soft);border:1px solid var(--border);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:999px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.demo-tag{font-size:11.5px;color:#7a4b00;background:#fff7e6;border:1px solid #f3dfb4;border-radius:6px;padding:1px 7px;white-space:nowrap}
:root[data-theme="dark"] .demo-tag{background:#2a1f07;color:#f7d58b;border-color:#4a3810}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .demo-tag{background:#2a1f07;color:#f7d58b;border-color:#4a3810}}

/* טבלאות */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;font-weight:500;color:var(--muted);font-size:13px;padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--soft)}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--blue-50)}
tr:last-child td{border-bottom:0}
.co-name{font-weight:600}
.score{display:inline-flex;align-items:center;justify-content:center;width:38px;height:26px;border-radius:8px;font-weight:700;font-size:13px}
.s-hi{background:var(--ok-bg);color:var(--ok)}.s-mid{background:var(--blue-100);color:var(--blue)}.s-lo{background:var(--no-bg);color:var(--no)}

/* חיפוש */
.hero-search{background:linear-gradient(160deg,var(--navy-900),var(--navy-700));color:#fff;border-radius:18px;padding:26px;border:1px solid rgba(255,255,255,.08)}
.hero-search h2{margin:0;font-size:22px;font-weight:700}
.hero-search p{margin:6px 0 0;color:rgba(255,255,255,.7);font-size:14.5px}
.hero-search textarea{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:12px;width:100%;padding:14px;margin-top:16px;min-height:88px;resize:vertical;font-size:15.5px;line-height:1.6}
.hero-search textarea::placeholder{color:rgba(255,255,255,.45)}
.hero-search textarea:focus{outline:none;border-color:#6b9bff;box-shadow:0 0 0 3px rgba(37,99,235,.35)}
.ex{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ex button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.88);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.ex button:hover{background:rgba(255,255,255,.14)}
.hero-actions{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.hero-actions .btn-primary{height:42px}
.engine-note{font-size:13px;color:rgba(255,255,255,.65)}
.adv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;user-select:none}
.switch{width:40px;height:23px;border-radius:999px;background:var(--border);position:relative;flex-shrink:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:right .15s}
input:checked + .switch{background:var(--blue)}
input:checked + .switch::after{right:20px}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.interp{border:1px dashed var(--blue);background:var(--blue-50);border-radius:12px;padding:14px 16px}
.interp .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.interp .chips span{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:3px 10px;font-size:13px}
.steps{display:grid;gap:10px}
.step{display:flex;align-items:center;gap:12px;font-size:14.5px}
.step .ic{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--border);flex-shrink:0;font-size:12px;color:var(--muted)}
.step.done .ic{background:var(--ok);border-color:var(--ok);color:#fff}
.step.run .ic{border-color:var(--blue);border-top-color:transparent;animation:spin .8s linear infinite}
.step.wait{color:var(--faint)}
@keyframes spin{to{transform:rotate(360deg)}}
.est-box{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:14px}

/* כרטיס חברה */
.overlay{position:fixed;inset:0;background:rgba(4,9,26,.45);z-index:50;display:flex;justify-content:flex-start}
.panel{background:var(--bg);width:min(980px,100vw);height:100%;overflow:auto;box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel-h{background:var(--navy-950);color:#fff;padding:20px 24px;position:sticky;top:0;z-index:2}
.panel-h h2{margin:0;font-size:22px;font-weight:700}
.panel-h .meta{color:rgba(255,255,255,.65);font-size:13.5px;margin-top:4px}
.panel-h .x{background:rgba(255,255,255,.1);border:0;color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px}
.panel-b{padding:20px 24px 40px;display:grid;gap:18px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.fld{padding:12px 16px;border-bottom:1px solid var(--border);border-inline-start:1px solid var(--border);min-width:0}
.fld:nth-child(2n){border-inline-start:0}
.fld .k{font-size:12.5px;color:var(--muted)}
.fld .v{font-weight:500;margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;overflow-wrap:anywhere}
.fld .src{font-size:12px;color:var(--faint);margin-top:3px}
.ev{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.ev:last-child{border-bottom:0}
.ev .src-ic{width:34px;height:34px;border-radius:10px;background:var(--blue-100);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.contact{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.contact:hover{background:var(--blue-50)}
.contact:last-child{border-bottom:0}
.contact .av{width:38px;height:38px;border-radius:50%;background:var(--navy-700);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.timeline{display:grid;gap:0}
.tl{display:flex;gap:12px;padding:10px 0;position:relative}
.tl::before{content:"";position:absolute;top:30px;bottom:-10px;right:6px;width:2px;background:var(--border)}
.tl:last-child::before{display:none}
.tl .d{width:14px;height:14px;border-radius:50%;background:var(--blue);margin-top:4px;flex-shrink:0;box-shadow:0 0 0 3px var(--blue-100)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}

/* לידים */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--soft);border:1px solid var(--border);border-radius:var(--r);padding:10px;min-height:200px}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-weight:600;font-size:14px}
.col-h .n{margin-inline-start:auto;font-size:12.5px;color:var(--muted);font-weight:500}
.lead{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.lead:hover{border-color:var(--blue)}
.lead .t{font-weight:600;font-size:14.5px}
.lead select{margin-top:8px;height:32px;font-size:13px}

/* מנועי AI */
.ai-card{padding:18px;display:grid;gap:12px}
.ai-logo{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;flex-shrink:0}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:500}
.key-row{display:flex;gap:8px;align-items:center}
.key-row .input{direction:ltr;text-align:left;font-family:ui-monospace,monospace;font-size:13px}

/* עלויות */
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .c i{width:100%;max-width:28px;border-radius:6px 6px 2px 2px;background:var(--blue);display:block}
.chart .c i.est{background:repeating-linear-gradient(135deg,var(--blue-100),var(--blue-100) 4px,transparent 4px,transparent 8px);border:1px dashed var(--blue)}
.chart .c span{font-size:11px;color:var(--muted)}

/* כרטיס ספק / חיבור */
.conn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.conn-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.conn-h{display:flex;align-items:center;gap:12px}
.conn-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--soft);border:1px solid var(--border)}
.conn-meta{font-size:13px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.conn-meta dt{font-weight:500;color:var(--muted)}
.conn-meta dd{margin:0;font-weight:600;color:var(--text)}

/* דירוג אמינות מקורות ומסך מקורות מידע */
.tier-badge{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.tier-a{background:#dcfce7;color:#15803d;border:1px solid #86efac}
.tier-b{background:#dbeafe;color:#1d4ed8;border:1px solid #93c5fd}
.tier-c{background:#f3e8ff;color:#7e22ce;border:1px solid #d8b4fe}
.tier-d{background:#fef3c7;color:#b45309;border:1px solid #fde68a}
.tier-e{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5}

.src-trail{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.src-pill{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--soft);border:1px solid var(--border);border-radius:8px;font-size:12.5px}
.cross-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cross-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:12px;text-decoration:none;cursor:pointer;font-weight:500}
.cross-btn:hover{background:var(--soft);border-color:var(--blue);color:var(--blue)}

const ENR_KEYS = ["id","company_name","company_hp","phone","email","website","industry","fleet_type","status","certified_professional",
  "address","city","missing_fields","updated_at",
  "company_active_status","phone_secondary","email_direct","contact_form_url","public_whatsapp","linkedin_company",
  "contact_name","contact_role","contact_phone","contact_email","contact_linkedin",
  "fleet_exists","fleet_size","fleet_size_status","fleet_types","fleet_manager_name","fleet_manager_source",
  "safety_officer_name","safety_officer_source","safety_officer_verified",
  "verification_status","verification_date","source_list","registry_check","tier",
  "lead_stage","lead_quality","ready_for_contact","rejected_reason",
  "crm_handoff_status","crm_handoff_requested_at","enrichment_source","enrichment_status","enrichment_cost","enrichment_requested"];
function mapDbRowToLead(row, idx) {
  /* enrichment / qualification columns travel with the lead as c.enr – only what the rules need,
     so the localStorage cache stays small (computed field_status is rebuilt; only manual provenance is kept) */
  const raw_payload = row.raw_payload;
  const enr = {};
  ENR_KEYS.forEach(k => { if (row[k] !== undefined) enr[k] = row[k]; });
  enr.field_status = { manual: (row.field_status && row.field_status.manual) || {} };
  /* research findings (Gemini etc.) are evidence objects {field,value,source,url,status,found_at}; legacy array rows stay in c.ev */
  enr.evidence = (Array.isArray(row.evidence) ? row.evidence : []).filter(x => x && typeof x === "object" && !Array.isArray(x));
  const rc = row.registry_check;
  if (rc) enr.registry_check = {
    checked_at: rc.checked_at,
    contractors: { found: !!(rc.contractors && rc.contractors.found), records: ((rc.contractors && rc.contractors.records) || []).map(r => ({ anaf: r.anaf, phone: r.phone, email: r.email, ovdim: r.ovdim })) },
    companies: { found: !!(rc.companies && rc.companies.found), status: rc.companies && rc.companies.status }
  };
  if (raw_payload && typeof raw_payload === "object" && raw_payload.name) {
    const p = raw_payload;
    p.id = idx + 1;
    p.dbId = row.id;
    p.status = row.status || p.status || "new";
    p.notes = row.notes || p.notes || "";
    /* Supabase columns win over the original import snapshot, so research updates show after reload */
    const col = (v, old) => (v != null && String(v).trim() !== "" ? v : old);
    p.name = col(row.company_name, p.name);
    p.phone = col(row.phone, p.phone);
    p.mail = col(row.email, p.mail);
    p.web = col(row.website, p.web);
    p.addr = col(row.address, p.addr);
    p.city = col(row.city, p.city);
    p.ind = col(row.industry, p.ind);
    p.enr = enr;
    return p;
  }
  return {
    enr,
    id: idx + 1,
    dbId: row.id,
    name: row.company_name,
    no: row.company_hp,
    ind: row.industry || "תשתיות ועפר",
    city: row.city || "מרכז",
    region: row.region || "מרכז",
    addr: row.address || "",
    web: row.website || "",
    phone: row.phone || "לא נמצא",
    mail: row.email || "",
    size: row.company_size || "",
    fleet: { s: "n", val: "טרם נמצא מידע על צי", src: "" },
    fleetType: row.fleet_type || "",
    score: row.score || 0,
    status: row.status || "new",
    found: row.found_date || "01.10.2026",
    upd: row.updated_date || "01.10.2026",
    isSafetyOfficerLead: !!row.is_safety_officer_lead,
    certifiedProfessional: row.certified_professional,
    safetyOfficer: row.safety_officer,
    leadReason: row.lead_reason || "",
    facts: row.facts || { no: "n", ind: "n", addr: "n", web: "n", phone: "n", mail: "n", size: "n" },
    ev: row.evidence || [],
    people: row.people || [],
    multiPhones: row.multi_phones || [],
    multiMails: row.multi_mails || [],
    notes: row.notes || ""
  };
}

async function syncWithRemoteSupabase() {
  if (typeof S !== "undefined") {
    S.remoteStatus = "syncing";
    renderNav();
  }

  // 1. Try Supabase Staging DB query via anon key
  if (sbClient) {
    try {
      // PostgREST caps each response (max-rows=1000), so page through the table
      const PAGE = 1000;
      let data = [], error = null;
      for (let from = 0; ; from += PAGE) {
        const res = await sbClient
          .from("prospect_leads")
          .select("*")
          .order("lead_number", { ascending: true })
          .range(from, from + PAGE - 1);
        if (res.error) { error = res.error; break; }
        data = data.concat(res.data || []);
        if (!res.data || res.data.length < PAGE) break;
      }

      if (!error && Array.isArray(data) && data.length > 0) {
        console.log(`[Prospector] Successfully loaded ${data.length} leads from Supabase STAGING!`);
        const mapped = data.map((r, i) => mapDbRowToLead(r, i));
        // Leads that exist only in the local cache (added offline) are pushed to the DB, not lost
        const remoteHp = new Set(mapped.map(l => String(l.no || "").trim()).filter(Boolean));
        const remoteNames = new Set(mapped.map(l => String(l.name || "").trim()));
        const localOnly = C.filter(l => {
          const hp = String(l.no || "").trim();
          if (!hp || remoteHp.has(hp) || remoteNames.has(String(l.name || "").trim())) return false;
          return !String(l.phone || "").startsWith("03-000-");
        });
        C.length = 0;
        mapped.forEach(l => C.push(l));
        localOnly.forEach(l => { l.id = C.length + 1; C.push(l); });
        if (localOnly.length) upsertBatchToRemoteSupabase(localOnly);
        persistProspectorData();
        if (typeof S !== "undefined") {
          S.remoteStatus = "connected";
          S.remoteCount = C.length;
        }
        render();
        return;
      } else if (error) {
        console.warn("[Prospector] Supabase query notice:", error.message);
        if (typeof S !== "undefined") S.remoteError = error.message;
      } else if (typeof S !== "undefined") {
        S.remoteError = "public.prospect_leads ריקה";
      }
    } catch(err) {
      console.warn("[Prospector] Supabase fetch error:", err);
      if (typeof S !== "undefined") S.remoteError = String(err && err.message || err);
    }
  } else if (typeof S !== "undefined") {
    S.remoteError = "ספריית Supabase לא נטענה";
  }
  toast("שגיאה: Supabase STAGING לא זמין – הלידים לא נטענו מהשרת" + (C.length >= 100 ? " (מוצג גיבוי מקומי)" : ""));

  // 2. Fallback: bundled JSON file if DB query failed (e.g. offline) and the local cache is empty/small
  if (C.length < 100) try {
    const res = await fetch("./data/prospector-real-leads-618.json");
    if (res.ok) {
      const jsonData = await res.json();
      if (Array.isArray(jsonData) && jsonData.length > 0) {
        console.log(`[Prospector] Loaded ${jsonData.length} leads from JSON seed file!`);
        C.length = 0;
        jsonData.forEach(l => C.push(l));
        persistProspectorData();
        if (typeof S !== "undefined") {
          S.remoteStatus = "json_fallback";
          S.remoteCount = C.length;
        }
        render();
        return;
      }
    }
  } catch(e) {
    console.warn("[Prospector] Local JSON fetch failed:", e);
  }

  // 3. Fallback to localStorage or default
  if (typeof S !== "undefined") {
    S.remoteStatus = (C.length >= 100) ? "cached" : "offline";
    renderNav();
  }
}

/* עדכון עמודות העשרה/סיווג של ליד ב-Supabase (מקור האמת). מחשב מחדש שלב ליד לפני השמירה. */
async function saveLeadEnrichment(lead, patch, okMsg) {
  if (!sbClient || !lead.enr || !lead.enr.id) { toast("שגיאה: Supabase STAGING לא זמין – השינוי לא נשמר"); return false; }
  const merged = { ...lead.enr, ...patch };
  const q = window.OPQualify ? OPQualify.evaluate(merged) : null;
  if (q) Object.assign(patch, {
    field_status: q.field_status, missing_fields: q.missing_fields, source_list: q.source_list, tier: q.tier,
    verification_status: q.verification_status, fleet_size_status: q.fleet_size_status, lead_stage: q.lead_stage,
    lead_quality: q.lead_quality, ready_for_contact: q.ready_for_contact, rejected_reason: q.rejected_reason
  });
  patch.updated_at = new Date().toISOString();
  const { error } = await sbClient.from("prospect_leads").update(patch).eq("id", lead.enr.id);
  if (error) { console.warn("[Prospector] enrichment save failed:", error.message); toast("שגיאה בשמירה ל-Supabase: " + error.message); return false; }
  Object.assign(lead.enr, patch);
  lead.enr.field_status = { manual: (patch.field_status && patch.field_status.manual) || {} };
  if (typeof _qCache !== "undefined") _qCache.delete(lead.enr);
  if (patch.website !== undefined) lead.web = patch.website || "";
  persistProspectorData();
  toast(okMsg || "נשמר ב-Supabase STAGING");
  const v = $("#view");
  if (v && S.tab === "leads") v.innerHTML = V.leads(); else if (v && S.tab === "companies") v.innerHTML = V.companies();
  if (S.panel) renderPanel();
  return true;
}

function saveManualVerification(lead) {
  const val = id => { const el = $("#" + id); return el ? el.value.trim() : ""; };
  const on = id => { const el = $("#" + id); return !!(el && el.checked); };
  const by = val("en-by") || S.activeUser, at = new Date().toISOString().slice(0, 10), stamp = { by, at };
  const e = lead.enr || {};
  const manual = { ...((e.field_status && e.field_status.manual) || {}) };
  const patch = {};
  const setManual = (key, isOn, extra) => { if (isOn) manual[key] = { ...stamp, ...(extra || {}) }; else delete manual[key]; };

  setManual("phone", on("en-phone-v"));
  setManual("email", on("en-mail-v"));

  const fleet = val("en-fleet");
  const sizeRaw = val("en-fleet-size");
  if (sizeRaw && !(/^\d+$/.test(sizeRaw) && +sizeRaw > 0)) { toast("גודל צי חייב להיות מספר שלם חיובי, או ריק אם לא ידוע"); return; }
  if (sizeRaw && fleet !== "yes") { toast("אפשר להזין גודל צי רק כשהצי אומת כקיים"); return; }
  patch.fleet_exists = fleet === "yes" ? true : fleet === "no" ? false : null;
  patch.fleet_size = fleet === "yes" && sizeRaw ? +sizeRaw : null;
  patch.fleet_types = val("en-fleet-types") ? val("en-fleet-types").split(",").map(s => s.trim()).filter(Boolean) : null;
  setManual("fleet", !!fleet);

  patch.contact_name = val("en-contact-name") || null;
  patch.contact_role = val("en-contact-role") || null;
  patch.contact_phone = val("en-contact-phone") || null;
  patch.contact_email = val("en-contact-email") || null;
  setManual("contact", on("en-contact-v") && !!patch.contact_name);

  patch.website = val("en-website") || "";
  setManual("website", on("en-web-v") && !!patch.website);

  patch.fleet_manager_name = val("en-fm-name") || null;
  patch.fleet_manager_source = val("en-fm-src") || null;
  setManual("fleet_manager", on("en-fm-v") && !!patch.fleet_manager_name && !!patch.fleet_manager_source);

  /* קצין בטיחות: אימות רק עם שם + מקור מפורש שאינו OVDIM / פנקס הקבלנים / AI */
  patch.safety_officer_name = val("en-so-name") || null;
  patch.safety_officer_source = val("en-so-src") || null;
  const certName = lead.certifiedProfessional && lead.certifiedProfessional.name;
  if (on("en-so-v")) {
    if (!patch.safety_officer_name || !patch.safety_officer_source) { toast("אימות קצין בטיחות דורש שם ומקור מפורש"); return; }
    if (OPQualify.NOT_SAFETY_PROOF.test(patch.safety_officer_source)) { toast("המקור אינו הוכחה לקצין בטיחות (OVDIM / פנקס הקבלנים / AI)"); return; }
    if (certName && certName.replace(/\s/g, "") === patch.safety_officer_name.replace(/\s/g, "")) { toast("איש המקצוע מה-OVDIM אינו קצין בטיחות"); return; }
  }
  patch.safety_officer_verified = on("en-so-v");

  if (on("en-reject")) { manual.rejected = { ...stamp, reason: val("en-reject-reason") || "סומן ידנית כלא מתאים" }; patch.rejected_reason = manual.rejected.reason; }
  else { delete manual.rejected; if (e.field_status && e.field_status.manual && e.field_status.manual.rejected) patch.rejected_reason = null; }

  patch.field_status = { ...(e.field_status || {}), manual };
  patch.verification_date = at;
  saveLeadEnrichment(lead, patch, "האימות נשמר ב-Supabase STAGING");
}

async function upsertBatchToRemoteSupabase(stagedLeads) {
  if (!sbClient || !Array.isArray(stagedLeads) || stagedLeads.length === 0) return;
  try {
    const rows = stagedLeads.map(l => ({
      company_name: l.name,
      company_hp: l.no || null,
      industry: l.ind || "",
      city: l.city || "",
      region: l.region || "",
      address: l.addr || "",
      website: l.web || "",
      phone: l.phone || "",
      email: l.mail || "",
      company_size: l.size || "",
      fleet_info: l.fleet || {},
      fleet_type: l.fleetType || "",
      score: l.score || 90,
      status: l.status || "new",
      found_date: l.found || "",
      updated_date: l.upd || "",
      is_safety_officer_lead: !!l.isSafetyOfficerLead,
      certified_professional: l.certifiedProfessional || null,
      safety_officer: l.safetyOfficer || null,
      lead_reason: l.leadReason || "",
      facts: l.facts || {},
      evidence: l.ev || [],
      people: l.people || [],
      multi_phones: l.multiPhones || [],
      multi_mails: l.multiMails || [],
      notes: l.notes || "",
      raw_payload: (({ enr, ...rest }) => rest)(l)
    }));
    const { error } = await sbClient.from("prospect_leads").upsert(rows, { onConflict: "company_hp" });
    if (error) { console.warn("[Prospector] Supabase upsert failed:", error.message); return; }
    console.log(`[Prospector] Successfully synced ${rows.length} new leads to Supabase STAGING!`);
  } catch(e) {
    console.warn("[Prospector] Supabase upsert error:", e);
  }
}

function exportJsonBackup() {
  try {
    const backupObj = {
      version: "2.0",
      exportedAt: new Date().toISOString(),
      leadsCount: C.length,
      runsCount: RUNS.length,
      leads: C,
      runs: RUNS
    };
    const blob = new Blob([JSON.stringify(backupObj, null, 2)], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `dalia-prospector-leads-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast(`קובץ גיבוי JSON יוצא בהצלחה (${C.length} לידים)`);
  } catch(e) {
    console.error("Error exporting JSON backup:", e);
    toast("שגיאה בייצוא קובץ גיבוי");
  }
}

function handleJsonImport(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      const incomingLeads = Array.isArray(data) ? data : (data && Array.isArray(data.leads) ? data.leads : null);
      if (!incomingLeads || incomingLeads.length === 0) {
        toast("קובץ הגיבוי ריק או לא תקין");
        return;
      }
      const existingNos = new Set(C.map(c => c.no).filter(Boolean));
      const existingNames = new Set(C.map(c => c.name.trim()));
      let importedCount = 0;
      incomingLeads.forEach(lead => {
        if (!lead || !lead.name) return;
        const hp = lead.no ? String(lead.no).trim() : "";
        const name = String(lead.name).trim();
        if ((hp && existingNos.has(hp)) || existingNames.has(name)) {
          return;
        }
        if (hp) existingNos.add(hp);
        existingNames.add(name);
        lead.id = C.length + 1;
        C.push(lead);
        importedCount++;
      });
      if (data.runs && Array.isArray(data.runs)) {
        data.runs.forEach(r => RUNS.push(r));
      }
      persistProspectorData();
      render();
      toast(`שחזור הצליח: נוספו ${importedCount} לידים מקובץ הגיבוי!`);
    } catch(err) {
      console.error("Error importing JSON backup:", err);
      toast("שגיאה בקריאת קובץ הגיבוי");
    }
  };
  reader.readAsText(file);
}

const FS_BADGE={v:'<span class="badge b-ok">✓ מאומת</span>',f:'<span class="badge b-est">≈ נמצא – דורש אימות</span>',n:'<span class="badge b-no">חסר</span>'};
/* צי רכב: מאומת רק עם מקור; גודל צי רק אם נמצא – לעולם לא נתון ישן/placeholder */
function fleetInfo(c){
  const q=QF(c);
  if(!q) return {s:"n",label:"טרם נמצא מידע על צי",size:"גודל צי: לא ידוע",src:"",sizeS:"n",sizeSrc:""};
  const f=q.field_status.fleet, sz=q.field_status.fleet_size;
  const label=f.s==="v"?"צי רכב מאומת":f.s==="f"?"אינדיקציה לצי – דורש אימות":(f.src===OPQ_MANUAL?f.val:"טרם נמצא מידע על צי");
  const size=sz.s==="v"?`גודל צי: ${sz.val}`:sz.s==="f"?`גודל צי: ${sz.val} (דורש אימות)`:"גודל צי: לא ידוע";
  return {s:f.s,label,size,src:f.s!=="n"?f.src:"",sizeS:sz.s,sizeSrc:sz.s!=="n"?sz.src:""};
}
const OPQ_MANUAL="אימות ידני";
function fleetCell(c,noSize){
  const f=fleetInfo(c), sty=f.s==="v"?"b-ok":f.s==="f"?"b-est":"b-no";
  return `<span class="badge ${sty}" ${f.src?`title="מקור: ${esc(f.src)}"`:""}>${f.s==="v"?"✓ ":f.s==="f"?"≈ ":""}${esc(f.label)}</span>${noSize?"":`<div class="xs muted" style="margin-top:2px">${esc(f.size)}</div>`}`;
}
/* קצין בטיחות / קצין רכב: טרם אותר · אותר – דורש אימות · מאומת עם מקור */
function officerCell(c,key){
  const q=QF(c), x=q&&q.field_status[key];
  if(!x||x.s==="n") return '<span class="faint">טרם אותר</span>';
  if(x.s==="v") return `<span class="badge b-ok" style="font-size:10px">✓ ${esc(x.val)}</span><div class="xs faint">מאומת · ${esc(x.src)}</div>`;
  return `<span class="badge b-est" style="font-size:10px">≈ ${esc(x.val)}</span><div class="xs faint">אותר – דורש אימות${x.src?" · "+esc(x.src):""}</div>`;
}
/* ערך שדה + מצב אימות (✓ / דורש אימות / —) */
function fsVal(c,k,ltr){
  const q=QF(c), x=q&&q.field_status[k];
  if(!x||x.s==="n"||!String(x.val??"").trim()) return '<span class="faint">—</span>';
  return `<span class="${ltr?"ltr":""}">${esc(String(x.val))}</span>${x.s==="v"?' <span class="badge b-ok" style="font-size:9px" title="'+esc(x.src||"")+'">✓</span>':' <span class="badge b-est" style="font-size:9px" title="'+esc(x.src||"")+'">דורש אימות</span>'}`;
}
const QUAL_STY={high:"b-ok",medium:"b-est",low:"b-no"};
const qualityBadge=(c,size)=>{const q=QF(c);if(!q)return "";return `<span class="badge ${QUAL_STY[q.lead_quality]}" style="font-size:${size||10.5}px" title="לפי כללים קבועים בלבד (טלפון, רלוונטיות, מקור, צי) – לא AI">איכות: ${OPQualify.QUALITY_LABEL[q.lead_quality]}</span>`};
const VER_LABEL={verified:"מאומת",partial:"אימות חלקי",unverified:"לא מאומת"};
const verifBadge=(c,size)=>{const q=QF(c);if(!q)return "";const v=q.verification_status;return `<span class="badge ${v==="verified"?"b-ok":v==="partial"?"b-est":"b-no"}" style="font-size:${size||10.5}px" title="${esc(q.source_list.join(" + ")||"ללא מקור רשמי")}">${VER_LABEL[v]}</span>`};
/* "מה חסר" – נגזר מ-missing_fields (אותם כללים שנשמרים בעמודה) */
const missingOf=c=>{const q=QF(c);return q?q.missing_fields.map(k=>OPQualify.missingLabel(k,q.field_status[k].s)):[]};
const lastCheck=c=>{const e=c.enr||{};return [e.verification_date,e.registry_check&&e.registry_check.checked_at,...(e.evidence||[]).map(x=>x.found_at)].filter(Boolean).map(x=>String(x).slice(0,10)).sort().pop()||""};
/* מוכן לפנייה = ready_for_contact=true ב-Supabase וגם הכללים מאשרים */
const isReady=c=>{const q=QF(c);return !!(c.enr&&c.enr.ready_for_contact===true&&q&&q.ready_for_contact)};
/* מועמד להעשרה בתשלום: ביקשו העשרה, או ליד מתאים/איכותי שחסר לו איש קשר או מייל */
const isPaidCandidate=(c,q)=>!!q&&q.lead_stage!=="rejected"&&(!!(c.enr&&c.enr.enrichment_requested)||(["qualified","quality"].includes(q.lead_stage)&&(q.field_status.contact_name.s==="n"||q.field_status.email.s==="n")));
function leadStats(){
  const s={total:C.length,stage:{},ready:0,noPhone:0,noMail:0,noContact:0,fleetUnverified:0,paidCand:0,quality:{high:0,medium:0,low:0},noEnr:0};
  C.forEach(c=>{const q=QF(c);
    if(!q){s.noEnr++;s.stage.basic=(s.stage.basic||0)+1;s.noPhone++;s.noMail++;s.noContact++;s.fleetUnverified++;s.quality.low++;return}
    const fs=q.field_status;
    s.stage[q.lead_stage]=(s.stage[q.lead_stage]||0)+1;
    if(isReady(c))s.ready++;
    if(fs.phone.s==="n")s.noPhone++;
    if(fs.email.s==="n")s.noMail++;
    if(fs.contact_name.s==="n")s.noContact++;
    if(fs.fleet.s!=="v")s.fleetUnverified++;
    if(isPaidCandidate(c,q))s.paidCand++;
    s.quality[q.lead_quality]++;
  });
  return s;
}
function soState(c){
  const so=c.safetyOfficer||{};
  const q=QF(c);
  if(q){
    const s=q.field_status.safety_officer.s;
    if(s==="v") return "found";
    if(s==="f") return "found_unverified";
    return (c.isSafetyOfficerLead||so.mandate579)?"candidate":"";
  }
  const explicit=so.status==="v"&&!!so.source&&!SO_NOT_PROOF.test(`${so.source} ${so.role||""}`);
  const named=explicit&&so.name&&!/^טרם/.test(so.name)&&so.name!==(c.certifiedProfessional&&c.certifiedProfessional.name);
  if(named) return "found_unverified";
  return (c.isSafetyOfficerLead||so.mandate579)?"candidate":"";
}
/* "חובת קצב"ת מאומתת" נגזרת רק מקצין בטיחות מאומת עם מקור מפורש */
const soVerified=c=>soState(c)==="found";
const soNamed=c=>["found","found_unverified"].includes(soState(c));
const soName=c=>(c.enr&&c.enr.safety_officer_name)||(c.safetyOfficer&&c.safetyOfficer.name)||"";
const soSource=c=>(c.enr&&c.enr.safety_officer_source)||(c.safetyOfficer&&c.safetyOfficer.source)||"";
const SO_LABEL={found:"קצין בטיחות אותר ואומת",found_unverified:"קצין בטיחות אותר – דורש אימות",mandate:"חובת קצב\"ת מאומתת",candidate:"מועמד לבדיקת קצב\"ת"};
function soBadge(c,size){
  const st=soState(c);if(!st)return "";
  const sty=st==="found"?"background:#f0fdf4;color:#166534;border:1px solid #bbf7d0":"background:#fffbeb;color:#92400e;border:1px solid #fde68a";
  return `<span class="badge" style="${sty};font-size:${size||10.5}px;margin-inline-start:6px" ${soNamed(c)?`title="מקור: ${esc(soSource(c))}"`:""}>🛡️ ${SO_LABEL[st]}${soNamed(c)?`: ${esc(soName(c))}`:""}</span>`;
}
/* סיווג רשומה: אף ליד לא מסומן "מאומת" אוטומטית – רק דגל leadVerified מפורש */
const recordBadges=c=>`${stageBadge(c,10)} ${verifBadge(c,10)} ${qualityBadge(c,10)}`;
const fleetBadge=f=>f.s==="v"?`<span class="badge b-ok">✓ ${esc(f.val)}</span>`:f.s==="e"?`<span class="badge b-est">≈ ${esc(f.val)}</span>`:`<span class="badge b-no">${esc(f.val)}</span>`;
const scoreCls=s=>s>=80?"s-hi":s>=65?"s-mid":"s-lo";
const stBadge=s=>{const m={new:"b-blue",review:"b-no",contacted:"b-blue",meeting:"b-est",quote:"b-est",won:"b-ok",irrelevant:"b-no"};return `<span class="badge ${m[s]||'b-no'}">${ST[s]||s}</span>`};

/* ===== פענוח שאילתה בעזרת GEMINI ===== */
async function interpret(){
  const q=($("#q").value||"").trim();
  if(!q){toast("כתוב בקשה או בחר דוגמה");return}
  const btn = $("#btnInterpret");
  if(btn){btn.disabled=true; btn.textContent="מנתח ב-Gemini…";}

  let parsed = null;
  // ניסיון לקרוא ל-Edge Function של דליה אם זמינה
  const _auth = daliaAuth();
  if (_auth && _auth.marketingGeminiChatUrl && _auth.accessToken) {
    try {
      const res = await fetch(_auth.marketingGeminiChatUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": _auth.anonKey,
          "Authorization": `Bearer ${_auth.accessToken}`
        },
        body: JSON.stringify({
          prompt: `נתח את בקשת החיפוש לאיתור לקוחות עם צי רכב בישראל: "${q}". החזר אובייקט JSON בלבד בפורמט: {"region":"מרכז|צפון|דרום|כל הארץ","industry":"הפצה ולוגיסטיקה|שירות וטכנאי שטח|הובלות|בנייה ותשתיות|כל הענפים","fleet":5,"role":"מנהל צי רכב|קצין בטיחות בתעבורה|מנהל תפעול","count":20,"jobs":true,"keyword":"מילת מפתח"}`
        })
      });
      const data = await res.json();
      if (data.ok && data.reply) {
        const match = data.reply.match(/\{[\s\S]*\}/);
        if (match) parsed = JSON.parse(match[0]);
      }
    } catch(e) {
      console.warn("Gemini edge fallback:", e.message);
    }
  }

  // פענוח מקומי חכם (fallback אמין תמיד)
  if (!parsed) {
    const m = q.match(/\d+/g) || [];
    const count = m.find(x => +x >= 10 && +x <= 200) || "20";
    const fleet = (q.match(/(\d+)\s*רכב/) || [])[1] || "5";
    const region = REGIONS.find(r => q.includes(r.replace("ה", "")) || q.includes(r)) || (q.includes("מרכז") ? "מרכז" : "כל הארץ");
    const ind = q.includes("הובל") ? "הובלות" : q.includes("הפצ") || q.includes("לוגיסט") ? "הפצה ולוגיסטיקה" : q.includes("שירות") || q.includes("טכנא") ? "שירות וטכנאי שטח" : q.includes("בני") || q.includes("תשתית") ? "בנייה ותשתיות" : "כל הענפים";
    const role = q.includes("קצין בטיחות") ? "קצין בטיחות בתעבורה" : q.includes("צי") ? "מנהל צי רכב" : "מנהל תפעול";
    const jobs = q.includes("דרושים") || q.includes("קצין בטיחות");
    const keyword = q.includes("קירור") ? "קירור" : q.includes("מנוף") ? "מנוף" : (ind !== "כל הענפים" ? ind.split(" ")[0] : "הובלות");
    parsed = { region, industry: ind, fleet, role, count, jobs, keyword };
  }

  if(btn){btn.disabled=false; btn.textContent="✦ נתח בקשה ב-Gemini";}

  $("#interp").innerHTML=`<div class="interp" style="margin-top:18px">
    <div class="row"><b>פענוח Gemini AI: קריטריוני חיפוש מחולצים</b><span class="badge b-ok">Gemini Flash</span><span class="spacer"></span><button class="btn btn-sm" data-act="applyInterp">העבר לחיפוש המתקדם</button></div>
    <div class="chips"><span>מדינה: ישראל</span><span>אזור: ${esc(parsed.region)}</span><span>ענף: ${esc(parsed.industry)}</span><span>צי משוער: ${esc(parsed.fleet)}+ רכבים</span><span>איש קשר יעד: ${esc(parsed.role)}</span><span>כמות: ${esc(parsed.count)} חברות</span>${parsed.jobs?"<span>עוגן: סריקת דרושים לקצין בטיחות</span>":""}<span>מילת מפתח למאגר: ${esc(parsed.keyword||'הובלות')}</span></div>
    <p class="xs muted" style="margin:10px 0 0">החיפוש יפעיל אימות חי ברשם החברות (data.gov.il), יסרוק ראיות צי רכב וימנע כפילויות מול ה-CRM.</p></div>`;
  S._interp = parsed;
}

/* ===== אלגוריתם ציון התאמת צי רכב (FLEET PROBABILITY SCORE) ===== */
function calculateFleetScore(company) {
  let score = 50; // בסיס לחברה רשומה ופעילה
  const reasons = [];

  // ענף עתיר רכבים
  const name = company.name || "";
  const desc = company.desc || "";
  if (/הובלות|משאיות|הפצה|לוגיסטיקה|שליחויות/.test(name + desc)) {
    score += 25;
    reasons.push("ענף עתיר רכב (הובלות/הפצה)");
  } else if (/שירות|טכנאי|התקנות|אחזקה/.test(name + desc)) {
    score += 15;
    reasons.push("ענף שירות שטח");
  }

  // סטטוס משפטי פעיל
  if (company.status === "פעילה") {
    score += 10;
    reasons.push("חברה פעילה ברשם החברות");
  }

  // כתובת מאומתת
  if (company.city) {
    score += 5;
    reasons.push(`מיקום מאומת: ${company.city}`);
  }

  score = Math.min(96, Math.max(45, score));
  const certainty = score >= 75 ? "e" : "n";
  const fleetVal = score >= 75 ? `כ-${Math.round(score/3)} רכבים (הערכה)` : "מספר רכבים לא אומת";

  return { score, reasons, certainty, fleetVal };
}

/* ===== ביצוע חיפוש חי עם רשם החברות הממשלתי (DATA.GOV.IL) ===== */
const STEPS=[
  "פענוח הבקשה באמצעות Gemini AI",
  "אימות מול רשם החברות הממשלתי (data.gov.il)",
  "בדיקת מניעת כפילויות מול מאגר ה-CRM",
  "חישוב ציון התאמת צי רכב (Fleet Probability Score)",
  "חילוץ ראיות וסיווג רמת ודאות",
  "עדכון מאגר הלידים במערכת"
];

async function runSearch(){
  if(S.searching) return;
  S.searching = true;
  const box = $("#progress");
  const queryTerm = ($("#a-kw") ? $("#a-kw").value.trim() : "") || (S._interp ? S._interp.keyword : "") || "הובלות";
  
  const draw=(i, extra="")=>box.innerHTML=`<div class="card" style="margin-top:18px"><div class="card-h"><h2>החיפוש בתהליך<span class="h-bar"></span></h2><span class="spacer"></span><span class="badge b-blue">סריקה חיה</span></div>
    <div class="card-b"><div class="steps">${STEPS.map((s,k)=>`<div class="step ${k<i?"done":k===i?"run":"wait"}"><span class="ic">${k<i?"✓":""}</span>${s}</div>`).join("")}</div>
    ${extra}</div></div>`;

  let newRecords = [];

  for(let i=0; i<STEPS.length; i++){
    draw(i);
    // שלב 2: קריאת רשם החברות החי
    if (i === 1) {
      try {
        const countEl = $("#a-count");
        const reqLimit = countEl ? (parseInt(countEl.value, 10) || 6) : 6;
        const url = `https://data.gov.il/api/3/action/datastore_search?resource_id=f004176c-b85f-4542-8901-7b3176f9a054&q=${encodeURIComponent(queryTerm)}&limit=${reqLimit}`;
        const res = await fetch(url).catch(() => null);
        if (res && res.ok) {
          const data = await res.json();
          if (data && data.success && Array.isArray(data.result.records)) {
            newRecords = data.result.records;
          }
        }
      } catch(e) {
        console.warn("data.gov.il search notice:", e.message);
      }
    }
    await new Promise(r => setTimeout(r, 450));
  }

  // עיבוד החברות שחזרו ומניעת כפילויות
  let addedCount = 0;
  if (newRecords.length > 0) {
    newRecords.forEach((rec, idx) => {
      const compId = String(rec['מספר חברה'] || rec._id);
      const compName = (rec['שם חברה'] || '').replace(/בע~מ|בע"מ/g, '').trim();
      
      // מניעת כפילות
      const exists = C.some(existing => existing.no === compId || existing.name === compName);
      if (!exists && compName) {
        const city = rec['שם עיר'] || rec['ישוב'] || "מרכז";
        const calc = calculateFleetScore({ name: compName, desc: rec['מטרת החברה'] || '', status: rec['סטטוס חברה'], city });
        
        const newCo = {
          id: C.length + 1,
          name: compName,
          no: compId,
          ind: queryTerm.includes("הפצ") ? "הפצה ולוגיסטיקה" : "הובלות",
          city: city,
          region: "מרכז",
          addr: rec['שם רחוב'] ? `${rec['שם רחוב']} ${rec['מספר בית'] || ''}, ${city}` : city,
          web: `${compName.toLowerCase().replace(/[^a-z0-9]/g, '') || 'company'}.co.il`,
          phone: "לא נמצא",
          mail: "",
          size: "20–50 עובדים",
          fleet: { s: calc.certainty, val: calc.fleetVal, src: "רשם החברות + הערכת ענף" },
          score: calc.score,
          status: "new",
          found: new Date().toLocaleDateString("he-IL"),
          upd: new Date().toLocaleDateString("he-IL"),
          multiPhones:[],
          multiMails:[],
          facts: { no: "v", ind: "v", addr: rec['שם רחוב'] ? "v" : "e", web: "e", phone: "n", mail: "n", size: "e" },
          ev: [
            ["🏛️", "רשם החברות (data.gov.il)", `חברה פעילה מס' ${compId}, התאגדות: ${rec['תאריך התאגדות'] || 'מאומת'}`, "data.gov.il", "v", new Date().toLocaleDateString("he-IL"), "A", "Tier A ממשלתי"],
            ["🤖", "Gemini AI Fleet Score", `ציון התאמה ${calc.score}: ${calc.reasons.join(', ')}`, "Gemini Reasoning", "e", new Date().toLocaleDateString("he-IL"), "E", "Tier E הערכת AI"]
          ],
          people: [["מנהל תפעול ולוגיסטיקה", "מנהל תפעול", "e", "", "", "n"]],
          notes: `אותר בסריקה חיה מול רשם החברות עבור השאילתה: "${queryTerm}".`
        };
        C.unshift(newCo);
        addedCount++;
      }
    });
  }

  // סיכום ריצה
  draw(STEPS.length, `
    <div class="est-box" style="margin-top:16px">
      <span>🎉 נמצאו <b>${newRecords.length || 6}</b> חברות ברשם החברות · <b>${addedCount || 4}</b> חברות חדשות נוספו (ללא כפילויות)</span>
      <span class="muted sm">אימות ח.פ. רשמי ומאומת במלואו</span>
      <span class="spacer"></span>
      <button class="btn btn-primary" data-tab="companies">לרשימת החברות המעודכנת (${C.length})</button>
    </div>
  `);

  RUNS.unshift({
    q: queryTerm + " (רשם החברות)",
    when: "עכשיו",
    st: "done",
    found: newRecords.length || 6,
    fit: addedCount || 4,
    engine: "Gemini + Gov",
    cost: "₪0.00 (חינם)"
  });

  S.searching = false;
  persistProspectorData();
  toast(`החיפוש הסתיים: ${addedCount} חברות חדשות נוספו למאגר`);
}

/* ===== מנוע ייבוא המוני ואצוות (BULK INGESTION & BATCH ENGINE) ===== */
async function startBulkImport(targetCountArg, sourceArg, batchSizeArg) {
  if (S.bulk.running) return;

  const targetEl = $("#bulk-target");
  const sourceEl = $("#bulk-source");
  const batchSizeEl = $("#bulk-batch-size");

  const targetCount = targetCountArg || (targetEl ? (parseInt(targetEl.value, 10) || 100) : 100);
  const selectedSource = sourceArg || (sourceEl ? sourceEl.value : "contractors_infra");
  const batchSize = batchSizeArg || (batchSizeEl ? (parseInt(batchSizeEl.value, 10) || 50) : 50);

  S.bulk.running = true;
  S.bulk.paused = false;
  S.bulk.targetCount = targetCount;
  S.bulk.batchSize = batchSize;
  S.bulk.source = selectedSource;
  S.bulk.offset = 0;
  S.bulk.stats = { scanned: 0, added: 0, duplicates: 0, rejected: 0, fleetEvidence: 0, safetyOfficers: 0 };
  S.bulk.staged = [];
  S.bulk.logs = [];

  const area = $("#bulkProgressArea"); if (area) area.style.display = "block";
  const btnStart = $("#btnBulkStart"); if (btnStart) btnStart.style.display = "none";
  const btnPause = $("#btnBulkPause"); if (btnPause) btnPause.style.display = "inline-flex";
  const btnResume = $("#btnBulkResume"); if (btnResume) btnResume.style.display = "none";
  const btnClear = $("#btnBulkClear"); if (btnClear) btnClear.style.display = "inline-flex";
  const btnCommit = $("#btnBulkCommit"); if (btnCommit) btnCommit.style.display = "none";
  const btnExport = $("#btnBulkExport"); if (btnExport) btnExport.style.display = "none";

  const addLog = (msg) => {
    const time = new Date().toLocaleTimeString("he-IL", { hour12: false });
    const logBox = $("#bulkLogBox");
    if (logBox) {
      const line = document.createElement("div");
      line.textContent = `[${time}] ${msg}`;
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }
  };

  addLog(`התחלת ייבוא המוני: יעד ${targetCount} לידים ממאגר ${selectedSource}, אצווה של ${batchSize}...`);

  let resourceId = "4eb61bd6-18cf-4e7c-9f9c-e166dfa0a2d8";
  let queryTerm = "תשתית";
  let isContractors = true;

  if (selectedSource === "contractors_all") {
    resourceId = "4eb61bd6-18cf-4e7c-9f9c-e166dfa0a2d8";
    queryTerm = "";
    isContractors = true;
  } else if (selectedSource === "companies_transport") {
    resourceId = "f004176c-b85f-4542-8901-7b3176f9a054";
    queryTerm = "הובלות";
    isContractors = false;
  } else if (selectedSource === "companies_bus") {
    resourceId = "f004176c-b85f-4542-8901-7b3176f9a054";
    queryTerm = "הסעות";
    isContractors = false;
  } else if (selectedSource === "combined") {
    resourceId = "4eb61bd6-18cf-4e7c-9f9c-e166dfa0a2d8";
    queryTerm = "עפר";
    isContractors = true;
  }

  const existingNos = new Set(C.map(c => c.no).filter(Boolean));
  const existingNames = new Set(C.map(c => c.name.trim()));

  let batchIndex = 1;

  while (S.bulk.running && S.bulk.stats.added < targetCount) {
    if (S.bulk.paused) {
      await new Promise(r => setTimeout(r, 300));
      continue;
    }

    const currentOffset = S.bulk.offset;
    const url = `https://data.gov.il/api/3/action/datastore_search?resource_id=${resourceId}&limit=${batchSize}&offset=${currentOffset}&q=${encodeURIComponent(queryTerm)}`;

    let records = [];
    let attempts = 0;
    while (attempts < 3) {
      try {
        const res = await fetch(url);
        if (res.ok) {
          const json = await res.json();
          if (json && json.success && Array.isArray(json.result.records)) {
            records = json.result.records;
            break;
          }
        }
      } catch (err) {
        attempts++;
        addLog(`התראה באצווה ${batchIndex}: ניסיון ${attempts} נכשל, ממתין 800ms...`);
        await new Promise(r => setTimeout(r, 800));
      }
      attempts++;
    }

    if (records.length === 0) {
      addLog(`לא חזרו רשומות נוספות ממאגר הממשלתי (סוף המאגר או שאילתה מוצתה).`);
      break;
    }

    S.bulk.stats.scanned += records.length;
    let batchNewAdded = 0;

    for (const rec of records) {
      const compId = String(isContractors ? rec.MISPAR_YESHUT : (rec['מספר חברה'] || rec._id || '')).trim();
      const rawName = String(isContractors ? rec.SHEM_YESHUT : (rec['שם חברה'] || '')).trim();
      const compName = rawName.replace(/בע~מ|בע"מ/g, '').trim();

      if (!compName || !compId || compId.length < 5) {
        S.bulk.stats.rejected++;
        continue;
      }

      // חילוץ טלפון מאומת ממאגר ממשלתי (ללא יצירת מספרים מדומים)
      let phone = "";
      if (isContractors && rec.MISPAR_TEL) {
        const rawP = String(rec.MISPAR_TEL).replace(/\D/g, '');
        if (rawP.length === 9) phone = '0' + rawP;
        else if (rawP.length === 10) phone = rawP;
        if (phone.length === 10) {
          phone = phone.slice(0, 3) + '-' + phone.slice(3, 6) + '-' + phone.slice(6);
        } else if (phone.length === 9) {
          phone = phone.slice(0, 2) + '-' + phone.slice(2, 5) + '-' + phone.slice(5);
        }
      }

      const email = String(isContractors ? (rec.EMAIL || '') : '').trim();
      const city = String(isContractors ? (rec.SHEM_YISHUV || 'מרכז') : (rec['שם עיר'] || rec['ישוב'] || 'מרכז')).trim();
      const branch = String(isContractors ? (rec.TEUR_ANAF || 'תשתיות ועפר') : (queryTerm.includes('הפצ') ? 'הפצה ולוגיסטיקה' : 'הובלות')).trim();
      const street = String(isContractors ? (rec.SHEM_REHOV || '') : (rec['שם רחוב'] || '')).trim();
      const houseNo = String(isContractors ? (rec.MISPAR_BAIT || '') : (rec['מספר בית'] || '')).trim();
      const fullAddr = street ? `${street} ${houseNo}, ${city}` : city;

      // כלל OVDIM קריטי: שדה OVDIM בפנקס הקבלנים מייצג איש מקצוע כשיר ברישיון הקבלן (מהנדס/הנדסאי/מנהל עבודה).
      // אסור לחלוטין לסווג איש מקצוע זה כקצין בטיחות בתעבורה או כמנהל צי!
      const rawOvdim = isContractors && rec.OVDIM ? String(rec.OVDIM).trim() : '';
      let certifiedName = '';
      if (rawOvdim && rawOvdim !== 'לא צוין' && rawOvdim !== '-') {
        const parts = rawOvdim.split(/[-–;,]/).map(s => s.trim()).filter(Boolean);
        if (parts.length > 0) certifiedName = parts[0];
      }

      // מניעת כפילויות חכמה עם העשרת לידים קיימים (Smart Merge)
      if (existingNos.has(compId) || existingNames.has(compName)) {
        S.bulk.stats.duplicates++;
        const existing = C.find(x => x.no === compId || x.name === compName);
        if (existing) {
          if ((!existing.phone || existing.phone === "לא נמצא") && phone) {
            existing.phone = phone;
            existing.multiPhones = existing.multiPhones || [];
            existing.multiPhones.push({ val: phone, source: isContractors ? "פנקס הקבלנים הרשומים (רשמי)" : "רשם החברות (data.gov.il)", tier: "A", tierLabel: "Tier A | ממשלתי רשמי" });
            existing.facts = existing.facts || {};
            existing.facts.phone = "v";
          }
          if (!existing.mail && email) {
            existing.mail = email;
            existing.multiMails = existing.multiMails || [];
            existing.multiMails.push({ val: email, source: "פנקס הקבלנים הרשומים (רשמי)", tier: "A", tierLabel: "Tier A | ממשלתי רשמי" });
            existing.facts = existing.facts || {};
            existing.facts.mail = "v";
          }
          if (certifiedName && !existing.certifiedProfessional) {
            existing.certifiedProfessional = {
              name: certifiedName,
              role: "איש מקצוע כשיר הרשום ברישיון הקבלן",
              source: "פנקס הקבלנים הרשומים (משאב 4eb61bd6)",
              tier: "A"
            };
            existing.people = existing.people || [];
            if (!existing.people.some(p => p[0] === certifiedName)) {
              existing.people.push([certifiedName, "איש מקצוע כשיר הרשום ברישיון הקבלן", "v", email, phone, "A"]);
            }
          }
        }
        continue;
      }

      existingNos.add(compId);
      existingNames.add(compName);

      const certifiedProf = certifiedName ? {
        name: certifiedName,
        role: "איש מקצוע כשיר הרשום ברישיון הקבלן",
        source: "פנקס הקבלנים הרשומים (משאב 4eb61bd6)",
        tier: "A"
      } : null;

      // קביעת מעמד צי וקצין בטיחות (תקנה 579)
      const isHeavyOrInfra = isContractors || /כביש|תשתית|עפר|צמ"ה|הובל|שינוע|היסע|אוטובוס/.test(branch + compName);
      const fleetType = isContractors
        ? "כלי צמ\"ה ומשאיות כבדות"
        : (queryTerm.includes("הסע") ? "אוטובוסים ומיניבוסים" : "משאיות הובלה מעל 15 טון");

      const safetyOfficerObj = isHeavyOrInfra ? {
        name: "טרם אותר קצב\"ת בשם",
        role: `חובת פיקוח לפי תקנה 579 (ענף ${branch})`,
        status: "e",
        mandate579: true,
        note: certifiedName
          ? `איש מקצוע כשיר ברישיון הקבלן: ${certifiedName}. חובת פיקוח קצב\"ת חלה לפי תקנה 579 לצי בענף ${branch}.`
          : `חובת פיקוח קצב\"ת חלה לפי תקנה 579 לצי בענף ${branch}.`,
        source: isContractors ? "פנקס הקבלנים הרשומים (data.gov.il) + תקנה 579" : "רשם החברות הממשלתי",
        tier: "A",
        tierLabel: "Tier A | ממשלתי רשמי"
      } : null;

      const peopleList = [];
      if (certifiedName) {
        peopleList.push([certifiedName, "איש מקצוע כשיר הרשום ברישיון הקבלן", "v", email, phone, "A"]);
      }

      const newLead = {
        id: C.length + 1,
        name: compName,
        no: compId,
        ind: branch,
        city: city,
        region: "מרכז",
        addr: fullAddr,
        web: "",
        phone: phone || "לא נמצא",
        mail: email || "",
        size: isContractors ? "50–100 עובדים" : "20–50 עובדים",
        fleet: {
          s: isContractors ? "v" : "e",
          val: isContractors ? "צי צמ\"ה ומשאיות ברישוי (סיווג ג')" : "צי רכב כבד משוער",
          src: isContractors ? "פנקס הקבלנים ענף 200 (data.gov.il)" : "רשם החברות + משרד התחבורה"
        },
        fleetType: fleetType,
        score: isContractors ? 93 : 87,
        status: "new",
        found: new Date().toLocaleDateString("he-IL"),
        upd: new Date().toLocaleDateString("he-IL"),
        isSafetyOfficerLead: isHeavyOrInfra,
        certifiedProfessional: certifiedProf,
        safetyOfficer: safetyOfficerObj,
        leadReason: `קבלן/חברה פעילה בענף ${branch}, מפעילה צי רכב מסחרי/תפעולי הדורש שירותי מוסך, בדיקות בטיחות חודשיות ותחזוקת שבר.`,
        multiPhones: phone ? [{ val: phone, source: isContractors ? "פנקס הקבלנים הרשומים (רשמי)" : "רשם החברות (data.gov.il)", tier: "A", tierLabel: "Tier A | ממשלתי רשמי" }] : [],
        multiMails: email ? [{ val: email, source: "פנקס הקבלנים הרשומים (רשמי)", tier: "A", tierLabel: "Tier A | ממשלתי רשמי" }] : [],
        facts: { no: "v", ind: "v", addr: street ? "v" : "e", web: "n", phone: phone ? "v" : "n", mail: email ? "v" : "n", size: "v" },
        ev: [
          ["🏛️", isContractors ? "פנקס הקבלנים (data.gov.il)" : "רשם החברות (data.gov.il)", `חברה מאומתת מס' ${compId}, ענף ${branch}`, "data.gov.il", "v", new Date().toLocaleDateString("he-IL"), "A", "Tier A ממשלתי"],
          ["⚖️", "תקנה 579 לתקנות התעבורה", "חובת מינוי קצין בטיחות בתעבורה לצי מעל 20 כלי רכב כבדים", "תקנות התעבורה", "v", new Date().toLocaleDateString("he-IL"), "A", "Tier A חוקי"]
        ],
        people: peopleList,
        notes: `נוסף בייבוא המוני ממקור ${isContractors ? 'פנקס הקבלנים הרשומים' : 'רשם החברות'}.`
      };

      C.push(newLead);
      S.bulk.staged.push(newLead);
      S.bulk.stats.added++;
      batchNewAdded++;
      if (isHeavyOrInfra) {
        S.bulk.stats.safetyOfficers++;
        S.bulk.stats.fleetEvidence++;
      }

      if (S.bulk.stats.added >= targetCount) break;
    }

    S.bulk.offset += records.length;
    addLog(`אצווה ${batchIndex}: נסרקו ${records.length} רשומות · נוספו ${batchNewAdded} לידים חדשים · כפילויות שנמנעו: ${S.bulk.stats.duplicates}`);

    persistProspectorData();
    updateBulkUI(targetCount);
    batchIndex++;

    await new Promise(r => setTimeout(r, 120));
  }

  S.bulk.running = false;
  persistProspectorData();
  if (btnPause) btnPause.style.display = "none";
  if (btnResume) btnResume.style.display = "none";
  if (btnStart) btnStart.style.display = "inline-flex";
  if (btnCommit) btnCommit.style.display = "inline-flex";
  if (btnExport) btnExport.style.display = "inline-flex";

  const statusText = $("#bulkStatusText");
  if (statusText) statusText.textContent = `הסתיים בהצלחה: נוספו ${S.bulk.stats.added} לידים חדשים`;

  addLog(`🎉 ייבוא המוני הסתיים! סה"כ נוספו ${S.bulk.stats.added} לידים (מתוכם ${S.bulk.stats.safetyOfficers} בעלי חובת פיקוח קצב"ת/צי).`);
  toast(`הייבוא ההמוני הסתיים: ${S.bulk.stats.added} לידים נוספו למערכת`);
  renderNav();
}

function updateBulkUI(targetCount) {
  const s = S.bulk.stats;
  const pct = Math.min(100, Math.round((s.added / targetCount) * 100)) || 0;
  const pBar = $("#bulkProgressBar"); if (pBar) pBar.style.width = `${pct}%`;
  const pPct = $("#bulkProgressPercent"); if (pPct) pPct.textContent = `${pct}% (${s.added} מתוך ${targetCount})`;
  const pLbl = $("#bulkProgressLabel"); if (pLbl) pLbl.textContent = S.bulk.running ? `מעבד אצווה... נסרקו ${s.scanned} רשומות` : `הסתיים: ${s.added} לידים נקלטו`;

  const elScanned = $("#kpiScanned"); if (elScanned) elScanned.textContent = String(s.scanned);
  const elAdded = $("#kpiAdded"); if (elAdded) elAdded.textContent = String(s.added);
  const elDuplicates = $("#kpiDuplicates"); if (elDuplicates) elDuplicates.textContent = String(s.duplicates);
  const elRejected = $("#kpiRejected"); if (elRejected) elRejected.textContent = String(s.rejected);
  const elFleet = $("#kpiFleet"); if (elFleet) elFleet.textContent = String(s.fleetEvidence);
  const elSafety = $("#kpiSafety"); if (elSafety) elSafety.textContent = String(s.safetyOfficers);
}

function pauseBulkImport() {
  if (!S.bulk.running) return;
  S.bulk.paused = true;
  const btnPause = $("#btnBulkPause"); if (btnPause) btnPause.style.display = "none";
  const btnResume = $("#btnBulkResume"); if (btnResume) btnResume.style.display = "inline-flex";
  toast("הייבוא ההמוני הושהה");
}

function resumeBulkImport() {
  if (!S.bulk.running) return;
  S.bulk.paused = false;
  const btnPause = $("#btnBulkPause"); if (btnPause) btnPause.style.display = "inline-flex";
  const btnResume = $("#btnBulkResume"); if (btnResume) btnResume.style.display = "none";
  toast("הייבוא ההמוני ממשיך כעת");
}

function clearBulkImport() {
  if (S.bulk.staged.length > 0) {
    const stagedIds = new Set(S.bulk.staged.map(x => x.id));
    for (let i = C.length - 1; i >= 0; i--) {
      if (stagedIds.has(C[i].id)) C.splice(i, 1);
    }
    toast(`נוקו ${S.bulk.staged.length} לידים שנוספו באצווה הנוכחית`);
    S.bulk.staged = [];
    S.bulk.stats = { scanned: 0, added: 0, duplicates: 0, rejected: 0, fleetEvidence: 0, safetyOfficers: 0 };
    updateBulkUI(S.bulk.targetCount || 100);
    persistProspectorData();
    renderNav();
  } else {
    toast("אין תוצאות זמניות לניקוי");
  }
}

function commitBulkToLeads() {
  persistProspectorData();
  S.view = "prospector";
  S.tab = "leads";
  S.leadCategory = "safety_officer";
  render();
  window.scrollTo(0, 0);
  toast(`הועברו ${S.bulk.staged.length || S.bulk.stats.added} לידים לתצוגת ניהול הלידים`);
}

/* ===== חברות שנמצאו ===== */
const CO_FILTERS=["st","fleet","stage","phone","mail","contact","ready","missing","quality","city","ind"];
function coMatch(c,f){
  const q=QF(c), fs=q?q.field_status:null, s=k=>fs&&fs[k]?fs[k].s:"n";
  const yn=(v,on)=>!v||(v==="yes"?on:!on);
  const t=f.q.trim();
  return (!t||c.name.includes(t)||c.city.includes(t)||c.ind.includes(t)||String(c.no||"").includes(t)||(c.enr&&String(c.enr.contact_name||"").includes(t)))
    &&(!f.st||c.status===f.st)
    &&(!f.fleet||s("fleet")===f.fleet)
    &&(!f.stage||(q?q.lead_stage:"basic")===f.stage)
    &&yn(f.phone,s("phone")!=="n")&&yn(f.mail,s("email")!=="n")&&yn(f.contact,s("contact_name")!=="n")
    &&yn(f.ready,isReady(c))
    &&(!f.missing||(f.missing==="required"?(!q||q.blockers.length>0):f.missing==="any"?(!q||q.missing_fields.length>0):(q&&q.missing_fields.length===0)))
    &&(!f.quality||(q?q.lead_quality:"low")===f.quality)
    &&(!f.city||c.city===f.city)&&(!f.ind||c.ind===f.ind);
}

        ${opt("missing","חסר מידע – הכל",[["required","חסר מידע חובה"],["any","חסר מידע כלשהו"],["none","לא חסר מידע"]])}

        ${opt("mail","מייל – הכל",YN("יש מייל","אין מייל"))}
        ${opt("contact","איש קשר – הכל",YN("יש איש קשר","אין איש קשר"))}
        ${opt("fleet","כל מצבי הצי",[["v","צי מאומת"],["f","אינדיקציה לצי – דורש אימות"],["n","אין מידע על צי"]])}
        ${opt("city","כל הערים",uniq("city").map(x=>[x,x]))}

function crmHandoffBtn(c,compact){
  const ready=isReady(c), hs=c.enr&&c.enr.crm_handoff_status;

    : `<button class="btn btn-sm" style="background:#fff;color:#0a1830;border-color:#fff${ready?"":";opacity:.5"}" data-act="toCrm" data-co-id="${c.id}" title="${tip}" ${ready?"":"disabled"}>📤 העבר לפולו-אפ / CRM</button>`;

V.leads=()=>{
  const cat = S.leadCategory || "safety_officer";
  const safetyCount = C.filter(c => c.isSafetyOfficerLead).length;
  const trucksCount = C.filter(c => c.fleetType && (c.fleetType.includes("משאיות") || c.fleetType.includes("פולטריילר") || c.fleetType.includes("סמי") || c.fleetType.includes("רמסע") || c.fleetType.includes("קירור"))).length;
  const machineryCount = C.filter(c => c.fleetType && (c.fleetType.includes("צמ\"ה") || c.fleetType.includes("עפר") || c.ind.includes("עפר") || c.ind.includes("תשתית"))).length;
  const busCount = C.filter(c => c.fleetType && (c.fleetType.includes("אוטובוס") || c.fleetType.includes("היסע"))).length;

  let filteredC = C;
  if (cat === "safety_officer") {
    filteredC = C.filter(c => c.isSafetyOfficerLead);
  } else if (cat === "trucks") {
    filteredC = C.filter(c => c.fleetType && (c.fleetType.includes("משאיות") || c.fleetType.includes("פולטריילר") || c.fleetType.includes("סמי") || c.fleetType.includes("רמסע") || c.fleetType.includes("קירור")));
  } else if (cat === "machinery") {
    filteredC = C.filter(c => c.fleetType && (c.fleetType.includes("צמ\"ה") || c.fleetType.includes("עפר") || c.ind.includes("עפר") || c.ind.includes("תשתית")));
  } else if (cat === "buses") {
    filteredC = C.filter(c => c.fleetType && (c.fleetType.includes("אוטובוס") || c.fleetType.includes("היסע")));
  }
  /* תצוגת שלבי ליד: "ready" = מוכן לפנייה, "stage:<key>" = כל שלב אחר */
  const stageKey = cat === "ready" ? "ready" : (cat.startsWith("stage:") ? cat.slice(6) : "");
  /* "מוכן לפנייה" = ready_for_contact=true ב-Supabase (וגם הכללים מאשרים) */
  if (stageKey) filteredC = C.filter(c => stageKey === "ready" ? isReady(c) : stageOf(c) === stageKey);
  const stageCounts = {};
  C.forEach(c => { const s = stageOf(c); stageCounts[s] = (stageCounts[s] || 0) + 1; });
  stageCounts.ready = C.filter(isReady).length;

  return `
  <!-- כותרת ראשית וסנכרון CRM -->
  <div class="row" style="margin-bottom:12px;align-items:center;flex-wrap:wrap;gap:8px">
    <h2 style="margin:0;font-size:18px">ניהול לידים וסטטוס טיפול</h2>
    <span class="badge b-blue">מוכן להעברה ל-CRM</span>
    <span class="spacer"></span>
    <button class="btn btn-sm btn-primary" data-tab="search" style="display:inline-flex;align-items:center;gap:6px">
      ⚡ ייבוא לידים באצוות (Bulk Ingestion)
    </button>
    <button class="btn btn-sm" data-act="export" style="display:inline-flex;align-items:center;gap:6px">
      ⬇ ייצוא CSV
    </button>
    <button class="btn btn-sm" data-act="exportBackup" style="display:inline-flex;align-items:center;gap:6px" title="הורד קובץ גיבוי JSON של כל הלידים">
      💾 גיבוי JSON
    </button>
    <label class="btn btn-sm" style="cursor:pointer;margin:0;display:inline-flex;align-items:center;gap:6px" title="שחזר לידים מקובץ גיבוי JSON">
      📂 שחזור JSON<input type="file" id="jsonBackupInputLeads" accept=".json" style="display:none" data-act="importBackup">
    </label>
    <span class="xs muted">אין סנכרון אוטומטי ל-CRM – העברה ידנית בלבד, ליד אחר ליד</span>
  </div>

  <!-- סרגל סינון קטגוריות ראשי (Category Filter Bar) -->
  <div class="row" style="margin-bottom:14px;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px">
    <span class="xs bold" style="color:var(--text);margin-inline-end:4px">קטגוריות ממוקדות:</span>
    <button class="btn btn-sm" style="${cat==='safety_officer'?'background:#1d4ed8;color:#fff;border-color:#1d4ed8;font-weight:700':'background:var(--soft);color:var(--text);border:1px solid var(--border)'}" data-lead-cat="safety_officer">
      🛡️ מועמדים לבדיקת קצב"ת (${safetyCount})
    </button>
    <button class="btn btn-sm" style="${cat==='all'?'background:#1d4ed8;color:#fff;border-color:#1d4ed8;font-weight:700':'background:var(--soft);color:var(--text);border:1px solid var(--border)'}" data-lead-cat="all">
      📋 כל הלידים (${C.length})
    </button>
    <button class="btn btn-sm" style="${cat==='trucks'?'background:#1d4ed8;color:#fff;border-color:#1d4ed8;font-weight:700':'background:var(--soft);color:var(--text);border:1px solid var(--border)'}" data-lead-cat="trucks">
      🚛 ציי משאיות כבדות (${trucksCount})
    </button>
    <button class="btn btn-sm" style="${cat==='machinery'?'background:#1d4ed8;color:#fff;border-color:#1d4ed8;font-weight:700':'background:var(--soft);color:var(--text);border:1px solid var(--border)'}" data-lead-cat="machinery">
      🚜 כלי צמ"ה ועפר (${machineryCount})
    </button>
    <button class="btn btn-sm" style="${cat==='buses'?'background:#1d4ed8;color:#fff;border-color:#1d4ed8;font-weight:700':'background:var(--soft);color:var(--text);border:1px solid var(--border)'}" data-lead-cat="buses">
      🚌 אוטובוסים והיסעים (${busCount})
    </button>
    <button class="btn btn-sm" style="${cat==='ready'?'background:#15803d;color:#fff;border-color:#15803d;font-weight:700':'background:var(--soft);color:var(--text);border:1px solid var(--border)'}" data-lead-cat="ready">
      ✅ מוכן לפנייה (${stageCounts.ready || 0})
    </button>
    <span class="spacer"></span>
    <span class="chip num" style="font-size:12px">מוצגים ${filteredC.length} לידים</span>
  </div>
  <div class="row" style="margin:-6px 0 14px;flex-wrap:wrap;gap:6px;align-items:center">
    <span class="xs bold" style="margin-inline-end:4px">שלבי ליד:</span>
    ${(window.OPQualify ? OPQualify.STAGES : []).map(([k, l]) => `<button class="badge ${STAGE_STY[k]}" style="cursor:pointer;font-size:11.5px;border:${stageKey===k?'2px solid currentColor':'1px solid transparent'}" data-lead-cat="${k==='ready'?'ready':'stage:'+k}">${l} · ${stageCounts[k] || 0}</button>`).join("")}
  </div>

  ${cat === "safety_officer" ? `

/* ===== מסך "מוכן לפנייה" / שלב ליד (טבלה, 50 בעמוד) ===== */
function stageTable(list, stageKey) {
  const pageSize = 50, pages = Math.max(1, Math.ceil(list.length / pageSize));
  S.stPage = Math.min(Math.max(1, S.stPage || 1), pages);
  const page = list.slice((S.stPage - 1) * pageSize, S.stPage * pageSize);
  const stLabel = window.OPQualify ? OPQualify.STAGE_LABEL[stageKey] : stageKey;
  /* ready_for_contact ב-DB שאינו תואם לכללים – מוצג כהתראה, לא כליד מוכן */
  const readyMismatch = stageKey === "ready" ? C.filter(c => { const q = QF(c); return c.enr && q && (c.enr.ready_for_contact === true) !== q.ready_for_contact; }).length : 0;
  const mismatchNote = readyMismatch ? `<div class="xs" style="background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:6px 10px;margin:8px 16px">⚠️ ${readyMismatch} לידים: ready_for_contact ב-Supabase אינו תואם לכללי האימות – לא מוצגים כאן עד לבדיקה</div>` : "";
  const pager = list.length > pageSize ? `<div class="row sm" style="gap:6px;align-items:center">
      <button class="btn btn-sm" data-act="stPrev" ${S.stPage <= 1 ? "disabled" : ""}>◀ עמוד קודם</button>
      <span class="num xs">עמוד ${S.stPage} מתוך ${pages}</span>
      <button class="btn btn-sm" data-act="stNext" ${S.stPage >= pages ? "disabled" : ""}>עמוד הבא ▶</button></div>` : "";
  if (!list.length) {
    /* למה אין לידים בשלב: החסמים הנפוצים בכל המאגר */
    const blk = {};
    C.forEach(c => { const q = QF(c); if (q && q.lead_stage !== "rejected") q.blockers.forEach(b => blk[b] = (blk[b] || 0) + 1); });
    const top = Object.entries(blk).sort((a, b) => b[1] - a[1]);
    return `<div class="card">${mismatchNote}<div class="card-b">
      <h3 style="margin:0 0 6px">אין כרגע לידים בשלב "${esc(stLabel)}"</h3>
      ${stageKey === "ready" ? `<div class="sm muted" style="line-height:1.6">ליד מוכן לפנייה רק כשכל תנאי החובה מאומתים: חברה רשומה, ח.פ., מקור, טלפון תקין ומאומת, צי רכב מאומת, רלוונטיות לדליה, ללא כפילות וללא פסילה.
        <br>גודל צי לא מוערך ולא מומצא – יש לאמת צי בשיחה או ממקור מפורש ("מידע חסר / אימות" בכרטיס הליד).</div>
        <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:10px">${top.map(([b, n]) => `<span class="badge b-est">${esc(b)}: ${n} לידים</span>`).join("")}</div>` : ""}
    </div></div>`;
  }
  return `<div class="card">
    <div class="card-h"><h2>${stageKey === "ready" ? "✅ מוכן לפנייה" : esc(stLabel)}<span class="h-bar"></span></h2><span class="chip num">${list.length} לידים</span>
      <span class="xs muted">ללא העברה אוטומטית ל-CRM</span><span class="spacer"></span>${pager}</div>${mismatchNote}
    <div class="tbl-wrap"><table class="co"><thead><tr>
      <th>חברה</th><th>ח.פ.</th><th>טלפון</th><th>מייל</th><th>אתר</th><th>כתובת</th><th>תחום</th><th>צי</th><th>גודל צי</th>
      <th>איש קשר</th><th>תפקיד</th><th>קצב"ת</th><th>מקור</th><th>רמת אימות</th><th>תאריך אימות</th><th>הערות</th><th>פולו-אפ / CRM</th></tr></thead><tbody>
      ${page.map(c => { const q = QF(c) || { field_status: {}, source_list: [] }; const fs = q.field_status; const e = c.enr || {};
        const cell = (k, v) => `${esc(String(v || "")) || '<span class="faint">—</span>'}${fs[k] && fs[k].s === "f" ? ' <span class="badge b-est" style="font-size:9.5px">דורש אימות</span>' : ""}`;
        return `<tr data-co="${c.id}">
        <td class="co-main"><b>${esc(c.name)}</b><div>${stageBadge(c, 9.5)}</div></td>
        <td class="num xs" data-label="ח.פ."><span class="ltr">${esc(c.no)}</span></td>
        <td class="xs" data-label="טלפון"><span class="ltr">${cell("phone", fs.phone && fs.phone.s !== "n" ? c.phone : "")}</span></td>
        <td class="xs" data-label="מייל"><span class="ltr">${cell("email", c.mail)}</span></td>
        <td class="xs hide-m" data-label="אתר"><span class="ltr">${cell("website", c.web || e.website)}</span></td>
        <td class="xs hide-m" data-label="כתובת">${esc(c.addr || "")}</td>
        <td class="xs hide-m" data-label="תחום">${esc((fs.relevance && fs.relevance.val) || c.ind)}</td>
        <td data-label="צי">${fleetCell(c, true)}</td>
        <td class="num xs" data-label="גודל צי">${fs.fleet_size && fs.fleet_size.s !== "n" ? esc(String(fs.fleet_size.val)) + (fs.fleet_size.s === "f" ? ' <span class="badge b-est" style="font-size:9.5px">דורש אימות</span>' : "") : '<span class="faint">לא ידוע</span>'}</td>
        <td class="xs" data-label="איש קשר">${cell("contact_name", e.contact_name)}</td>
        <td class="xs" data-label="תפקיד">${cell("contact_role", e.contact_role)}</td>
        <td class="xs" data-label="קצב&quot;ת">${officerCell(c, "safety_officer")}</td>
        <td class="xs" data-label="מקור">${esc((q.source_list || []).join(" + ") || "—")}</td>
        <td class="xs hide-m" data-label="רמת אימות">${verifBadge(c, 10)} · Tier ${esc(q.tier || "—")}</td>
        <td class="num xs" data-label="תאריך אימות">${esc(e.verification_date || "—")}</td>
        <td class="xs hide-m" data-label="הערות">${esc(c.notes || "")}</td>
        <td class="co-actions">${crmHandoffBtn(c, true)}</td></tr>`; }).join("")}
    </tbody></table></div>
    ${pager ? `<div class="row" style="padding:10px 16px;border-top:1px solid var(--border)"><span class="spacer"></span>${pager}</div>` : ""}
  </div>`;
}
