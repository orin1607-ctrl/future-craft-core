/* ===== אלגוריתם דירוג איכות ליד (LEAD QUALITY SCORE) ===== */
function evaluateHitQuality(h) {
  let score = 50; // בסיס לחברה רשומה ופעילה ברשם
  let color = "yellow";
  let label = "איכות בינונית";

  if (h.fleetIsFact) score += 25;
  else if (String(h.fleetPotential || "").includes("5+")) score += 15;

  if (h.phoneVerBadgeColor === "green") score += 20;
  else if (h.phone && h.phone !== "—" && h.phone !== "לא ידוע") score += 10;

  if (h.mobile && h.mobile !== "—") score += 10;
  if (h.email && h.email !== "—" && h.email !== "לא ידוע" && h.email.includes("@")) score += 10;
  if (h.addrKnown) score += 5;
  if (h.contactPerson && h.contactPerson !== "—") score += 10;

  score = Math.min(98, Math.max(40, score));

  if (score >= 80 && (h.phone && h.phone !== "—" || h.mobile && h.mobile !== "—")) {
    color = "green";
    label = "איכות גבוהה ⭐";
  } else if (score >= 60) {
    color = "yellow";
    label = "איכות בינונית";
  } else {
    color = "red";
    label = "בסיסי / חסר קשר";
  }

  return { score, color, label };
}

/* ===== מנוע איתור חברות באצוות הדרגתיות רב-מקורות (STREAMING MULTI-SOURCE BATCH ENGINE) ===== */
async function runUnifiedSearch(customOpts = {}) {
  if (S.searchRunning) return;

  // 1. חילוץ שדות הטופס
  const kwInput = (($("#a-kw") && $("#a-kw").value.trim()) || customOpts.kw || (S._lastQueryTerm || "")).trim();
  let keywords = kwInput.split(/[,،;]+/).map(k => k.trim()).filter(Boolean);
  const indVal = ($("#a-ind") && $("#a-ind").value) || customOpts.ind || "";

  if (keywords.length === 0 && indVal && indVal !== "כל הענפים" && indVal !== "כל הענפים והתחומים") {
    keywords = (window.OPQualify && window.OPQualify.OPDomainKeywords)
      ? window.OPQualify.OPDomainKeywords.getKeywordsForDomain(indVal)
      : [indVal];
  }
  if (keywords.length === 0) keywords = ["הובלות"];

  const countInput = ($("#a-count") && parseInt($("#a-count").value, 10)) || customOpts.reqLimit || 50;
  const reqLimit = Math.max(5, Math.min(2000, countInput));
  
  // חילוץ מקורות נבחרים מהצ'קבוקסים
  const selectedCheckboxes = Array.from(document.querySelectorAll(".src-cb:checked"));
  let selectedSourceIds = selectedCheckboxes.map(cb => cb.value);
  if (selectedSourceIds.length === 0) {
    // אם לא נבחר כלום, בחר את ברירת המחדל
    selectedSourceIds = ["src_companies", "src_contractors", "src_business_licenses", "src_garages", "src_manpower_security"];
  }
  saveSourceSelection(selectedSourceIds);

  // הגדרת יעד הצלבות
  const targetCross = parseInt(($("#a-target-cross") && $("#a-target-cross").value) || customOpts.targetCross || 4, 10);

  // חילוץ שאר מסנני הפוסט-שליפה
  const regionVal = ($("#a-region") && $("#a-region").value) || customOpts.region || "";
  const cityVal = ($("#a-city") && $("#a-city").value.trim().toLowerCase()) || (customOpts.city || "").trim().toLowerCase();
  const fleetTypeVal = ($("#a-fleet-type") && $("#a-fleet-type").value) || customOpts.fleetType || "";
  const fleetModeVal = ($("#a-fleet-filter-mode") && $("#a-fleet-filter-mode").value) || customOpts.fleetMode || "all";
  const workforceVal = ($("#a-workforce-range") && $("#a-workforce-range").value) || customOpts.workforce || "all";
  const targetRoleVal = ($("#a-target-role") && $("#a-target-role").value) || customOpts.targetRole || "all";
  const contactReqVal = ($("#a-contact-req") && $("#a-contact-req").value) || customOpts.contactReq || "all";

  S._lastQueryTerm = keywords.join(", ");
  S._lastSaveSuccess = null;

  // 2. אתחול משתני מצב
  S.searchRunning = true;
  S.searchStopRequested = false;
  S.searchHits = [];
  S.searchDuplicates = [];
  S.searchRejected = [];
  S.searchHitSelection = new Set();
  S.searchExpandedDrawers = new Set();
  S.searchActiveTab = "new";
  S.searchStats = {
    requested: reqLimit,
    scanned: 0,
    added: 0,
    duplicates: 0,
    rejected: 0,
    pending: 0,
    fleetEvidence: 0
  };

  // 3. הצגת שלד התוצאות מיד על המסך מתחת לטופס (< 500ms)
  const resultsContainer = $("#searchResultsArea");
  if (resultsContainer) {
    resultsContainer.innerHTML = renderSearchResultsArea();
    resultsContainer.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  // 4. בניית אינדקס מהיר למניעת כפילויות מול מאגר STAGING (2,018 חברות) ומאגר C
  const existingHpMap = new Map();
  if (typeof STAGING_DB_HPS !== "undefined" && STAGING_DB_HPS.forEach) {
    STAGING_DB_HPS.forEach(hp => {
      const norm = String(hp || "").replace(/\D/g, "");
      if (norm) existingHpMap.set(norm, { name: "חברה קיימת במאגר STAGING DB", no: norm, source: "database" });
    });
  }
  C.forEach(c => {
    const norm = (window.OPQualify ? OPQualify.normalizeCompanyHp(c.no) : String(c.no || "").replace(/\D/g, ""));
    if (norm) existingHpMap.set(norm, c);
  });
  const seenInCurrentRun = new Set();

  // 5. מיפוי מקורות נבחרים למשאבי data.gov.il פעילים
  const datasets = [];
  if (selectedSourceIds.includes("src_companies")) {
    datasets.push({ id: "f004176c-b85f-4542-8901-7b3176f9a054", type: "companies", name: "רשם החברות" });
  }
  if (selectedSourceIds.includes("src_contractors")) {
    datasets.push({ id: "4eb61bd6-18cf-4e7c-9f9c-e166dfa0a2d8", type: "contractors", name: "פנקס הקבלנים" });
  }
  if (selectedSourceIds.includes("src_business_licenses")) {
    datasets.push({ id: "7d4c61e2-2416-453e-8efb-bd02ec89db35", type: "business_licenses", name: "רישוי עסקים ממשלתי" });
  }
  if (selectedSourceIds.includes("src_garages")) {
    datasets.push({ id: "bb68386a-a331-4bbc-b668-bba2766d517d", type: "garages", name: "מוסכים ומכוני רישוי" });
  }
  if (selectedSourceIds.includes("src_manpower_security")) {
    datasets.push({ id: "243fe1ce-b2ae-4c26-9e5e-ce306a602040", type: "manpower_security", name: "קבלני שמירה וכוח אדם" });
  }
  if (selectedSourceIds.includes("src_plants_industry")) {
    datasets.push({ id: "88d1883c-3b7a-4580-9be9-6d54659666c3", type: "plants_industry", name: "רשימת מפעלים ותעשייה" });
  }
  if (selectedSourceIds.includes("src_ngos")) {
    datasets.push({ id: "be5b7935-3922-45d4-9638-08871b17ec95", type: "ngos", name: "רשם העמותות" });
  }

  // ברירת מחדל אם נבחרו רק מקורות קישור חיצוני
  if (datasets.length === 0) {
    datasets.push(
      { id: "f004176c-b85f-4542-8901-7b3176f9a054", type: "companies", name: "רשם החברות" },
      { id: "4eb61bd6-18cf-4e7c-9f9c-e166dfa0a2d8", type: "contractors", name: "פנקס הקבלנים" },
      { id: "7d4c61e2-2416-453e-8efb-bd02ec89db35", type: "business_licenses", name: "רישוי עסקים ממשלתי" },
      { id: "bb68386a-a331-4bbc-b668-bba2766d517d", type: "garages", name: "מוסכים ומכוני רישוי" }
    );
  }

  const batchSize = 50;
  let batchIndex = 1;
  const startTime = Date.now();

  try {
    const maxOffset = Math.max(250, reqLimit * 4);
    let offset = 0;

    while (offset < maxOffset && !S.searchStopRequested && S.searchStats.added < reqLimit) {
      let anyRecordsInRound = false;

      for (const ds of datasets) {
        if (S.searchStopRequested || S.searchStats.added >= reqLimit) break;

        for (const kw of keywords) {
          if (S.searchStopRequested || S.searchStats.added >= reqLimit) break;

          updateLiveSearchStatus(`סורק אצווה ${batchIndex} מ-${ds.name} (מילת מפתח: "${kw}", היסט: ${offset})...`);

          const url = `https://data.gov.il/api/3/action/datastore_search?resource_id=${ds.id}&q=${encodeURIComponent(kw)}&limit=${batchSize}&offset=${offset}`;

          let records = [];
          try {
            const resp = await fetch(url);
            if (resp.ok) {
              const json = await resp.json();
              if (json && json.success && Array.isArray(json.result?.records)) {
                records = json.result.records;
              }
            }
          } catch (err) {
            console.warn("שגיאת שליפה מאצווה:", err);
          }

          if (records.length === 0) continue;
          anyRecordsInRound = true;
          S.searchStats.scanned += records.length;

          const newBatchHits = [];

          for (const rec of records) {
            let rawHit = null;
            if (ds.type === "contractors") rawHit = contractorHit(rec);
            else if (ds.type === "business_licenses") rawHit = businessLicenseHit(rec);
            else if (ds.type === "garages") rawHit = garageHit(rec);
            else if (ds.type === "manpower_security") rawHit = manpowerHit(rec);
            else if (ds.type === "plants_industry") rawHit = plantHit(rec);
            else if (ds.type === "ngos") rawHit = ngoHit(rec);
            else rawHit = registryHit(rec);

            if (!rawHit) {
              S.searchStats.rejected++;
              S.searchRejected.push({
                name: rec.SHEM_YESHUT || rec["שם עסק"] || rec.shem_mosah || rec.companyname || rec["שם חברה"] || "ללא שם",
                no: rec.MISPAR_YESHUT || rec.rasham_havarot || rec.identitynumber || rec["מספר חברה"] || "ללא מזהה",
                reason: "חסר שם או ח.פ. תקין"
              });
              continue;
            }

            rawHit.source_keyword = kw;
            const normHp = (window.OPQualify ? OPQualify.normalizeCompanyHp(rawHit.no) : String(rawHit.no).replace(/\D/g, ""));
            rawHit.no = normHp;

            // בדיקת כפילות בתוך הריצה הנוכחית
            if (seenInCurrentRun.has(normHp)) {
              S.searchStats.duplicates++;
              S.searchDuplicates.push({
                name: rawHit.name,
                no: normHp,
                city: rawHit.city,
                ind: rawHit.ind,
                reason: "כפילות שחזרה בתוך תוצאות החיפוש הנוכחי"
              });
              continue;
            }

            // בדיקת כפילות מול מאגר STAGING DB (2,018 חברות)
            if (existingHpMap.has(normHp)) {
              const existing = existingHpMap.get(normHp);
              S.searchStats.duplicates++;
              S.searchDuplicates.push({
                name: rawHit.name,
                no: normHp,
                city: rawHit.city,
                ind: rawHit.ind,
                reason: `ח.פ. קיים במאגר: "${existing.name}" (סטטוס: ${existing.status || 'חדש'}, נשמר: ${existing.found || 'בעבר'})`
              });
              continue;
            }
            // חיבור נוסחת מודל כוח אדם וצי רכב המקורית (Workforce & Fleet Estimation Formula v2)
            if (window.OPQualify && typeof window.OPQualify.evaluate === "function") {
              const qRow = {
                company_name: rawHit.name,
                company_hp: rawHit.no,
                industry_name: rawHit.ind,
                city: rawHit.city,
                address: rawHit.addr,
                phone: (rawHit.phone && rawHit.phone !== "—") ? rawHit.phone : "",
                mobile_phone: (rawHit.mobile && rawHit.mobile !== "—") ? rawHit.mobile : "",
                email: (rawHit.email && rawHit.email !== "—") ? rawHit.email : "",
                source_name: rawHit.source_label,
                contact_name: (rawHit.contactPerson && rawHit.contactPerson !== "—") ? rawHit.contactPerson : "",
                contact_role: rawHit.roleTitle || "",
                notes: rawHit.ind,
                contractor_classification: rawHit.source === "contractors" ? rawHit.ind : "",
                registry_check: {
                  companies: { found: rawHit.source === "companies", status: rawHit.status },
                  contractors: { found: rawHit.source === "contractors", records: (rawHit.phone && rawHit.phone !== "—") ? [{ phone: rawHit.phone }] : [] }
                }
              };
              const evalRes = window.OPQualify.evaluate(qRow);
              if (evalRes) {
                const wf = evalRes.workforce_estimate_v2 || evalRes.workforce_estimate || {};
                rawHit.workforce_v2 = wf;
                rawHit.approxEmployees = (wf.approx_employees !== undefined) ? wf.approx_employees : null;
                rawHit.workforceRange = wf.employee_count_range || "לא ידוע";
                rawHit.workforceDisplay = wf.employee_count_display || (rawHit.employeesCount ? (rawHit.employeesCount + " עובדים (מאומת)") : "לא ידוע (ללא אסמכתא)");
                rawHit.workforceConfidence = wf.workforce_confidence_level || "";
                rawHit.workforceBreakdown = wf.workforce_breakdown || {};
                rawHit.rolesIdentified = wf.roles_identified || [];
                rawHit.fieldWorkersCount = wf.field_workers_count || 0;
                rawHit.fieldWorkersDisplay = wf.field_workers_count_display || "";
                rawHit.workforceBasis = wf.basis_label || "";

                const fl = evalRes.fleet_estimate_v2 || {};
                rawHit.fleet_v2 = fl;
                rawHit.fleetSizeDisplay = fl.fleet_size_display || rawHit.fleetPotential || "לא ידוע";
                rawHit.fleetRounded = fl.fleet_count_rounded || "";
                rawHit.fleetConfidence = fl.fleet_confidence || "נמוך";
                rawHit.fleetBasis = fl.basis_of_estimate_label || "";
                rawHit.fleetIsEstimate = fl.fleet_is_estimate !== false;

                rawHit.fleetOfficerProb = evalRes.fleet_officer_probability || 0;
                rawHit.fleetOfficerStatus = evalRes.fleet_officer_status || "לא נמצא";
                rawHit.fleetOfficerLegalNote = evalRes.fleet_officer_legal_note || "";

                rawHit.businessPotentialScore = evalRes.business_potential_score || 50;
                rawHit.potentialBreakdown = evalRes.business_potential_breakdown || {};

                if ((!rawHit.roleTitle || rawHit.roleTitle.startsWith("אינדיקציה")) && rawHit.rolesIdentified.length > 0) {
                  rawHit.roleTitle = rawHit.rolesIdentified.slice(0, 2).join(", ");
                }
              }
            }

            // סינונים מקומיים (Post-Fetch Filters):
            // א. סינון עיר
            if (cityVal && !String(rawHit.city || "").toLowerCase().includes(cityVal)) {
              continue;
            }

            // ב. סינון אזור
            const derivedReg = (window.OPQualify ? OPQualify.cityToRegion(rawHit.city) : "לא ידוע");
            rawHit.region = derivedReg;
            if (regionVal && regionVal !== "כל הארץ" && regionVal !== "כל האזורים" && derivedReg !== regionVal) {
              continue;
            }

            // ג. סינון תחום פעילות
            if (indVal && indVal !== "כל הענפים" && indVal !== "כל הענפים והתחומים" && !String(rawHit.ind || "").includes(indVal) && !String(rawHit.name || "").includes(indVal)) {
              continue;
            }

            // ד. סינון סוג רכב
            if (fleetTypeVal && fleetTypeVal !== "all") {
              const combType = (String(rawHit.fleetType || "") + " " + String(rawHit.ind || "") + " " + String(rawHit.name || "") + " " + (rawHit.rolesIdentified || []).join(" ")).toLowerCase();
              if (fleetTypeVal === "private" && !combType.includes("פרטי") && !combType.includes("ליסינג")) continue;
              if (fleetTypeVal === "commercial" && !combType.includes("מסחרי") && !combType.includes("טנדר") && !combType.includes("ואן")) continue;
              if (fleetTypeVal === "trucks" && !combType.includes("משא") && !combType.includes("הובל") && !combType.includes("רמסע")) continue;
              if (fleetTypeVal === "buses" && !combType.includes("אוטובוס") && !combType.includes("מיניבוס") && !combType.includes("הסעות")) continue;
              if (fleetTypeVal === "tzama" && !combType.includes('צמ"ה') && !combType.includes('צמ״ה') && !combType.includes('צמה') && !combType.includes("עפר") && !combType.includes("תשתית")) continue;
              if (fleetTypeVal === "service" && !combType.includes("שירות") && !combType.includes("טכנאי") && !combType.includes("סיור")) continue;
            }

            // ה. סינון צי (מודל v2 עובדה ופוטנציאל)
            if (fleetModeVal && fleetModeVal !== "all") {
              const flStr = String(rawHit.fleetRounded || rawHit.fleetSizeDisplay || "");
              if (fleetModeVal === "1-4" && !flStr.includes("1–4") && !flStr.includes("1-4") && !flStr.includes("צי קטן")) continue;
              if (fleetModeVal === "5-10" && !flStr.includes("5–10") && !flStr.includes("5-10")) continue;
              if (fleetModeVal === "11-20" && !flStr.includes("10–15") && !flStr.includes("10-15") && !flStr.includes("15–25") && !flStr.includes("11-20")) continue;
              if (fleetModeVal === "21-50" && !flStr.includes("20–50") && !flStr.includes("25–50") && !flStr.includes("21-50")) continue;
              if (fleetModeVal === "51-100" && !flStr.includes("50–100") && !flStr.includes("51-100")) continue;
              if (fleetModeVal === "100plus" && !flStr.includes("100+")) continue;
              if (fleetModeVal === "indication_200" && !String(rawHit.fleetPotential || "").includes("200") && !String(rawHit.ind || "").includes("200")) continue;
              if (fleetModeVal === "potential_5plus" && !String(rawHit.fleetPotential || "").includes("5+") && !rawHit.fleetIsFact) continue;
            }

            // ו. סינון מספר עובדים (מודל הערכת עובדים v2)
            if (workforceVal && workforceVal !== "all") {
              const empNum = (rawHit.approxEmployees !== null && rawHit.approxEmployees !== undefined) ? rawHit.approxEmployees : rawHit.employeesCount;
              if (workforceVal === "1-50" && (empNum === null || empNum < 1 || empNum > 50)) continue;
              if (workforceVal === "51-100" && (empNum === null || empNum < 51 || empNum > 100)) continue;
              if (workforceVal === "101-500" && (empNum === null || empNum < 101 || empNum > 500)) continue;
              if (workforceVal === "501plus" && (empNum === null || empNum < 501)) continue;
              if (workforceVal === "unknown" && empNum !== null) continue;
            }

            // ז. סינון בעל תפקיד / קצין בטיחות מבוקש
            if (targetRoleVal && targetRoleVal !== "all") {
              const rTitle = (String(rawHit.roleTitle || "") + " " + (rawHit.rolesIdentified || []).join(" ") + " " + String(rawHit.contactPerson || "") + " " + String(rawHit.fleetOfficerStatus || "")).toLowerCase();
              if (targetRoleVal === "safety_officer" && !rTitle.includes("בטיחות") && (rawHit.fleetOfficerProb || 0) < 50) continue;
              if (targetRoleVal === "fleet_manager" && !rTitle.includes("צי") && !rTitle.includes("רכב")) continue;
              if (targetRoleVal === "transport_manager" && !rTitle.includes("תחבורה") && !rTitle.includes("לוגיסטיקה")) continue;
              if (targetRoleVal === "ops_manager" && !rTitle.includes("תפעול") && !rTitle.includes("עבודה")) continue;
              if (targetRoleVal === "tech_manager" && !rTitle.includes("מקצועי") && !rTitle.includes("מוסמך")) continue;
              if (targetRoleVal === "ceo_owner" && !rTitle.includes("מנכ") && !rTitle.includes("בעלים")) continue;
            }
            // ח. מנוע הצלבת מקורות ואימות טלפון ירוק מחמיר (True Green Phone Cross-Referencing)
            const hasPhone = rawHit.phone && rawHit.phone !== "לא ידוע" && rawHit.phone !== "לא נמצא" && rawHit.phone !== "—";
            const isMobile = hasPhone && (rawHit.phone.startsWith("05") || String(rawHit.mobile || "").startsWith("05"));
            const hasEmail = rawHit.email && rawHit.email !== "לא ידוע" && rawHit.email !== "—" && rawHit.email.includes("@");

            const phoneSources = [];
            if (hasPhone) {
              if (rawHit.source === "contractors") phoneSources.push("פנקס הקבלנים (data.gov.il)");
              else if (rawHit.source === "business_licenses") phoneSources.push("רישוי עסקים ממשלתי (data.gov.il)");
              else if (rawHit.source === "garages") phoneSources.push("מוסכים ומכוני רישוי (משרד התחבורה)");
              else phoneSources.push(rawHit.source_label || "מאגר ממשלתי");

              // בדיקת הצלבה מול טלפון מאומת במאגר STAGING DB (מקור עצמאי שני)
              const stagingRec = (typeof STAGING_VERIFIED_PHONES !== "undefined") ? STAGING_VERIFIED_PHONES[normHp] : null;
              if (stagingRec && stagingRec.phone) {
                const normP1 = rawHit.phone.replace(/\D/g, "");
                const normP2 = String(stagingRec.phone).replace(/\D/g, "");
                if (normP1 && normP2 && (normP1 === normP2 || normP1.endsWith(normP2) || normP2.endsWith(normP1))) {
                  phoneSources.push("מאגר מאומת STAGING DB");
                }
              }
            }

            // כלל אימות טלפון ירוק: רק אם אותו מספר בדיוק מופיע ב-2 מקורות עצמאיים ומעלה -> GREEN
            const phoneMatches = phoneSources.length;
            rawHit.phoneSourcesList = phoneSources;
            rawHit.phoneMatches = phoneMatches;

            if (phoneMatches >= 2) {
              rawHit.phoneVerBadgeColor = "green";
              rawHit.phoneVerBadgeLabel = (targetCross === 2)
                ? "✓ ירוק (2/2)"
                : `✓ ירוק (מינימום הושג: ${phoneMatches}/${targetCross})`;
              rawHit.phoneVerStatus = `מאומת (${phoneMatches} מקורות עצמאיים: ${phoneSources.join(', ')})`;
            } else if (phoneMatches === 1) {
              rawHit.phoneVerBadgeColor = "yellow";
              rawHit.phoneVerBadgeLabel = `חלקי (1/${targetCross})`;
              rawHit.phoneVerStatus = `אימות חלקי (מקור יחיד: ${phoneSources[0]}) - דורש מקור עצמאי שני לסטטוס ירוק`;
            } else {
              rawHit.phoneVerBadgeColor = "gray";
              rawHit.phoneVerBadgeLabel = `0/${targetCross}`;
              rawHit.phoneVerStatus = "ללא אימות טלפוני עצמאי";
            }

            // אימות אימייל נפרד (אימייל לא הופך טלפון לירוק!)
            const emailSources = [];
            if (hasEmail) {
              if (rawHit.source === "contractors") emailSources.push("פנקס הקבלנים (data.gov.il)");
              else if (rawHit.source === "business_licenses") emailSources.push("רישוי עסקים ממשלתי (data.gov.il)");
              else emailSources.push("רישום רשמי");
            }
            rawHit.emailMatches = emailSources.length;
            rawHit.emailVerLabel = emailSources.length > 0 ? `${emailSources.length}/${targetCross}` : `0/${targetCross}`;

            // ט. סינון פרטי קשר נדרשים
            if (contactReqVal === "green_phone" && rawHit.phoneVerBadgeColor !== "green") continue;
            if (contactReqVal === "phone" && !hasPhone) continue;
            if (contactReqVal === "mobile" && !isMobile) continue;
            if (contactReqVal === "email" && !hasEmail) continue;
            if (contactReqVal === "any" && !hasPhone && !hasEmail) continue;

            // הפרדת טלפון נייח מנייד עסקי
            if (isMobile) {
              rawHit.mobile = rawHit.phone;
              rawHit.phone = "—";
            } else {
              rawHit.mobile = "—";
            }

            // י. חישוב ציון איכות ליד
            const q = evaluateHitQuality(rawHit);
            rawHit.qualityScore = q.score;
            rawHit.qualityColor = q.color;
            rawHit.qualityLabel = q.label;

            // סימון אינדיקציית צי
            if (rawHit.fleetIsFact || String(rawHit.fleetPotential || "").includes("5+")) {
              S.searchStats.fleetEvidence++;
            }

            seenInCurrentRun.add(normHp);
            newBatchHits.push(rawHit);
            S.searchStats.added++;

            if (S.searchStats.added >= reqLimit) break;
          }

          if (newBatchHits.length > 0) {
            S.searchHits.push(...newBatchHits);
            renderSearchHitsProgressive();
            updateLiveKpisAndProgress();
          }
        }
      }

      if (!anyRecordsInRound) {
        break;
      }

      offset += batchSize;
      batchIndex++;
    }
  } catch (globalErr) {
    console.error("שגיאה במנוע החיפוש המאוחד:", globalErr);
    toast("שגיאה בסריקה: " + globalErr.message, "error");
  } finally {
    S.searchRunning = false;
    const durSec = ((Date.now() - startTime) / 1000).toFixed(1);
    updateLiveSearchStatus(`הסריקה הסתיימה בהצלחה ב-${durSec} שניות. אותרו ${S.searchHits.length} חברות חדשות.`);
    renderSearchHitsProgressive();
    updateLiveKpisAndProgress();
    updateActionButtonsState();
  }
}

/* 1. חילוץ רשומת רשם החברות */
function registryHit(rec) {
  const hp = String(rec["מספר חברה"] || "").replace(/\D/g, "");
  const name = String(rec["שם חברה"] || "").replace(/בע~מ|בע״מ|בע"מ/g, "").trim();
  if (!hp || hp.length < 5 || !name) return null;
  const cityRaw = String(rec["שם עיר"] || rec["ישוב"] || "").trim();
  const street = String(rec["שם רחוב"] || "").trim();
  const house = String(rec["מספר בית"] || "").trim();
  const descRaw = String(rec["תאור חברה"] || "").trim();
  const purposeRaw = String(rec["מטרת החברה"] || "").trim();
  const industryText = descRaw || (purposeRaw && !purposeRaw.includes("עיסוק חוקי") ? purposeRaw : "חברה פעילה ברשם");
  const status = String(rec["סטטוס חברה"] || "פעילה").trim();
  const isHeavy = /הובל|משאיות|הפצה|לוגיסטיקה|שינוע|קירור|מנוף|גרירה/.test(name + " " + industryText);

  return {
    no: hp,
    name,
    city: cityRaw || "לא ידוע",
    addr: street ? `${street}${house ? " " + house : ""}${cityRaw ? ", " + cityRaw : ""}` : (cityRaw || "לא ידוע"),
    ind: industryText,
    status: status || "פעילה",
    incorporated: String(rec["תאריך התאגדות"] || "").trim() || "לא ידוע",
    addrKnown: !!street,
    phone: "—",
    mobile: "—",
    email: "—",
    employees: "לא ידוע (ללא אסמכתא)",
    employeesCount: null,
    fleetIsFact: false,
    fleetPotential: isHeavy ? "פוטנציאל צי 5+ (הערכה ענפית)" : "הערכה (ללא אסמכתא)",
    fleetType: isHeavy ? "משאיות הובלה ולוגיסטיקה" : "רכבי עבודה",
    contactPerson: "—",
    roleTitle: isHeavy ? "אינדיקציה: פעילות צי מסחרי" : "",
    roleType: isHeavy ? "industry_indication" : "none",
    source: "companies",
    source_label: "רשם החברות",
    source_url: `https://data.gov.il/dataset/f004176c-b85f-4542-8901-7b3176f9a054`,
    tierLabel: "Tier A | ממשלתי רשמי"
  };
}

function formatIsraeliPhone(raw) {
  if (!raw) return "";
  const digits = String(raw).replace(/\D/g, "");
  if (!digits || digits === "0" || digits === "00" || digits === "000") return "";
  let full = digits;
  if (!full.startsWith("0")) full = "0" + full;
  if (full.length === 10) {
    return full.slice(0, 3) + "-" + full.slice(3, 6) + "-" + full.slice(6);
  }
  if (full.length === 9) {
    return full.slice(0, 2) + "-" + full.slice(2, 5) + "-" + full.slice(5);
  }
  return full;
}

async function saveSelectedToDiscovered() {
  const sel = S.searchHitSelection || new Set();

  }

  const hits = S.searchHits || [];

  if (selectedHits.length === 0) {
    toast("כל החברות שנבחרו כבר קיימות במאגר או נשמרו", "info");

  }

  const ok = confirm(`האם לשמור ${selectedHits.length} חברות חדשות כ'חברות שנמצאו' (שלב 2)?\n\nשימת לב: חברות אלו יישמרו כחברות שנמצאו בלבד ולא יועברו ל'ניהול לידים' ללא אישור נוסף ונפרד.`);

  let addedCount = 0;
  selectedHits.forEach(h => {

    C.push({
      id: "disc_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
      name: h.name,
      no: h.no,
      city: h.city,
      addr: h.addr,
      ind: h.ind,

      found: new Date().toLocaleDateString("he-IL"),
      fleet: h.fleetPotential || "הערכה ענפית",
      phone: h.phone || "—",
      mobile: h.mobile || "—",
      email: h.email || "—",
      contact: h.contactPerson || "—",

async function runAiProspectingSearch() {

  if (!prompt) {
    toast("נא להזין תיאור לחיפוש ה-AI", "warn");

  }

  S.aiSearchRunning = true;
  S._lastAiPrompt = prompt;

  try {

    if (/שירות|טכנאי|התקנות/.test(prompt)) kwList.push("שירות");
    if (/מוסך|רכב|תיקון/.test(prompt)) kwList.push("מוסך");
    if (kwList.length === 0) kwList.push("הובלות");

    S.searchTrack = "free";
    V.search();

  } catch (err) {

    S.aiSearchRunning = false;
    V.search();
  }

/* ===== חברות שנמצאו ===== */
const CO_FILTERS=["st","fleet","stage","phone","mail","contact","ready","missing","quality","city","ind","region","fleetType","fleetSize","source","leadApproved","employeeCount","qualColor","wfStatus","missingField","discoveryBatch","employeeRange","potentialTier","contactType","verState","yellowSubtype","readyOnly","workforceOnly","fleet5PlusOnly","srcCountMobile","srcCountLandline","srcCountEmail"];
function checkMissingField(c, q, fs, mf) {
  if (!q) return false;
  if (mf === "contact") return !OPQualify.hasAnyRealContact(c, q);
  if (mf === "phone") return !OPQualify.hasAnyValidPhone(c, q);
  if (mf === "mobile") return !q.has_mobile_phone;
  if (mf === "email") return !OPQualify.hasAnyValidEmail(c, q);
  if (mf === "website") return !c.web && !(c.enr && c.enr.website);
  if (mf === "fleet_manager") return !(c.enr && c.enr.fleet_manager_name);
  if (mf === "safety_officer") return !(c.enr && c.enr.safety_officer_name);
  if (mf === "fleet") return !fs || fs.fleet.s !== "v";
  return true;
}
function coMatch(c, f) {
  if (!matchLeadFilter(c, f)) return false;
  const q = QF(c), fs = q ? q.field_status : null, s = k => fs && fs[k] ? fs[k].s : "n";
  const yn = (v, on) => !v || (v === "yes" ? on : !on);
  const t = (f.q || "").trim().toLowerCase();

  if (t) {
    const inName = (c.name || "").toLowerCase().includes(t);
    const inCity = (c.city || "").toLowerCase().includes(t);
    const inInd = (c.ind || "").toLowerCase().includes(t);
    const inNo = String(c.no || "").toLowerCase().includes(t);
    const inEnrContact = (c.enr && String(c.enr.contact_name || "")).toLowerCase().includes(t);
    const inContacts = q && Array.isArray(q.contacts_list) && q.contacts_list.some(ct =>
      String(ct.name || "").toLowerCase().includes(t) ||
      String(ct.role || "").toLowerCase().includes(t) ||
      String(ct.phone || "").includes(t)
    );
    const inPeople = Array.isArray(c.people) && c.people.some(p => {
      const pName = Array.isArray(p) ? p[0] : (p?.name || p?.contact_name);
      return String(pName || "").toLowerCase().includes(t);
    });
    const inPhone = String(c.phone || "").includes(t) || (c.enr && String(c.enr.phone || "").includes(t));
    const inKw = String(c.source_keyword || "").toLowerCase().includes(t);
    if (!(inName || inCity || inInd || inNo || inEnrContact || inContacts || inPeople || inPhone || inKw)) {
      return false;
    }
  }

  if (f.st && c.status !== f.st) return false;
  if (f.fleet && s("fleet") !== f.fleet) return false;
  if (f.stage && (q ? q.lead_stage : "basic") !== f.stage) return false;

  if (!yn(f.phone, OPQualify.hasAnyValidPhone(c, q))) return false;
  if (!yn(f.mail, OPQualify.hasAnyValidEmail(c, q))) return false;
  if (!yn(f.contact, OPQualify.hasAnyRealContact(c, q))) return false;
  if (!yn(f.ready, isReady(c))) return false;

  if (f.missing) {
    if (f.missing === "required" && (!q || q.blockers.length === 0)) return false;
    if (f.missing === "any" && (!q || q.missing_fields.length === 0)) return false;
    if (f.missing === "none" && (!q || q.missing_fields.length > 0)) return false;
  }

  if (f.quality && (q ? q.lead_quality : "low") !== f.quality) return false;
  if (f.city && c.city !== f.city) return false;
  if (f.ind && c.ind !== f.ind) return false;

  // 1. Region filter
  if (f.region) {
    const reg = c.region || (window.OPQualify ? OPQualify.cityToRegion(c.city) : "לא ידוע");
    if (reg !== f.region) return false;
  }

  // 2. Vehicle / Fleet type filter
  if (f.fleetType && !(c.fleetType && c.fleetType.includes(f.fleetType))) return false;

  // 3. Fleet size / 5+ Potential filter
  if (f.fleetSize) {
    const is5PlusVerified = Number.isInteger(c.fleet_size) && c.fleet_size >= 5 && (q ? q.fleet_size_status === 'verified' : false);
    const is5PlusPotential = !!(c.fleetType && (c.fleetType.includes('צמ"ה') || c.fleetType.includes('משאיות') || c.fleetType.includes('אוטובוס') || (c.ind && (c.ind.includes('תשתית') || c.ind.includes('עפר') || c.ind.includes('הובל')))));
    const isUnknown = !c.fleet_size || c.fleet_size === 'לא ידוע' || (q && q.fleet_size_status === 'unknown');
    if (f.fleetSize === '5plus_verified' && !is5PlusVerified) return false;
    if (f.fleetSize === '5plus_potential' && !is5PlusPotential) return false;
    if (f.fleetSize === 'unknown' && !isUnknown) return false;
  }

  // 4. Source filter
  if (f.source) {
    const evStr = Array.isArray(c.ev) ? c.ev.map(x => Array.isArray(x) ? x.join(" ") : JSON.stringify(x)).join(" ") : String(c.ev || "");
    const srcList = String(c.source_list || "");
    const mainSrc = String(c.source || "");
    const allSrc = `${evStr} ${srcList} ${mainSrc}`;
    if (f.source === "contractors" && !allSrc.includes("קבלנים")) return false;
    if (f.source === "companies" && !allSrc.includes("רשם החברות")) return false;
    if (f.source === "manual" && !(c.enr?.field_status?.manual && Object.keys(c.enr.field_status.manual).length > 0)) return false;
    if (f.source === "ai" && !(c.enr?.enrichment_source === "gemini" || c.enr?.enrichment_source === "gemini_incremental")) return false;
  }

  // 5. Approved Lead status filter
  if (f.leadApproved) {
    const isApp = c.isApprovedLead !== false;
    if (f.leadApproved === "yes" && !isApp) return false;
    if (f.leadApproved === "no" && isApp) return false;
  }

  // 6. Employee count filter
  if (f.employeeCount) {
    const isKnown = c.size && c.size !== "לא ידוע" && c.size !== "אין מידע";
    if (f.employeeCount === "known" && !isKnown) return false;
    if (f.employeeCount === "unknown" && isKnown) return false;
  }

  if (f.qualColor) {
    if (f.qualColor === "green_plus") {
      if (!q || q.lead_quality_color !== "green" || !q.is_quality_plus) return false;
    } else {
      if ((q ? q.lead_quality_color : "red") !== f.qualColor) return false;
    }
  }

  if (f.wfStatus) {
    const curWf = (q ? q.workflow_status : (c.enr?.enrichment_status || "new"));
    if (f.wfStatus === "sent_to_ai") {
      if (curWf !== "sent_to_ai" && curWf !== "queued_for_ai" && c.enr?.enrichment_status !== "sent_to_ai" && c.enr?.enrichment_status !== "queued_for_ai") {
        return false;
      }
    } else {
      if (curWf !== f.wfStatus) return false;
    }
  }

  if (f.missingField && !checkMissingField(c, q, fs, f.missingField)) return false;

  // 7. Discovery Batch filter (Mission 3 - Sections 2 & 10)
  if (f.discoveryBatch) {
    const b = c.discovery_batch || "batch_1";
    if (f.discoveryBatch === "batch_1" && b !== "batch_1") return false;
    if (f.discoveryBatch === "batch_2" && b !== "batch_2") return false;
    if (f.discoveryBatch === "future" && (b === "batch_1" || b === "batch_2")) return false;
  }

  // 8. Employee Range filter (Mission 3 - Section 4)
  if (f.employeeRange) {
    const wf = q?.workforce_estimate || c.workforce_estimate || {};
    const range = String(c.employee_range || wf.employee_count_range || "");
    const cnt = c.employee_count || c.approx_employees || wf.approx_employees || 0;
    if (f.employeeRange === "1-10" && !(cnt >= 1 && cnt <= 10 || range.includes("1–10") || range.includes("1-10"))) return false;
    if (f.employeeRange === "11-50" && !(cnt >= 11 && cnt <= 50 || range.includes("11–50") || range.includes("11-50") || range.includes("25"))) return false;
    if (f.employeeRange === "51-200" && !(cnt >= 51 && cnt <= 200 || range.includes("51–200") || range.includes("51-200") || range.includes("50–100") || range.includes("100–250"))) return false;

function renderPanel(){
  const el=$("#panel");

  el.innerHTML=`<div class="overlay" data-act="closePanel"><div class="panel" role="dialog" aria-modal="true" aria-label="כרטיס חברה" data-stop>${S.panel.person!=null?personCard(c,c.people[S.panel.person]):companyCard(c)}</div></div>`;
}

            <div class="xs" style="margin-top:2px">${esc(d)}</div><div class="xs faint ltr">${esc(u)}</div></div></div>`).join("")}

}

/* ===== ניהול לידים (KANBAN) ===== */
V.leads=()=>{
  const cat = S.leadCategory || "all";
  const approvedC = C.filter(c => c.isApprovedLead !== false);
  const readyForWorkLeads = approvedC.filter(c => {
    const q = QF(c);
    const ct = window.OPQualify ? OPQualify.classifyLeadContacts(c, q) : null;
    const phoneVer = ct ? (ct.mobileStatus === "verified" || ct.landlineStatus === "verified") : false;
    const mailVer = ct ? ct.emailStatus === "verified" : false;
    return phoneVer && mailVer;
  });
  const pendingContactLeads = approvedC.filter(c => !readyForWorkLeads.includes(c));

  const safetyCount = approvedC.filter(c => c.isSafetyOfficerLead).length;
  const trucksCount = approvedC.filter(c => c.fleetType && (c.fleetType.includes("משאיות") || c.fleetType.includes("פולטריילר") || c.fleetType.includes("סמי") || c.fleetType.includes("רמסע") || c.fleetType.includes("קירור"))).length;
  const machineryCount = approvedC.filter(c => c.fleetType && (c.fleetType.includes("צמ\"ה") || c.fleetType.includes("עפר") || c.ind.includes("עפר") || c.ind.includes("תשתית"))).length;
  const busCount = approvedC.filter(c => c.fleetType && (c.fleetType.includes("אוטובוס") || c.fleetType.includes("היסע"))).length;

  let filteredC = approvedC;
  if (S.leadActiveFilter) {
    filteredC = approvedC.filter(c => matchLeadFilter(c, S.leadActiveFilter));
  } else if (cat === "pending_contacts") {
    filteredC = pendingContactLeads;
  } else if (cat === "approved_all") {
    filteredC = approvedC;
  } else if (cat === "safety_officer") {
    filteredC = approvedC.filter(c => c.isSafetyOfficerLead);
  } else if (cat === "trucks") {
    filteredC = approvedC.filter(c => c.fleetType && (c.fleetType.includes("משאיות") || c.fleetType.includes("פולטריילר") || c.fleetType.includes("סמי") || c.fleetType.includes("רמסע") || c.fleetType.includes("קירור")));
  } else if (cat === "machinery") {
    filteredC = approvedC.filter(c => c.fleetType && (c.fleetType.includes("צמ\"ה") || c.fleetType.includes("עפר") || c.ind.includes("עפר") || c.ind.includes("תשתית")));
  } else if (cat === "buses") {
    filteredC = approvedC.filter(c => c.fleetType && (c.fleetType.includes("אוטובוס") || c.fleetType.includes("היסע")));
  } else {
    // רשימת עבודה ראשית כברירת מחדל: רק לידים בעלי טלפון ואימייל מאומתים יחד
    filteredC = readyForWorkLeads;
  }

  /* תצוגת שלבי ליד: "ready" = מוכן לפנייה, "stage:<key>" = כל שלב אחר */
  const stageKey = (!S.leadActiveFilter && cat === "ready") ? "ready" : (!S.leadActiveFilter && cat.startsWith("stage:") ? cat.slice(6) : "");
  if (stageKey) filteredC = approvedC.filter(c => stageKey === "ready" ? isReady(c) : stageOf(c) === stageKey);
  const stageCounts = {};
  approvedC.forEach(c => { const s = stageOf(c); stageCounts[s] = (stageCounts[s] || 0) + 1; });
  stageCounts.ready = approvedC.filter(isReady).length;

  return `
  <!-- כותרת ראשית וסנכרון CRM -->
  <div class="row" style="margin-bottom:12px;align-items:center;flex-wrap:wrap;gap:8px">
    <h2 style="margin:0;font-size:18px">ניהול לידים וסטטוס טיפול</h2>
    <span class="badge b-blue">מוכן להעברה ל-CRM</span>
    <span class="spacer"></span>
    <button class="btn btn-sm btn-primary" data-tab="search" style="display:inline-flex;align-items:center;gap:6px">
      ⚡ ייבוא לידים באצוות (Bulk Ingestion)
    </button>
    <button class="btn btn-sm" data-act="export" style="display:inline-flex;align-items:center;gap:6px">
      ⬇ ייצוא CSV
    </button>
    <button class="btn btn-sm" data-act="exportBackup" style="display:inline-flex;align-items:center;gap:6px" title="הורד קובץ גיבוי JSON של כל הלידים">
      💾 גיבוי JSON
    </button>
    <label class="btn btn-sm" style="cursor:pointer;margin:0;display:inline-flex;align-items:center;gap:6px" title="שחזר לידים מקובץ גיבוי JSON">
      📂 שחזור JSON<input type="file" id="jsonBackupInputLeads" accept=".json" style="display:none" data-act="importBackup">
    </label>

  ${S.leadActiveFilter ? `
  <div class="active-filter-banner" style="background:linear-gradient(135deg,rgba(37,99,235,0.08),rgba(16,185,129,0.08));border:1.5px solid var(--blue);border-radius:12px;padding:12px 18px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:24px">🎯</span>
      <div>
        <div style="font-size:16px;font-weight:700;color:var(--text)">סינון פעיל: ${esc(S.leadActiveFilter.label || "סינון מותאם")}</div>
        <div class="xs muted" style="margin-top:2px">מוצגים <b class="num" style="color:var(--blue);font-size:13px">${filteredC.length}</b> לידים מאושרים התואמים לקריטריונים</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-sm btn-primary" data-act="copyVerifiedMobiles" data-source="leads" style="font-weight:700;display:inline-flex;align-items:center;gap:6px">
        📋 העתק ניידים מאומתים (${countVerifiedMobiles(filteredC)})
      </button>
      <button class="btn btn-sm" data-act="clearLeadFilter" style="background:var(--card);border:1px solid var(--border)">
        ✕ נקה סינון / הצג הכל
      </button>
      <button class="btn btn-sm" data-tab="dash" style="color:var(--text);font-weight:600;border:1px solid var(--border);background:var(--card);display:inline-flex;align-items:center;gap:4px">
        ↩️ חזור לדשבורד
      </button>
    </div>
  </div>
  ` : ''}

  <!-- סרגל סינון מהיר והחלפת תצוגה -->
  <div class="row" style="margin-bottom:14px;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px">
    <span class="xs bold" style="color:var(--text);margin-inline-end:4px">🔍 סינון מתקדם:</span>
    ${renderLeadFilterDropdowns()}
    <span class="spacer"></span>
    <div class="seg" style="margin-inline-end:6px">
      <button class="btn btn-sm ${S.leadsViewMode==='table'?'btn-primary':''}" style="${S.leadsViewMode==='table'?'background:var(--blue);color:#fff':''}" data-act="setLeadsViewMode" data-mode="table">📋 טבלה</button>
      <button class="btn btn-sm ${S.leadsViewMode==='kanban'?'btn-primary':''}" style="${S.leadsViewMode==='kanban'?'background:var(--blue);color:#fff':''}" data-act="setLeadsViewMode" data-mode="kanban">📊 לוח (Kanban)</button>
    </div>
    <button class="btn btn-sm btn-primary" data-act="copyVerifiedMobiles" data-source="leads" style="font-size:12px;display:inline-flex;align-items:center;gap:4px">
      📋 העתק ניידים (${countVerifiedMobiles(filteredC)})
    </button>
  </div>

  <!-- סרגל סינון קטגוריות ראשי (Category Filter Bar) -->
  <div class="row" style="margin-bottom:14px;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px">
    <span class="xs bold" style="color:var(--text);margin-inline-end:4px">רשימת עבודה:</span>
    <button class="btn btn-sm" style="${(!S.leadActiveFilter && cat==='all')?'background:#1d4ed8;color:#fff;border-color:#1d4ed8;font-weight:700':'background:var(--soft);color:var(--text);border:1px solid var(--border)'}" data-lead-cat="all" title="חברות בעלות טלפון ואימייל מאומתים יחד">
      📞✉️ רשימת עבודה ראשית (${readyForWorkLeads.length})
    </button>
    <button class="btn btn-sm" style="${(!S.leadActiveFilter && cat==='pending_contacts')?'background:#b45309;color:#fff;border-color:#b45309;font-weight:700':'background:var(--soft);color:var(--text);border:1px solid var(--border)'}" data-lead-cat="pending_contacts" title="חברות שחסר בהן טלפון או אימייל מאומת">
      ⏳ ממתינים להשלמת פרטי קשר (${pendingContactLeads.length})
    </button>
    <button class="btn btn-sm" style="${(!S.leadActiveFilter && cat==='approved_all')?'background:#475569;color:#fff;border-color:#475569;font-weight:700':'background:var(--soft);color:var(--text);border:1px solid var(--border)'}" data-lead-cat="approved_all">
      📋 כל הלידים המאושרים (${approvedC.length})
    </button>
    <span class="spacer"></span>
    <span class="xs bold" style="color:var(--text);margin-inline-end:4px">פילוח ענפי:</span>
    <button class="btn btn-sm" style="${(!S.leadActiveFilter && cat==='safety_officer')?'background:#1d4ed8;color:#fff;border-color:#1d4ed8;font-weight:700':'background:var(--soft);color:var(--text);border:1px solid var(--border)'}" data-lead-cat="safety_officer">
      🛡️ קצב"ת (${safetyCount})
    </button>
    <button class="btn btn-sm" style="${(!S.leadActiveFilter && cat==='trucks')?'background:#1d4ed8;color:#fff;border-color:#1d4ed8;font-weight:700':'background:var(--soft);color:var(--text);border:1px solid var(--border)'}" data-lead-cat="trucks">
      🚛 משאיות (${trucksCount})
    </button>
    <button class="btn btn-sm" style="${(!S.leadActiveFilter && cat==='machinery')?'background:#1d4ed8;color:#fff;border-color:#1d4ed8;font-weight:700':'background:var(--soft);color:var(--text);border:1px solid var(--border)'}" data-lead-cat="machinery">
      🚜 צמ"ה (${machineryCount})
    </button>
    <button class="btn btn-sm" style="${(!S.leadActiveFilter && cat==='buses')?'background:#1d4ed8;color:#fff;border-color:#1d4ed8;font-weight:700':'background:var(--soft);color:var(--text);border:1px solid var(--border)'}" data-lead-cat="buses">
      🚌 היסעים (${busCount})
    </button>
    <button class="btn btn-sm" style="${(!S.leadActiveFilter && cat==='ready')?'background:#15803d;color:#fff;border-color:#15803d;font-weight:700':'background:var(--soft);color:var(--text);border:1px solid var(--border)'}" data-lead-cat="ready">
      ✅ מוכן לפנייה (${stageCounts.ready || 0})
    </button>
    <span class="chip num" style="font-size:12px">מוצגים ${filteredC.length} לידים</span>
  </div>
  <div class="row" style="margin:-6px 0 14px;flex-wrap:wrap;gap:6px;align-items:center">
    <span class="xs bold" style="margin-inline-end:4px">שלבי ליד:</span>
    ${(window.OPQualify ? OPQualify.STAGES : []).map(([k, l]) => `<button class="badge ${STAGE_STY[k]}" style="cursor:pointer;font-size:11.5px;border:${stageKey===k?'2px solid currentColor':'1px solid transparent'}" data-lead-cat="${k==='ready'?'ready':'stage:'+k}">${l} · ${stageCounts[k] || 0}</button>`).join("")}
  </div>

  ${(!S.leadActiveFilter && cat === "safety_officer") ? `
    <!-- באנר הסבר ומעמד חוקי: קצין רכב / קצין בטיחות בתעבורה (תקנה 579) -->
    <div class="card card-b" style="border:1.5px solid #93c5fd;background:linear-gradient(135deg,rgba(59,111,224,0.08),rgba(255,255,255,0.02));margin-bottom:16px;border-radius:12px;padding:14px 18px">
      <div class="row" style="flex-wrap:wrap;gap:12px;align-items:flex-start">
        <div style="flex:1;min-width:280px">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:22px">🛡️</span>
            <h3 style="margin:0;font-size:16px;color:#1e3a8a">מועמדים לבדיקת קצין בטיחות בתעבורה (קצב"ת)</h3>
            <span class="badge b-est" style="font-weight:700">${safetyCount} לידים לבדיקה</span>
            <span class="badge b-est" style="font-weight:700">${filteredC.filter(soNamed).length} קצינים אותרו (דורש אימות: ${filteredC.filter(c => soNamed(c) && !soVerified(c)).length})</span>
            <span class="badge b-ok" style="font-weight:700">${filteredC.filter(soVerified).length} חובת קצב"ת מאומתת</span>
          </div>
          <div class="sm" style="margin-top:8px;line-height:1.5;color:var(--text)">
            חברות אלו מופיעות במאגרים רשמיים (פנקס הקבלנים, מאגרי רכב כבד / צמ"ה / אוטובוסים) ונראות רלוונטיות לבדיקה.
            חובת מינוי <b>קצין בטיחות בתעבורה (תקנה 579)</b> <b>לא הוכחה</b> עבורן, אלא אם מסומן במפורש "חובת קצב"ת מאומתת" או "קצין בטיחות אותר".
            איש מקצוע כשיר מפנקס הקבלנים (OVDIM) אינו קצין בטיחות.
          </div>
          <div class="xs muted" style="margin-top:6px;display:flex;gap:12px;flex-wrap:wrap">
            <span>✓ <b>רשומות ממקור אמיתי</b> (ח.פ. ממאגר רשמי)</span>
            <span>✓ נתונים רשמיים ממאגרי <b>data.gov.il</b> ופנקס הקבלנים</span>
            <span>✓ ללא שמות מומצאים (Tier A/B)</span>
            <span>✓ מדרג מהימנות שקוף לכל טלפון ומייל</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-self:center">
          <span class="badge b-blue" style="padding:6px 12px;font-size:12.5px">🎯 יעד אסטרטגי לדליה</span>
          <span class="xs muted text-center">הסכמי מוסך ציים</span>
        </div>
      </div>
    </div>
  ` : ''}

  ${(S.leadsViewMode !== "kanban" || stageKey) ? stageTable(filteredC, S.leadActiveFilter ? S.leadActiveFilter.label : (stageKey ? (window.OPQualify ? OPQualify.STAGE_LABEL[stageKey] : stageKey) : "רשימת לידים מאושרים")) : `
  <!-- לוח KANBAN לניהול הלידים -->
  <div class="board">
    ${STATUSES.map(([k,l])=>{
      const list = filteredC.filter(c => c.status === k);
      const limit = S.leadsLimit || 40;
      const visibleList = list.slice(0, limit);
      const hasMore = list.length > limit;
      return `
      <div class="col">
        <div class="col-h">

          <span class="n num">${list.length}</span>

          <div class="lead" data-co="${c.id}" style="position:relative">

/* ===== עזרים להורדת קבצים ===== */
function downloadTextFile(content, fileName, mimeType) {
  const blob = new Blob([content], { type: mimeType || "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ===== עוזר AI כללי (General AI Assistant - OpenProspector) ===== */
function loadAiChatHistory() {
  try {
    const raw = sessionStorage.getItem("op_ai_chat_history_v2");
    if (raw) {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length > 0) return arr;
    }
  } catch (e) {}
  return null;
}

function saveAiChatHistory() {
  try {
    sessionStorage.setItem("op_ai_chat_history_v2", JSON.stringify(S.aiChatMessages.slice(-50)));
  } catch (e) {}
}

function initAiChatWelcome() {
  const saved = loadAiChatHistory();
  if (saved && saved.length > 0) {
    S.aiChatMessages = saved;
    return;
  }
  S.aiChatMessages = [
    {
      role: "assistant",
      text: `שלום יוני! 👋 אני עוזר ה-AI של OpenProspector לניהול ציי רכב.
אני מחובר ישירות לנתוני המאגר החי ב-STAGING (${C.length} חברות) ולרשם החברות הממשלתי.

תוכל לבקש ממני בשפה חופשית בעברית:
• 🔍 "תמצא לי 20 חברות הובלה באזור המרכז"
• 🚚 "חפש עסקים שיש להם לפחות 5 רכבים"

function appendAiContextLeadIntro(lead) {
  const q = QF(lead);
  const qCol = q ? q.lead_quality_color : "yellow";
  const colIcon = qCol === "green" ? "🟢" : qCol === "yellow" ? "🟡" : "🔴";
  const bp = q ? q.business_potential_score : lead.score;
  const cr = q ? q.contact_readiness_score : 0;
  S.aiChatMessages.push({
    role: "assistant",
    text: `🔍 **פוקוס על ליד:** **${esc(lead.name)}** (ח.פ. ${lead.no || "לא צוין"})
איכות: ${colIcon} ${q ? q.lead_quality_label : ""} | פוטנציאל עסקי: **${bp}%** | מוכנות לפנייה: **${cr}%**
עיר: ${lead.city || "לא ידוע"} | תחום: ${lead.ind || "כללי"}

${q && q.why_not_green ? `📌 **סטטוס איכות:** ${q.why_not_green}` : ""}
${q && q.detailed_missing_fields && q.detailed_missing_fields.length ? `⚠️ **מה חסר:** ${q.detailed_missing_fields.join(", ")}` : ""}`,
    chips: [
      "למה הליד הזה צהוב?",
      "מה חסר לליד זה?",
      "האם כדאי להעביר להעשרת AI?",
      "האם כדאי לשלוח לספק חיצוני?"
    ]
  });
  saveAiChatHistory();
}

function handleAiUserMessage(userText) {
  if (!userText || !userText.trim()) return;
  const qText = userText.trim();
  if (S.aiChatBusy) return;
  S.aiChatBusy = true;
  const seq = ++S.aiChatSeq;
  S.aiChatMessages.push({ role: "user", text: qText });
  const pending = { role: "assistant", text: "בודק את הנתונים ומעבד תשובה…" };
  S.aiChatMessages.push(pending);
  saveAiChatHistory();
  renderAiChat();
  const b = $("#aiChatBody");
  if (b) b.scrollTop = b.scrollHeight;

  const finish = (reply) => {
    S.aiChatBusy = false;
    if (seq !== S.aiChatSeq) {
      pending.text = "השאלה הוחלפה בשאלה חדשה יותר, והתשובה הזו לא עודכנה.";
      saveAiChatHistory();
      renderAiChat();
      return;
    }
    pending.text = reply.text;
    pending.chips = reply.chips || null;
    pending.actionCard = reply.actionCard || null;
    pending.actionFilter = reply.actionFilter || null;
    pending.retryPrompt = reply.retryPrompt || null;
    saveAiChatHistory();
    renderAiChat();
    const b2 = $("#aiChatBody");
    if (b2) b2.scrollTop = b2.scrollHeight;
    const inp = $("#aiChatInput");
    if (inp) inp.focus();
  };

  try {
    const local = processAiQuery(qText);
    if (local) { finish(local); return; }
  } catch(e) {
    console.error("[Prospector Query Error]", e);
  }

  askGeminiFreeform(qText).then(finish).catch(err => {
    finish({
      role: "assistant",
      text: `⚠️ שגיאה בלתי צפויה: ${esc(err.message || String(err))}.\n\nהשיחה נשמרה בצורה מאובטחת.`,
      chips: ["🔄 נסה שוב", "תמליץ על 5 הלידים המובילים ביותר לדליה"],
      retryPrompt: qText
    });
  });
}

/* ===== מנוע הבינה העסקית וההמלצות של דליה (DALIA FLEET INTELLIGENCE & RECOMMENDATION ENGINE) ===== */

function scoreLeadForDaliaFleet(c) {
  let s = c.score || 50;
  const fText = ((c.fleet && c.fleet.val) || "") + " " + (c.fleetType || "");
  const indText = (c.ind || "") + " " + (c.leadReason || "");
  if (/משאיות|עפר|צמ"ה|צמה|רמסע|סמיטריילר|כבדים/.test(fText)) s += 35;
  if (/הובל|שינוע|לוגיסטיקה|עפר|תשתיות|כבישים|מחצבות/.test(indText)) s += 25;
  if (c.isSafetyOfficerLead || (c.safetyOfficer && c.safetyOfficer.mandate579)) s += 20;
  if (c.phone && c.phone !== "לא נמצא" && c.phone !== "n") s += 15;
  if (c.people && c.people.length > 0) s += 15;
  const q = QF(c);
  if (q && q.business_potential_score) s += Math.round(q.business_potential_score / 5);
  return s;
}

function findCompanyInQuery(q) {
  if (S.aiChatContextLead) return S.aiChatContextLead;
  const hpMatch = q.match(/\b\d{8,9}\b/);
  if (hpMatch) {
    const found = C.find(c => c.no && String(c.no).includes(hpMatch[0]));
    if (found) return found;
  }
  const isBroad = /(?:תמצא|חפש|תסנן|תציג|תראה|רשימ|המלצ|כמה|עסקים|חברות הובלה|חברות לוגיסטיקה)/.test(q);
  const isExplicitCompany = /(?:חברת|חברה|כרטיס|עבור|של|דוסייה)\s+([^\s]+)/.test(q);
  if (isBroad && !isExplicitCompany) return null;

  const stopWords = new Set([
    "חברת", "חברה", "של", "על", "מי", "מה", "איך", "האם", "ליד", "לידים", "פרטים", "נתח", "הסבר",
    "אינפורמציה", "טוב", "טובה", "טובים", "טובות", "יותר", "הכי", "עבור", "תספר", "המצב", "כמה",
    "רוצה", "לדעת", "תן", "תמליץ", "תמליצי", "המלצה", "המלצות", "רכב", "צי", "ציי", "רכבים", "משאית",
    "משאיות", "הובלה", "הובלות", "הובלת", "שינוע", "עפר", "תשתית", "תשתיות", "כביש", "כבישים",
    "לוגיסטיקה", "קבלן", "קבלני", "קבלנים", "דרום", "בדרום", "מרכז", "במרכז", "צפון", "בצפון",
    "שפלה", "בשפלה", "באר", "שבע", "אשקלון", "אשדוד", "תל", "אביב", "חיפה", "חולון", "ראשון", "לציון",
    "שירות", "שירותים", "שירותי", "מוסך", "מוסכים", "דליה", "אורן", "קאר", "הצעת", "ערך", "תקנה",
    "בטיחות", "לי", "לו", "לה", "לנו", "להם", "עוד", "בין", "רק", "גם", "את", "אתה", "אתם", "היא",
    "הוא", "הם", "מתאים", "מתאימה", "מתאימות", "מתאימים", "המתאים", "המתאימה", "המתאימים", "המתאימות",
    "רשימה", "רשימת", "אנא", "בבקשה", "איזה", "אילו", "אפשר", "אשמח", "כל", "הכל", "יש", "אין",
    "באזור", "אזור", "מציג", "תמצא", "חפש", "עסקים", "פוטנציאל"
  ]);
  const cleanQ = q.replace(/[?!,.:;""''״׳]/g, " ").trim();
  const words = cleanQ.split(/\s+/).map(w => w.trim()).filter(w => w.length >= 3 && !stopWords.has(w));
  if (!words.length) return null;

  let best = null;
  let bestScore = 0;
  for (const c of C) {
    const cTokens = (c.name || "").split(/\s+/).map(t => t.replace(/[^\u0590-\u05FFa-zA-Z0-9]/g, "").trim());
    let score = 0;
    for (const w of words) {
      const stems = [w];
      if (/^[וכבלמה]/.test(w) && w.length >= 4) stems.push(w.slice(1));
      for (const st of stems) {
        if (cTokens.includes(st)) score += 10;
        else if (c.name && c.name.includes(st)) score += 3;
      }
    }
    if (score > bestScore) {
      bestScore = score;
      best = c;
    }
  }
  return bestScore >= 10 ? best : null;
}

function executeConversationalSearch(userQuery) {
  const q = userQuery.toLowerCase();

  // 1. Target count
  const countMatch = q.match(/\b(\d+)\s*(?:חברות|לידים|עסקים)?/);
  let targetCount = countMatch ? Math.min(50, Math.max(1, parseInt(countMatch[1], 10))) : (q.includes("תמצא") ? 20 : (q.includes("10") ? 10 : 5));

  // 2. Industry
  let industry = "";
  let indLabel = "כל הענפים";
  if (q.includes("הובל") || q.includes("שינוע") || q.includes("משאית") || q.includes("משאיות")) {
    industry = "הובל";
    indLabel = "הובלה ושינוע";
  } else if (q.includes("לוגיסט") || q.includes("הפצ") || q.includes("שליח")) {
    industry = "לוגיסט";
    indLabel = "לוגיסטיקה והפצה";
  } else if (q.includes("עפר") || q.includes("תשתית") || q.includes("כביש") || q.includes("מחצב") || q.includes("בניי") || q.includes("בניה")) {
    industry = "תשתית";
    indLabel = "תשתיות, עפר וכבישים";
  } else if (q.includes("הסע") || q.includes("היסע") || q.includes("אוטובוס")) {
    industry = "הסע";
    indLabel = "היסעים ותחבורה";
  } else if (q.includes("שירות") || q.includes("טכנא")) {
    industry = "שירות";
    indLabel = "שירות וטכנאי שטח";
  }

  // 3. Location / Region / Cities
  let city = "";
  let region = "";
  if (q.includes("ראשון לציון") || q.includes("ראשל\"צ") || q.includes("ראשלצ")) city = "ראשון לציון";
  else if (q.includes("חולון")) city = "חולון";
  else if (q.includes("תל אביב") || q.includes("ת\"א")) city = "תל אביב";
  else if (q.includes("פתח תקווה") || q.includes("פ\"ת")) city = "פתח תקווה";
  else if (q.includes("אשדוד")) city = "אשדוד";
  else if (q.includes("אשקלון")) city = "אשקלון";
  else if (q.includes("באר שבע")) city = "באר שבע";
  else if (q.includes("חיפה")) city = "חיפה";

  if (!city) {
    if (q.includes("מרכז") || q.includes("במרכז")) region = "מרכז";
    else if (q.includes("דרום") || q.includes("בדרום")) region = "דרום";
    else if (q.includes("צפון") || q.includes("בצפון")) region = "צפון";
    else if (q.includes("שפלה") || q.includes("בשפלה")) region = "שפלה";
  }

  const dualCities = [];
  if (q.includes("ראשון לציון") || q.includes("ראשל\"צ")) dualCities.push("ראשון לציון");
  if (q.includes("חולון")) dualCities.push("חולון");

  // 4. Fleet requirements
  const minFleet20 = q.includes("20 רכבים") || q.includes("מעל 20") || q.includes("20+");
  const minFleet5 = q.includes("5 רכבים") || q.includes("לפחות 5") || q.includes("5+");

  // 5. Not yet in leads filter
  const notInLeads = q.includes("לא נמצאות ברשימת הלידים") || q.includes("עוד לא נמצאות") || q.includes("שעוד לא") || q.includes("שלא ברשימת הלידים");

  // Filter against C (the 618 leads in STAGING)
  let list = [...C];

  if (notInLeads) {
    list = list.filter(c => c.status === "new");
  }

  if (dualCities.length > 0) {
    list = list.filter(c => dualCities.some(dc => (c.city || "").includes(dc)));
  } else if (city) {
    list = list.filter(c => (c.city || "").includes(city));
  } else if (region) {
    list = list.filter(c => (c.region || "").includes(region) || (c.city || "").includes(region));
  }

  if (industry) {
    list = list.filter(c => (c.ind || "").includes(industry) || (c.leadReason || "").includes(industry) || (c.name || "").includes(industry));
  }

  if (minFleet20) {
    list = list.filter(c => c.isSafetyOfficerLead || (c.safetyOfficer && c.safetyOfficer.mandate579) || /משאיות|צמ"ה|סמיטריילר|כבדים/.test((c.fleet?.val || "") + (c.fleetType || "")));
  }

  // Score and sort
  list.sort((a, b) => scoreLeadForDaliaFleet(b) - scoreLeadForDaliaFleet(a));

  const totalFound = list.length;
  const matches = list.slice(0, targetCount);

  if (!matches.length) {
    return {
      role: "assistant",
      text: `🔍 לא אותרו חברות התואמות במדויק את כל תנאי החיפוש בתוך מאגר ${C.length} הלידים ב-STAGING.
(חיפשת: ${indLabel} | ${city ? `עיר: ${city}` : (region ? `אזור: ${region}` : "כל הארץ")}${minFleet20 ? " | צי 20+ רכבים" : ""}).

💡 **המלצה:** נסה להרחיב את החיפוש לאזור גיאוגרפי סמוך או לכלל ענפי התחבורה והתשתיות.`,
      chips: ["תמליץ על 5 הלידים המובילים לדליה", "תמצא 20 חברות הובלה במרכז", "מי מחויבת בתקנה 579?"]
    };
  }

  let criteriaLabel = [];
  if (industry) criteriaLabel.push(`בענף ${indLabel}`);
  if (dualCities.length) criteriaLabel.push(`באזור ${dualCities.join(" ו")}`);
  else if (city) criteriaLabel.push(`בעיר ${city}`);
  else if (region) criteriaLabel.push(`באזור ${region}`);
  if (minFleet20) criteriaLabel.push(`עם פוטנציאל לצי של מעל 20 רכבים (תקנה 579)`);
  else if (minFleet5) criteriaLabel.push(`עם לפחות 5 רכבים`);
  if (notInLeads) criteriaLabel.push(`שטרם הועברו לרשימת הלידים`);

  const criteriaText = criteriaLabel.length ? criteriaLabel.join(" · ") : "המתאימות לשירותי דליה";

  const cardsText = matches.map((c, i) => {
    const qf = QF(c);
    const fVal = (c.fleet && c.fleet.val) || c.fleetType || "צי רכבי עבודה ומסחריות";
    const isFleetVerified = !!(c.fleet && c.fleet.src);
    const fleetStatus = isFleetVerified ? `✅ מאומת מול ${c.fleet.src}` : `📊 הערכת ענף (הערה: צי משוער אינו נתון מאומת)`;
    const phone = c.phone && c.phone !== "לא נמצא" ? `\`${c.phone}\`` : "❌ טרם אותר";
    const contact = (c.people && c.people[0]) ? `${c.people[0][0]} (${c.people[0][1]})` : (c.enr?.contact_name || "קצין רכב / מנהל תפעול");
    const missing = [];
    if (!OPQualify.hasAnyValidPhone(c, qf)) missing.push("טלפון");
    if (!OPQualify.hasAnyRealContact(c, qf)) missing.push("איש קשר");
    if (!isFleetVerified) missing.push("אימות גודל צי ממשלתי");
    if (!c.enr?.safety_officer_name && (c.isSafetyOfficerLead || c.safetyOfficer?.mandate579)) missing.push("קצב\"ת בשם");

    return `🏢 **${i + 1}. ${c.name}** (ח.פ. \`${c.no || "—"}\`)
• **עיר וענף:** ${c.city || "—"} (${c.region || "—"}) · ${c.ind || "—"}
• **צי רכב:** **${fVal}** (${fleetStatus})
• **התאמה לשירותי דליה:** ${c.leadReason || "חברה בעלת צי עבודה מסחרי הדורשת שירותי ניהול, תחזוקה שוטפת וצמצום זמני השבתה."}
• **איש קשר וטלפון:** ${contact} | טלפון: ${phone}
• **פרטים חסרים לאימות:** ${missing.length ? missing.join(", ") : "נתונים בסיסיים שלמים"}
• **עדיפות לפנייה:** ${qf?.lead_quality_color === "green" ? "🟢 עדיפות עליונה" : "🟡 עדיפות שנייה (דורש העשרה)"}`;
  }).join("\n\n---\n\n");

  const actionFilter = industry
    ? { key: "ind", val: industry, label: `🔍 סנן ${matches.length} חברות אלו בטבלה` }
    : (region ? { key: "city", val: region, label: `🔍 סנן לפי אזור ${region}` } : undefined);

  return {
    role: "assistant",
    text: `🔍 **תוצאות איתור אמיתיות ממאגר 618 הלידים ב-STAGING:**
אותרו **${totalFound} חברות אמיתיות** ${criteriaText} (מוצגות ${matches.length} המובילות):

${cardsText}

💡 **התאמה עסקית מקיפה לדליה:**
דליה מספקת מעטפת ניהול, תחזוקה, תפעול ופיקוח בטיחות (תקנה 579) לציי רכב עסקיים מעל 5 רכבים כדי למנוע השבתת רכבים (Downtime). דליה אינה מוסך.`,
    chips: [
      "תסנן לי את החברות המתאימות",
      "תציג רק חברות עם מספר טלפון",
      "תכין לי העברה של החברות שבחרתי לרשימת הלידים",
      "תכין לי תוכנית עבודה לפנייה לחברות"

${items}

function buildRegulation579Analysis() {
  const mandated = C.filter(c => c.isSafetyOfficerLead || (c.safetyOfficer && c.safetyOfficer.mandate579));
  const openPositions = mandated.filter(c => c.safetyOfficer && /טרם אותר|טרם נמצא|בבדיקה/i.test(c.safetyOfficer.name || ""));
  const topList = mandated.slice(0, 5).map((c, i) => {
    return `${i + 1}. **${c.name}** (ח.פ. \`${c.no}\`) · צי: **${(c.fleet && c.fleet.val) || "רכב כבד"}** · עיר: ${c.city}\n   • סטטוס קצב"ת: ${(c.safetyOfficer && c.safetyOfficer.note) || "חובת מינוי לפי דין"}`;

  return {

    text: `⚖️ **ניתוח חברות תחת תקנה 579 לתקנות התעבורה (חובת קצין בטיחות בתעבורה):**

בחברות שבהן טרם אותר קצב"ת מכהן, דליה יכולה להציע חבילת ניהול צי משולבת: פיקוח קצב"ת מוסמך יחד עם מעטפת תחזוקה מונעת וצמצום ימי השבתה! (דליה אינה מוסך).`,

      "איך לפנות למנהלי ציים אלו?"

function executeNaturalQuery(userQuery, isFallback = false) {
  const q = (userQuery || "").trim().toLowerCase();
  const ctx = S.aiChatContextLead;

  // 1. Filter by phone
  if (q.includes("רק חברות עם") && q.includes("טלפון") || q.includes("תציג רק חברות עם מספר טלפון") || (q.includes("סנן") && q.includes("טלפון") && !q.includes("בלי") && !q.includes("חסר") && !q.includes("אין"))) {
    S.coFilter.phone = "yes";
    S.coPage = 1;
    S.view = "prospector";
    S.tab = "companies";
    render();
    const withPhoneCount = C.filter(c => OPQualify.hasAnyValidPhone(c, QF(c))).length;
    return {
      role: "assistant",
      text: `📞 **הופעל סינון בטבלה:** מוצגות כעת **${withPhoneCount} חברות עם מספר טלפון מאומת** מתוך ${C.length}.\n\nהתצוגה עברה ללשונית "חברות שנמצאו".`,
      chips: ["תסנן לי את החברות המתאימות", "תכין לי רשימה של 10 החברות הכי טובות", "הכן העברה לרשימת הלידים"],
      actionFilter: { key: "phone", val: "yes", label: "🔍 הצג חברות עם טלפון" }
    };
  }

  // 2. Filter suitable companies
  if (q.includes("תסנן לי את החברות המתאימות") || (q.includes("סנן") && q.includes("מתאימ"))) {
    S.coFilter.qualColor = "green";
    S.coPage = 1;
    S.view = "prospector";
    S.tab = "companies";
    render();
    const greenCount = C.filter(c => QF(c)?.lead_quality_color === "green").length;
    return {
      role: "assistant",
      text: `🎯 **הופעל סינון בטבלה:** מוצגות **${greenCount} חברות מובילות (סיווג ירוק)** עם פוטנציאל עסקי גבוה ומוכנות לפנייה ישירה לדליה.\n\nהתצוגה עברה ללשונית "חברות שנמצאו".`,
      chips: ["תציג רק חברות עם מספר טלפון", "תכין לי רשימה של 10 החברות הכי טובות", "תכין לי תוכנית עבודה לפנייה לחברות"],
      actionFilter: { key: "qualColor", val: "green", label: "🔍 הצג חברות ירוקות" }
    };
  }

  // 3. Companies not yet in leads
  if (q.includes("עדיין לא הועברו") || q.includes("עוד לא הועברו") || q.includes("שלא הועברו ללידים") || q.includes("שטרם הועברו")) {
    S.coFilter.st = "new";
    S.coPage = 1;
    S.view = "prospector";
    S.tab = "companies";
    render();
    const newCount = C.filter(c => c.status === "new").length;
    return {
      role: "assistant",
      text: `📋 **הופעל סינון בטבלה:** מוצגות **${newCount} חברות במאגר בסטטוס 'חדש'** שטרם הועברו לתהליך העבודה וניהול הלידים.\n\nהתצוגה עברה ללשונית "חברות שנמצאו".`,
      chips: ["תכין לי העברה של החברות שבחרתי לרשימת הלידים", "תכין לי רשימה של 10 החברות הכי טובות", "סנן רק עם טלפון"],
      actionFilter: { key: "st", val: "new", label: "🔍 הצג חברות חדשות שטרם הועברו" }
    };
  }

  // 4. Open company card
  if (q.includes("פתח לי את הכרטיס") || q.includes("פתח כרטיס") || q.includes("הצג כרטיס")) {
    let targetCo = S.aiChatContextLead;
    if (!targetCo) {
      targetCo = findCompanyInQuery(userQuery);
    }
    if (!targetCo) {
      targetCo = [...C].sort((a, b) => scoreLeadForDaliaFleet(b) - scoreLeadForDaliaFleet(a))[0];
    }
    if (targetCo) {
      S.panel = { co: targetCo.id };
      renderPanel();
      return {
        role: "assistant",
        text: `🏢 **כרטיס החברה נפתח בהצלחה:**\nפתחתי את כרטיס החברה של **${targetCo.name}** (ח.פ. \`${targetCo.no || "—"}\`).\nהכרטיס מוצג כעת על המסך עם מלוא הנתונים המאומתים, אנשי הקשר ושרשרת הראיות.`,
        chips: ["למה הליד הזה צהוב?", "מה חסר לליד זה?", "תמליץ על עוד חברות דומות"]
      };
    }
  }

  // 5. Prepare lead transfer with Preview and Confirmation
  if (q.includes("העברה של החברות") || q.includes("העברה לרשימת הלידים") || q.includes("העבר לרשימת הלידים") || q.includes("העבר ללידים") || q.includes("הכן העברה")) {
    let candidates = [];
    if (S.selectedCoIds && S.selectedCoIds.size > 0) {
      candidates = C.filter(c => S.selectedCoIds.has(c.id) && c.isApprovedLead === false);
    }
    if (!candidates.length && ctx && ctx.isApprovedLead === false) {
      candidates = [ctx];
    }
    if (!candidates.length) {
      candidates = C.filter(c => c.isApprovedLead === false).slice(0, 5);
    }
    if (!candidates.length) {
      return {
        role: "assistant",
        text: `ℹ️ **אין חברות חדשות הממתינות לאישור כליד:**\n\nכל ${C.length} החברות הקיימות במערכת כבר מאושרות כלידים, או שלא נבחרו חברות בלתי-מאושרות.\nניתן לבצע חיפוש חדש ברשם החברות כדי לאתר חברות נוספות ולאשר אותן כלידים.`,
        chips: ["תמליץ על 5 הלידים המובילים ביותר לדליה", "כמה לידים בלי טלפון יש?", "למה יש כל כך הרבה לידים צהובים?"]
      };
    }

    const itemsSummary = candidates.map((c, i) => `${i+1}. **${c.name}** (ח.פ. \`${c.no || "—"}\`) · ${c.city || "—"} · ${c.ind || "—"}`).join("\n");

    return {
      role: "assistant",
      text: `📥 **תצוגה מקדימה לאישור ${candidates.length} חברות חדשות כלידים (Preview):**

להלן החברות שנמצאו באיתור וממתינות לאישור להעברה לרשימת הלידים:

${itemsSummary}

⚠️ **אבטחה ושליטה:** פעולה זו אינה משנה נתונים של לידים קיימים. הנתונים לא ישתנו ללא אישורך המפורש בלחיצה על הכפתור מטה.`,
      actionCard: {
        id: "transfer_leads_" + Date.now(),
        type: "transfer_to_leads",
        title: `📥 אישור והעברת ${candidates.length} חברות לרשימת הלידים`,
        description: `אישור החברות כלידים פעילים במערכת והעברתן לניהול לידים (STAGING מקומי).`,
        leads: candidates
      },
      chips: ["בטל העברה", "תכין לי תוכנית עבודה לפנייה לחברות", "תסנן לי את החברות המתאימות"]
    };
  }

  // 6. Top 10 list
  if (q.includes("10 החברות הכי טובות") || q.includes("רשימה של 10") || q.includes("עשר החברות") || (q.includes("10") && q.includes("מוביל"))) {
    const top10 = [...C].sort((a, b) => scoreLeadForDaliaFleet(b) - scoreLeadForDaliaFleet(a)).slice(0, 10);
    const listStr = top10.map((c, i) => {
      const fVal = (c.fleet && c.fleet.val) || c.fleetType || "צי מסחרי";
      const fSrc = (c.fleet && c.fleet.src) ? `(מאומת: ${c.fleet.src})` : "(הערכת ענף)";
      const person = (c.people && c.people[0]) ? `${c.people[0][0]} (${c.people[0][1]}) - ${c.people[0][4] || c.phone || ""}` : (c.phone || "—");
      return `🔹 **${i+1}. ${c.name}** (ח.פ. \`${c.no || "—"}\`)
   • עיר: ${c.city || "—"} | ענף: ${c.ind || "—"}
   • צי רכב: **${fVal}** ${fSrc}
   • איש קשר: ${person}
   • התאמה לדליה: ${c.leadReason || "צי עבודה הדורש טיפולים שוטפים וצמצום זמני השבתה."}`;
    }).join("\n\n");

    return {
      role: "assistant",
      text: `⭐ **10 החברות המובילות ביותר במאגר לשירותי ניהול ציים של דליה:**

${listStr}

💡 **למה חברות אלו נבחרו:**
חברות אלו מחזיקות בצי רכבי עבודה כבדים/מסחריים, בעלות פוטנציאל עסקי מעל 80%, ומאפשרות לדליה לספק מענה מלא: ניהול טיפולים שוטפים, עמידה בתקנות תעבורה, וצמצום ימי השבתה (Downtime). דליה אינה מוסך.`,
      chips: ["תכין לי העברה של החברות שבחרתי לרשימת הלידים", "תכין לי תוכנית עבודה לפנייה לחברות", "תציג רק חברות עם מספר טלפון"]
    };
  }

  // 7. Outreach plan
  if (q.includes("תוכנית עבודה") || q.includes("תכנית עבודה") || q.includes("איך לפנות") || q.includes("תסריט פנייה") || q.includes("מדריך פנייה")) {
    return buildDaliaSalesGuidance();
  }

  // 8. Regulation 579
  if (q.includes("579") || q.includes("קצין בטיחות") || q.includes("קצב\"ת") || q.includes("קצבת")) {
    return buildRegulation579Analysis();
  }

  // 9. Specific Company
  const isSearchIntent = q.includes("תמצא") || q.includes("חפש") || q.includes("תציג") || q.includes("רשימ") || q.includes("המלצ") || q.includes("כמה");
  const foundCo = findCompanyInQuery(userQuery);
  if (foundCo && !isSearchIntent) {
    return buildCompanyDossier(foundCo);
  }

  // 10. Conversational Search
  if (isSearchIntent || q.includes("הובל") || q.includes("לוגיסט") || q.includes("עפר") || q.includes("תשתית") || q.includes("רכבים") || q.includes("לקוחות פוטנציאליים")) {
    return executeConversationalSearch(userQuery);
  }

  // 11. Recommendations
  if (q.includes("תמליץ") || q.includes("המלצה") || q.includes("המלצות") || q.includes("5 הלידים המובילים") || q.includes("לידים מומלצים")) {
    return buildDaliaRecommendations();
  }

  if (isFallback) {
    if (q.includes("שלום") || q.includes("היי") || q.includes("בוקר") || q.includes("ערב") || q.includes("לעזור") || q.includes("מי אתה") || q.includes("מה אתה")) {
      return {
        role: "assistant",
        text: `👋 **שלום! אני עוזר ה-AI של OpenProspector לניהול ציי רכב דליה.**\n\nאני כאן כדי לסייע לך לאתר לקוחות עסקיים, לנתח ציי רכב ולייצר פניות אפקטיביות.\n*(הבהרה: דליה אינה מוסך — דליה מספקת שירותי ניהול ציים, תחזוקה מונעת, ליווי קצב"ת לפי תקנה 579 וצמצום זמני השבתה לחברות עם 5 רכבים ומעלה).*\n\n🎯 **איך אני יכול לעזור לך עכשיו:**\n• **חיפוש וסינון:** *"תמצא לי 20 חברות הובלה במרכז"*, *"סנן חברות עם לפחות 5 רכבים"*, או *"תציג רק חברות עם מספר טלפון"*.\n• **המלצות ממוקדות:** *"תמליץ על 5 הלידים המובילים ביותר לדליה"* או *"מי מחויבת בתקנה 579?"*.\n• **תחקור חברה ספציפית:** שאל אותי על חברה מסוימת (למשל *"מה אתה יודע על מדן קבלנות?"* או *"פתח לי את הכרטיס"*).\n• **העברה לניהול לידים:** *"תכין לי העברה לרשימת הלידים"* (כולל תצוגה מקדימה ואישור).\n• **הכנה לפנייה:** *"תכין לי תוכנית עבודה לפנייה לחברות"*.`,
        chips: [
          "תמליץ על 5 הלידים המובילים ביותר לדליה",
          "תמצא לי 20 חברות הובלה באזור המרכז",
          "תסנן לי את החברות המתאימות",
          "מי מחויבת בתקנה 579?"
        ]
      };
    }
    return buildDaliaRecommendations();
  }

  return null;
}

async function askGeminiFreeform(question) {
  const sess = await userSession();
  const ls = leadStats();
  const ctx = S.aiChatContextLead;
  const qLead = ctx ? QF(ctx) : null;
  const facts = {
    total: ls.total,
    ready_for_contact: ls.ready,
    missing_phone: ls.noPhone,
    missing_email: ls.noMail,
    missing_contact: ls.noContact,
    fleet_unverified: ls.fleetUnverified,
    stages: ls.stage,
    quality: ls.quality,
    paid_candidates: ls.paidCand
  };
  const lead = ctx ? {
    name: ctx.name,
    hp: ctx.no || "",
    city: ctx.city || "לא ידוע",
    stage: qLead && qLead.lead_stage,
    ready: isReady(ctx),
    missing: qLead && qLead.missing_fields,
    why_not_ready: qLead && qLead.why_not_green
  } : null;

  if (sess) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 22000);
    try {
      let res = await fetch(`${SUPABASE_STAGING_URL}/functions/v1/marketing-gemini-chat`, {
        method: "POST",
        signal: controller.signal,
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_STAGING_ANON,
          "Authorization": `Bearer ${sess.accessToken}`
        },
        body: JSON.stringify({
          system: "אתה עוזר OpenProspector של דליה לניהול ציי רכב. ענה בעברית מקצועית. דליה מספקת שירותי ניהול, תחזוקה, תפעול ופיקוח בטיחות (תקנה 579) לציי רכב עסקיים (5 רכבים ומעלה). דליה אינה מוסך. השתמש רק בעובדות שב-JSON. הבחן בין עובדה מאומתת להערכה. המלץ על חברות המתאימות לשירותי דליה עם נימוקים וראיות.",
          clientContext: { facts, lead },
          prompt: question
        })
      });
      clearTimeout(timeoutId);

      // If token expired (401), try one silent refresh and retry
      if (res.status === 401 && sbClient) {
        try {
          const { data: refData } = await sbClient.auth.refreshSession();
          if (refData && refData.session && refData.session.access_token) {
            sess.accessToken = refData.session.access_token;
            res = await fetch(`${SUPABASE_STAGING_URL}/functions/v1/marketing-gemini-chat`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_STAGING_ANON,
                "Authorization": `Bearer ${sess.accessToken}`
              },
              body: JSON.stringify({
                system: "אתה עוזר OpenProspector של דליה לניהול ציי רכב. ענה בעברית מקצועית. דליה מספקת שירותי ניהול, תחזוקה, תפעול ופיקוח בטיחות (תקנה 579) לציי רכב עסקיים (5 רכבים ומעלה). דליה אינה מוסך. השתמש רק בעובדות שב-JSON. הבחן בין עובדה מאומתת להערכה. המלץ על חברות המתאימות לשירותי דליה עם נימוקים וראיות.",
                clientContext: { facts, lead },
                prompt: question
              })
            });
          }
        } catch (rfErr) {
          console.warn("[Prospector] Retry after refresh failed:", rfErr);
        }
      }

      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok && (data.reply || data.text)) {
        return {
          role: "assistant",
          text: `🤖 **תשובת Gemini AI (מודל חי ב-STAGING):**\n\n${String(data.reply || data.text)}`,
          chips: ["תמליץ על 5 הלידים המובילים ביותר לדליה", "מי מחויבת בתקנה 579?", "תכין לי תוכנית עבודה לפנייה לחברות"]
        };
      }

      const judged = geminiTestResult(res, data);
      const fallback = executeNaturalQuery(question, true);
      const http = data.upstream_status || res.status;
      return {
        role: "assistant",
        text: `⚠️ **הודעת מערכת Gemini (קוד ${http || "—"}):** ${judged.label}\n\n⚡ **מענה חלופי ממנוע הניתוח והאיתור המקומי של דליה:**\n\n${fallback.text}`,
        chips: fallback.chips || ["🔄 נסה שוב", "תמליץ על 5 הלידים המובילים לדליה"],
        actionFilter: fallback.actionFilter,
        actionCard: fallback.actionCard,
        retryPrompt: question
      };
    } catch (e) {
      clearTimeout(timeoutId);
      const isTimeout = e.name === "AbortError";
      const errMsg = isTimeout ? "הקריאה ל-Gemini חרגה ממגבלת הזמן (Timeout של 22 שניות)" : (e.message || "שגיאת רשת");
      const fallback = executeNaturalQuery(question, true);
      return {
        role: "assistant",
        text: `⚠️ **שגיאת תקשורת עם Gemini ב-STAGING (${errMsg}):**\n\n⚡ **מענה חלופי ממנוע הניתוח והאיתור המקומי של דליה:**\n\n${fallback.text}`,
        chips: fallback.chips || ["🔄 נסה שוב", "תמליץ על 5 הלידים המובילים ביותר לדליה"],
        actionFilter: fallback.actionFilter,
        actionCard: fallback.actionCard,
        retryPrompt: question
      };
    }
  }

  // Without session: Full local mode
  const fallback = executeNaturalQuery(question, true);
  return {
    role: "assistant",
    text: `ℹ️ **מצב תצוגה פתוח (מנוע הלידים וההמלצות של דליה פועל ישירות מול 618 הלידים המאומתים):**\n\n${fallback.text}`,
    chips: fallback.chips,
    actionFilter: fallback.actionFilter,
    actionCard: fallback.actionCard
  };
}

function processAiQuery(query) {

  // 1. Context-specific queries for active lead

    const lq = QF(ctx);
    return {
      role: "assistant",
      text: `🏢 **ניתוח איכות עבור: ${ctx.name}**
צבע סיווג: **${lq?.lead_quality_label || "צהוב"}**
ציון פוטנציאל עסקי: **${lq?.business_potential_score || 0}%**
ציון מוכנות לפנייה: **${lq?.contact_readiness_score || 0}%**
