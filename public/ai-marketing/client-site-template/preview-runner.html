<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Client Preview Runner</title>
  <style>
    body{margin:0;font-family:Heebo,Arial,sans-serif;background:#0b1020;color:#fff}
    header{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.2);display:flex;justify-content:space-between;gap:12px;align-items:center}
    main{padding:16px}
    .muted{opacity:.8;font-size:12px}
    .card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:12px;margin-bottom:10px}
    a{color:#93c5fd}
  </style>
</head>
<body>
  <header>
    <div>Client Preview Runner</div>
    <div class="muted" id="state">loading...</div>
  </header>
  <main>
    <div class="card" id="summary"></div>
    <div class="card" id="links"></div>
  </main>
  <script>
    (function () {
      function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
      var summary = document.getElementById('summary');
      var links = document.getElementById('links');
      var state = document.getElementById('state');
      var raw = null;
      try { raw = JSON.parse(localStorage.getItem('coco-website-builder-preview-site-v1') || 'null'); } catch (e) { raw = null; }
      if (!raw || !raw.pages || !raw.pages.length) {
        state.textContent = 'no preview found';
        summary.innerHTML = 'לא נמצא preview פעיל בלוקאל סטורג\'. בנה אתר מתוך Website Builder ואז חזור למסך זה.';
        links.innerHTML = '—';
        return;
      }
      state.textContent = 'ready';
      summary.innerHTML = 'לקוח: <strong>' + esc(raw.slug || 'client-preview') + '</strong><br>עמודים: ' + raw.pages.length + '<br>מצב: preview זמני בלבד';
      links.innerHTML = raw.pages.map(function (p) {
        return '<div style="margin-bottom:8px;"><a href="' + esc(p.blobUrl || '#') + '" target="_blank" rel="noopener">' + esc(p.title || p.fileName) + '</a></div>';
      }).join('');
    })();
  </script>
</body>
</html>
