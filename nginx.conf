# Production nginx — synced from live VPS /etc/nginx/sites-enabled/future-craft-core
# Source of truth for paths: /site/, /orin-marketing/, /, SPA catch-all.
# Brand site files live OUTSIDE dist: /root/future-craft-core/site-static/
# Deploy must NOT wipe site-static/ (see .github/workflows/deploy-production-vps.yml).

server {
    server_name dalia-car.online www.dalia-car.online;
    root /root/future-craft-core/dist;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # CO.CO Wave2 — exact SPA entry (keep /ai-marketing/* static assets)

    # New marketing entry (button "ניהול שיווק חדש") — platform only, no SPA
    location = /marketing {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /ai-marketing-platform.html =404;
    }
    location = /marketing/ {
        return 301 /marketing;
    }

    location = /ai-marketing {
        # Serve gated marketing platform (Owner/super_admin). Not SPA landing.
        try_files /ai-marketing-platform.html =404;
    }
    location = /ai-marketing/ {
        return 301 /ai-marketing;
    }

    # Marketing assets first (prefix ^~ beats later regex; prevents 1y immutable mix)
    location ^~ /ai-marketing/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location ^~ /crm/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location = /ai-marketing-platform.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /ai-marketing-platform.html =404;
    }
    location = /coco-owner-gate.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /coco-owner-gate.js =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # OPS_API_BLOCK begin
    location /ops-api/ {
        proxy_pass http://127.0.0.1:7700/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
    # OPS_API_BLOCK end

    location ^~ /coco-reports/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # Brand site — static, outside SPA (Multi-Asset)
    location ^~ /site/ {
        alias /root/future-craft-core/site-static/;
        index index.html;
        add_header Cache-Control "public, max-age=300";
    }
    location = /site {
        return 301 /site/;
    }
    # Legacy preview → permanent brand site
    location ^~ /orin-marketing/client-previews/dalia-c-official/ {
        rewrite ^/orin-marketing/client-previews/dalia-c-official/(.*)$ /site/$1 permanent;
    }
    location = /orin-marketing/client-previews/dalia-c-official {
        return 301 /site/;
    }

    # Virtual path: single physical ai-marketing-platform.html under /orin-marketing/
    location = /orin-marketing/ai-marketing-platform.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /ai-marketing-platform.html =404;
    }

    # Isolated Orin marketing — fully static, no SPA fallback mix
    location = /orin-marketing {
        return 301 /orin-marketing/;
    }
    location = /orin-marketing/ {
        return 302 /orin-marketing/coco-dalia/pirsum-home.html$is_args$args;
    }
    location ^~ /orin-marketing/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    server_tokens off;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dalia-car.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dalia-car.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.dalia-car.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = dalia-car.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name dalia-car.online www.dalia-car.online;
    return 404; # managed by Certbot
}
