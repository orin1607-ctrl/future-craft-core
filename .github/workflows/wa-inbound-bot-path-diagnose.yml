name: WA inbound bot path diagnose (no send)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/wa-inbound-bot-path-diagnose.mjs'
      - 'public/project-001/wa-inbound-bot-path-queue.json'
      - '.github/workflows/wa-inbound-bot-path-diagnose.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose inbound bot path (read-only)
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          MAKE_ZONE: ${{ secrets.MAKE_ZONE }}
        run: node scripts/wa-inbound-bot-path-diagnose.mjs
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/project-001/wa-inbound-bot-path-result.json || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "ci: inbound WhatsApp bot path diagnose (no send, no Production)"
          git push
