name: Oren Car Production driver tracking center

# Owner authorized 2026-10-15: driver-tracking center ONLY onto live SHA 0132b70c.
# Source of the screen: 3d4e7df0 (STAGING). Frontend code-only.
# Does NOT checkout main/dev/origin/production wholesale.
# Does not migrate, alter schema, change RLS, Storage, Auth, or customer data.

on:
  push:
    branches: [cross/prod-driver-tracking]
    paths:
      - 'public/project-001/oren-car-prod-driver-tracking.json'
      - '.github/workflows/oren-car-prod-driver-tracking.yml'
  workflow_dispatch:

concurrency:
  group: oren-car-prod-driver-tracking
  cancel-in-progress: false

env:
  PROD_SUPABASE_URL: https://qasomfndnjuixgjmjwcm.supabase.co
  PROD_SUPABASE_PROJECT_ID: qasomfndnjuixgjmjwcm
  WEB_ROOT: /root/future-craft-core/dist
  PRODUCTION_URL: https://dalia-car.online
  LIVE_BEFORE: 0132b70c703994f38952b36e8e4d85509e4106e0

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate — armed + live ancestor + driver-tracking files only
        id: gate
        run: |
          set -euo pipefail
          armed=$(node -e "const q=require('./public/project-001/oren-car-prod-driver-tracking.json'); process.stdout.write(String(q.armed===true))")
          echo "armed=$armed" >> "$GITHUB_OUTPUT"
          echo "SHA=${GITHUB_SHA}"
          if [ "$armed" != "true" ]; then
            echo "not armed — skip deploy"
            exit 0
          fi
          git merge-base --is-ancestor "$LIVE_BEFORE" HEAD
          if git rev-parse origin/main >/dev/null 2>&1; then
            MAIN=$(git rev-parse origin/main || true)
            if [ "$GITHUB_SHA" = "$MAIN" ]; then
              echo "REFUSING to deploy origin/main wholesale" >&2
              exit 1
            fi
          fi
          if git rev-parse origin/production >/dev/null 2>&1; then
            PROD=$(git rev-parse origin/production || true)
            if [ "$GITHUB_SHA" = "$PROD" ]; then
              echo "REFUSING to deploy origin/production wholesale" >&2
              exit 1
            fi
          fi
          mapfile -t changed < <(git diff --name-only "$LIVE_BEFORE" HEAD)
          allow='^(src/pages/DriverTracking\.(tsx|test\.tsx)|src/components/driver-tracking/.+|src/lib/driverTracking(Data\.test|Data|Load|Dates)\.ts|src/App\.tsx|src/components/BottomNav\.tsx|src/components/home/HomeDashboard\.tsx|src/hooks/useHiddenButtons\.ts|src/lib/daliaPageContext\.ts|src/lib/routeAccess(\.test)?\.ts|scripts/generate-spa-route-shells\.mjs|\.github/workflows/oren-car-prod-driver-tracking\.yml|public/project-001/oren-car-prod-driver-tracking\.json)$'
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "REFUSING empty diff from live" >&2
            exit 1
          fi
          for f in "${changed[@]}"; do
            if ! [[ "$f" =~ $allow ]]; then
              echo "REFUSING unexpected file: $f" >&2
              exit 1
            fi
          done
          echo "changed_files=${#changed[@]}"

      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.gate.outputs.armed == 'true' }}

      - name: Install + build production frontend
        if: ${{ steps.gate.outputs.armed == 'true' }}
        env:
          VITE_SUPABASE_URL: ${{ env.PROD_SUPABASE_URL }}
          VITE_SUPABASE_PROJECT_ID: ${{ env.PROD_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          bun install --frozen-lockfile
          bun x vite build
          node scripts/ci-smoke-report.mjs --dist dist --supabase-ref qasomfndnjuixgjmjwcm
          if grep -q usfeoerkpcafxxlyuldl dist/assets/*.js; then
            echo "REFUSING staging supabase ref in production bundle" >&2
            exit 1
          fi
          if ! grep -q driver-tracking dist/assets/*.js; then
            echo "REFUSING bundle without driver-tracking" >&2
            exit 1
          fi

      - id: bundle
        if: ${{ steps.gate.outputs.armed == 'true' }}
        run: |
          BUNDLE=$(grep -oE 'index-[^"]+\.js' dist/index.html | head -1)
          echo "name=${BUNDLE}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        if: ${{ steps.gate.outputs.armed == 'true' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Backup VPS dist then rsync frontend
        if: ${{ steps.gate.outputs.armed == 'true' }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%F-%H%M%S)
          SSH=(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=6)
          RSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=6"
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "backup_attempt=$attempt"
            if "${SSH[@]}" ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "tar czf /root/pre-deploy-dist-${STAMP}.tgz -C /root/future-craft-core dist && echo BACKUP=/root/pre-deploy-dist-${STAMP}.tgz"; then
              ok=1
              break
            fi
            sleep $((attempt * 8))
          done
          test "$ok" = "1"
          rsync -avz -e "$RSH" \
            --delete \
            --filter="P orin-marketing/" \
            --filter="P orin-owner-gate.js" \
            dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.WEB_ROOT }}/
          "${SSH[@]}" ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo 'commit=${{ github.sha }} bundle=${{ steps.bundle.outputs.name }} at=$(date -u +%Y-%m-%dT%H:%M:%SZ) reason=driver-tracking-center-only-2026-10-15 before=${{ env.LIVE_BEFORE }}' > /root/future-craft-core/dist/PRODUCTION-DEPLOY.txt"
          "${SSH[@]}" ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "nginx -t && systemctl reload nginx"

      - uses: actions/setup-node@v4
        if: ${{ steps.gate.outputs.armed == 'true' }}
        with:
          node-version: '20'

      - name: Post-deploy smoke (live)
        if: ${{ steps.gate.outputs.armed == 'true' }}
        run: |
          sleep 5
          node scripts/ci-smoke-report.mjs \
            --base "${{ env.PRODUCTION_URL }}" \
            --supabase-ref qasomfndnjuixgjmjwcm \
            --out reports/ci-smoke-oren-car-driver-tracking.json
