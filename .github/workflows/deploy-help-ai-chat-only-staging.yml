name: Staging help-ai-chat only

# Deploys help-ai-chat to dalia-staging (usfeoerkpcafxxlyuldl) only.
# Runs ONLY when a matching tag is pushed — pushing the branch never runs it.
# No migration, no other function, no Pages, no Production.
#   deploy/help-ai-chat-staging/<name>    → help-ai-chat from the tagged commit
#   rollback/help-ai-chat-staging/<name>  → help-ai-chat as live before (v149 = 00ac6c73)
# Keeps verify_jwt off, as live (config.toml says true; the function checks auth itself).
# Uses STAGING_SUPABASE_ACCESS_TOKEN only.

on:
  push:
    tags:
      - 'deploy/help-ai-chat-staging/*'
      - 'rollback/help-ai-chat-staging/*'

permissions:
  contents: read

concurrency:
  group: deploy-help-ai-chat-only-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard Staging only
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = "tag"
          case "${GITHUB_REF_NAME}" in
            deploy/help-ai-chat-staging/*|rollback/help-ai-chat-staging/*) ;;
            *) echo "Unexpected ref ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac
          test "usfeoerkpcafxxlyuldl" != "qasomfndnjuixgjmjwcm"

      - name: Prepare help-ai-chat files
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            rollback/*) MODE=rollback ;;
            *) MODE=deploy ;;
          esac
          bash scripts/help-ai-chat-staging-prepare-deploy.sh "$MODE" .

      - name: Deploy help-ai-chat to Staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          export SUPABASE_ACCESS_TOKEN="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$SUPABASE_ACCESS_TOKEN"
          npx --yes supabase functions deploy help-ai-chat --project-ref usfeoerkpcafxxlyuldl --use-api --no-verify-jwt
