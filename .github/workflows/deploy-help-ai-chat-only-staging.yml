name: Staging help-ai-chat only

# Deploys help-ai-chat to dalia-staging (usfeoerkpcafxxlyuldl) only.
# Runs when a matching tag is pushed, or via manual workflow_dispatch.
# No migration, no other function, no Pages, no Production.
# Keeps verify_jwt off, as live (config.toml says true; the function checks auth itself).

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'deploy/help-ai-chat-staging/*'
      - 'rollback/help-ai-chat-staging/*'

permissions:
  contents: read

concurrency:
  group: deploy-help-ai-chat-only-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard Staging only
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF_TYPE}" = "tag"
            case "${GITHUB_REF_NAME}" in
              deploy/help-ai-chat-staging/*|rollback/help-ai-chat-staging/*) ;;
              *) echo "Unexpected ref ${GITHUB_REF_NAME}" >&2; exit 1 ;;
            esac
          fi
          test "usfeoerkpcafxxlyuldl" != "qasomfndnjuixgjmjwcm"

      - name: Prepare help-ai-chat files
        run: |
          set -euo pipefail
          MODE=deploy
          if [ "${GITHUB_REF_NAME:-}" = "rollback" ] || [[ "${GITHUB_REF_NAME:-}" =~ ^rollback/ ]]; then
            MODE=rollback
          fi
          bash scripts/help-ai-chat-staging-prepare-deploy.sh "$MODE" .

      - name: Deploy help-ai-chat to Staging
        env:
          TOKEN_1: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          TOKEN_2: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TOKEN_3: ${{ secrets.SUPABASE_STAGING_PRECHECK_TOKEN }}
        run: |
          set -euo pipefail
          deployed=0
          for tok in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3"; do
            clean="$(printf '%s' "$tok" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [ -z "$clean" ]; then continue; fi
            echo "Attempting deploy with token candidate (length ${#clean})..."
            
            # Verify access to staging project and ensure never targeting production
            PROBE_RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -H "Authorization: Bearer $clean" https://api.supabase.com/v1/projects/usfeoerkpcafxxlyuldl)
            PROBE_STATUS=$(echo "$PROBE_RESP" | grep "HTTP_STATUS:" | cut -d: -f2)
            PROBE_BODY=$(echo "$PROBE_RESP" | grep -v "HTTP_STATUS:" | head -c 200)
            echo "Probe for usfeoerkpcafxxlyuldl: HTTP $PROBE_STATUS - $PROBE_BODY"
            
            # Also check GET /v1/projects to see what projects this token can access
            PROJ_LIST=$(curl -s -H "Authorization: Bearer $clean" https://api.supabase.com/v1/projects | node -e "
              let b=''; process.stdin.on('data', c=>b+=c); process.stdin.on('end', ()=>{
                try {
                  const arr = JSON.parse(b);
                  if (Array.isArray(arr)) {
                    console.log('Token accessible projects:', arr.map(p=>({ id: p.id, name: p.name, ref: p.id })).slice(0, 5));
                  } else {
                    console.log('Projects list response:', JSON.stringify(arr).slice(0, 150));
                  }
                } catch (e) { console.log('Projects list parse err:', e.message); }
              });
            ")
            echo "$PROJ_LIST"

            if [ "$PROBE_STATUS" != "200" ]; then
              echo "Probe check failed, trying direct supabase functions deploy just in case..."
            fi
            
            if SUPABASE_ACCESS_TOKEN="$clean" npx --yes supabase functions deploy help-ai-chat --project-ref usfeoerkpcafxxlyuldl --use-api --no-verify-jwt; then
              echo "Deployment succeeded!"
              deployed=1
              break
            else
              echo "Token candidate deploy failed, trying next..."
            fi
          done
          if [ "$deployed" -ne 1 ]; then
            echo "All token candidates failed to deploy help-ai-chat" >&2
            exit 1
          fi
