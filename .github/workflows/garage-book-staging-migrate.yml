name: Garage book migration — Staging only

# Applies garage_customers / garage_vehicles / garage_cases
# to Oren Car PUBLIC STAGING (usfeoerkpcafxxlyuldl) only.
# Never Production / qasomfndnjuixgjmjwcm / dalia-car.online.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260911120000_garage_book_staging.sql'
      - 'scripts/apply-garage-book-staging.mjs'
      - '.github/workflows/garage-book-staging-migrate.yml'

permissions:
  contents: read

jobs:
  staging-migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply garage book on Staging only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/apply-garage-book-staging.mjs
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garage-book-staging-qa
          path: test-results/garage-book-staging-qa.json
          if-no-files-found: ignore
