name: Garage book migration — Staging only

# Applies garage_customers / garage_vehicles / garage_cases
# to Oren Car PUBLIC STAGING (usfeoerkpcafxxlyuldl) only.
# Never Production / qasomfndnjuixgjmjwcm / dalia-car.online.
#
# Manual only: SUPABASE_ACCESS_TOKEN currently returns 401 against the
# Management API (known repo issue). Do not auto-run on PR/main until the
# token is rotated or STAGING_DATABASE_URL is set.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  staging-migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply garage book on Staging only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: node scripts/apply-garage-book-staging.mjs
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garage-book-staging-qa
          path: test-results/garage-book-staging-qa.json
          if-no-files-found: ignore
