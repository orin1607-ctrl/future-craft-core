name: Whatsapp Bot latency audit (no logic change)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/wa-bot-latency-audit.mjs'
      - 'public/project-001/wa-bot-latency-queue.json'
      - '.github/workflows/wa-bot-latency-audit.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  latency:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Latency audit (read-only logic)
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          MAKE_ZONE: ${{ secrets.MAKE_ZONE }}
          LATENCY_PROBE: 'false'
        run: node scripts/wa-bot-latency-audit.mjs
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/project-001/wa-bot-latency-result.json || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "ci: Whatsapp Bot latency audit (no logic change)"
          git push
