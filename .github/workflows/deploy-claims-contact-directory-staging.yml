name: Staging claims contact directory

# Staging only. Applies the approved claims contact tables + RLS.
# Never Production.

on:
  push:
    branches:
      - feat/incident-alerts-staging
    paths:
      - 'supabase/migrations/20260909120000_claims_contact_directory_staging.sql'
      - 'scripts/apply-claims-contact-directory-staging.mjs'
      - '.github/workflows/deploy-claims-contact-directory-staging.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-claims-contact-directory-staging
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard Staging only
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" != "production"
          test "${GITHUB_REF_NAME}" != "main"
          test "usfeoerkpcafxxlyuldl" != "qasomfndnjuixgjmjwcm"

      - name: Apply contact directory SQL on Staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          export SUPABASE_ACCESS_TOKEN="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '\r\n')"
          npm install --no-save @supabase/supabase-js pg
          node scripts/apply-claims-contact-directory-staging.mjs
