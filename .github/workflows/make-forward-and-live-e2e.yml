name: Make forward + Staging live DLR E2E

# Uses MAKE_API_TOKEN + MAKE_ZONE GitHub Secrets.
# 1) Find Gupshup webhook scenario
# 2) Add HTTP forward to Staging gupshup-webhook (keep existing modules)
# 3) One live WA send Staging + DLR poll
# Production untouched. Gupshup portal webhook URL untouched.

on:
  push:
    branches: [main]
    paths:
      - 'public/project-001/make-forward-execute-queue.json'
      - '.github/workflows/make-forward-and-live-e2e.yml'
      - 'scripts/make-forward-supabase.mjs'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  make-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Make forward + Staging live E2E
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          MAKE_ZONE: ${{ secrets.MAKE_ZONE }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/make-forward-supabase.mjs
