name: Make forward + Staging live DLR E2E

# Configure Make forward ONLY by default.
# Live WA E2E send requires: queue armed+live_wa_send AND workflow_dispatch/input,
# or LIVE_E2E_ARMED=true. Script push alone must NEVER send WhatsApp.

on:
  push:
    branches: [main]
    paths:
      - 'public/project-001/make-forward-execute-queue.json'
      - '.github/workflows/make-forward-and-live-e2e.yml'
      # NOTE: scripts/make-forward-supabase.mjs intentionally NOT in paths —
      # editing the script must not auto-send E2E to Owner phone.
  workflow_dispatch:
    inputs:
      live_wa_send:
        description: 'Also send one Staging E2E WhatsApp (dangerous — Owner only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  make-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Make forward (E2E only if explicitly armed)
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          MAKE_ZONE: ${{ secrets.MAKE_ZONE }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          LIVE_E2E_ARMED: ${{ github.event.inputs.live_wa_send == 'true' && 'true' || 'false' }}
        run: node scripts/make-forward-supabase.mjs
