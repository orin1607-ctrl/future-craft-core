name: Staging — Driver app notifications

# Staging-only: attempt to apply driver-app settings SQL to dalia-staging.
# NEVER targets production (qasomfndnjuixgjmjwcm or kuenhflklivaxrmqbsee).
#
# GitHub Pages is NOT deployed from this workflow: the github-pages
# environment only allows branch `main`, and this agent will not push there.

on:
  push:
    branches:
      - cursor/driver-app-notifications-563b
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: staging-driver-app-notifications
  cancel-in-progress: false

jobs:
  apply-staging-migration:
    name: Apply migration to dalia-staging only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — refuse production refs
        run: |
          set -euo pipefail
          STAGING_REF="usfeoerkpcafxxlyuldl"
          PROD_REF_A="qasomfndnjuixgjmjwcm"
          PROD_REF_B="kuenhflklivaxrmqbsee"
          echo "Target staging project: $STAGING_REF"
          echo "Guarding against production: $PROD_REF_A $PROD_REF_B"
          if grep -R --fixed-strings "$PROD_REF_A" .github/workflows/staging-driver-app-notifications.yml | grep -v 'PROD_REF\|production\|NEVER\|refuse\|Guard'; then
            echo "::error::Workflow unexpectedly references production project A"
            exit 1
          fi
          if grep -R --fixed-strings "$PROD_REF_B" .github/workflows/staging-driver-app-notifications.yml | grep -v 'PROD_REF\|production\|NEVER\|refuse\|Guard'; then
            echo "::error::Workflow unexpectedly references production project B"
            exit 1
          fi

      - name: Apply SQL via Supabase Management API (staging only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_REF: usfeoerkpcafxxlyuldl
        run: |
          set -euo pipefail
          TOK=$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$TOK" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN missing. Apply the SQL in the Staging SQL Editor."
            exit 0
          fi
          export SUPABASE_ACCESS_TOKEN="$TOK"

          SQL_FILE_A="supabase/migrations/20260905223000_driver_app_notification_settings.sql"
          SQL_FILE_B="supabase/migrations/20260906120000_driver_app_control_center_expand.sql"
          test -f "$SQL_FILE_A"
          test -f "$SQL_FILE_B"

          apply_sql() {
            local FILE="$1"
            local SQL_JSON
            SQL_JSON=$(python3 -c "import json; print(json.dumps({\"query\": open('$FILE', encoding='utf-8').read()}))")
            local CODE
            CODE=$(curl -sS -o /tmp/sql_result.json -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/${STAGING_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -H "User-Agent: supabase-cli/2.0" \
              --data-binary "$SQL_JSON" || echo "000")
            echo "SQL HTTP for $FILE: $CODE"
            head -c 2000 /tmp/sql_result.json; echo
            if [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; then
              echo "✅ Applied $FILE via Management API to staging only"
            elif grep -qiE 'already exists|duplicate' /tmp/sql_result.json; then
              echo "✅ $FILE already applied (idempotent)"
            else
              echo "::warning::Could not apply $FILE to staging (HTTP $CODE). Apply both driver-app SQL files in the Staging SQL Editor."
            fi
          }

          apply_sql "$SQL_FILE_A"
          apply_sql "$SQL_FILE_B"

      - name: Verify new tables exist on staging
        env:
          STAGING_URL: https://usfeoerkpcafxxlyuldl.supabase.co
          STAGING_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzZmVvZXJrcGNhZnh4bHl1bGRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMTQ4NTYsImV4cCI6MjA5NDY5MDg1Nn0.Z1AsULSK9fNsVwjw7iRP_DkSodeTUdtb-eB5s66qtJU
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /tmp/verify.json -w "%{http_code}" \
            "${STAGING_URL}/rest/v1/dalia_contact_settings?select=id&limit=1" \
            -H "apikey: ${STAGING_ANON}" \
            -H "Authorization: Bearer ${STAGING_ANON}")
          echo "REST verify HTTP: $CODE"
          cat /tmp/verify.json
          echo
          if [ "$CODE" = "200" ] || [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
            echo "✅ dalia_contact_settings is present on Staging (HTTP $CODE is expected under RLS)"
          else
            echo "::warning::Table not reachable on Staging yet (HTTP $CODE). Apply supabase/migrations/20260905223000_driver_app_notification_settings.sql in the Staging SQL Editor."
          fi
