name: Fix Whatsapp Bot reply path (one inbound)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/wa-bot-fix-reply.mjs'
      - 'public/project-001/wa-bot-fix-reply-queue.json'
      - '.github/workflows/wa-bot-fix-reply.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fix-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix Whatsapp Bot + one inbound היי
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          MAKE_ZONE: ${{ secrets.MAKE_ZONE }}
        run: node scripts/wa-bot-fix-reply.mjs
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/project-001/wa-bot-fix-reply-result.json || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "ci: Whatsapp Bot fix — remove broken Forward, one היי inbound"
          git push
