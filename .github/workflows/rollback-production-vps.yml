name: Rollback Production

# Restores Production web root from a pre-deploy tarball on the VPS.
# Must match deploy-production-vps.yml: WEB_ROOT=/root/future-craft-core/dist
# Backups: /root/pre-deploy-dist-*.tgz (created as tar of `dist` under /root/future-craft-core)

on:
  workflow_dispatch:
    inputs:
      backup_path:
        description: 'Tarball on VPS e.g. /root/pre-deploy-dist-2026-06-16-1200.tgz (empty = latest)'
        required: false
        default: ''

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dalia-car.online
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rollback web root from backup
        id: rollback
        env:
          BACKUP_INPUT: ${{ inputs.backup_path }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "BACKUP_INPUT=$(printf '%q' "${BACKUP_INPUT}") bash -s" << 'REMOTE'
          set -euo pipefail
          WEB_ROOT="/root/future-craft-core/dist"
          BACKUP="${BACKUP_INPUT:-}"
          if [ -z "$BACKUP" ]; then
            BACKUP=$(ls -1t /root/pre-deploy-dist-*.tgz 2>/dev/null | head -1 || true)
          fi
          if [ -z "$BACKUP" ] || [ ! -f "$BACKUP" ]; then
            echo "No backup found under /root/pre-deploy-dist-*.tgz" >&2
            exit 1
          fi
          STAMP=$(date -u +%F-%H%M)
          SAFETY="/root/pre-rollback-safety-${STAMP}.tgz"
          mkdir -p /root/future-craft-core
          tar czf "$SAFETY" -C /root/future-craft-core dist
          rm -rf "${WEB_ROOT}"
          mkdir -p "${WEB_ROOT}"
          # Backup was created as: tar czf … -C /root/future-craft-core dist
          # → extract restores a `dist/` directory
          tar xzf "$BACKUP" -C /root/future-craft-core
          if [ ! -f "${WEB_ROOT}/index.html" ]; then
            echo "Rollback extract did not produce ${WEB_ROOT}/index.html" >&2
            exit 1
          fi
          nginx -t && systemctl reload nginx
          echo "restored_from=$BACKUP"
          echo "safety_backup=$SAFETY"
          grep -oE 'index-[^"'\''/]+\.js' "${WEB_ROOT}/index.html" | head -1 || true
          REMOTE
          echo "done=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Record rollback in Supabase
        env:
          SUPABASE_URL: https://qasomfndnjuixgjmjwcm.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/finalize-production-deploy.mjs \
            --action rollback \
            --backup "${{ inputs.backup_path }}" \
            --workflow-run "${{ github.run_id }}"
