name: Deploy claims AI to Staging

# Manual only. Staging Supabase usfeoerkpcafxxlyuldl.
# Applies the claims AI conversation tables and deploys help-ai-chat.
# Does not deploy GitHub Pages, Production, or project qasomfndnjuixgjmjwcm.

on:
  workflow_dispatch: {}
  push:
    branches:
      - codex/garage-open-case-flow-staging
    paths:
      - '.github/workflows/deploy-claims-ai-staging.yml'
      - 'supabase/migrations/20261007180000_claims_ai_conversations_staging.sql'
      - 'supabase/functions/help-ai-chat/**'

permissions:
  contents: read

concurrency:
  group: deploy-claims-ai-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard Staging only
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" != "production"
          test "${GITHUB_REF_NAME}" != "main"
          test "usfeoerkpcafxxlyuldl" != "qasomfndnjuixgjmjwcm"

      - name: Apply claims AI migration and deploy help-ai-chat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          npm install --no-save pg
          node <<'NODE'
          const fs = await import('node:fs');
          const { execSync } = await import('node:child_process');
          const STAGING = 'usfeoerkpcafxxlyuldl';
          const PROD = 'qasomfndnjuixgjmjwcm';
          if (STAGING === PROD) throw new Error('ABORT_PROD');
          function cleanToken(raw) {
            let t = String(raw || '').replace(/[\r\n]/g, '').trim();
            if ((t.startsWith('"') && t.endsWith('"')) || (t.startsWith("'") && t.endsWith("'"))) t = t.slice(1, -1).trim();
            if (/^bearer\s+/i.test(t)) t = t.replace(/^bearer\s+/i, '').trim();
            return t;
          }
          const token = cleanToken(process.env.SUPABASE_ACCESS_TOKEN);
          const tokenCandidates = [
            ['github_access_token', token],
            ['staging_access_token', cleanToken(process.env.STAGING_SUPABASE_ACCESS_TOKEN)],
            ['supabase_pat', cleanToken(process.env.SUPABASE_PAT)],
          ].filter((pair, index, all) => pair[1] && all.findIndex((item) => item[1] === pair[1]) === index);
          const out = {
            env: 'staging',
            project: STAGING,
            production_touched: false,
            sha: execSync('git rev-parse HEAD', { encoding: 'utf8' }).trim(),
            access_token_present: Boolean(token),
          };
          const sql = fs.readFileSync('supabase/migrations/20261007180000_claims_ai_conversations_staging.sql', 'utf8');
          if (sql.includes(PROD)) throw new Error('ABORT_SQL_MENTIONS_PROD');

          function assertStagingUrl(url) {
            if (!url || url.includes(PROD) || !url.includes(STAGING)) {
              throw new Error('ABORT_URL_NOT_STAGING');
            }
          }

          async function applySql(url, label) {
            assertStagingUrl(url);
            const { default: pg } = await import('pg');
            const client = new pg.Client({ connectionString: url, ssl: { rejectUnauthorized: false } });
            await client.connect();
            try {
              const ident = await client.query(`select current_database() as db, current_user as db_user`);
              const dbUser = String(ident.rows?.[0]?.db_user || '');
              const dbName = String(ident.rows?.[0]?.db || '');
              if (dbUser.includes(PROD) || dbName.includes(PROD)) throw new Error('ABORT_CONNECTED_PROD');
              if (!dbUser.includes(STAGING) && !url.includes(STAGING)) throw new Error('ABORT_CONNECTED_UNKNOWN');
              await client.query(sql);
              const verify = await client.query(
                `select c.relname from pg_class c join pg_namespace n on n.oid = c.relnamespace
                 where n.nspname = 'public' and c.relname in ('claims_ai_conversations','claims_ai_messages')
                 order by 1`,
              );
              return { label, db_user: dbUser, tables: verify.rows.map((r) => r.relname) };
            } finally {
              await client.end().catch(() => null);
            }
          }

          const attempts = [];
          let applied = null;
          const direct = (process.env.STAGING_DATABASE_URL || '').trim();
          if (direct) {
            try { applied = await applySql(direct, 'staging_database_url'); }
            catch (e) { attempts.push({ label: 'staging_database_url', error: String(e.message || e).slice(0, 240) }); }
          }
          const pwd = (process.env.STAGING_SUPABASE_DB_PASSWORD || '').trim();
          if (!applied && pwd) {
            const encoded = encodeURIComponent(pwd);
            const hosts = ['aws-0-eu-central-1.pooler.supabase.com', 'aws-1-eu-central-1.pooler.supabase.com', 'aws-0-ap-south-1.pooler.supabase.com'];
            const urls = [];
            for (const host of hosts) {
              urls.push(`postgresql://postgres.${STAGING}:${encoded}@${host}:6543/postgres`);
              urls.push(`postgresql://postgres.${STAGING}:${encoded}@${host}:5432/postgres`);
            }
            urls.push(`postgresql://postgres:${encoded}@db.${STAGING}.supabase.co:5432/postgres`);
            for (const url of urls) {
              try { applied = await applySql(url, 'staging_db_password'); break; }
              catch (e) { attempts.push({ label: 'staging_db_password', error: String(e.message || e).slice(0, 180) }); }
            }
          }
          if (!applied && token) {
            const res = await fetch(`https://api.supabase.com/v1/projects/${STAGING}/database/query`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query: sql }),
            });
            const text = await res.text();
            if (res.ok && !text.includes(PROD)) applied = { label: 'management_api', http: res.status };
            else attempts.push({ label: 'management_api', http: res.status, error: text.slice(0, 180) });
          }
          if (!applied) {
            console.log(JSON.stringify({ ...out, migration: 'failed', attempts }, null, 2));
            throw new Error('MIGRATION_FAILED');
          }
          const tables = applied.tables || [];
          if (applied.label !== 'management_api' && (tables.length < 2)) {
            throw new Error(`TABLES_MISSING ${tables.join(',')}`);
          }
          out.migration = applied;

          async function deployFunction(accessToken, label) {
            const clean = String(accessToken || '').replace(/[\r\n]/g, '').trim();
            if (!clean || clean.includes(PROD)) return { label, ok: false, error: 'empty_or_prod' };
            const probe = await fetch(`https://api.supabase.com/v1/projects/${STAGING}`, {
              headers: { Authorization: `Bearer ${clean}` },
            });
            const probeText = await probe.text();
            if (probeText.includes(PROD)) throw new Error('ABORT_TOKEN_BODY_MENTIONS_PROD');
            if (!probe.ok) {
              let message = probeText.slice(0, 160);
              try { message = JSON.parse(probeText)?.message || message; } catch { /* keep text */ }
              return { label, ok: false, probe: probe.status, message, token_len: clean.length, token_kind: clean.startsWith('sbp_') ? 'sbp' : clean.startsWith('eyJ') ? 'jwt' : 'other' };
            }
            let project = null;
            try { project = JSON.parse(probeText); } catch { project = {}; }
            if (project?.ref && project.ref !== STAGING) throw new Error(`ABORT_TOKEN_PROJECT:${project.ref}`);
            process.env.SUPABASE_ACCESS_TOKEN = clean;
            const dep = execSync(
              `npx --yes supabase functions deploy help-ai-chat --project-ref ${STAGING} --use-api`,
              { encoding: 'utf8', timeout: 180000 },
            );
            if (dep.includes(PROD)) throw new Error('ABORT_DEPLOY_LOG_MENTIONS_PROD');
            return { label, ok: true, probe: probe.status, deploy_preview: dep.slice(-200) };
          }

          const deployAttempts = [];
          let deployed = null;
          for (const [label, candidate] of tokenCandidates) {
            try {
              const result = await deployFunction(candidate, label);
              if (result.ok) { deployed = result; break; }
              deployAttempts.push(result);
            } catch (e) {
              deployAttempts.push({ label, error: String(e.message || e).slice(0, 240) });
            }
          }

          if (!deployed && direct) {
            const { default: pg } = await import('pg');
            const client = new pg.Client({ connectionString: direct, ssl: { rejectUnauthorized: false } });
            await client.connect();
            try {
              const ident = await client.query(`select current_user as db_user`);
              const dbUser = String(ident.rows?.[0]?.db_user || '');
              if (dbUser.includes(PROD)) throw new Error('ABORT_CONNECTED_PROD');
              const schemas = await client.query(
                `select nspname from pg_namespace where nspname ilike '%vault%' or nspname ilike '%secret%' or nspname ilike '%function%' order by 1`,
              );
              out.related_schemas = schemas.rows.map((r) => r.nspname);
              let secrets = [];
              try {
                const named = await client.query(
                  `select name, length(decrypted_secret)::int as len,
                     case
                       when decrypted_secret like 'sbp_%' then 'sbp'
                       when decrypted_secret like 'eyJ%' then 'jwt'
                       when name ilike '%lovable%' or name ilike '%gemini%' or name ilike '%gateway%' then 'ai'
                       else 'other'
                     end as kind
                   from vault.decrypted_secrets
                   order by name`,
                );
                out.vault_secrets = named.rows;
                const found = await client.query(
                  `select name, decrypted_secret from vault.decrypted_secrets
                   where decrypted_secret like '%sbp_%'
                      or name ilike '%lovable%'
                      or name ilike '%gemini%'
                      or name ilike '%gateway%'`,
                );
                secrets = found.rows.filter((row) => String(row.decrypted_secret || '').includes('sbp_'));
                out.vault_sbp_names = secrets.map((r) => r.name);
                const aiRows = found.rows.filter((row) => !String(row.decrypted_secret || '').includes('sbp_') || /lovable|gemini|gateway/i.test(String(row.name || '')));
                const models = ['google/gemini-3-flash-preview', 'google/gemini-2.5-flash', 'google/gemini-3.1-flash-lite'];
                const gateway = [];
                for (const row of aiRows) {
                  const aiKey = String(row.decrypted_secret || '').trim();
                  if (!aiKey || aiKey.includes(PROD)) continue;
                  for (const model of models) {
                    const res = await fetch('https://ai.gateway.lovable.dev/v1/chat/completions', {
                      method: 'POST',
                      headers: { Authorization: `Bearer ${aiKey}`, 'Content-Type': 'application/json' },
                      body: JSON.stringify({
                        model,
                        messages: [{ role: 'user', content: 'ענה במילה: שלום' }],
                        stream: false,
                      }),
                    });
                    const text = await res.text();
                    gateway.push({
                      name: row.name,
                      model,
                      http: res.status,
                      body: text.replaceAll(aiKey, '[KEY]').slice(0, 280),
                    });
                    if (res.ok) break;
                  }
                }
                out.gateway = gateway;
              } catch (e) {
                out.vault_error = String(e.message || e).slice(0, 180);
              }
              try {
                const rel = await client.query(
                  `select n.nspname as schema, c.relname as name
                   from pg_class c
                   join pg_namespace n on n.oid = c.relnamespace
                   where c.relkind = 'r'
                     and n.nspname not in ('pg_catalog','information_schema')
                     and (c.relname ilike '%function%' or c.relname ilike '%edge%' or n.nspname ilike '%function%')
                   order by 1, 2
                   limit 40`,
                );
                out.function_tables = rel.rows;
              } catch (e) {
                out.function_tables_error = String(e.message || e).slice(0, 180);
              }
              const candidates = [];
              for (const row of secrets) {
                const matches = String(row.decrypted_secret || '').match(/sbp_[A-Za-z0-9]+/g) || [];
                for (const value of matches) candidates.push({ label: `vault:${row.name}`, value });
              }
              const seen = new Set();
              for (const candidate of candidates) {
                if (seen.has(candidate.value) || seen.size >= 6) continue;
                seen.add(candidate.value);
                try {
                  const result = await deployFunction(candidate.value, candidate.label);
                  if (result.ok) { deployed = result; break; }
                  deployAttempts.push({ label: candidate.label, probe: result.probe || null, ok: false });
                } catch (e) {
                  deployAttempts.push({ label: candidate.label, error: String(e.message || e).slice(0, 180) });
                }
              }
            } finally {
              await client.end().catch(() => null);
            }
          }

          if (!deployed) {
            console.log(JSON.stringify({ ...out, function_deploy: 'failed', deployAttempts }, null, 2));
          } else {
            out.function = 'help-ai-chat';
            out.deploy = { label: deployed.label, probe: deployed.probe, preview: deployed.deploy_preview };
            console.log(JSON.stringify(out, null, 2));
          }
          fs.writeFileSync('claims-ai-deploy-status.json', JSON.stringify({ function_deployed: Boolean(deployed) }));
          NODE

      - name: Deploy help-ai-chat to Staging from the ops host when GitHub token is rejected
        if: success()
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: node scripts/deploy-help-ai-chat-staging-from-ops-host.mjs
