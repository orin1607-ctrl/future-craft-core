name: E2E — Alerts Internal Search Staging

# Staging-only. Never Production.
on:
  push:
    branches:
      - feat/incident-alerts-staging
    paths:
      - 'src/pages/Alerts.tsx'
      - 'src/pages/Reports.tsx'
      - 'src/components/SearchableFilterField.tsx'
      - 'scripts/e2e-alerts-internal-staging.mjs'
      - '.github/workflows/e2e-alerts-internal-staging.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-alerts-internal-staging
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bun x playwright install --with-deps chromium

      - name: Wait for Staging Pages settle
        run: sleep 45

      - name: Run alerts internal-number E2E on Staging Pages
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_PAGES_URL: https://orin1607-ctrl.github.io/future-craft-core
        run: node scripts/e2e-alerts-internal-staging.mjs

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alerts-internal-e2e
          path: |
            docs/screenshots/alerts-internal-e2e/**
            /opt/cursor/artifacts/alerts-internal-staging-e2e.json
          if-no-files-found: ignore
