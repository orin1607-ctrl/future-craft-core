name: Staging garage-gmail deploy

# Staging only. Never Production. Never Hostinger. Never claims-gmail.

on:
  push:
    branches:
      - feat/incident-alerts-staging
    paths:
      - 'supabase/functions/garage-gmail/**'
      - '.github/workflows/deploy-garage-gmail-staging.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-garage-gmail-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard Staging only
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" != "production"
          test "${GITHUB_REF_NAME}" != "main"
          test "usfeoerkpcafxxlyuldl" != "qasomfndnjuixgjmjwcm"

      - name: Deploy garage-gmail to Staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          export SUPABASE_ACCESS_TOKEN="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$SUPABASE_ACCESS_TOKEN"
          npx --yes supabase functions deploy garage-gmail --project-ref usfeoerkpcafxxlyuldl --use-api
