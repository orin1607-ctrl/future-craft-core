name: Deploy garage-gmail — Staging only

# Oren Car PUBLIC STAGING (usfeoerkpcafxxlyuldl) only.
# Never Production / qasomfndnjuixgjmjwcm / dalia-car.online.
# Does not deploy claims-gmail. Does not touch claims_gmail_connection.
#
# Uses GitHub secret SUPABASE_ACCESS_TOKEN against Staging usfeoerkpcafxxlyuldl only.
# Preview environment is optional fallback. Never Production.

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/garage-gmail/**'
      - 'src/modules/garage-management/garage-gmail.staging.manual.sql'
      - 'scripts/apply-garage-gmail-staging.mjs'
      - 'scripts/deploy-garage-gmail-edge.mjs'
      - 'scripts/qa-garage-gmail-staging.mjs'
      - '.github/workflows/deploy-garage-gmail-staging.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/garage-gmail/**'
      - 'src/modules/garage-management/garage-gmail.staging.manual.sql'
      - 'scripts/apply-garage-gmail-staging.mjs'
      - 'scripts/deploy-garage-gmail-edge.mjs'
      - 'scripts/qa-garage-gmail-staging.mjs'
      - '.github/workflows/deploy-garage-gmail-staging.yml'

permissions:
  contents: read

jobs:
  from-preview:
    name: Deploy via Preview environment
    runs-on: ubuntu-latest
    environment: Preview
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show which existing Preview secrets are present
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_QA_EMAIL: ${{ secrets.STAGING_QA_EMAIL }}
        run: |
          python3 - <<'PY'
          import os
          names = [
            "STAGING_DATABASE_URL","DATABASE_URL","SUPABASE_ACCESS_TOKEN",
            "STAGING_SUPABASE_ACCESS_TOKEN","STAGING_SUPABASE_SERVICE_ROLE_KEY","STAGING_QA_EMAIL",
          ]
          for n in names:
              v = (os.environ.get(n) or "").strip()
              print(f"{n} present={'yes' if v else 'no'} len={len(v)}")
              if "qasomfndnjuixgjmjwcm" in v or "dalia-car.online" in v.lower():
                  raise SystemExit(f"{n} looks like Production — refusing")
          PY
      - name: Apply approved garage Gmail SQL if Staging DB URL is present
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${STAGING_DATABASE_URL:-}${DATABASE_URL:-}" ]; then
            node scripts/apply-garage-gmail-staging.mjs
          else
            echo "No Staging DB URL in Preview — skip SQL, function can still scan via existing Edge Google token"
          fi
      - name: Deploy garage-gmail Edge to Staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/deploy-garage-gmail-edge.mjs
      - name: Upload preview deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garage-gmail-preview-deploy
          path: test-results/garage-gmail-*.json
          if-no-files-found: ignore

  from-repo:
    name: Deploy via repo secrets
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show which existing repo secrets are present
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          for n in ["STAGING_DATABASE_URL","SUPABASE_ACCESS_TOKEN","STAGING_SUPABASE_ACCESS_TOKEN","STAGING_SUPABASE_SERVICE_ROLE_KEY"]:
              v = (os.environ.get(n) or "").strip()
              print(f"{n} present={'yes' if v else 'no'} len={len(v)}")
              if "qasomfndnjuixgjmjwcm" in v or "dalia-car.online" in v.lower():
                  raise SystemExit(f"{n} looks like Production — refusing")
          PY
      - name: Apply approved garage Gmail SQL if Staging DB URL is present
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -n "${STAGING_DATABASE_URL:-}" ]; then
            node scripts/apply-garage-gmail-staging.mjs
          else
            echo "No STAGING_DATABASE_URL at repo level — skip SQL"
          fi
      - name: Deploy garage-gmail Edge to Staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/deploy-garage-gmail-edge.mjs
      - name: Upload repo deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garage-gmail-repo-deploy
          path: test-results/garage-gmail-*.json
          if-no-files-found: ignore

  staging-garage-gmail-e2e:
    name: E2E garage-gmail on Staging
    needs: [from-preview, from-repo]
    if: always() && needs.from-preview.result != 'cancelled' && needs.from-repo.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: E2E garage-gmail on Staging only
        env:
          VITE_SUPABASE_URL: https://usfeoerkpcafxxlyuldl.supabase.co
          VITE_SUPABASE_PROJECT_ID: usfeoerkpcafxxlyuldl
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TEST_EMAIL: ${{ secrets.STAGING_QA_EMAIL }}
          TEST_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD }}
          STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          sleep 8
          node scripts/qa-garage-gmail-staging.mjs
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garage-gmail-staging-qa
          path: test-results/garage-gmail-staging-qa.json
          if-no-files-found: ignore
