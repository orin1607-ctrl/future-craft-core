name: Deploy Edge — incident notify

# Deploys notify-accident-email + best-effort migrations.
# Requires secret: SUPABASE_ACCESS_TOKEN (must pass Management API preflight).
# On push to main (matching paths): Staging auto + Production queued behind Environment gate.
# Canonical secrets map: docs/ENVIRONMENT-AND-SECRETS-HE.md

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'staging or production'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
  push:
    branches: [main]
    paths:
      - 'supabase/functions/notify-accident-email/**'
      - 'supabase/migrations/**incident**'
      - '.github/workflows/deploy-edge-incident-notify.yml'
      - 'public/project-001/edge-deploy-queue.json'

permissions:
  contents: read

concurrency:
  group: deploy-edge-incident-notify
  cancel-in-progress: true

jobs:
  preflight-token:
    name: Preflight SUPABASE_ACCESS_TOKEN
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.check.outputs.valid }}
    steps:
      - name: Validate Management API token
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::error::SUPABASE_ACCESS_TOKEN missing. Rotate at https://supabase.com/dashboard/account/tokens then update GitHub Secret."
            exit 0
          fi
          CODE=$(curl -sS -o /tmp/mgmt.json -w "%{http_code}" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects" || echo "000")
          echo "Management API HTTP: $CODE"
          if [ "$CODE" = "200" ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "✅ Token accepted"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::error::SUPABASE_ACCESS_TOKEN rejected (HTTP $CODE). Rotate at https://supabase.com/dashboard/account/tokens and update the GitHub Secret."
            exit 0
          fi

  token-gate-report:
    needs: preflight-token
    if: needs.preflight-token.outputs.valid != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Owner must rotate SUPABASE_ACCESS_TOKEN
        run: |
          echo "::error::Edge deploy blocked until Owner rotates SUPABASE_ACCESS_TOKEN (GitHub Secret)."
          echo "After update: re-push or re-run this workflow — Staging deploys automatically; Production waits for Environment Approve."
          exit 1

  deploy-edge-staging:
    needs: preflight-token
    if: needs.preflight-token.outputs.valid == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.target == 'staging') || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Edge to Staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          npx supabase functions deploy notify-accident-email --project-ref usfeoerkpcafxxlyuldl
          npx supabase link --project-ref usfeoerkpcafxxlyuldl || true
          npx supabase db push --include-all || echo "::warning::Apply migrations manually on Staging"

  # Production: Environment gate → Owner Approve → deploy
  deploy-edge-production:
    needs: [preflight-token, deploy-edge-staging]
    if: |
      always() &&
      needs.preflight-token.outputs.valid == 'true' &&
      (needs.deploy-edge-staging.result == 'success' || needs.deploy-edge-staging.result == 'skipped') &&
      ((github.event_name == 'workflow_dispatch' && inputs.target == 'production') || github.event_name == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://qasomfndnjuixgjmjwcm.supabase.co/functions/v1/notify-accident-email
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Edge to Production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          npx supabase functions deploy notify-accident-email --project-ref qasomfndnjuixgjmjwcm
          npx supabase link --project-ref qasomfndnjuixgjmjwcm || true
          npx supabase db push --include-all || echo "::warning::Apply migrations manually on Production"
