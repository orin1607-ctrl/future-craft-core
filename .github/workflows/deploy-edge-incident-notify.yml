name: Deploy Edge — incident notify

# Deploys notify-accident-email + best-effort migrations.
# Requires secret: SUPABASE_ACCESS_TOKEN
# Frontend Hostinger deploy: use deploy-production-vps.yml separately.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'staging or production'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
  # Register workflow on push to main (no-op job skipped unless dispatch)
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-edge-incident-notify.yml'

permissions:
  contents: read

jobs:
  deploy-edge-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Edge to Staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          npx supabase functions deploy notify-accident-email --project-ref usfeoerkpcafxxlyuldl
          npx supabase link --project-ref usfeoerkpcafxxlyuldl || true
          npx supabase db push --include-all || echo "::warning::Apply migrations manually on Staging"

  deploy-edge-production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Edge to Production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          npx supabase functions deploy notify-accident-email --project-ref qasomfndnjuixgjmjwcm
          npx supabase link --project-ref qasomfndnjuixgjmjwcm || true
          npx supabase db push --include-all || echo "::warning::Apply migrations manually on Production"

  register-only:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workflow registered on main — use workflow_dispatch to deploy Edge"
