name: Gupshup rotation verify (Staging send + Make)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/gupshup-rotation-verify.mjs'
      - 'public/project-001/gupshup-rotation-verify-queue.json'
      - '.github/workflows/gupshup-rotation-verify.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate — queue armed
        id: gate
        run: |
          armed=$(node -e "const q=require('./public/project-001/gupshup-rotation-verify-queue.json'); process.stdout.write(String(q.armed===true))")
          echo "armed=$armed" >> "$GITHUB_OUTPUT"
      - name: Verify rotation
        if: steps.gate.outputs.armed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          MAKE_ZONE: ${{ secrets.MAKE_ZONE }}
        run: node scripts/gupshup-rotation-verify.mjs
      - name: Disarm + commit results
        if: always() && steps.gate.outputs.armed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node -e "
            const fs=require('fs');
            const p='public/project-001/gupshup-rotation-verify-queue.json';
            const q=JSON.parse(fs.readFileSync(p,'utf8'));
            q.armed=false; q.completed=true; q.at=new Date().toISOString();
            fs.writeFileSync(p, JSON.stringify(q,null,2)+'\n');
          "
          git add -f public/project-001/gupshup-rotation-verify-result.json || true
          git add -f public/project-001/gupshup-rotation-verify-summary.json || true
          git add -f public/project-001/gupshup-rotation-verify-queue.json || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git pull --rebase origin main || true
          git commit -m "ci: Gupshup rotation verify (Staging send + Make apikey probe)"
          git push
