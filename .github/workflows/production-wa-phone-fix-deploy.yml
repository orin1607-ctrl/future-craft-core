name: Production — WhatsApp Phone Fix Deploy

# Owner reported Production bug (Cursor chat 2026-07-22):
# Declaration + exam WhatsApp do not resolve driver phone correctly.
# Frontend-only fix: shared drivers.phone + israeliPhone normalizer → 9725XXXXXXXX.
# Same Hostinger path as prior owner-approved deploys (no GitHub Environment gate).

on:
  push:
    branches: [main]
    paths:
      - 'public/project-001/production-wa-phone-fix-queue.json'
      - '.github/workflows/production-wa-phone-fix-deploy.yml'
      - 'scripts/production-wa-phone-fix-verify.mjs'
      - 'src/utils/israeliPhone.ts'
      - 'src/utils/israeliPhone.test.ts'
      - 'src/lib/driverOutboundNotify.ts'
      - 'src/pages/Drivers.tsx'
      - 'src/components/DriverDeclaration.tsx'
      - 'src/components/driving-exam/DriverExamsTab.tsx'
      - 'src/components/driving-exam/PracticalExamsList.tsx'
      - 'src/components/driving-exam/PracticalExamRunner.tsx'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: production-wa-phone-fix-deploy
  cancel-in-progress: false

env:
  PROD_SUPABASE_URL: https://qasomfndnjuixgjmjwcm.supabase.co
  PROD_SUPABASE_PROJECT_ID: qasomfndnjuixgjmjwcm
  WEB_ROOT: /root/future-craft-core/dist
  PRODUCTION_URL: https://dalia-car.online
  PROD_REF: qasomfndnjuixgjmjwcm

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Gate — queue armed
        id: gate
        run: |
          armed=$(node -e "const q=require('./public/project-001/production-wa-phone-fix-queue.json'); process.stdout.write(String(q.armed===true))")
          echo "armed=$armed" >> "$GITHUB_OUTPUT"
          echo "ARMED=$armed"

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.armed == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.armed == 'true'
        with:
          node-version: '22'

      - name: Install + build Production frontend
        if: steps.gate.outputs.armed == 'true'
        env:
          VITE_SUPABASE_URL: ${{ env.PROD_SUPABASE_URL }}
          VITE_SUPABASE_PROJECT_ID: ${{ env.PROD_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun x vitest run src/utils/israeliPhone.test.ts
          bun x vite build
          node scripts/ci-smoke-report.mjs --dist dist --supabase-ref qasomfndnjuixgjmjwcm || true
          BUNDLE=$(grep -oE 'index-[^"]+\.js' dist/index.html | head -1)
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          echo "DEPLOY_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          test -n "$BUNDLE"
          grep -q 'wa.me/' "dist/assets/$BUNDLE"
          grep -q 'חסר מספר טלפון בכרטיס הנהג' "dist/assets/$BUNDLE"
          grep -q 'driverPhone' "dist/assets/$BUNDLE"
          echo "WA_PHONE_FIX_MARKERS_OK"

      - name: Setup SSH
        if: steps.gate.outputs.armed == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Backup + rsync frontend to Hostinger (dalia-car.online)
        if: steps.gate.outputs.armed == 'true'
        run: |
          set -euo pipefail
          STAMP=$(date -u +%F-%H%M)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "tar czf /root/pre-deploy-dist-${STAMP}.tgz -C /root/future-craft-core dist && echo BACKUP=/root/pre-deploy-dist-${STAMP}.tgz"
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --delete \
            --filter="P orin-marketing/" \
            --filter="P orin-owner-gate.js" \
            dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.WEB_ROOT }}/
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo 'commit=${{ github.sha }} bundle=${BUNDLE} at=$(date -u +%Y-%m-%dT%H:%M:%SZ) reason=wa-phone-shared-fix owner_reported=2026-07-22' > /root/future-craft-core/dist/PRODUCTION-DEPLOY.txt"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "nginx -t && systemctl reload nginx"
          echo "FRONTEND_DEPLOY=ok"

      - name: Post-deploy verify (declaration + exam WA phone)
        if: steps.gate.outputs.armed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
        run: node scripts/production-wa-phone-fix-verify.mjs

      - name: Disarm + commit results
        if: always() && steps.gate.outputs.armed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node -e "
            const fs=require('fs');
            const p='public/project-001/production-wa-phone-fix-queue.json';
            const q=JSON.parse(fs.readFileSync(p,'utf8'));
            q.armed=false; q.completed=true; q.at=new Date().toISOString();
            fs.writeFileSync(p, JSON.stringify(q,null,2)+'\n');
          "
          git add public/project-001/production-wa-phone-fix-queue.json \
            public/project-001/production-wa-phone-fix-result.json \
            public/project-001/production-wa-phone-fix-summary.json || true
          git commit -m "chore(prod): WhatsApp phone fix deploy results (disarm queue)" || echo "NO_COMMIT"
          git push origin HEAD:main || echo "PUSH_WARN"
