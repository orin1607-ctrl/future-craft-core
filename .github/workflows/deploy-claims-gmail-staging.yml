name: Staging claims-gmail deploy

# Staging only. Deploys claims-gmail after SUPABASE_ACCESS_TOKEN refresh.
# Never Production. Never Hostinger.

on:
  push:
    branches:
      - feat/incident-alerts-staging
    paths:
      - 'supabase/functions/claims-gmail/**'
      - 'supabase/migrations/20260906180000_claims_gmail_scan_tick_3h.sql'
      - 'scripts/claims-gmail-3h-eli-qa.mjs'
      - '.github/workflows/deploy-claims-gmail-staging.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-claims-gmail-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard Staging only
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" != "production"
          test "${GITHUB_REF_NAME}" != "main"
          test "usfeoerkpcafxxlyuldl" != "qasomfndnjuixgjmjwcm"

      - name: Deploy claims-gmail to Staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          export SUPABASE_ACCESS_TOKEN="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$SUPABASE_ACCESS_TOKEN"
          npx --yes supabase functions deploy claims-gmail --project-ref usfeoerkpcafxxlyuldl --use-api

      - name: Apply existing-dispatch Gmail 3h tick SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          export SUPABASE_ACCESS_TOKEN="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$SUPABASE_ACCESS_TOKEN"
          node <<'NODE'
          const fs = require('fs');
          const sql = fs.readFileSync('supabase/migrations/20260906180000_claims_gmail_scan_tick_3h.sql', 'utf8');
          if (sql.includes('https://qasomfndnjuixgjmjwcm.supabase.co/functions/v1')) {
            throw new Error('refused production url');
          }
          (async () => {
            const token = process.env.SUPABASE_ACCESS_TOKEN;
            const res = await fetch('https://api.supabase.com/v1/projects/usfeoerkpcafxxlyuldl/database/query', {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, apikey: token, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query: sql }),
            });
            const text = await res.text();
            if (!res.ok) {
              console.error(text.slice(0, 2000));
              process.exit(1);
            }
            console.log('sql_apply_ok', text.slice(0, 400));
          })();
          NODE

      - name: Live Inbox+Sent + אליהו אטיאס QA
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          npm install --no-save @supabase/supabase-js
          node scripts/claims-gmail-3h-eli-qa.mjs
