name: WA peer-compare Staging send (alt number)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/wa-peer-compare-send.mjs'
      - 'public/project-001/wa-peer-compare-queue.json'
      - '.github/workflows/wa-peer-compare-send.yml'
  workflow_dispatch:
    inputs:
      destination:
        description: 'Alternate WA local (05…) or E.164 — must NOT be Owner 0534338601'
        required: true
        type: string
permissions:
  contents: write
jobs:
  peer-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Peer-compare one Staging send
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          MAKE_ZONE: ${{ secrets.MAKE_ZONE }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          WA_COMPARE_DEST: ${{ github.event.inputs.destination || '' }}
        run: node scripts/wa-peer-compare-send.mjs
      - name: Commit result artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/project-001/wa-peer-compare-result.json \
                  public/project-001/wa-peer-compare-gate.json \
                  public/project-001/wa-peer-compare-queue.json || true
          git diff --cached --quiet && echo "no artifact changes" && exit 0
          git commit -m "ci: WA peer-compare Staging result (no Production)"
          git push
