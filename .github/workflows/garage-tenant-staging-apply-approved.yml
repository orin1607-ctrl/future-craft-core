name: Garage tenant Isolation SQL — Staging apply (approved)

# Owner-approved Isolation SQL on usfeoerkpcafxxlyuldl only.
# Uses STAGING_DATABASE_URL (write) + psql transaction.
# Never SUPABASE_ACCESS_TOKEN. Never Production. Never Pages deploy.
# Does not open /garage-management. Does not change routeAccess.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  apply-and-verify:
    if: >
      github.repository == 'orin1607-ctrl/future-craft-core' &&
      github.event.pull_request.head.ref == 'cursor/garage-ops-center-tenant-bed0' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard Staging-only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          ref = os.environ.get("GITHUB_REF", "")
          if ref.endswith("/production"):
              sys.exit("Refusing Production branch")
          print("ref_ok", ref)
          PY
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Diagnose write-url delivery (booleans only)
        env:
          HAS_STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL != '' }}
        run: |
          set -euo pipefail
          echo "has_staging_database_url=${HAS_STAGING_DATABASE_URL}"
          echo "will_not_use_SUPABASE_ACCESS_TOKEN=true"
          echo "will_not_use_DATABASE_URL=true"
      - name: Verify STAGING_DATABASE_URL is Staging only
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          STAGING = "usfeoerkpcafxxlyuldl"
          PROD = "qasomfndnjuixgjmjwcm"
          raw = os.environ.get("STAGING_DATABASE_URL") or ""
          if not raw.strip():
              sys.exit("STAGING_DATABASE_URL is empty. Isolation SQL not applied. Did not use SUPABASE_ACCESS_TOKEN.")
          if PROD in raw or "dalia-car.online" in raw.lower():
              sys.exit("STAGING_DATABASE_URL contains Production. STOP. SQL not applied.")
          if STAGING not in raw:
              sys.exit("STAGING_DATABASE_URL does not contain usfeoerkpcafxxlyuldl. STOP. SQL not applied.")
          at = raw.rfind("@")
          if at < 0:
              sys.exit("STAGING_DATABASE_URL has no host. STOP.")
          userinfo = raw[:at]
          rest = raw[at + 1:]
          hostport = rest.split("/")[0]
          host = hostport.split(":")[0].lower()
          port = hostport.split(":")[1] if ":" in hostport else ""
          scheme = raw.split(":", 1)[0].lower()
          if PROD in host or PROD in userinfo:
              sys.exit("Production ref found in host/user. STOP. SQL not applied.")
          staging_in_host = STAGING in host
          staging_in_userinfo = STAGING in userinfo
          if not staging_in_host and not staging_in_userinfo:
              sys.exit("Neither host nor user identify Staging usfeoerkpcafxxlyuldl. STOP.")
          if "pooler.supabase.com" in host and not staging_in_userinfo:
              sys.exit("Pooler host without Staging tenant in user. STOP.")
          if host.startswith("db.") and host.endswith(".supabase.co"):
              sys.exit("Still the direct db host (IPv6-only from Actions). Need Session pooler. STOP. SQL not applied.")
          print("url_scheme", scheme)
          print("url_host", host)
          print("url_port", port or "(default)")
          print("staging_in_host", staging_in_host)
          print("staging_in_userinfo", staging_in_userinfo)
          print("production_ref_present", False)
          PY
      - name: Live connection identity (SELECT only, no apply)
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess, sys
          STAGING = "usfeoerkpcafxxlyuldl"
          PROD = "qasomfndnjuixgjmjwcm"
          raw = (os.environ.get("STAGING_DATABASE_URL") or "").strip()
          if not raw:
              sys.exit("STAGING_DATABASE_URL is empty. STOP. SQL not applied.")
          if PROD in raw or "dalia-car.online" in raw.lower():
              sys.exit("STAGING_DATABASE_URL contains Production. STOP. SQL not applied.")
          if STAGING not in raw:
              sys.exit("STAGING_DATABASE_URL does not contain usfeoerkpcafxxlyuldl. STOP. SQL not applied.")
          env = os.environ.copy()
          env["PGSSLMODE"] = env.get("PGSSLMODE") or "require"
          r = subprocess.run(
              ["psql", raw, "-v", "ON_ERROR_STOP=1", "--no-psqlrc", "-tA", "-F", "|",
               "-c", "SELECT current_user, session_user, current_database();"],
              capture_output=True, text=True, timeout=30, env=env,
          )
          if r.returncode != 0:
              print("live_psql_failed")
              sys.exit("Live psql identity failed. STOP. SQL not applied. Production not touched.")
          line = (r.stdout or "").strip().splitlines()[-1] if (r.stdout or "").strip() else ""
          parts = line.split("|")
          if len(parts) != 3:
              sys.exit("Live identity result was not current_user|session_user|current_database. STOP.")
          current_user, session_user, current_db = parts
          blob = f"{current_user}|{session_user}|{current_db}"
          if PROD in blob:
              sys.exit("Live session contains Production ref qasomfndnjuixgjmjwcm. STOP. SQL not applied.")
          live_staging = STAGING in current_user or STAGING in session_user
          at = raw.rfind("@")
          userinfo = raw[:at] if at >= 0 else ""
          staging_in_userinfo = STAGING in userinfo
          print("live_current_user", current_user)
          print("live_session_user", session_user)
          print("live_current_database", current_db)
          print("live_role_has_staging_ref", live_staging)
          print("live_userinfo_has_staging_ref", staging_in_userinfo)
          print("live_production_ref_present", False)
          if not live_staging and not staging_in_userinfo:
              sys.exit("Live identity is not Staging usfeoerkpcafxxlyuldl. STOP. SQL not applied.")
          print("CONNECTION_IDENTITY_OK", STAGING)
          PY
      - name: Apply Isolation SQL in one transaction
        env:
          APPLY_GARAGE_TENANT_STAGING: '1'
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: node scripts/apply-garage-tenant-staging.mjs
      - name: SQL consistency verify (read-only PRECHECK token)
        env:
          SUPABASE_STAGING_PRECHECK_TOKEN: ${{ secrets.SUPABASE_STAGING_PRECHECK_TOKEN }}
        run: node scripts/verify-garage-tenant-staging.mjs
      - name: Diagnose isolation QA secret delivery (booleans only)
        env:
          HAS_STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY != '' }}
          HAS_STAGING_QA_EMAIL: ${{ secrets.STAGING_QA_EMAIL != '' }}
          HAS_STAGING_QA_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD != '' }}
          HAS_STAGING_QA_FLEET_A_EMAIL: ${{ secrets.STAGING_QA_FLEET_A_EMAIL != '' }}
          HAS_STAGING_QA_FLEET_A_PASSWORD: ${{ secrets.STAGING_QA_FLEET_A_PASSWORD != '' }}
          HAS_STAGING_QA_FLEET_B_EMAIL: ${{ secrets.STAGING_QA_FLEET_B_EMAIL != '' }}
          HAS_STAGING_QA_FLEET_B_PASSWORD: ${{ secrets.STAGING_QA_FLEET_B_PASSWORD != '' }}
        run: |
          set -euo pipefail
          echo "has_staging_supabase_anon_key=${HAS_STAGING_SUPABASE_ANON_KEY}"
          echo "has_staging_qa_email=${HAS_STAGING_QA_EMAIL}"
          echo "has_staging_qa_password=${HAS_STAGING_QA_PASSWORD}"
          echo "has_staging_qa_fleet_a_email=${HAS_STAGING_QA_FLEET_A_EMAIL}"
          echo "has_staging_qa_fleet_a_password=${HAS_STAGING_QA_FLEET_A_PASSWORD}"
          echo "has_staging_qa_fleet_b_email=${HAS_STAGING_QA_FLEET_B_EMAIL}"
          echo "has_staging_qa_fleet_b_password=${HAS_STAGING_QA_FLEET_B_PASSWORD}"
          echo "qa_uses_fetch_not_supabase_js=true"
      - name: Role isolation probe (not PASS without two fleet QA users)
        env:
          VITE_SUPABASE_URL: https://usfeoerkpcafxxlyuldl.supabase.co
          VITE_SUPABASE_PROJECT_ID: usfeoerkpcafxxlyuldl
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_QA_EMAIL: ${{ secrets.STAGING_QA_EMAIL }}
          STAGING_QA_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD }}
          STAGING_QA_FLEET_A_EMAIL: ${{ secrets.STAGING_QA_FLEET_A_EMAIL }}
          STAGING_QA_FLEET_A_PASSWORD: ${{ secrets.STAGING_QA_FLEET_A_PASSWORD }}
          STAGING_QA_FLEET_B_EMAIL: ${{ secrets.STAGING_QA_FLEET_B_EMAIL }}
          STAGING_QA_FLEET_B_PASSWORD: ${{ secrets.STAGING_QA_FLEET_B_PASSWORD }}
        run: |
          set -euo pipefail
          set +e
          node scripts/qa-garage-tenant-isolation.mjs
          code=$?
          set -e
          echo "isolation_qa_exit=${code}"
          if [ "${code}" = "2" ]; then
            echo "::error::Isolation QA fail-closed (SQL missing or overlap). Did not open the module."
            exit 2
          fi
          if [ "${code}" = "3" ]; then
            echo "Isolation QA skipped: two fleet_manager QA users are missing. Not Isolation PASS."
            exit 0
          fi
          if [ "${code}" != "0" ]; then
            exit "${code}"
          fi
      - name: Upload apply/verify reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garage-tenant-staging-apply
          path: |
            test-results/garage-tenant-staging-apply.json
            test-results/garage-tenant-staging-verify.json
            test-results/garage-tenant-isolation-qa.json
          if-no-files-found: ignore
