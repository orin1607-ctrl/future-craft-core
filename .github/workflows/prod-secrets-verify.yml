name: Production secrets verify + complete
on:
  push:
    branches: [main]
    paths:
      - 'scripts/prod-secrets-verify.mjs'
      - 'public/project-001/prod-secrets-verify-queue.json'
      - '.github/workflows/prod-secrets-verify.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate — queue armed
        id: gate
        run: |
          armed=$(node -e "const q=require('./public/project-001/prod-secrets-verify-queue.json'); process.stdout.write(String(q.armed===true))")
          echo "armed=$armed" >> "$GITHUB_OUTPUT"
      - name: Verify + complete Prod secrets
        if: steps.gate.outputs.armed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          # Optional — only if Owner stored these as GitHub Secrets
          GUPSHUP_API_KEY: ${{ secrets.GUPSHUP_API_KEY }}
          GUPSHUP_SOURCE: ${{ secrets.GUPSHUP_SOURCE }}
          GUPSHUP_APP_NAME: ${{ secrets.GUPSHUP_APP_NAME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: node scripts/prod-secrets-verify.mjs
      - name: Disarm + commit results
        if: always() && steps.gate.outputs.armed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node -e "
            const fs=require('fs');
            const p='public/project-001/prod-secrets-verify-queue.json';
            const q=JSON.parse(fs.readFileSync(p,'utf8'));
            q.armed=false; q.completed=true; q.at=new Date().toISOString();
            fs.writeFileSync(p, JSON.stringify(q,null,2)+'\n');
          "
          git add -f public/project-001/prod-secrets-verify-result.json || true
          git add -f public/project-001/prod-secrets-verify-summary.json || true
          git add -f public/project-001/prod-secrets-verify-queue.json || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git pull --rebase origin main || true
          git commit -m "ci: Production secrets verify (no code deploy)"
          git push
