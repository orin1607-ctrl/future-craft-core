name: Probe Gupshup Edge Secrets Capability

# Checks whether CI can list/set Production Edge Secrets.
# NEVER prints secret values — names and HTTP status only.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-gupshup-secrets-capability.yml'
      - 'public/project-001/gupshup-secrets-probe-queue.json'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capability probe (names + status only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANON: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const tokenRaw = process.env.SUPABASE_ACCESS_TOKEN || '';
          const token = tokenRaw.replace(/[\r\n]/g, '').trim();
          const srk = process.env.SRK;
          const anon = process.env.ANON;
          const STAGING = 'usfeoerkpcafxxlyuldl';
          const PROD = 'qasomfndnjuixgjmjwcm';
          const NEEDED = ['GUPSHUP_API_KEY', 'GUPSHUP_SOURCE', 'GUPSHUP_APP_NAME'];

          const out = {
            access_token_present: Boolean(token),
            access_token_len: token.length,
            management_api: {},
            secrets_list: {},
            secrets_set_capability: {},
            agent_has_gupshup_values: {
              GUPSHUP_API_KEY: Boolean(process.env.GUPSHUP_API_KEY),
              GUPSHUP_SOURCE: Boolean(process.env.GUPSHUP_SOURCE),
              GUPSHUP_APP_NAME: Boolean(process.env.GUPSHUP_APP_NAME),
              note: 'Agent/CI env does not contain GUPSHUP values; secrets list API returns names only',
            },
            production_wa_configured: null,
            verdict: null,
          };

          async function mgmt(path, { method = 'GET', body } = {}) {
            const res = await fetch(`https://api.supabase.com/v1${path}`, {
              method,
              headers: {
                Authorization: `Bearer ${token}`,
                apikey: token,
                ...(body ? { 'Content-Type': 'application/json' } : {}),
              },
              body: body ? JSON.stringify(body) : undefined,
            });
            const text = await res.text();
            let json = null;
            try { json = text ? JSON.parse(text) : null; } catch { json = { raw: text.slice(0, 200) }; }
            return { status: res.status, json, text: text.slice(0, 300) };
          }

          // 1) Validate token
          const projects = await mgmt('/projects');
          out.management_api.projects_list_http = projects.status;
          out.management_api.token_valid = projects.status === 200;
          if (projects.status !== 200) {
            out.verdict = 'NO_PERMISSION_OR_INVALID_ACCESS_TOKEN';
            out.owner_needed = [
              'Rotate SUPABASE_ACCESS_TOKEN (Dashboard account tokens → GitHub Secret)',
              'Then copy GUPSHUP_* from Staging Edge Secrets to Production Edge Secrets in Dashboard',
            ];
            console.log(JSON.stringify(out, null, 2));
            process.exit(0);
          }

          // 2) List secret NAMES for staging + prod (values are never returned)
          for (const ref of [STAGING, PROD]) {
            const listed = await mgmt(`/projects/${ref}/secrets`);
            const names = Array.isArray(listed.json)
              ? listed.json.map((s) => s.name || s).filter(Boolean)
              : [];
            const present = {};
            for (const n of NEEDED) present[n] = names.includes(n);
            out.secrets_list[ref] = {
              http: listed.status,
              gupshup_names_present: present,
              all_secret_count: names.length,
              // do not dump full name list if huge — only GUPSHUP-related + RESEND presence
              has_RESEND_API_KEY: names.includes('RESEND_API_KEY'),
              has_RESEND_FROM: names.includes('RESEND_FROM'),
            };
          }

          // 3) Can we SET? Probe with deliberately invalid empty update is unsafe.
          //    Instead: report whether we HAVE values to set. Without values, set is impossible.
          const canSetApi = out.management_api.token_valid; // token can call secrets endpoints
          const haveValues = Object.values(out.agent_has_gupshup_values).some((v) => v === true);
          out.secrets_set_capability = {
            management_token_can_call_secrets_api: canSetApi,
            agent_has_secret_VALUES_to_write: false,
            can_copy_values_from_staging_via_api: false,
            reason:
              'Supabase secrets list returns names only; values cannot be read/copied by API. Setting Production secrets requires the actual GUPSHUP_API_KEY value from Owner/Dashboard/Staging UI.',
          };

          // 4) Live WA configured check on Production
          async function post(base, path, body, bearer, apikey) {
            const res = await fetch(base + path, {
              method: 'POST',
              headers: {
                apikey: apikey || bearer,
                Authorization: `Bearer ${bearer}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(body),
            });
            return { status: res.status, body: await res.json().catch(() => ({})) };
          }
          const gen = await post(`https://${PROD}.supabase.co`, '/auth/v1/admin/generate_link', { type: 'magiclink', email: 'orin1607@gmail.com' }, srk, srk);
          const ver = await post(`https://${PROD}.supabase.co`, '/auth/v1/verify', { type: 'magiclink', email: 'orin1607@gmail.com', token: gen.body.email_otp }, anon, anon);
          const at = ver.body.access_token || ver.body.session?.access_token;
          const wa = await post(`https://${PROD}.supabase.co`, '/functions/v1/send-whatsapp-message', { action: 'check_connection' }, at, anon);
          out.production_wa_configured = {
            http: wa.status,
            configured: wa.body.configured ?? null,
            message: String(wa.body.message || '').slice(0, 160),
          };

          const stagingHasKey = out.secrets_list[STAGING]?.gupshup_names_present?.GUPSHUP_API_KEY;
          const prodHasKey = out.secrets_list[PROD]?.gupshup_names_present?.GUPSHUP_API_KEY;

          if (prodHasKey && out.production_wa_configured.configured) {
            out.verdict = 'PRODUCTION_ALREADY_CONFIGURED';
          } else if (!haveValues) {
            out.verdict = 'AGENT_CANNOT_SET_MISSING_SECRET_VALUES';
            out.owner_needed = {
              action: 'Copy GUPSHUP secrets Staging → Production in Supabase Dashboard (do not paste in chat)',
              staging_url: `https://supabase.com/dashboard/project/${STAGING}/settings/functions`,
              production_url: `https://supabase.com/dashboard/project/${PROD}/settings/functions`,
              secrets: [
                { name: 'GUPSHUP_API_KEY', required: true, staging_present: Boolean(stagingHasKey), production_present: Boolean(prodHasKey) },
                { name: 'GUPSHUP_SOURCE', required: false, default_in_code: '972546500305', staging_present: out.secrets_list[STAGING]?.gupshup_names_present?.GUPSHUP_SOURCE ?? null, production_present: out.secrets_list[PROD]?.gupshup_names_present?.GUPSHUP_SOURCE ?? null },
                { name: 'GUPSHUP_APP_NAME', required: false, default_in_code: 'DaliaVehicle', staging_present: out.secrets_list[STAGING]?.gupshup_names_present?.GUPSHUP_APP_NAME ?? null, production_present: out.secrets_list[PROD]?.gupshup_names_present?.GUPSHUP_APP_NAME ?? null },
              ],
              after_done: 'Reply «סיימתי Gupshup Production» and agent will re-run E2E + send real WA/Email',
            };
          }

          console.log('---GUP_SHUP_CAPABILITY---');
          console.log(JSON.stringify(out, null, 2));
          console.log('---GUP_SHUP_CAPABILITY_DONE---');
          NODE
