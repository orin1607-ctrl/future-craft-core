name: Oren Car Production Code Deploy

# Owner authorized in Cursor chat 2026-08-10:
# CODE ONLY to dalia-car.online — tasks 1-15 + 3 bug fixes. NO data changes.
# No GitHub Environment gate (blocks automated approvals).

on:
  push:
    branches:
      - main
      # Owner-authorized 2026-09-06: overlay Tasks 1-2 onto live Production SHA only.
      # Do not merge this branch to main. Does not target the GPS/telematics VPS.
      - cursor/oren-car-prod-overlay-tasks-1-2-b1e6
    paths:
      - 'public/project-001/oren-car-production-deploy.json'
      - '.github/workflows/oren-car-production-code-deploy.yml'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Git commit to deploy (default HEAD main)'
        required: false
        default: ''

concurrency:
  group: oren-car-production-code-deploy
  cancel-in-progress: false

env:
  PROD_SUPABASE_URL: https://qasomfndnjuixgjmjwcm.supabase.co
  PROD_SUPABASE_PROJECT_ID: qasomfndnjuixgjmjwcm
  WEB_ROOT: /root/future-craft-core/dist
  PRODUCTION_URL: https://dalia-car.online

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0

      - name: Gate — deploy armed
        id: gate
        run: |
          armed=$(node -e "const q=require('./public/project-001/oren-car-production-deploy.json'); process.stdout.write(String(q.armed===true))")
          echo "armed=$armed" >> "$GITHUB_OUTPUT"
          test "$armed" = "true"

      - uses: oven-sh/setup-bun@v2

      - name: Install + build production
        env:
          VITE_SUPABASE_URL: ${{ env.PROD_SUPABASE_URL }}
          VITE_SUPABASE_PROJECT_ID: ${{ env.PROD_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          bun install --frozen-lockfile
          bun x vite build
          node scripts/ci-smoke-report.mjs --dist dist --supabase-ref qasomfndnjuixgjmjwcm

      - id: bundle
        run: |
          BUNDLE=$(grep -oE 'index-[^"]+\.js' dist/index.html | head -1)
          echo "name=${BUNDLE}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Backup + rsync frontend to Production
        run: |
          STAMP=$(date -u +%F-%H%M)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "tar czf /root/pre-deploy-dist-${STAMP}.tgz -C /root/future-craft-core dist && echo BACKUP=/root/pre-deploy-dist-${STAMP}.tgz"
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --delete \
            --filter="P orin-marketing/" \
            --filter="P orin-owner-gate.js" \
            dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.WEB_ROOT }}/
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /root/future-craft-core/site-static"
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            public/site/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/future-craft-core/site-static/
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo 'commit=${{ github.sha }} bundle=${{ steps.bundle.outputs.name }} at=$(date -u +%Y-%m-%dT%H:%M:%SZ) reason=oren-car-tasks-1-2-overlay base=6431c688 fullMerge=NO' > /root/future-craft-core/dist/PRODUCTION-DEPLOY.txt"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "nginx -t && systemctl reload nginx"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post-deploy smoke (live)
        run: |
          sleep 5
          node scripts/ci-smoke-report.mjs \
            --base "${{ env.PRODUCTION_URL }}" \
            --supabase-ref qasomfndnjuixgjmjwcm \
            --out reports/ci-smoke-oren-car-production.json
