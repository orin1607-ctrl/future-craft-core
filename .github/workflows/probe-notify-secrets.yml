name: Probe notify secrets + test GH access token

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-notify-secrets.yml'
  workflow_dispatch: {}

jobs:
  probe-vps-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Search key names only
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' <<'REMOTE'
          set +e
          echo "=== files mentioning GUPSHUP/RESEND/SERVICE_ROLE ==="
          grep -rIl -E 'GUPSHUP|RESEND_API|SERVICE_ROLE|sbp_' /root --include='.env*' --include='*.sh' --include='*.env' --include='*.json' --include='*.yml' 2>/dev/null | head -40
          echo "=== key name hits (lengths only) ==="
          for f in $(grep -rIl -E 'GUPSHUP|RESEND|SERVICE_ROLE|sbp_' /root/dalia-ops /root --include='.env*' --include='*.sh' 2>/dev/null | head -30); do
            echo "-- $f"
            python3 - <<PY
          from pathlib import Path
          import re
          text=Path("$f").read_text(errors="ignore")
          for line in text.splitlines():
            if re.search(r'GUPSHUP|RESEND|SERVICE_ROLE|ACCESS_TOKEN|sbp_', line, re.I) and '=' in line:
              k,v=line.split('=',1)
              v=v.strip().strip('"').strip("'")
              print(f"  {k.strip()}_LEN={len(v)} PREFIX={(v[:4]+'...') if v else 'EMPTY'}")
          PY
          done
          echo "=== dalia-ops server listen? ==="
          ss -lntp | grep -E '7700|3000|8080' || netstat -lntp 2>/dev/null | grep -E '7700|3000' || true
          systemctl is-active dalia-ops 2>/dev/null || true
          echo DONE
          REMOTE

  test-gh-supabase-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test SUPABASE_ACCESS_TOKEN from GitHub Secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "GH_SECRET_EMPTY=1"
            exit 0
          fi
          echo "GH_SECRET_LEN=${#SUPABASE_ACCESS_TOKEN} PREFIX=${SUPABASE_ACCESS_TOKEN:0:4}..."
          npx supabase projects list 2>&1 | head -20 || true
          echo "EXIT=$?"
