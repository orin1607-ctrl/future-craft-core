name: E2E — Declaration Template Text Staging

# Staging-only. Never Production.
on:
  push:
    branches:
      - feat/incident-alerts-staging
    paths:
      - 'src/components/DeclarationTemplateManager.tsx'
      - 'src/components/DriverDeclaration.tsx'
      - 'src/components/DeclarationPreviewModal.tsx'
      - 'src/pages/SignDeclaration.tsx'
      - 'src/services/declarationTemplatesApi.ts'
      - 'src/utils/declarationTemplates.ts'
      - 'src/utils/printDeclaration.ts'
      - 'scripts/e2e-declaration-template-text-staging.mjs'
      - '.github/workflows/e2e-declaration-template-text-staging.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-declaration-template-text-staging
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun x vitest run src/utils/declarationTemplates.test.ts src/utils/normalizeTemplateCompanyName.test.ts

      - name: Install Playwright Chromium
        run: bun x playwright install --with-deps chromium

      - name: Wait for Staging Pages settle
        run: sleep 45

      - name: Run declaration template text E2E on Staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_PAGES_URL: https://orin1607-ctrl.github.io/future-craft-core
        run: node scripts/e2e-declaration-template-text-staging.mjs

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: declaration-template-text-e2e
          path: |
            docs/screenshots/declaration-template-e2e/**
            /opt/cursor/artifacts/declaration-template-text-staging-e2e.json
          if-no-files-found: ignore
