name: Production driver-area selective

# Owner authorized 2026-09-13: six driver-area tasks ONLY onto live SHA 172f525c.
# Does NOT checkout main/dev/origin/production. Does not use GitHub Environment gate
# (that gate is for full-main deploys). Always backups VPS + DB before migrate.

on:
  push:
    branches: [cursor/prod-driver-area-only-b784]
    paths:
      - 'public/project-001/prod-driver-area-deploy.json'
      - '.github/workflows/prod-driver-area-selective.yml'
  workflow_dispatch:
    inputs:
      phase:
        description: backup | migrate | functions | frontend | all
        required: false
        default: 'all'

concurrency:
  group: prod-driver-area-selective
  cancel-in-progress: false

env:
  PROD_SUPABASE_URL: https://qasomfndnjuixgjmjwcm.supabase.co
  PROD_SUPABASE_PROJECT_ID: qasomfndnjuixgjmjwcm
  WEB_ROOT: /root/future-craft-core/dist
  PRODUCTION_URL: https://dalia-car.online
  LIVE_BEFORE: 172f525c5b1c1ff1aed3525dd3526828a9938c8a

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate — armed + this branch only
        id: gate
        run: |
          set -euo pipefail
          armed=$(node -e "const q=require('./public/project-001/prod-driver-area-deploy.json'); process.stdout.write(String(q.armed===true))")
          echo "armed=$armed" >> "$GITHUB_OUTPUT"
          test "$armed" = "true"
          echo "SHA=${GITHUB_SHA}"
          git merge-base --is-ancestor "$LIVE_BEFORE" HEAD
          # Refuse if this commit is origin/main tip (would mean we deployed staging wholesale)
          if git rev-parse origin/main >/dev/null 2>&1; then
            MAIN=$(git rev-parse origin/main || true)
            if [ "$GITHUB_SHA" = "$MAIN" ]; then
              echo "REFUSING to deploy origin/main wholesale" >&2
              exit 1
            fi
          fi
          PHASE="${{ github.event.inputs.phase || '' }}"
          if [ -z "$PHASE" ]; then
            PHASE=$(node -e "const q=require('./public/project-001/prod-driver-area-deploy.json'); process.stdout.write(q.phase||'all')")
          fi
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          echo "PHASE=$PHASE"

      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.gate.outputs.phase == 'all' || steps.gate.outputs.phase == 'frontend' }}

      - name: Install + build production frontend
        if: ${{ steps.gate.outputs.phase == 'all' || steps.gate.outputs.phase == 'frontend' }}
        env:
          VITE_SUPABASE_URL: ${{ env.PROD_SUPABASE_URL }}
          VITE_SUPABASE_PROJECT_ID: ${{ env.PROD_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          bun install --frozen-lockfile
          bun x vite build
          node scripts/ci-smoke-report.mjs --dist dist --supabase-ref qasomfndnjuixgjmjwcm

      - id: bundle
        if: ${{ steps.gate.outputs.phase == 'all' || steps.gate.outputs.phase == 'frontend' }}
        run: |
          BUNDLE=$(grep -oE 'index-[^"]+\.js' dist/index.html | head -1)
          echo "name=${BUNDLE}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        if: ${{ steps.gate.outputs.phase != 'functions' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Backup Production DB + VPS dist (required before migrate)
        if: ${{ steps.gate.outputs.phase == 'all' || steps.gate.outputs.phase == 'migrate' || steps.gate.outputs.phase == 'backup' }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%F-%H%M%S)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          SSH=(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=6)
          RSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=6"
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "backup_attempt=$attempt"
            if "${SSH[@]}" ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /root/driver-area-sql /root/db-backups"; then
              ok=1
              break
            fi
            sleep $((attempt * 8))
          done
          test "$ok" = "1"
          rsync -avz -e "$RSH" \
            supabase/migrations/20260913220000_prod_driver_area_only.sql \
            docs/audit-reports/prod-driver-area-20260913/ROLLBACK.sql \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/driver-area-sql/
          "${SSH[@]}" ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "STAMP=$STAMP LIVE_BEFORE=$LIVE_BEFORE GITHUB_SHA=${GITHUB_SHA} bash -s" << 'REMOTE'
          set -euo pipefail
          mkdir -p /root/driver-area-sql /root/db-backups
          tar czf "/root/pre-deploy-dist-${STAMP}.tgz" -C /root/future-craft-core dist
          echo "FRONTEND_BACKUP=/root/pre-deploy-dist-${STAMP}.tgz"
          set -a; source /root/dalia-ops/.env; set +a
          DB_URL=$(python3 - <<'PY'
          import os, urllib.parse
          pwd=os.environ["SUPABASE_DB_PASSWORD"]
          host=os.environ.get("SUPABASE_POOLER_HOST","aws-1-ap-south-1.pooler.supabase.com")
          ref=os.environ.get("SUPABASE_PROJECT_REF","qasomfndnjuixgjmjwcm")
          print(f"postgresql://postgres.{ref}:{urllib.parse.quote(pwd)}@{host}:5432/postgres")
          PY
          )
          SNAP="/root/db-backups/prod-before-driver-area-${STAMP}"
          mkdir -p "$SNAP"
          # psql 16 can talk to Postgres 17; pg_dump 16 cannot. Do not pull docker images on the live VPS.
          psql "$DB_URL" -c "\dt public.*" > "$SNAP/tables.txt"
          psql "$DB_URL" -Atc "select table_name||'.'||column_name||'|'||data_type from information_schema.columns where table_schema='public' and table_name in ('emergency_logs','vehicle_history','vehicles','driver_app_action_settings','driver_app_company_config','dalia_contact_settings') order by table_name, ordinal_position;" > "$SNAP/columns.txt"
          psql "$DB_URL" -c "\\copy public.emergency_logs to '$SNAP/emergency_logs.csv' csv header"
          set +e
          psql "$DB_URL" -c "\\copy public.vehicle_history to '$SNAP/vehicle_history.csv' csv header"
          set -e
          psql "$DB_URL" -c "\\copy (select id, license_plate, odometer, assigned_driver_id, updated_at, company_name from public.vehicles) to '$SNAP/vehicles_odometer.csv' csv header"
          test -s "$SNAP/tables.txt"
          test -s "$SNAP/emergency_logs.csv"
          test -s "$SNAP/vehicles_odometer.csv"
          tar czf "${SNAP}.tgz" -C /root/db-backups "prod-before-driver-area-${STAMP}"
          echo "DB_SNAPSHOT=${SNAP}.tgz"
          echo "DB_ROLLBACK=/root/driver-area-sql/ROLLBACK.sql"
          ls -lh /root/pre-deploy-dist-${STAMP}.tgz "${SNAP}.tgz"
          psql "$DB_URL" -c "select current_database(), current_user;" | head -5
          echo "TABLES_BEFORE"
          psql "$DB_URL" -c "select to_regclass('public.dalia_contact_settings') as dalia_contact_settings, to_regclass('public.driver_app_company_config') as driver_app_company_config, to_regclass('public.driver_app_action_settings') as driver_app_action_settings;"
          echo "BACKUP_OK sha_before=$LIVE_BEFORE sha_deploy=$GITHUB_SHA"
          REMOTE

      - name: Apply isolated driver-area SQL
        if: ${{ steps.gate.outputs.phase == 'all' || steps.gate.outputs.phase == 'migrate' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=6 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          set -a; source /root/dalia-ops/.env; set +a
          DB_URL=$(python3 - <<'PY'
          import os, urllib.parse
          pwd=os.environ["SUPABASE_DB_PASSWORD"]
          host=os.environ.get("SUPABASE_POOLER_HOST","aws-1-ap-south-1.pooler.supabase.com")
          ref=os.environ.get("SUPABASE_PROJECT_REF","qasomfndnjuixgjmjwcm")
          print(f"postgresql://postgres.{ref}:{urllib.parse.quote(pwd)}@{host}:5432/postgres")
          PY
          )
          test -f /root/driver-area-sql/20260913220000_prod_driver_area_only.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f /root/driver-area-sql/20260913220000_prod_driver_area_only.sql
          psql "$DB_URL" -tAc "select to_regclass('public.dalia_contact_settings');" | grep -q dalia_contact_settings
          psql "$DB_URL" -tAc "select to_regclass('public.driver_app_action_settings');" | grep -q driver_app_action_settings
          psql "$DB_URL" -tAc "select 1 from information_schema.columns where table_name='emergency_logs' and column_name='sla_deadline_at';" | grep -q 1
          psql "$DB_URL" -tAc "select 1 from pg_proc where proname='report_driver_odometer';" | grep -q 1
          echo "MIGRATE_OK"
          REMOTE

      - name: Rsync frontend to Production
        if: ${{ steps.gate.outputs.phase == 'all' || steps.gate.outputs.phase == 'frontend' }}
        run: |
          set -euo pipefail
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=6" \
            --delete \
            --filter="P orin-marketing/" \
            --filter="P orin-owner-gate.js" \
            dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.WEB_ROOT }}/
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=6 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo 'commit=${{ github.sha }} bundle=${{ steps.bundle.outputs.name }} at=$(date -u +%Y-%m-%dT%H:%M:%SZ) reason=driver-area-only-2026-09-13 before=${{ env.LIVE_BEFORE }}' > /root/future-craft-core/dist/PRODUCTION-DEPLOY.txt"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=6 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "nginx -t && systemctl reload nginx"

      - uses: actions/setup-node@v4
        if: ${{ steps.gate.outputs.phase == 'all' || steps.gate.outputs.phase == 'functions' }}
        with:
          node-version: '20'

      - name: Deploy notify-driver-event only (GitHub secret, Production ref)
        id: fn_runner
        if: ${{ steps.gate.outputs.phase == 'all' || steps.gate.outputs.phase == 'functions' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          TOK=$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          export SUPABASE_ACCESS_TOKEN="$TOK"
          echo "GH_TOKEN_LEN=${#SUPABASE_ACCESS_TOKEN}"
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "EDGE_DEPLOY=NO_GH_TOKEN"
            exit 1
          fi
          PROJ_HTTP=$(curl -sS -o /tmp/mgmt-projects.json -w "%{http_code}" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects" || echo 000)
          ONE_HTTP=$(curl -sS -o /tmp/mgmt-one.json -w "%{http_code}" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/qasomfndnjuixgjmjwcm" || echo 000)
          FN_HTTP=$(curl -sS -o /tmp/mgmt-fns.json -w "%{http_code}" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/qasomfndnjuixgjmjwcm/functions" || echo 000)
          echo "MGMT_PROJECTS_HTTP=$PROJ_HTTP ONE_HTTP=$ONE_HTTP FUNCTIONS_LIST_HTTP=$FN_HTTP"
          python3 - <<'PY'
          import json
          for name in ("mgmt-projects","mgmt-one","mgmt-fns"):
            try:
              raw=open(f"/tmp/{name}.json").read()[:240]
            except Exception:
              raw=""
            print(f"{name}_err_prefix={raw.replace(chr(10),' ')[:240]}")
          PY
          # Try deploy even if /v1/projects is 403 — some tokens can still publish to one project.
          npx --yes supabase functions deploy notify-driver-event --project-ref qasomfndnjuixgjmjwcm --use-api
          echo "EDGE_DEPLOY=notify-driver-event OK (runner)"

      - name: Deploy notify-driver-event only (VPS token hunt fallback)
        id: fn_vps
        if: ${{ steps.gate.outputs.phase == 'all' && steps.fn_runner.outcome != 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=6 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /root/driver-area-fn/supabase/functions"
          rsync -az -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=6" \
            supabase/functions/notify-driver-event/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/driver-area-fn/supabase/functions/notify-driver-event/
          rsync -az -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=6" \
            supabase/config.toml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/driver-area-fn/supabase/config.toml
          printf '%s' "${{ secrets.SUPABASE_ACCESS_TOKEN }}" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=6 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'umask 077; cat > /root/driver-area-fn/.gh_token; echo GH_TOKEN_LEN=$(wc -c </root/driver-area-fn/.gh_token)'
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=6 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /root/driver-area-fn
          python3 - <<'PY'
          from pathlib import Path
          cands = []
          env = Path('/root/dalia-ops/.env')
          if env.exists():
            for line in env.read_text(errors='ignore').splitlines():
              if '=' not in line or line.strip().startswith('#'):
                continue
              k, v = line.split('=', 1)
              k = k.strip()
              v = v.strip().strip('"').strip("'")
              if not v:
                continue
              if 'ACCESS_TOKEN' in k or k in ('SUPABASE_PAT', 'SUPABASE_TOKEN') or v.startswith('sbp_'):
                cands.append((k, v))
          for p in [Path('/root/.supabase/access-token'), Path('/root/supabase-access-token'), Path('/root/driver-area-fn/.gh_token')]:
            if p.exists():
              t = p.read_text(errors='ignore').strip()
              if t:
                cands.append((str(p), t))
          Path('/root/driver-area-fn/.token_names').write_text('\n'.join(f'{i}:{name}:len={len(val)}' for i,(name,val) in enumerate(cands)))
          Path('/root/driver-area-fn/.tokens').write_text('\n'.join(v for _,v in cands))
          print('CANDIDATES', len(cands))
          for i,(name,val) in enumerate(cands):
            print(f'cand_{i}_len={len(val)} name={name}')
          PY
          cat .token_names || true
          OK=0
          if [ -f .tokens ] && [ -s .tokens ]; then
            while IFS= read -r TOK; do
              [ -z "$TOK" ] && continue
              export SUPABASE_ACCESS_TOKEN="$TOK"
              echo "TRY_LEN=${#SUPABASE_ACCESS_TOKEN}"
              set +e
              CODE=$(curl -sS -o /tmp/mgmt.json -w "%{http_code}" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "https://api.supabase.com/v1/projects" || echo 000)
              ONE=$(curl -sS -o /tmp/mgmt-one.json -w "%{http_code}" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "https://api.supabase.com/v1/projects/qasomfndnjuixgjmjwcm" || echo 000)
              set -e
              echo "MGMT_HTTP=$CODE ONE_HTTP=$ONE"
              set +e
              npx --yes supabase functions deploy notify-driver-event --project-ref qasomfndnjuixgjmjwcm --use-api
              RC=$?
              set -e
              echo "DEPLOY_RC=$RC"
              if [ "$RC" = "0" ]; then
                OK=1
                break
              fi
            done < .tokens
          fi
          rm -f .tokens .ops_token .token_names .gh_token
          if [ "$OK" != "1" ]; then
            echo "EDGE_DEPLOY=NO_PRIVILEGED_TOKEN" >&2
            exit 1
          fi
          echo "EDGE_DEPLOY=notify-driver-event OK (vps)"
          REMOTE

      - name: Post-deploy smoke (live frontend)
        if: ${{ steps.gate.outputs.phase == 'all' || steps.gate.outputs.phase == 'frontend' }}
        run: |
          sleep 5
          node scripts/ci-smoke-report.mjs \
            --base "${{ env.PRODUCTION_URL }}" \
            --supabase-ref qasomfndnjuixgjmjwcm \
            --out reports/ci-smoke-prod-driver-area.json
          curl -sS https://dalia-car.online/PRODUCTION-DEPLOY.txt

      - name: QA notify-driver-event (settings-driven Email/WhatsApp)
        if: ${{ steps.gate.outputs.phase == 'functions' || steps.gate.outputs.phase == 'qa' }}
        env:
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANON: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, urllib.request, urllib.error
          SRK = os.environ['SRK']
          ANON = os.environ.get('ANON') or SRK
          BASE = 'https://qasomfndnjuixgjmjwcm.supabase.co'
          FN = BASE + '/functions/v1/notify-driver-event'

          def rest(path):
              req = urllib.request.Request(
                  BASE + path,
                  headers={'apikey': SRK, 'Authorization': 'Bearer ' + SRK, 'Accept': 'application/json'},
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode() or '[]')

          def mask_email(v):
              v = (v or '').strip()
              if '@' not in v:
                  return 'set' if v else ''
              a, b = v.split('@', 1)
              return (a[:1] + '***@' + b)

          def mask_phone(v):
              d = ''.join(c for c in (v or '') if c.isdigit())
              return ('***' + d[-3:]) if len(d) >= 3 else ('set' if d else '')

          settings = rest('/rest/v1/driver_app_action_settings?select=company_name,action_key,email_enabled,whatsapp_enabled,in_app_enabled,email_to_company_contact,email_to_dalia,email_to_fleet_managers,whatsapp_to_company_contact,whatsapp_to_dalia,whatsapp_to_fleet_managers,email_extra,whatsapp_extra')
          configs = rest('/rest/v1/driver_app_company_config?select=company_name,contact_email,contact_whatsapp,dalia_service_enabled,emergency_phone')
          dalia = rest('/rest/v1/dalia_contact_settings?select=id,email,whatsapp,phone&id=eq.global')
          print('SETTINGS_ROWS', len(settings))
          print('CONFIG_ROWS', len(configs))
          cfg_by = {c['company_name']: c for c in configs}
          d0 = dalia[0] if dalia else {}
          print('DALIA_EMAIL', mask_email(d0.get('email')))
          print('DALIA_WHATSAPP', mask_phone(d0.get('whatsapp')))

          enabled = [s for s in settings if s.get('email_enabled') or s.get('whatsapp_enabled')]
          print('ENABLED_NOTIFY_ROWS', len(enabled))
          for s in enabled:
              cfg = cfg_by.get(s['company_name']) or {}
              print('ROW', json.dumps({
                  'company': s['company_name'],
                  'action': s['action_key'],
                  'email': s.get('email_enabled'),
                  'whatsapp': s.get('whatsapp_enabled'),
                  'email_to_contact': s.get('email_to_company_contact'),
                  'email_to_dalia': s.get('email_to_dalia'),
                  'email_to_fm': s.get('email_to_fleet_managers'),
                  'wa_to_contact': s.get('whatsapp_to_company_contact'),
                  'wa_to_dalia': s.get('whatsapp_to_dalia'),
                  'wa_to_fm': s.get('whatsapp_to_fleet_managers'),
                  'email_extra': bool((s.get('email_extra') or '').strip()),
                  'whatsapp_extra': bool((s.get('whatsapp_extra') or '').strip()),
                  'contact_email': mask_email(cfg.get('contact_email')),
                  'contact_whatsapp': mask_phone(cfg.get('contact_whatsapp')),
              }, ensure_ascii=False))

          wanted = ['fault', 'fault_urgent', 'accident', 'emergency']
          # One company per action: first enabled row, else first config, else skip send.
          tests = []
          for action in wanted:
              rows = [s for s in enabled if s['action_key'] == action]
              if rows:
                  tests.append(rows[0])
              elif configs:
                  tests.append({'company_name': configs[0]['company_name'], 'action_key': action, '_unconfigured': True})

          if not tests:
              print('NO_COMPANY_CONFIGURED — invoking unconfigured company to prove zero extra sends')
              tests = [{'company_name': '__qa_unconfigured__', 'action_key': a, '_unconfigured': True} for a in wanted]

          def invoke(action, company):
              body = json.dumps({
                  'action_key': action,
                  'record': {
                      'company_name': company,
                      'driver_name': 'בדיקת מערכת',
                      'vehicle_plate': 'QA-DRIVER',
                      'description': 'בדיקת אזור נהג Production — לא אירוע אמיתי',
                  },
                  'title': f'בדיקת מערכת דליה — {action}',
                  'message': 'בדיקת אזור נהג. לא תקלה/תאונה/חירום אמיתיים.',
                  'link': '/dashboard',
              }).encode()
              req = urllib.request.Request(
                  FN, data=body, method='POST',
                  headers={
                      'Content-Type': 'application/json',
                      'apikey': ANON,
                      'Authorization': 'Bearer ' + ANON,
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw = r.read().decode()
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode()
                  try:
                      parsed = json.loads(raw)
                  except Exception:
                      parsed = {'raw': raw[:400]}
                  return e.code, parsed

          print('INVOKES')
          for t in tests:
              st, data = invoke(t['action_key'], t['company_name'])
              print('INVOKE', json.dumps({
                  'action': t['action_key'],
                  'company': t['company_name'],
                  'unconfigured': bool(t.get('_unconfigured')),
                  'http': st,
                  'ok': data.get('ok'),
                  'emails_sent': data.get('emails_sent'),
                  'whatsapp_sent': data.get('whatsapp_sent'),
                  'whatsapp_skipped': data.get('whatsapp_skipped'),
                  'in_app_company_contact': data.get('in_app_company_contact'),
                  'error': data.get('error'),
              }, ensure_ascii=False))
          PY
