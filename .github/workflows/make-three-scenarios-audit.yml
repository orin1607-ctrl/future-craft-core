name: Make three-scenarios audit (no send)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/make-three-scenarios-audit.mjs'
      - 'public/project-001/make-three-scenarios-audit-queue.json'
      - '.github/workflows/make-three-scenarios-audit.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit active Make scenarios (read-only)
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          MAKE_ZONE: ${{ secrets.MAKE_ZONE }}
        run: node scripts/make-three-scenarios-audit.mjs
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/project-001/make-three-scenarios-audit-result.json || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "ci: Make three-scenarios audit (no send, no Production)"
          git push
