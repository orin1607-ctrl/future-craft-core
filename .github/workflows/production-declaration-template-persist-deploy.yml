name: Production — Declaration Template Persist Fix

# Owner reported Production bug (Cursor chat 2026-07-22):
# Edited declaration template reverts to old text after reopen / new declaration.
# Frontend-only fix: persist save + default promote; create always reads DB.

on:
  push:
    branches: [main]
    paths:
      - 'public/project-001/production-declaration-template-persist-queue.json'
      - '.github/workflows/production-declaration-template-persist-deploy.yml'
      - 'scripts/production-declaration-template-persist-verify.mjs'
      - 'src/services/declarationTemplatesApi.ts'
      - 'src/components/DeclarationTemplateManager.tsx'
      - 'src/components/DriverDeclaration.tsx'
      - 'src/pages/DriverDeclarations.tsx'
      - 'src/utils/declarationTemplates.ts'
      - 'src/utils/normalizeTemplateCompanyName.test.ts'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: production-declaration-template-persist-deploy
  cancel-in-progress: false

env:
  PROD_SUPABASE_URL: https://qasomfndnjuixgjmjwcm.supabase.co
  PROD_SUPABASE_PROJECT_ID: qasomfndnjuixgjmjwcm
  WEB_ROOT: /root/future-craft-core/dist
  PRODUCTION_URL: https://dalia-car.online

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Gate — queue armed
        id: gate
        run: |
          armed=$(node -e "const q=require('./public/project-001/production-declaration-template-persist-queue.json'); process.stdout.write(String(q.armed===true))")
          echo "armed=$armed" >> "$GITHUB_OUTPUT"
          echo "ARMED=$armed"

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.armed == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.armed == 'true'
        with:
          node-version: '22'

      - name: Install + build Production frontend
        if: steps.gate.outputs.armed == 'true'
        env:
          VITE_SUPABASE_URL: ${{ env.PROD_SUPABASE_URL }}
          VITE_SUPABASE_PROJECT_ID: ${{ env.PROD_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun x vitest run src/utils/declarationTemplates.test.ts src/utils/normalizeTemplateCompanyName.test.ts
          bun x vite build
          BUNDLE=$(grep -oE 'index-[^"]+\.js' dist/index.html | head -1)
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          echo "DEPLOY_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          test -n "$BUNDLE"
          grep -q 'התצהיר נשמר במסד הנתונים' "dist/assets/$BUNDLE"
          if grep -q 'Falling back to built-in declaration text' "dist/assets/$BUNDLE"; then
            echo "FAIL: silent hardcoded fallback still present"
            exit 1
          fi
          echo "PERSIST_FIX_MARKERS_OK"

      - name: Setup SSH
        if: steps.gate.outputs.armed == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Backup + rsync frontend to Hostinger
        if: steps.gate.outputs.armed == 'true'
        run: |
          set -euo pipefail
          STAMP=$(date -u +%F-%H%M)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "tar czf /root/pre-deploy-dist-${STAMP}.tgz -C /root/future-craft-core dist && echo BACKUP=/root/pre-deploy-dist-${STAMP}.tgz"
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --delete \
            --filter="P orin-marketing/" \
            --filter="P orin-owner-gate.js" \
            dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.WEB_ROOT }}/
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo 'commit=${{ github.sha }} bundle=${BUNDLE} at=$(date -u +%Y-%m-%dT%H:%M:%SZ) reason=declaration-template-persist-fix' > /root/future-craft-core/dist/PRODUCTION-DEPLOY.txt"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "nginx -t && systemctl reload nginx"
          echo "FRONTEND_DEPLOY=ok"

      - name: Post-deploy persist verify
        if: steps.gate.outputs.armed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
        run: node scripts/production-declaration-template-persist-verify.mjs

      - name: Disarm + commit results
        if: always() && steps.gate.outputs.armed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node -e "
            const fs=require('fs');
            const p='public/project-001/production-declaration-template-persist-queue.json';
            const q=JSON.parse(fs.readFileSync(p,'utf8'));
            q.armed=false; q.completed=true; q.at=new Date().toISOString();
            fs.writeFileSync(p, JSON.stringify(q,null,2)+'\n');
          "
          git add public/project-001/production-declaration-template-persist-queue.json \
            public/project-001/production-declaration-template-persist-result.json \
            public/project-001/production-declaration-template-persist-summary.json || true
          git commit -m "chore(prod): declaration template persist deploy results (disarm queue)" || echo "NO_COMMIT"
          git push origin HEAD:main || echo "PUSH_WARN"
