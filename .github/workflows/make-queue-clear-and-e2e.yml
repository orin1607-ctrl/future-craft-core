name: Make clear queue + Staging E2E

# Deletes webhook incomings only. Activates Whatsapp Bot. One Staging WA + DLR.
# No Production.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/make-queue-clear-and-e2e.mjs'
      - 'public/project-001/make-queue-clear-e2e-queue.json'
      - '.github/workflows/make-queue-clear-and-e2e.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  clear-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clear Make queue + one Staging E2E
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          MAKE_ZONE: ${{ secrets.MAKE_ZONE }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/make-queue-clear-and-e2e.mjs
