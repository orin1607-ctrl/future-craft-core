name: WA sent-not-received diagnose

on:
  push:
    branches: [main]
    paths:
      - 'scripts/wa-sent-not-received-diagnose.mjs'
      - 'public/project-001/wa-sent-not-received-queue.json'
      - '.github/workflows/wa-sent-not-received-diagnose.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose sent without delivered
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          MAKE_ZONE: ${{ secrets.MAKE_ZONE }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/wa-sent-not-received-diagnose.mjs
