name: Garage tenant PRECHECK — Staging read-only

# SELECT-only counts on usfeoerkpcafxxlyuldl.
# Uses SUPABASE_STAGING_PRECHECK_TOKEN only (Database READ).
# Never SUPABASE_ACCESS_TOKEN. Never Production. Never applies tenant SQL.

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  staging-precheck:
    if: github.ref != 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard this is Staging-only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          ref = os.environ.get("GITHUB_REF", "")
          if ref.endswith("/production"):
              sys.exit("Refusing Production branch")
          print("ref_ok", ref)
          PY
      - name: Diagnose secret delivery (booleans only, never print tokens)
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
          PRECHECK_SECRET_PRESENT: ${{ secrets.SUPABASE_STAGING_PRECHECK_TOKEN != '' }}
          OTHER_REPO_SECRET_PRESENT: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          PRECHECK_VARIABLE_PRESENT: ${{ vars.SUPABASE_STAGING_PRECHECK_TOKEN != '' }}
        run: |
          set -euo pipefail
          echo "event=${EVENT_NAME}"
          echo "head_repo=${HEAD_REPO}"
          echo "is_fork=${IS_FORK}"
          echo "precheck_secret_present=${PRECHECK_SECRET_PRESENT}"
          echo "other_repo_secret_present=${OTHER_REPO_SECRET_PRESENT}"
          echo "precheck_variable_present=${PRECHECK_VARIABLE_PRESENT}"
          echo "job_environment=none (repository Actions secrets only)"
      - name: Require SUPABASE_STAGING_PRECHECK_TOKEN
        env:
          SUPABASE_STAGING_PRECHECK_TOKEN: ${{ secrets.SUPABASE_STAGING_PRECHECK_TOKEN }}
          PRECHECK_SECRET_PRESENT: ${{ secrets.SUPABASE_STAGING_PRECHECK_TOKEN != '' }}
          OTHER_REPO_SECRET_PRESENT: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          PRECHECK_VARIABLE_PRESENT: ${{ vars.SUPABASE_STAGING_PRECHECK_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_STAGING_PRECHECK_TOKEN}" ]; then
            echo "::error::GitHub secret SUPABASE_STAGING_PRECHECK_TOKEN is empty in this job. Do not use SUPABASE_ACCESS_TOKEN. Production was not touched."
            if [ "${PRECHECK_VARIABLE_PRESENT}" = "true" ]; then
              echo "::error::A Repository VARIABLE with this name exists. Move the PAT to Actions Secrets (not Variables)."
            elif [ "${OTHER_REPO_SECRET_PRESENT}" = "true" ]; then
              echo "::error::Other repository Actions secrets are visible, so this is not a pull_request secret-block. The new name is missing from Repository Actions secrets (check Environment secrets on github-pages / Preview / Production, or a typo)."
            else
              echo "::error::No repository Actions secrets were visible to this job. Save SUPABASE_STAGING_PRECHECK_TOKEN under Settings → Secrets and variables → Actions → Repository secrets (not an Environment secret unless this job sets that environment)."
            fi
            exit 3
          fi
          echo "precheck_token_present=true"
      - name: Read-only PRECHECK
        env:
          SUPABASE_STAGING_PRECHECK_TOKEN: ${{ secrets.SUPABASE_STAGING_PRECHECK_TOKEN }}
          VITE_SUPABASE_URL: https://usfeoerkpcafxxlyuldl.supabase.co
          VITE_SUPABASE_PROJECT_ID: usfeoerkpcafxxlyuldl
        run: node scripts/precheck-garage-tenant-staging.mjs
      - name: Upload PRECHECK report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garage-tenant-precheck
          path: test-results/garage-tenant-precheck.json
          if-no-files-found: ignore

  # If the PAT was saved as a Preview Environment secret, repository-secret
  # jobs cannot see it. This job never uses Production / github-pages.
  staging-precheck-preview-env:
    if: github.ref != 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe Preview environment for the read-only token
        env:
          SUPABASE_STAGING_PRECHECK_TOKEN: ${{ secrets.SUPABASE_STAGING_PRECHECK_TOKEN }}
        run: |
          set -euo pipefail
          echo "preview_env_precheck_secret_present=${{ secrets.SUPABASE_STAGING_PRECHECK_TOKEN != '' }}"
          if [ -z "${SUPABASE_STAGING_PRECHECK_TOKEN}" ]; then
            echo "Preview environment does not have SUPABASE_STAGING_PRECHECK_TOKEN. Did not query. Did not use SUPABASE_ACCESS_TOKEN."
            exit 0
          fi
          export VITE_SUPABASE_URL=https://usfeoerkpcafxxlyuldl.supabase.co
          export VITE_SUPABASE_PROJECT_ID=usfeoerkpcafxxlyuldl
          node scripts/precheck-garage-tenant-staging.mjs
      - name: Upload Preview-env PRECHECK report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garage-tenant-precheck-preview-env
          path: test-results/garage-tenant-precheck.json
          if-no-files-found: ignore
