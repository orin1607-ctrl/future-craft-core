name: Garage tenant PRECHECK — Staging read-only

# SELECT-only counts on usfeoerkpcafxxlyuldl.
# Uses SUPABASE_STAGING_PRECHECK_TOKEN only (Database READ).
# Never SUPABASE_ACCESS_TOKEN. Never Production. Never applies tenant SQL.

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  staging-precheck:
    if: github.ref != 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard this is Staging-only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          ref = os.environ.get("GITHUB_REF", "")
          if ref.endswith("/production"):
              sys.exit("Refusing Production branch")
          print("ref_ok", ref)
          PY
      - name: Require SUPABASE_STAGING_PRECHECK_TOKEN
        env:
          SUPABASE_STAGING_PRECHECK_TOKEN: ${{ secrets.SUPABASE_STAGING_PRECHECK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_STAGING_PRECHECK_TOKEN}" ]; then
            echo "::error::GitHub secret SUPABASE_STAGING_PRECHECK_TOKEN is empty in this job. Add it as a Repository Actions secret with that exact name. If it was saved as an Environment secret, this job has no environment: and cannot see it. Do not use SUPABASE_ACCESS_TOKEN. Production was not touched."
            exit 3
          fi
          echo "precheck_token_present=true"
      - name: Read-only PRECHECK
        env:
          SUPABASE_STAGING_PRECHECK_TOKEN: ${{ secrets.SUPABASE_STAGING_PRECHECK_TOKEN }}
          VITE_SUPABASE_URL: https://usfeoerkpcafxxlyuldl.supabase.co
          VITE_SUPABASE_PROJECT_ID: usfeoerkpcafxxlyuldl
        run: node scripts/precheck-garage-tenant-staging.mjs
      - name: Upload PRECHECK report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garage-tenant-precheck
          path: test-results/garage-tenant-precheck.json
          if-no-files-found: ignore
