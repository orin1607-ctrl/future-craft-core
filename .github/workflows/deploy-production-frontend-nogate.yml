name: Deploy Production Frontend (no gate)

# Owner-authorized in Cursor chat 2026-07-20:
# merge + deploy document-upload link fix to Production immediately.
# Same VPS path as owner-golive-production, WITHOUT GitHub Environment
# "production" reviewer gate (that gate blocks cursor[bot] approvals).

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/documentRequestClient.ts'
      - 'src/lib/documentRequestClient.test.ts'
      - 'src/components/documents/RequestDocumentDialog.tsx'
      - 'src/pages/UploadDocumentRequest.tsx'
      - '.github/workflows/deploy-production-frontend-nogate.yml'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Git commit to deploy (default HEAD main)'
        required: false
        default: ''

concurrency:
  group: dalia-production-frontend-nogate
  cancel-in-progress: true

env:
  PROD_SUPABASE_URL: https://qasomfndnjuixgjmjwcm.supabase.co
  PROD_SUPABASE_PROJECT_ID: qasomfndnjuixgjmjwcm
  WEB_ROOT: /root/future-craft-core/dist
  PRODUCTION_URL: https://dalia-car.online

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build production
        env:
          VITE_SUPABASE_URL: ${{ env.PROD_SUPABASE_URL }}
          VITE_SUPABASE_PROJECT_ID: ${{ env.PROD_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun x vite build

      - name: Pre-deploy smoke (dist)
        run: node scripts/ci-smoke-report.mjs --dist dist --supabase-ref qasomfndnjuixgjmjwcm

      - name: Assert fix present in dist bundle
        run: |
          BUNDLE=$(grep -oE 'index-[^"]+\.js' dist/index.html | head -1)
          echo "BUNDLE=$BUNDLE"
          if grep -q 'assertClientStaging' "dist/assets/$BUNDLE"; then
            echo "FAIL: assertClientStaging still in production bundle"
            exit 1
          fi
          grep -q 'upload-request' "dist/assets/$BUNDLE"
          echo "FIX_PRESENT_IN_DIST_OK"

      - id: bundle
        run: |
          BUNDLE=$(grep -oE 'index-[^"]+\.js' dist/index.html | head -1)
          echo "name=${BUNDLE}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Backup + rsync frontend to Production
        run: |
          STAMP=$(date -u +%F-%H%M)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "tar czf /root/pre-deploy-dist-${STAMP}.tgz -C /root/future-craft-core dist && echo BACKUP=/root/pre-deploy-dist-${STAMP}.tgz"
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --delete \
            --filter="P orin-marketing/" \
            --filter="P orin-owner-gate.js" \
            dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.WEB_ROOT }}/
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /root/future-craft-core/site-static"
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            public/site/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/future-craft-core/site-static/
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo 'commit=${{ github.sha }} bundle=${{ steps.bundle.outputs.name }} at=$(date -u +%Y-%m-%dT%H:%M:%SZ) reason=upload-request-assert-fix' > /root/future-craft-core/dist/PRODUCTION-DEPLOY.txt"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "nginx -t && systemctl reload nginx"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post-deploy smoke + assert fix live
        run: |
          sleep 5
          node scripts/ci-smoke-report.mjs \
            --base "${{ env.PRODUCTION_URL }}" \
            --supabase-ref qasomfndnjuixgjmjwcm \
            --out reports/ci-smoke-production-nogate.json || true
          HTML=$(curl -sL "${{ env.PRODUCTION_URL }}/")
          BUNDLE=$(echo "$HTML" | grep -oE 'assets/index-[^"]+\.js' | head -1)
          echo "LIVE_BUNDLE=$BUNDLE"
          test -n "$BUNDLE"
          curl -sL "${{ env.PRODUCTION_URL }}/$BUNDLE" -o /tmp/live.js
          if grep -q 'assertClientStaging' /tmp/live.js; then
            echo "FAIL: assertClientStaging still live on Production"
            exit 1
          fi
          grep -q 'upload-request' /tmp/live.js
          curl -sL "${{ env.PRODUCTION_URL }}/PRODUCTION-DEPLOY.txt" || true
          echo "PRODUCTION_FIX_LIVE_OK commit=${{ github.sha }} bundle=$BUNDLE"
