name: WA billing vs scenario diagnose (no send)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/wa-billing-vs-scenario-diagnose.mjs'
      - 'public/project-001/wa-billing-vs-scenario-queue.json'
      - '.github/workflows/wa-billing-vs-scenario-diagnose.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Billing vs scenario (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          MAKE_ZONE: ${{ secrets.MAKE_ZONE }}
        run: node scripts/wa-billing-vs-scenario-diagnose.mjs
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/project-001/wa-billing-vs-scenario-result.json || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "ci: billing vs scenario diagnose (no send, no Production)"
          git push
