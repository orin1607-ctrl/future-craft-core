name: Deploy Staging to GitHub Pages

# Manually-triggered staging deployment.
#
# Builds the SAME shared codebase (production branch) but pointed at the
# dalia-staging Supabase environment, then publishes to GitHub Pages.
#
# This is intentionally manual-only (workflow_dispatch). It NEVER runs on
# push. Yoni decides when staging updates, exactly like the main system's
# "Update Code" button. Miki's changes reach this branch via the existing
# sync-from-miki workflow; this just builds + publishes them to staging
# when triggered.
#
# Staging Supabase anon key is public-safe by design (it is embedded in
# the frontend bundle regardless), so it lives here rather than as a secret.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-staging
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (staging Supabase environment)
        env:
          VITE_SUPABASE_URL: https://usfeoerkpcafxxlyuldl.supabase.co
          VITE_SUPABASE_PROJECT_ID: usfeoerkpcafxxlyuldl
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzZmVvZXJrcGNhZnh4bHl1bGRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMTQ4NTYsImV4cCI6MjA5NDY5MDg1Nn0.Z1AsULSK9fNsVwjw7iRP_DkSodeTUdtb-eB5s66qtJU
        run: |
          bun x vite build --outDir dist
          # SPA fallback so client-side routes work on GitHub Pages
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
