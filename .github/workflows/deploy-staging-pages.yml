name: Deploy Staging to GitHub Pages

# Staging deployment to GitHub Pages (dalia-staging Supabase only).
# Always publishes origin/main. Never publishes origin/dev or production.
# Cursor cannot workflow_dispatch; push to cursor/deploy-staging-pages-bed0
# rebuilds origin/main. Push to main also rebuilds origin/main.

on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: 'Git ref to build and deploy. Empty = origin/main. Never production or dev.'
        required: false
        default: 'main'
  push:
    branches:
      - main
      - cursor/deploy-staging-pages-bed0

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-staging
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Do not bind this job to environment `github-pages` (that environment
    # only allows branch `main`). Pages deploy uses pages:write + id-token.
    steps:
      - name: Resolve deploy ref (main only)
        id: ref
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.deploy_ref }}" ]; then
            REF="${{ github.event.inputs.deploy_ref }}"
          elif [ "${{ github.ref_name }}" = "cursor/deploy-staging-pages-bed0" ]; then
            # One-off Pages publish of claims document-name fix (descended from live 13bc76ba).
            # Do not push main (avoids Production waiting + garage-gmail job).
            REF="576a08d4cd8f9d9d10986eefc153ff500df57590"
          else
            REF="main"
          fi
          case "$REF" in
            production|refs/heads/production|*production*|dev|refs/heads/dev|origin/dev)
              echo "::error::Refusing to publish $REF to GitHub Pages"
              exit 1
              ;;
          esac
          echo "Publishing GitHub Pages from: $REF"
          echo "value=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout deploy ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.value }}
          fetch-depth: 1

      - name: Record checked-out SHA
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "Checked out $SHA"
          echo "DEPLOY_SHA=$SHA" >> "$GITHUB_ENV"
          printf '%s\n' "$SHA" > /tmp/staging-sha.txt

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (staging Supabase environment)
        env:
          VITE_SUPABASE_URL: https://usfeoerkpcafxxlyuldl.supabase.co
          VITE_SUPABASE_PROJECT_ID: usfeoerkpcafxxlyuldl
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzZmVvZXJrcGNhZnh4bHl1bGRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMTQ4NTYsImV4cCI6MjA5NDY5MDg1Nn0.Z1AsULSK9fNsVwjw7iRP_DkSodeTUdtb-eB5s66qtJU
          VITE_BASE_PATH: /future-craft-core/
          VITE_BUILD_COMMIT: ${{ env.DEPLOY_SHA }}
          VITE_MARKETING_UI_VERSION: v3-mission-25-1-${{ github.run_number }}
        run: |
          bun x vite build
          cp dist/index.html dist/404.html
          node scripts/generate-spa-route-shells.mjs dist
          mkdir -p dist/dev/project-001/dashboard
          cp dist/index.html dist/dev/project-001/dashboard/index.html

      - name: Copy CO.CO AI Marketing static dashboard
        run: |
          mkdir -p dist dist/project-001
          cp public/coco-marketing-platform.html dist/
          cp public/ai-marketing-platform.html dist/
          cp public/dalia-crm-platform.html dist/
          cp public/dalia-crm.html dist/
          cp -r public/ai-marketing dist/
          cp -r public/coco-dalia dist/
          cp -r public/crm dist/
          cp dist/index.html dist/ai-marketing/index.html
          cp -r public/project-001-mockup dist/
          cp public/project-001/dashboard.json dist/project-001/ 2>/dev/null || true
          HASH=$(git rev-parse --short HEAD)
          RUN_VER="v3-mission-25-1-${HASH}"
          sed -i "s/content=\"STAGING\"/content=\"${HASH}\"/" dist/coco-marketing-platform.html
          sed -i "s/content=\"STAGING\"/content=\"${HASH}\"/" dist/ai-marketing-platform.html
          sed -i "s/content=\"STAGING\"/content=\"${HASH}\"/" dist/dalia-crm-platform.html
          sed -i "s/content=\"v3-mission-25-1\"/content=\"${RUN_VER}\"/" dist/ai-marketing-platform.html
          sed -i "s/var ver = 'v3-mission-25-1'/var ver = '${RUN_VER}'/" dist/ai-marketing-platform.html
          sed -i "s/v=v3-mission-25-1/v=${RUN_VER}/g" dist/ai-marketing-platform.html
          sed -i "s/var VERSION = 'v3-global-filter-unified'/var VERSION = '${RUN_VER}'/" dist/ai-marketing/coco-marketing-unified.js
          sed -i "s/|| 'v3-mission-25-1'/|| '${RUN_VER}'/" dist/ai-marketing/coco-marketing-crm-bridge.js
          sed -i "s/v=3-unified-3g/v=${RUN_VER}/g" dist/ai-marketing-platform.html
          sed -i "s/v=crm-1/v=crm-${HASH}/g" dist/dalia-crm-platform.html
          test -f dist/index.html || cp public/ai-marketing-platform.html dist/index.html
          test -f dist/404.html || cp dist/index.html dist/404.html
          touch dist/.nojekyll
          echo "deployed_ref=$(git rev-parse --short HEAD) $(git rev-parse --abbrev-ref HEAD)" > dist/STAGING-DEPLOY.txt
          cp /tmp/staging-sha.txt dist/staging-sha.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  staging-garage-gmail:
    name: Deploy garage-gmail via Preview
    needs: build-deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Preview
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply approved garage Gmail SQL if Staging DB URL is present
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 - <<'PY'
          import os, sys
          for n in ("STAGING_DATABASE_URL", "DATABASE_URL"):
              v = (os.environ.get(n) or "")
              if "qasomfndnjuixgjmjwcm" in v or "dalia-car.online" in v.lower():
                  sys.exit(f"{n} looks like Production — refusing")
          PY
          if [ -n "${STAGING_DATABASE_URL:-}${DATABASE_URL:-}" ]; then
            node scripts/apply-garage-gmail-staging.mjs
          else
            echo "No Staging DB URL in Preview — skip SQL"
          fi
      - name: Deploy garage-gmail Edge to Staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/deploy-garage-gmail-edge.mjs
      - uses: oven-sh/setup-bun@v2
        if: always()
        with:
          bun-version: latest
      - name: E2E garage-gmail on Staging only
        if: always()
        env:
          VITE_SUPABASE_URL: https://usfeoerkpcafxxlyuldl.supabase.co
          VITE_SUPABASE_PROJECT_ID: usfeoerkpcafxxlyuldl
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TEST_EMAIL: ${{ secrets.STAGING_QA_EMAIL }}
          TEST_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD }}
          STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          bun install --frozen-lockfile
          node scripts/qa-garage-gmail-staging.mjs
      - name: Upload garage-gmail logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garage-gmail-pages-preview
          path: test-results/garage-gmail-*.json
          if-no-files-found: ignore
