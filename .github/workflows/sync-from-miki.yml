name: Sync from Miki repo

# Auto-merges Miki's main branch (websolutions-il/future-craft-core) into
# Yoni's production branch with file-level protections that preserve our
# manual-update system. Yoni then sees the merged commits as pending updates
# in the Super Admin "Update Code" page and approves them with one click.
#
# Files PROTECTED from being deleted by Miki's diff (always restored from
# pre-merge production state):
#   - src/pages/SystemUpdate*.tsx
#   - supabase/functions/system-update/
#   - supabase/migrations/20260502120000_*.sql
#   - .github/workflows/sync-from-miki.yml  (this file)
#   - .gitattributes
#   - .github/workflows/deploy.yml          (must stay deleted)
#
# Files MERGED with 'union' strategy (both sides' changes coexist) — see
# .gitattributes on the production branch:
#   - src/App.tsx
#   - src/components/BottomNav.tsx
#   - src/integrations/supabase/types.ts
#
# Conflict policy for everything else: -X theirs (always prefer Miki's
# latest version).

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/sync-from-miki.yml']

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout production with full history
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"

      - name: Add Miki remote and fetch main
        run: |
          git remote add miki https://github.com/websolutions-il/future-craft-core.git
          git fetch miki main --no-tags

      - name: Diagnostic — current state
        run: |
          echo "Current ref:    $(git rev-parse HEAD)"
          echo "Current branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "miki/main:      $(git rev-parse miki/main)"

      - name: Check whether anything new from miki
        id: check
        run: |
          AHEAD=$(git rev-list --count HEAD..miki/main)
          echo "ahead=$AHEAD" >> $GITHUB_OUTPUT
          echo "Miki has $AHEAD commits not yet on production"
          if [ "$AHEAD" != "0" ]; then
            echo "First few commits to merge:"
            git log --oneline HEAD..miki/main | head -5
          fi

      - name: Snapshot protected files before merge
        if: steps.check.outputs.ahead != '0'
        run: |
          mkdir -p /tmp/protected
          PROTECTED=(
            "src/pages/SystemUpdateCode.tsx"
            "src/pages/SystemUpdateDatabase.tsx"
            "src/pages/SystemUpdateAudit.tsx"
            "supabase/functions/system-update/index.ts"
            "supabase/migrations/20260502120000_system_update_audit.sql"
            ".github/workflows/sync-from-miki.yml"
            ".gitattributes"
          )
          for f in "${PROTECTED[@]}"; do
            if [ -f "$f" ]; then
              mkdir -p "/tmp/protected/$(dirname "$f")"
              cp -a "$f" "/tmp/protected/$f"
              echo "snapshot: $f"
            fi
          done

      - name: Merge miki/main with -X theirs (.gitattributes union for hot files)
        if: steps.check.outputs.ahead != '0'
        run: |
          set -e
          if ! git merge miki/main --no-edit --no-ff -X theirs \
                -m "auto-sync: merge miki/main (-X theirs)"; then
            echo "::error::merge failed even with -X theirs strategy"
            git status
            git merge --abort || true
            exit 1
          fi
          echo "Merge succeeded. New HEAD: $(git rev-parse HEAD)"

      - name: Restore protected files + delete deploy.yml
        if: steps.check.outputs.ahead != '0'
        run: |
          set -e
          PROTECTED=(
            "src/pages/SystemUpdateCode.tsx"
            "src/pages/SystemUpdateDatabase.tsx"
            "src/pages/SystemUpdateAudit.tsx"
            "supabase/functions/system-update/index.ts"
            "supabase/migrations/20260502120000_system_update_audit.sql"
            ".github/workflows/sync-from-miki.yml"
            ".gitattributes"
          )
          changed=false
          for f in "${PROTECTED[@]}"; do
            if [ ! -f "/tmp/protected/$f" ]; then continue; fi
            if [ ! -f "$f" ] || ! diff -q "/tmp/protected/$f" "$f" >/dev/null 2>&1; then
              mkdir -p "$(dirname "$f")"
              cp -a "/tmp/protected/$f" "$f"
              git add "$f"
              echo "restored: $f"
              changed=true
            fi
          done
          if [ -f .github/workflows/deploy.yml ]; then
            rm -f .github/workflows/deploy.yml
            git add .github/workflows/deploy.yml
            echo "deleted deploy.yml"
            changed=true
          fi
          if [ "$changed" = "true" ]; then
            git commit --amend --no-edit
            echo "amended merge with restored files"
          else
            echo "no protected files needed restoring"
          fi

      - name: Detect changed edge functions
        if: steps.check.outputs.ahead != '0'
        id: fn_changes
        run: |
          set -e
          BEFORE=$(git rev-parse HEAD~1)
          AFTER=$(git rev-parse HEAD)
          CHANGED=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- supabase/functions/ \
                    | awk -F/ 'NF>=3 {print $3}' \
                    | sort -u \
                    | grep -v '^system-update$' || true)
          if [ -z "$CHANGED" ]; then
            echo "  no edge function changes"
            echo "changed=" >> $GITHUB_OUTPUT
          else
            echo "  changed functions:"
            echo "$CHANGED" | sed 's/^/    /'
            CHANGED_CSV=$(echo "$CHANGED" | tr '\n' ',' | sed 's/,$//')
            echo "changed=$CHANGED_CSV" >> $GITHUB_OUTPUT
          fi

      - name: Push production
        if: steps.check.outputs.ahead != '0'
        run: git push origin production

      - name: Install Supabase CLI
        if: steps.fn_changes.outputs.changed != ''
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz \
            | tar -xz -C /tmp
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          supabase --version

      - name: Deploy changed edge functions
        if: steps.fn_changes.outputs.changed != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: qasomfndnjuixgjmjwcm
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret is not set."
            echo "::warning::Skipping edge function deploy. Add it at"
            echo "::warning::https://github.com/orin1607-ctrl/future-craft-core/settings/secrets/actions"
            exit 0
          fi
          # Per-function verify_jwt is read automatically from supabase/config.toml.
          IFS=',' read -ra FUNCS <<< "${{ steps.fn_changes.outputs.changed }}"
          for fn in "${FUNCS[@]}"; do
            echo "::group::deploy $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" 2>&1 | tail -5 || {
              echo "::error::deploy of $fn failed"
              exit 1
            }
            echo "::endgroup::"
          done
          echo "Deployed: ${{ steps.fn_changes.outputs.changed }}"

      - name: Summary
        if: always()
        run: |
          echo "### Sync run summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "miki/main:  \`$(git rev-parse miki/main)\`" >> $GITHUB_STEP_SUMMARY
          echo "production: \`$(git rev-parse HEAD)\`" >> $GITHUB_STEP_SUMMARY
          echo "Commits brought in: ${{ steps.check.outputs.ahead }}" >> $GITHUB_STEP_SUMMARY
          echo "Edge fns deployed:  ${{ steps.fn_changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
