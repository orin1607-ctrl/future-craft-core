name: Sync from Miki repo

# Auto-merges Miki's main branch (websolutions-il/future-craft-core) directly
# into production, with file-level protections that preserve our manual-update
# system. Yoni then sees the merged commits as pending updates in the Super
# Admin "Update Code" page and approves them with one click.
#
# Files PROTECTED from being deleted by Miki's diff:
#   - src/pages/SystemUpdate*.tsx
#   - supabase/functions/system-update/
#   - supabase/migrations/20260502120000_*.sql
#   - .github/workflows/sync-from-miki.yml  (this file)
#   - .github/workflows/deploy.yml          (must stay deleted)
#
# Files MERGED with 'union' strategy (both sides' changes coexist) — see
# .gitattributes on the production branch:
#   - src/App.tsx
#   - src/components/BottomNav.tsx
#   - src/integrations/supabase/types.ts
#
# Conflict policy for everything else: -X theirs — always prefer Miki's
# latest version. Combined with the protected-file restore, this means
# the merge will essentially never fail. Miki's code wins on every line
# he touched; our protected files are then put back; everything else
# stays as-is.
#
# A snapshot of Miki's main is also pushed to the miki-mirror branch as a
# diagnostic / belt-and-suspenders backup.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/sync-from-miki.yml']

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout production with full history
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"

      - name: Add Miki remote and fetch
        run: |
          git remote add miki https://github.com/websolutions-il/future-craft-core.git
          git fetch miki main --no-tags

      # ----- 1. Mirror snapshot to miki-mirror (diagnostic, unchanged) -----
      - name: Build squashed snapshot of miki/main (workflows stripped)
        run: |
          MIKI_SHA=$(git rev-parse miki/main)
          MIKI_SHORT=$(git rev-parse --short miki/main)
          MIKI_MSG=$(git log -1 --format=%s miki/main)

          git checkout --orphan miki-mirror-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          git read-tree miki/main
          git rm -rf --cached .github/workflows >/dev/null 2>&1 || true

          git commit -m "Mirror miki/main @ ${MIKI_SHORT} ($(date -u +%Y-%m-%dT%H:%M:%SZ))

          Source commit: ${MIKI_SHA}
          Subject: ${MIKI_MSG}"

          git push origin --force HEAD:refs/heads/miki-mirror

      # ----- 2. Auto-merge into production with file protections -----
      - name: Switch back to production
        run: |
          git checkout production
          git branch -D miki-mirror-tmp || true

      - name: Check whether anything new from miki
        id: check
        run: |
          echo "Current ref:    $(git rev-parse HEAD)"
          echo "Current branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "miki/main:      $(git rev-parse miki/main)"
          AHEAD=$(git rev-list --count HEAD..miki/main)
          echo "ahead=$AHEAD" >> $GITHUB_OUTPUT
          echo "Miki has $AHEAD commits not yet on production"
          if [ "$AHEAD" != "0" ]; then
            echo "First few commits to merge:"
            git log --oneline HEAD..miki/main | head -5
          fi

      - name: Merge miki/main with .gitattributes union + -X theirs fallback
        if: steps.check.outputs.ahead != '0'
        run: |
          set -e

          # Strategy:
          #   1. .gitattributes 'merge=union' handles App.tsx / BottomNav.tsx /
          #      types.ts — both sides' lines preserved.
          #   2. -X theirs handles every other conflicting line by taking
          #      Miki's latest version (we'll restore our protected files
          #      explicitly in the next step regardless).
          #   3. If even -X theirs cannot resolve (extremely rare —
          #      typically a binary or rename conflict), abort + fail loudly.
          if ! git merge miki/main --no-edit --no-ff -X theirs \
                -m "auto-sync: merge miki/main (-X theirs)"; then
            echo "::error::merge failed even with -X theirs strategy"
            git merge --abort || true
            exit 1
          fi

          # Restore protected files (in case Miki's tree didn't have them and
          # 'theirs' wins for missing-file cases would have removed them).
          # If they're already correct, this is a no-op.
          PROTECTED_FILES=(
            "src/pages/SystemUpdateCode.tsx"
            "src/pages/SystemUpdateDatabase.tsx"
            "src/pages/SystemUpdateAudit.tsx"
            "supabase/functions/system-update/index.ts"
            "supabase/migrations/20260502120000_system_update_audit.sql"
            ".github/workflows/sync-from-miki.yml"
            ".gitattributes"
          )
          changed=false
          for f in "${PROTECTED_FILES[@]}"; do
            if [ -f "$f" ]; then continue; fi
            # File missing after merge — restore it from production HEAD before merge
            git checkout HEAD~1 -- "$f" 2>/dev/null || true
            git add "$f"
            changed=true
          done

          # Ensure deploy.yml stays deleted (Miki may have re-introduced it)
          if [ -f .github/workflows/deploy.yml ]; then
            rm -f .github/workflows/deploy.yml
            git add .github/workflows/deploy.yml
            changed=true
          fi

          if [ "$changed" = "true" ]; then
            git commit --amend --no-edit
          fi

      - name: Push merged production
        if: steps.check.outputs.ahead != '0'
        run: git push origin production

      - name: Summary
        if: always()
        run: |
          echo "### Sync run summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "miki/main: \`$(git rev-parse miki/main)\`" >> $GITHUB_STEP_SUMMARY
          echo "production: \`$(git rev-parse production 2>/dev/null || git rev-parse HEAD)\`" >> $GITHUB_STEP_SUMMARY
          echo "Commits brought in: ${{ steps.check.outputs.ahead }}" >> $GITHUB_STEP_SUMMARY
