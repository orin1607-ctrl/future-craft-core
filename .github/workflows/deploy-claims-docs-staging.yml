name: Staging claims-docs customer link

# Staging only. Deploys claims-docs and runs cross-device link QA.
# Never Production. Never Hostinger.

on:
  push:
    branches:
      - feat/incident-alerts-staging
    paths:
      - 'supabase/functions/claims-docs/**'
      - 'src/features/claims/ClaimsScreen.tsx'
      - 'src/features/claims/claims.css'
      - 'scripts/claims-customer-link-cross-device-qa.mjs'
      - '.github/workflows/deploy-claims-docs-staging.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-claims-docs-staging
  cancel-in-progress: true

jobs:
  deploy-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Guard Staging only
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" != "production"
          test "${GITHUB_REF_NAME}" != "main"
          test "usfeoerkpcafxxlyuldl" != "qasomfndnjuixgjmjwcm"

      - name: Deploy claims-docs to Staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          export SUPABASE_ACCESS_TOKEN="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$SUPABASE_ACCESS_TOKEN"
          npx --yes supabase functions deploy claims-docs --project-ref usfeoerkpcafxxlyuldl --no-verify-jwt

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bun x playwright install --with-deps chromium

      - name: Cross-device customer link QA
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLAIMS_QA_BASE: https://orin1607-ctrl.github.io/future-craft-core
        run: |
          set -euo pipefail
          export SUPABASE_ACCESS_TOKEN="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          node scripts/claims-customer-link-cross-device-qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claims-link-cross-device-qa
          path: docs/audit-reports/claims-customer-link-cross-device-2026-09-02
          if-no-files-found: ignore
