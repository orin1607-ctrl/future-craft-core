name: E2E — Declaration Driver Card Staging Sync

# Staging-only declaration E2E. Never Production.
# MUST NOT recreate anon USING(true) table/storage SELECT policies (C4/C1).
# Sign-by-link uses token RPCs + anon INSERT of signature files only.
on:
  push:
    branches:
      - feat/incident-alerts-staging
    paths:
      - 'src/components/DriverDeclaration.tsx'
      - 'src/components/DeclarationTemplateManager.tsx'
      - 'src/components/DeclarationPreviewModal.tsx'
      - 'src/services/declarationTemplatesApi.ts'
      - 'src/utils/declarationTemplates.ts'
      - 'src/pages/SignDeclaration.tsx'
      - 'scripts/e2e-declaration-driver-card-staging.mjs'
      - 'scripts/sync-staging-declaration-anon-rls.mjs'
      - '.github/workflows/e2e-declaration-driver-card-staging.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-declaration-driver-card-staging
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests (declaration helpers)
        run: bun x vitest run src/utils/declarationTemplates.test.ts src/utils/normalizeTemplateCompanyName.test.ts

      - name: Install Playwright Chromium
        run: bun x playwright install --with-deps chromium

      - name: Wait for Staging Pages settle
        run: sleep 50

      - name: Guard Staging declaration RLS (token RPCs only, never recreate C4)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/sync-staging-declaration-anon-rls.mjs

      - name: Run driver-card declaration E2E on Staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_PAGES_URL: https://orin1607-ctrl.github.io/future-craft-core
        run: node scripts/e2e-declaration-driver-card-staging.mjs

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: declaration-driver-card-staging-e2e
          path: |
            docs/screenshots/declaration-driver-card-e2e/**
            /opt/cursor/artifacts/declaration-driver-card-staging-e2e.json
            /opt/cursor/artifacts/sync-staging-declaration-anon-rls.json
            /opt/cursor/artifacts/stg-decl-sign.png
          if-no-files-found: ignore
