name: Replay Make DLR to Staging (no WA send)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/replay-make-dlr-to-staging.mjs'
      - 'supabase/functions/gupshup-webhook/**'
      - 'public/project-001/replay-make-dlr-queue.json'
      - '.github/workflows/replay-make-dlr-to-staging.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay captured DLR
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/replay-make-dlr-to-staging.mjs
