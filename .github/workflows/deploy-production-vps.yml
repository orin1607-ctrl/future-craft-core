name: Deploy Production (dalia-car.online)

# Triggered only by workflow_dispatch or deploy-control edge function.
# Requires GitHub Environment "production" approval.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Git commit to deploy (default HEAD main)'
        required: false
        default: ''
      deploy_run_id:
        description: 'Optional deploy_runs UUID from Dalia Deploy UI'
        required: false
        default: ''

concurrency:
  group: dalia-production-deploy
  cancel-in-progress: false

env:
  PROD_SUPABASE_URL: https://qasomfndnjuixgjmjwcm.supabase.co
  PROD_SUPABASE_PROJECT_ID: qasomfndnjuixgjmjwcm
  WEB_ROOT: /root/future-craft-core/dist
  PRODUCTION_URL: https://dalia-car.online

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dalia-car.online
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || 'main' }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build production
        env:
          VITE_SUPABASE_URL: ${{ env.PROD_SUPABASE_URL }}
          VITE_SUPABASE_PROJECT_ID: ${{ env.PROD_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun x vite build

      - name: Pre-deploy smoke (dist)
        run: node scripts/ci-smoke-report.mjs --dist dist --supabase-ref qasomfndnjuixgjmjwcm

      - id: bundle
        run: |
          BUNDLE=$(grep -oE 'index-[^"]+\.js' dist/index.html | head -1)
          echo "name=${BUNDLE}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Backup production web root
        id: backup
        run: |
          STAMP=$(date -u +%F-%H%M)
          BACKUP="/root/pre-deploy-dist-${STAMP}.tgz"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "tar czf ${BACKUP} -C /root/future-craft-core dist && echo ${BACKUP}"
          echo "path=${BACKUP}" >> "$GITHUB_OUTPUT"

      - name: Deploy to production
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --delete \
            --filter="P orin-marketing/" \
            --filter="P orin-owner-gate.js" \
            dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.WEB_ROOT }}/

      # Brand site lives OUTSIDE dist so SPA --delete cannot wipe it.
      - name: Sync brand site (/site/) outside dist
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /root/future-craft-core/site-static"
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            public/site/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/future-craft-core/site-static/

      - name: Assert nginx brand + marketing paths present in repo
        run: |
          grep -q 'location ^~ /site/' nginx.conf
          grep -q 'location ^~ /orin-marketing/' nginx.conf
          grep -q 'client-previews/dalia-c-official' nginx.conf
          grep -q 'site-static' nginx.conf

      - name: Assert permanent pirsum
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "python3 -c \"from pathlib import Path; import re; html=Path('/root/future-craft-core/dist/index.html').read_text(); assert 'pirsum-btn' not in html.lower(); m=re.search(r'/assets/(index-[^\\"\\']+\\.js)', html); t=(Path('/root/future-craft-core/dist/assets')/m.group(1)).read_text(encoding='utf-8',errors='ignore'); assert 'title:\\"פרסום\\"' in t; assert 'path:\\"/orin-marketing\\"' in t or 'href:\\"/orin-marketing/\\"' in t; print('ok')\""


      - name: Reload nginx
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "nginx -t && systemctl reload nginx"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post-deploy smoke
        run: |
          node scripts/ci-smoke-report.mjs \
            --base "${{ env.PRODUCTION_URL }}" \
            --supabase-ref qasomfndnjuixgjmjwcm \
            --out reports/ci-smoke-production.json

      - name: Update deploy_runs
        env:
          SUPABASE_URL: ${{ env.PROD_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/finalize-production-deploy.mjs \
            --commit "${{ github.sha }}" \
            --bundle "${{ steps.bundle.outputs.name }}" \
            --backup "${{ steps.backup.outputs.path }}" \
            --deploy-run-id "${{ inputs.deploy_run_id }}" \
            --workflow-run "${{ github.run_id }}" \
            --report reports/ci-smoke-production.json
